              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HarborRobotAccount
            properties:
              adoptExisting:
                description: |-
                  adoptExisting takes over a robot of the same name. Because Harbor never
                  reveals an existing secret, adoption refreshes the secret.
                type: boolean
              connectionRef:
                description: connectionRef selects the Harbor instance.
