  name: hankoemailproviders.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoEmailProvider
    listKind: HankoEmailProviderList
    plural: hankoemailproviders
    shortNames:
    - hep
    singular: hankoemailprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
