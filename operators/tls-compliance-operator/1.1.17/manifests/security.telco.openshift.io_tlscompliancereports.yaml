                    items:
                      type: string
                    type: array
                  fingerprint:
                    description: Fingerprint is the SHA-256 digest of the DER-encoded
                      certificate, lowercase hex
                    type: string
                  hostnameMatch:
                    description: HostnameMatch indicates whether the certificate is
                      valid for the tested endpoint hostname
                    type: boolean
                  ipAddresses:
                    description: IPAddresses lists IP SANs on the certificate
                    items:
                      type: string
                    type: array
                  isExpired:
                    description: IsExpired indicates if the certificate has expired
                    type: boolean
                  issuer:
                    description: Issuer is the certificate issuer
                    type: string
                  notAfter:
                    description: NotAfter is the end of the certificate's validity
                      period
                    format: date-time
                    type: string
                  notBefore:
                    description: NotBefore is the start of the certificate's validity
                      period
                    format: date-time
                    type: string
                  publicKeyAlgorithm:
                    description: PublicKeyAlgorithm is the certificate's public key
                      algorithm (e.g. RSA, ECDSA, Ed25519)
                    type: string
                  publicKeyBits:
                    description: PublicKeyBits is the size of the public key in bits
                    type: integer
                  serialNumber:
                    description: SerialNumber is the certificate serial number in
                      lowercase hex
                    type: string
                  signatureAlgorithm:
                    description: SignatureAlgorithm is the algorithm used to sign
                      the certificate (e.g. SHA256-RSA, ECDSA-SHA256)
                    type: string
                  subject:
                    description: Subject is the certificate subject
                    type: string
                type: object
              checkCount:
                description: CheckCount is the number of TLS checks performed
                format: int64
                type: integer
              cipherStrengthGrades:
                additionalProperties:
                  type: string
                description: CipherStrengthGrades maps each cipher suite name to its
                  strength grade (A-F)
                type: object
              cipherSuites:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: CipherSuites maps TLS version to supported cipher suite
                  names
                type: object
              complianceStatus:
                default: Unknown
                description: ComplianceStatus indicates the overall TLS compliance
                  status
                enum:
                - Compliant
                - NonCompliant
                - Warning
                - Unreachable
                - Timeout
                - Closed
                - Filtered
                - NoTLS
                - PlaintextHTTP
                - MutualTLSRequired
                - Pending
                - Unknown
                type: string
              conditions:
                description: Conditions represent the current state of the TLSComplianceReport
                  resource
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveErrors:
                description: ConsecutiveErrors is the number of consecutive check
                  errors
                type: integer
              fipsDetected:
                description: |-
                  FIPSDetected indicates whether the operator detected FIPS mode on the cluster.
                  When true, ML-KEM key exchange is unavailable due to FIPS restrictions.
                type: boolean
              firstSeenAt:
                description: FirstSeenAt is when this endpoint was first discovered
                format: date-time
                type: string
              forwardSecrecy:
                description: |-
                  ForwardSecrecy indicates whether all negotiated cipher suites use
                  ephemeral key exchange (ECDHE/DHE), providing perfect forward secrecy
                type: boolean
              history:
                description: History contains a bounded audit trail of previous scan
                  results
                items:
                  description: ComplianceHistoryEntry represents a single historical
                    TLS scan result
                  properties:
                    certFingerprint:
                      description: CertFingerprint is the SHA-256 digest of the certificate
                        fingerprint
                      type: string
                    complianceStatus:
                      description: ComplianceStatus is the TLS compliance status at
                        that time
                      enum:
                      - Compliant
                      - NonCompliant
                      - Warning
                      - Unreachable
                      - Timeout
                      - Closed
                      - Filtered
                      - NoTLS
                      - PlaintextHTTP
                      - MutualTLSRequired
                      - Pending
                      - Unknown
                      type: string
                    overallCipherGrade:
                      description: OverallCipherGrade is the worst grade across all
                        negotiated cipher suites
                      type: string
                    timestamp:
                      description: Timestamp is when the check was performed
                      format: date-time
                      type: string
                    tlsVersions:
                      description: TLSVersions indicates which TLS versions were supported
                      properties:
                        ssl30:
                          description: SSL30 indicates if the deprecated SSLv3 protocol
                            is supported
                          type: boolean
                        tls10:
                          description: TLS10 indicates if TLS 1.0 is supported
                          type: boolean
                        tls11:
                          description: TLS11 indicates if TLS 1.1 is supported
                          type: boolean
                        tls12:
                          description: TLS12 indicates if TLS 1.2 is supported
                          type: boolean
                        tls13:
                          description: TLS13 indicates if TLS 1.3 is supported
                          type: boolean
                      required:
                      - tls10
                      - tls11
                      - tls12
                      - tls13
                      type: object
                  required:
                  - complianceStatus
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              imageCertificationInfo:
                description: |-
                  ImageCertificationInfo contains image certification data cross-referenced from
                  imagecertinfo-operator. Only populated when sourceKind=Pod and imagecertinfo-operator
                  is installed in the cluster.
                items:
                  description: |-
                    ContainerImageCertInfo holds certification data for one container image,
                    sourced from a corresponding ImageCertificationInfo CR (imagecertinfo-operator).
                  properties:
                    autoRebuildEnabled:
                      description: AutoRebuildEnabled indicates whether the image
                        has automatic CVE rebuilds enabled
                      type: boolean
                    certificationStatus:
                      description: |-
                        CertificationStatus is the certification status from imagecertinfo-operator
                        (e.g. Certified, NotCertified, Unknown, Error)
                      type: string
                    containerName:
                      description: ContainerName is the name of the container within
                        the pod
                      type: string
                    criticalCveCount:
                      description: CriticalCVECount is the number of critical vulnerabilities
                        reported by Pyxis
                      type: integer
                    cveIds:
                      description: CVEIDs is the list of CVE identifiers found for
                        this image
                      items:
                        type: string
                      type: array
                    daysUntilEol:
                      description: DaysUntilEOL is the number of days until end-of-life
                        (negative if past EOL)
                      type: integer
                    healthIndex:
                      description: HealthIndex is the image health grade (A-F) from
                        Red Hat Pyxis
                      type: string
                    iciName:
                      description: ICIName is the name of the ImageCertificationInfo
                        CR that was cross-referenced
                      type: string
                    iciOperatorVersion:
                      description: ICIOperatorVersion is the version of imagecertinfo-operator
                        that produced this data
                      type: string
                    imageAge:
                      description: ImageAge is how old the image is (e.g. "45 days")
                      type: string
                    imageRef:
                      description: ImageRef is the full image reference (registry/repository@sha256:...)
                      type: string
                    importantCveCount:
                      description: ImportantCVECount is the number of important-severity
                        vulnerabilities from Pyxis
                      type: integer
                    lastCheckedAt:
                      description: LastCheckedAt is when the certification data was
                        last verified against Pyxis
                      type: string
                    lowCveCount:
                      description: LowCVECount is the number of low-severity vulnerabilities
                        from Pyxis
                      type: integer
                    moderateCveCount:
                      description: ModerateCVECount is the number of moderate-severity
                        vulnerabilities from Pyxis
                      type: integer
                    publisher:
                      description: Publisher is the image publisher from Pyxis (e.g.
                        "Red Hat, Inc.")
                      type: string
                    registryType:
                      description: RegistryType is the registry type (RedHat, Partner,
                        Community, Private, Unknown)
                      type: string
                    releaseCategory:
                      description: ReleaseCategory is the Pyxis release category (e.g.
                        "Generally Available", "Tech Preview", "Deprecated")
                      type: string
                  required:
                  - containerName
                  - imageRef
                  type: object
                type: array
              ingressProfileCompliance:
                description: |-
                  IngressProfileCompliance contains the compliance result against the
                  OpenShift IngressController TLS security profile (OpenShift only)
                properties:
                  compliant:
                    description: Compliant indicates whether the endpoint meets the
                      profile requirements
                    type: boolean
                  disallowedCiphers:
                    description: |-
                      DisallowedCiphers lists cipher suites negotiated by the endpoint that are
                      not in the profile's allowed list
                    items:
                      type: string
                    type: array
                  disallowedGroups:
                    description: |-
                      DisallowedGroups lists key exchange groups negotiated by the endpoint
                      that are not in the profile's allowed list
                    items:
                      type: string
                    type: array
                  groupsCompliant:
                    description: |-
                      GroupsCompliant indicates whether the endpoint's negotiated curves are
                      in the profile's allowed groups list
                    type: boolean
                  minTLSVersionMet:
                    description: |-
                      MinTLSVersionMet indicates whether the endpoint does not support TLS versions
