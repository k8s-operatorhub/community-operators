      - kind: VastStorageClassReplication
        name: vaststorageclassreplications.vastdata.com
        displayName: VastStorageClassReplication
        description: "VastStorageClassReplication declares a replication group across StorageClasses."
        version: v1alpha1
        resources:
          - kind: VolumeGroupReplication
            name: ''
            version: v1alpha1
          - kind: StorageClass
            name: ''
            version: v1
        specDescriptors:
          - description: |
              Optional. Namespace of the PersistentVolumeClaims in this group. Leave empty to use this VastStorageClassReplication's namespace.
            displayName: Volume Namespace
            path: volumeNamespace
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:Namespace
          - description: |
              VastStorage that is currently acting as the active (primary) replica. The StorageClass name matches the VastStorage resource name.
            displayName: Primary StorageClass
            path: primaryStorageClass
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:storage.vastdata.com:v1:VastStorage
          - description: |
              Undirected replication mesh. Each entry connects two VastStorage (StorageClass) resources. For two clusters provide a single source/destination pair.
            displayName: Protection Topology
            path: protectionTopology
          - description: |
              Source VastStorage in this replication pair. The StorageClass name matches the VastStorage resource name.
            displayName: Source StorageClass
            path: protectionTopology[0].source
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:storage.vastdata.com:v1:VastStorage
          - description: |
