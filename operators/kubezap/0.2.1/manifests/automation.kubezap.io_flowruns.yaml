apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: flowruns.automation.kubezap.io
spec:
  group: automation.kubezap.io
  names:
    kind: FlowRun
    listKind: FlowRunList
    plural: flowruns
    singular: flowrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Flow name
      jsonPath: .spec.flowRef.name
      name: FLOW
      type: string
    - description: FlowRun phase
      jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - description: Completion timestamp
      jsonPath: .status.completionTime
      name: DURATION
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FlowRun is an execution instance of a Flow, created by a gateway
          when a trigger fires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FlowRunSpec defines the desired state of FlowRun.
            properties:
              flowRef:
                description: |-
                  Reference to the Flow to execute. The Flow must be in the same namespace as the FlowRun.
                  Cross-namespace FlowRefs are not supported in v1alpha1 and are deferred to v1beta1 with a FlowGrant CRD.
                properties:
                  name:
                    description: |-
                      Name of the Flow CR to execute. The Flow must be in the same namespace as the referencing resource.
                      Cross-namespace FlowRefs are not supported in v1alpha1 and are deferred to v1beta1 with a FlowGrant CRD.
                    type: string
                required:
                - name
                type: object
              params:
                description: Optional runtime parameters.
                items:
                  description: |-
                    ParamValue assigns an explicit value to a Flow parameter declared via
                    FlowSpec.Params (see ParamDeclaration). Used by FlowRunSpec.Params.
                  properties:
                    name:
                      description: Name of the parameter.
                      type: string
                    value:
                      description: Value to set.
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
              triggerData:
                description: Originating trigger data.
                properties:
                  body:
                    type: string
                  bodyEncoding:
                    description: |-
                      BodyEncoding indicates how Body is encoded: "utf8" or "base64". Body is
                      captured verbatim as UTF-8 when the (possibly truncated, per
                      BodyTruncated) payload decodes as valid UTF-8, or base64-encoded
                      otherwise — mirrors the Key/KeyEncoding convention above.
                    type: string
                  bodyTruncated:
                    type: boolean
                  contentType:
                    type: string
                  eventType:
                    description: 'EventType is the Kubernetes watch event type for
                      resource triggers: ADDED, MODIFIED, DELETED.'
                    type: string
                  headers:
                    additionalProperties:
                      type: string
                    type: object
                  key:
                    description: |-
                      Key is the Kafka record key (kafka triggers only), captured verbatim when it
                      decodes as valid UTF-8, or base64-encoded otherwise. Unset (zero value) when
                      the record key is nil. See KeyEncoding to determine which form this is in.
                    type: string
                  keyEncoding:
                    description: |-
                      KeyEncoding indicates how Key is encoded: "utf8" or "base64". Unset when Key
                      is unset (nil record key).
                    type: string
                  method:
                    type: string
                  offset:
                    format: int64
                    type: integer
                  partition:
                    format: int32
                    type: integer
                  path:
                    type: string
                  resourceAPIVersion:
                    description: ResourceAPIVersion is the API version of the watched
                      resource.
                    type: string
                  resourceKind:
                    description: ResourceKind is the kind of the watched resource.
                    type: string
                  resourceName:
                    description: ResourceName is the name of the resource that fired
                      the trigger.
                    type: string
                  resourceNamespace:
                    description: ResourceNamespace is the namespace of the resource
                      that fired the trigger.
                    type: string
                  scheduledTime:
                    format: date-time
                    type: string
                  source:
                    type: string
                  topic:
                    type: string
                type: object
              triggerRef:
                description: Originating trigger reference.
                properties:
                  name:
                    description: Name of the trigger.
                    type: string
                  type:
                    description: Type of the trigger.
                    enum:
                    - webhook
                    - cron
                    - kafka
                    - amqp
                    - nats
                    - resource
                    type: string
                required:
                - name
                - type
                type: object
              ttlAfterFinished:
                description: TTL for cleanup after completion.
                type: string
            required:
            - flowRef
            type: object
          status:
            description: FlowRunStatus defines the observed state of FlowRun.
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              durationMillis:
                description: |-
                  DurationMillis is the FlowRun's total execution time in milliseconds, set
                  once the FlowRun reaches a terminal phase (Succeeded, Failed, or
                  Cancelled) — the same full-precision time.Duration observed into the
                  kubezap_flowrun_duration_seconds histogram. Unset while the FlowRun is
                  Pending or Running.
                format: int64
                type: integer
              message:
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: |-
                  FlowRunPhase is the overall execution phase of a FlowRun. Distinct from
                  StepPhase — see its doc comment for why.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              startTime:
                format: date-time
                type: string
              steps:
                items:
                  description: StepRunStatus tracks execution state for an individual
                    Flow step.
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    completionTime:
                      format: date-time
                      type: string
                    durationMillis:
                      description: |-
                        DurationMillis is the step's execution time in milliseconds, set once the
                        step reaches a terminal phase (Succeeded, Failed, or Skipped) — the same
                        full-precision time.Duration observed into the kubezap_step_duration_seconds
                        histogram, in case a caller needs it and can't fall back to subtracting the
                        second-precision StartTime/CompletionTime. Unset while the step is Pending,
                        Running, or Waiting.
                      format: int64
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: |-
                        StepPhase is the execution phase of an individual Flow step. Distinct from
                        FlowRunPhase (rather than sharing one "Phase" type) so the compiler catches a
                        value valid for one but not the other being used in place of the wrong one —
                        e.g. Waiting is a valid StepPhase but was, before this type existed, mistakenly
                        documented as a valid FlowRunPhase too. See docs/design/typed-phase-enums.md.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      - Waiting
                      type: string
                    results:
                      items:
                        description: ResultValue is a named result emitted by a step.
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                        required:
                        - name
                        - value
                        type: object
                      type: array
                    resumeAfter:
                      description: |-
                        ResumeAfter is set by the wait step executor and records when the step should resume.
                        The controller requeues the FlowRun until this time has elapsed.
                      format: date-time
                      type: string
                    startTime:
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
