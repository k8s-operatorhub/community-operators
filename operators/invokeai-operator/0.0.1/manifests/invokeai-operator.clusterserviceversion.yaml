  description: |
    InvokeAI is an open-source creative engine for AI image generation and node-based
    workflow automation. It provides a web canvas for composing generative pipelines and
    a REST API that third-party plugins can use to drive inference. More information is
    available at https://invoke-ai.github.io/InvokeAI/ and the operator source is at
    https://github.com/red-hat-et/invokeai-operator.

    ## Features

    The InvokeAI Operator manages the full lifecycle of an InvokeAI deployment on
    Kubernetes and OpenShift from a single custom resource (InvokeAIPlatform).

    - Deploys InvokeAI as a Kubernetes Deployment and ClusterIP Service, keeping them
      in sync with the CR spec on every change.
    - Optionally deploys KServe InferenceServices for reasoning and image-generation
      backends, and wires their in-cluster predictor URLs into InvokeAI via environment
      variables automatically.
    - Self-heals: if the InvokeAI Deployment or any managed InferenceService is deleted,
      the operator recreates it within seconds.
    - Cleans up orphaned InferenceServices when a backend is removed from the CR spec.
    - Optionally creates KServe ServingRuntimes when a runtime container image is
      provided in the CR spec, so no manual runtime setup is required.
    - Supports both RawDeployment and Serverless (Knative) KServe modes via a single
      spec field.
    - Reports per-backend readiness, predictor URLs, and a platform-level phase
      (Pending, Deploying, Ready, Degraded) on the CR status subresource.

    ## Prerequisites

    - Kubernetes 1.25+ or OpenShift 4.12+.
    - KServe v0.14+ must be installed and running on the cluster before creating an
      InvokeAIPlatform CR that includes backends. The operator does not install KServe.
    - GPU nodes with the nvidia.com/gpu extended resource are required for inference
      backends. Each backend requests GPU resources via the CR spec.
    - The InvokeAI container image and any vLLM runtime image must be accessible from
      the cluster (public registry or image pull secret configured on the namespace).
