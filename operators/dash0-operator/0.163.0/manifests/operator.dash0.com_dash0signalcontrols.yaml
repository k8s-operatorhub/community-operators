              controlPlaneApiEndpoint:
                description: |-
                  The Dash0 API endpoint used by the dash0settingsonedge extension to fetch settings and rules (it queries
                  {endpoint}/api/edge/settings on the region-bound Dash0 public API). This setting is optional. When not set,
                  it defaults to the Dash0 API endpoint configured in the operator configuration resource as-is
                  (e.g., https://api.eu-central-1.aws.dash0.com). The field name is retained for backwards compatibility;
                  it must point at the public API host, not the control-plane-api host.
                type: string
              edgeProxy:
                description: |-
                  Configuration for the Edge Proxy. When enabled, the operator deploys the Edge Proxy as a Deployment and
                  Service in the operator namespace. The Edge Proxy consolidates collector-to-Decision-Maker connections,
                  reducing egress and improving reliability. Recommended for clusters with multiple collector instances.
                properties:
                  debug:
                    description: |-
                      Enable verbose network logging in the Edge Proxy. This is separate from the log level and produces
                      detailed output about gRPC connections and message flow. Warning: high log volume. This setting
                      is optional, it defaults to false.
                    type: boolean
                  enabled:
                    default: true
                    description: |-
                      Whether to deploy the Edge Proxy. When enabled, collectors connect to the Edge Proxy instead of directly
                      to the cloud Decision Maker. This consolidates N collector connections into 1-2 upstream connections.
                      This setting is optional, it defaults to true.
                    type: boolean
                  fallbackMinConnectedRatio:
                    default: "1.0"
                    description: |-
                      The minimum ratio of connected upstream Decision Maker instances the Edge Proxy tolerates before it
                      signals collectors to enter fallback. "1.0" enters fallback as soon as any upstream connection is lost
                      (fail loud); lower values tolerate partial upstream outages at the risk of silently dropping the sampling
                      decisions routed to a missing upstream. This setting is optional, it defaults to "1.0". Must be a string
                      representation of a float between 0.0 and 1.0.
                    pattern: ^(0(\.\d+)?|1(\.0+)?)$
                    type: string
                  insecure:
                    description: |-
                      Disables TLS for the Edge Proxy's upstream gRPC connection to the Decision Maker. Intended for local
                      development and end-to-end testing against in-cluster mock services. Production deployments
                      should leave this unset so that the Edge Proxy requires TLS upstream. This setting is optional, it
                      defaults to false.
                    type: boolean
                  logLevel:
                    allOf:
                    - enum:
                      - trace
                      - debug
                      - info
                      - warn
                      - error
                    - enum:
                      - trace
                      - debug
                      - info
                      - warn
                      - error
                    default: info
                    description: The log level for the Edge Proxy. This setting is
                      optional, it defaults to "info".
                    type: string
                  settingsRefreshInterval:
                    description: |-
                      How often the Edge Proxy refreshes the organization settings feed (spam filters, signal-to-metrics and
                      sampling rules) from the Dash0 API. Go duration syntax (e.g. "60s", "5m"). Must be between 10s and 1h; a
                      value outside this range is rejected by the Edge Proxy. This setting is optional; the Edge Proxy default
                      (60s) applies when unset.
                    type: string
                required:
                - enabled
                type: object
              enabled:
                default: true
                description: |-
                  Whether Signal Control is enabled. When disabled, no Signal Control components are added to the collector pipeline
                  and no Signal Control resources (e.g. Edge Proxy) are deployed, regardless of other settings in this resource. This
                  setting is optional, it defaults to true.
                type: boolean
              logEnrichment:
                description: |-
