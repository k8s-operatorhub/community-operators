              - urn:alm:descriptor:com.tectonic.ui:text
          - description: |-
              tags are applied to the resource. Tags with other keys are left alone: the operator
              only ever adds tags, it never removes one.
            displayName: Tags
            path: tags
        statusDescriptors:
