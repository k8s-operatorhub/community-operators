dependencies:
# The operator issues a cert-manager Certificate and Issuer for every
# OvercommitClass, so cert-manager is mandatory: without it the generated
# mutating webhooks never get a serving certificate and pod admission fails.
#
# Declared as olm.gvk (not olm.package) on purpose: any provider of the API
# satisfies it, so a cluster that already runs cert-manager outside OLM
# (helm, manifests) does not get a second cert-manager installed on top.
- type: olm.gvk
  value:
    group: cert-manager.io
    kind: Certificate
    version: v1
- type: olm.gvk
  value:
    group: cert-manager.io
    kind: Issuer
    version: v1
