                  deployment.
                maxLength: 253
                type: string
              lastReconciled:
                description: LastReconciled is the time of the latest reconciliation
                  attempt.
                format: date-time
                maxLength: 64
                type: string
              phase:
                description: Phase summarises the reconciliation state.
                enum:
                - Pending
                - Ready
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
