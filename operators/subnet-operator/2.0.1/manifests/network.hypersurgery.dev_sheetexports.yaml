            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SheetExport
            properties:
              credentialsSecretRef:
                description: credentialsSecretRef holds the Google service account
                  JSON.
                properties:
                  key:
                    default: credentials.json
                    description: key holding the Google service account JSON.
                    type: string
                  name:
                    description: name of the Secret.
                    type: string
                  namespace:
                    description: namespace of the Secret.
                    type: string
                required:
                - name
                - namespace
                type: object
              extraTagColumns:
                description: extraTagColumns adds one column per tag key, after the
                  standard columns.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              refreshInterval:
                default: 5m
                description: refreshInterval is how often the sheet is rewritten.
                type: string
              scopeRef:
                description: scopeRef is the NetworkScope whose subnets are exported.
                maxLength: 253
                minLength: 1
                type: string
              sheetName:
                default: Subnets
                description: |-
                  sheetName is the tab that holds the inventory. It is created if missing and fully
                  rewritten on every export, so people should not keep their own data in it.
                type: string
              spreadsheetID:
                description: |-
                  spreadsheetID is the ID from the spreadsheet URL
                  (docs.google.com/spreadsheets/d/<spreadsheetID>/edit). The spreadsheet must be shared
                  with the service account as an editor.
                type: string
            required:
            - credentialsSecretRef
            - scopeRef
            - spreadsheetID
