                  datadog:
                    description: Datadog configures a Datadog metrics source.
                    properties:
                      apiKeySecretRef:
                        description: |-
                          APIKeySecretRef references a Secret containing the Datadog API key.
                          The Secret must contain an "api-key" key and optionally an "app-key" key.
                          On AttunePolicy and AttuneNamespaceDefaults the Secret is in that namespace.
                          On cluster AttuneDefaults the name is still copied onto each policy.
                          When --datadog-api-key-secret is set, a cluster-chosen Datadog block
                          reads the operator-namespace Secret instead of this name.
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      site:
                        default: datadoghq.com
                        description: |-
                          Site is the Datadog site (e.g. "datadoghq.com", "datadoghq.eu", "us5.datadoghq.com").
                          Defaults to "datadoghq.com".
                        type: string
                    required:
                    - apiKeySecretRef
                    type: object
                  historyWindow:
                    description: |-
                      HistoryWindow is the time window for historical metrics data.
                      Defaults to 7d (168h) if not specified.
                    type: string
                  memoryRecordingMetric:
                    description: |-
                      MemoryRecordingMetric is an optional pre-aggregated Prometheus metric name
                      used instead of container_memory_working_set_bytes. Same label requirements
                      as CPURecordingMetric.
                    type: string
                  minimumDataPoints:
                    description: |-
                      MinimumDataPoints is the minimum number of data points required
                      before generating recommendations. Minimum 1, default 48 samples.
                      With the default queryStep of 5m, 48 samples is about 4 hours of data.
                      Defaults to 48 if not set (applied by the controller so that
                      AttuneDefaults cluster configuration can override it).
                    format: int32
                    minimum: 1
                    type: integer
                  podAggregation:
                    description: |-
                      PodAggregation controls how multi-pod series are reduced in Prometheus
                      range queries for this policy.
                        Max (default): max by (container) — size for the busiest pod; O(containers) series.
                        Avg: avg by (container) across pods.
                        None: no aggregation (one series per pod; expensive for high replica counts).
                      Datadog and CloudWatch already group by container; this field applies to Prometheus.
                    enum:
                    - Max
                    - Avg
                    - None
                    type: string
                  prometheus:
                    description: Prometheus configures a Prometheus metrics source.
                    properties:
                      address:
                        description: Address is the URL of the Prometheus-compatible
                          query endpoint.
                        type: string
                      bearerTokenSecret:
                        description: |-
                          BearerTokenSecret references a Secret with a bearer token
                          (Google Managed Prometheus, Mimir, and other bearer front ends).
                          Do not set this for Amazon Managed Prometheus; use sigv4.
                          Webhook rejects both together.
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      headers:
                        additionalProperties:
                          type: string
                        description: |-
                          Headers are custom HTTP headers added to every query request.
                          Use for non-secret tenant or routing headers (e.g. "X-Scope-OrgID"
                          for Mimir). Do not put credentials here; use BearerTokenSecret for
                          authentication tokens.
                        type: object
                      queryParameters:
                        additionalProperties:
                          type: string
                        description: |-
                          QueryParameters are appended to every query request URL.
                          Use for backend-specific settings such as Thanos deduplication
                          (e.g. {"dedup": "true", "partial_response": "true"}). Reserved
                          query keys controlled by the operator (`query`, `start`, `end`, `step`,
                          `time`, `timeout`) are rejected.
                        type: object
                      sigv4:
                        description: |-
                          SigV4 signs queries for Amazon Managed Prometheus (service aps).
                          Do not combine with BearerTokenSecret, an Authorization header,
                          or X-Amz-* headers. Omitted means do not sign.
                        properties:
                          region:
                            description: |-
                              Region is the AWS region of the AMP workspace, for example us-east-1.
                              Required when sigv4 is set. There is no default.
                            minLength: 1
                            type: string
                          roleArn:
                            description: |-
                              RoleARN is an optional IAM role to assume. Empty uses the operator
                              identity. On AttunePolicy and AttuneNamespaceDefaults a set role must
                              match --sigv4-allowed-role-arns, and an empty role requires the
                              workspace host in --sigv4-allowed-workspace-hosts. Cluster
                              AttuneDefaults is not filtered by those lists. A namespaced assume
                              sends ExternalId attune:<namespace>.
                            type: string
                        required:
                        - region
                        type: object
                      tls:
                        description: TLS configures TLS settings for the connection.
                        properties:
                          insecureSkipVerify:
                            description: |-
                              InsecureSkipVerify disables TLS certificate verification.
                              Use only for self-signed certificates in development.
                            type: boolean
                        type: object
                    required:
                    - address
                    type: object
                  queryStep:
                    description: |-
                      QueryStep is the step interval for Prometheus range queries and ETA
                      calculations. Should match your Prometheus scrape interval for
                      accurate time estimates. Minimum 10s, maximum 1h. Default 5m.
                    type: string
                  rateWindow:
                    description: |-
                      RateWindow is the window used in the PromQL rate() function for CPU
                      queries. Defaults to queryStep if not set. Must be >= 30s and <= historyWindow.
                      Advanced users may set this independently to control CPU rate smoothing
                      (e.g. a short rateWindow for responsive tracking with a longer queryStep).
                    type: string
                  vpa:
                    description: VPA configures consumption of existing VerticalPodAutoscaler
                      recommendations.
                    properties:
                      name:
                        description: Name is the name of the VerticalPodAutoscaler
                          object.
                        type: string
                      namespace:
                        description: |-
                          Namespace is the namespace of the VPA. Empty uses the policy namespace.
                          AttunePolicy and AttuneNamespaceDefaults may only name their own
                          namespace. Cluster AttuneDefaults may name another namespace, and
                          policies that inherit only that value still read it.
                        type: string
                    required:
                    - name
                    type: object
                type: object
              updateStrategy:
                description: UpdateStrategy configures default update strategy settings.
                properties:
                  autoRevert:
                    description: |-
                      AutoRevert automatically reverts changes if degradation is detected.
                      Defaults to true if not set (applied by the controller so that
                      AttuneDefaults cluster configuration can override it).
                    type: boolean
                  canary:
                    description: Canary configures canary rollout behavior when Type
                      is Canary.
                    properties:
                      autoPromote:
                        description: |-
                          AutoPromote controls whether the operator automatically promotes the
                          resize to all pods after the observation period passes without safety
                          violations. When false (default), the user must manually switch the
                          mode to Auto to resize the remaining pods.
                        type: boolean
                      observationPeriod:
                        description: ObservationPeriod is how long to observe canary
                          pods before proceeding.
                        type: string
                      percentage:
                        description: Percentage is the percentage of pods to resize
                          first.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    required:
                    - observationPeriod
                    - percentage
                    type: object
                  cooldown:
                    description: |-
                      Cooldown is the minimum time between successive resize operations.
                      Defaults to 1h if not specified.
                    type: string
                  export:
                    description: |-
                      Export configures how recommendations are exported for external
                      consumption (e.g. GitOps workflows with ArgoCD or Flux).
                    properties:
                      configMap:
                        description: ConfigMap enables exporting recommendations to
                          ConfigMaps.
                        type: boolean
                      pullRequest:
                        description: |-
                          PullRequest enables opt-in GitOps PR automation (default off).
                          Requires a token Secret and repository identity. Never logs the token.
                        properties:
                          allowPrivateEndpoints:
                            description: |-
                              AllowPrivateEndpoints permits RFC1918/ULA API hosts (self-hosted
                              GitLab/Gitea/Bitbucket). Loopback, link-local (including cloud
                              metadata), and unspecified addresses stay blocked. Default false.
                            type: boolean
                          apiUrl:
                            description: |-
                              APIURL overrides the API base URL (Enterprise GitHub or self-hosted GitLab).
                              Defaults: https://api.github.com or https://gitlab.com/api/v4.
                            type: string
                          baseBranch:
                            description: BaseBranch is the PR target branch. Defaults
                              to "main".
                            type: string
                          cooldown:
                            description: |-
                              Cooldown is the minimum time between PR create/update attempts for this
                              policy. Defaults to 24h.
                            type: string
                          dryRun:
                            description: |-
                              DryRun logs the intended PR and updates status without calling the
                              remote API. Useful for CI and first enablement.
                            type: boolean
                          enabled:
                            description: Enabled turns on PR automation. Default false.
                            type: boolean
                          labels:
                            description: Labels are applied to the pull request when
                              supported by the provider.
                            items:
                              type: string
                            maxItems: 20
                            type: array
                          minChangePercent:
                            description: |-
                              MinChangePercent is the minimum absolute percent change (per container
                              resource vs template) required to open or update a PR. Defaults to 10.
                            format: int32
                            maximum: 100
                            minimum: 1
                            type: integer
                          provider:
                            description: Provider is "github" or "gitlab". Default
                              "github".
                            enum:
                            - github
                            - gitlab
                            type: string
                          repository:
                            description: |-
                              Repository is "owner/name" (GitHub) or "group/project" (GitLab path).
                              Required when Enabled is true.
                            type: string
                          tokenSecretRef:
                            description: |-
                              TokenSecretRef references a Secret key holding a PAT / project token.
                              GitHub: repo contents + pull requests. GitLab: api scope on the project.
                              Required when Enabled is true.
                            properties:
                              key:
                                description: Key within the Secret.
                                type: string
                              name:
                                description: Name of the Secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                    type: object
                  hpaTargetBounds:
                    description: |-
                      HPATargetBounds optionally clamps auto-tuned HPA utilization
                      percents after the limit cap. Unset means no user band. It does
                      not turn auto-tune on. The HPA still needs attune.io/auto-tune=true.
                    properties:
                      cpu:
                        description: CPU applies only to CPU utilization targets.
                        properties:
                          max:
                            description: |-
                              Max is the highest published percent. The limit cap can still
                              publish a lower number.
                            format: int32
                            maximum: 10000
                            minimum: 1
                            type: integer
                          min:
                            description: |-
                              Min is the lowest published percent. It cannot raise a target
                              above the limit cap.
                            format: int32
                            maximum: 10000
                            minimum: 1
                            type: integer
                        type: object
                      memory:
                        description: Memory applies only to memory utilization targets.
                        properties:
                          max:
                            description: |-
                              Max is the highest published percent. The limit cap can still
                              publish a lower number.
                            format: int32
                            maximum: 10000
                            minimum: 1
                            type: integer
                          min:
                            description: |-
                              Min is the lowest published percent. It cannot raise a target
                              above the limit cap.
                            format: int32
                            maximum: 10000
                            minimum: 1
                            type: integer
                        type: object
                    type: object
                  includeExplanationsInStatus:
                    description: |-
                      IncludeExplanationsInStatus controls whether recommendation explanation
                      chains are written to status. Set to false on large policies to shrink
                      CR size. Default: true.
                    type: boolean
                  initialSizing:
                    description: |-
                      InitialSizing enables a mutating admission webhook that sets resource
                      requests/limits on new pods at creation time, based on existing
                      recommendations. Matching uses targetRef.name or targetRef.selector.
                      Owner Get includes Deployment, StatefulSet, DaemonSet, ReplicaSet, Job,
                      and CronJob. A Deployment-owned ReplicaSet is resolved to the
                      Deployment and is not a ReplicaSet target. Job pods walk the owning
                      Job to the CronJob. Fail-closes on Get or parse errors. Recommend is
                      allowed for Job and CronJob CREATE; Observe still skips. Requires the
                      namespace label attune.io/initial-sizing=enabled. Defaults to false.
                    type: boolean
                  maxConcurrentResizes:
                    description: |-
                      MaxConcurrentResizes is the maximum number of pods to resize
                      concurrently within a single reconcile cycle. Default: 1 (serial).
                      Applied by the controller after AttuneDefaults merge so cluster
                      and namespace defaults can override the built-in value. Zero is
                      treated as unset; explicit values must be 1-50.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                  maxCpuIncreasePerMinute:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxCPUIncreasePerMinute is the maximum aggregate CPU increase
                      allowed per wall-clock minute (e.g. "2000m"). Refilled by elapsed
                      time, so the cap does not change if reconcileInterval changes.
                      When set, it applies in addition to maxTotalCpuIncrease.
                      Decreases do not consume budget. Default: unlimited.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxMemoryIncreasePerMinute:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxMemoryIncreasePerMinute is the maximum aggregate memory increase
                      allowed per wall-clock minute (e.g. "4Gi"). Refilled by elapsed
                      time. When set, it applies in addition to maxTotalMemoryIncrease.
                      Decreases do not consume budget. Default: unlimited.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxStatusRecommendations:
                    description: |-
                      MaxStatusRecommendations caps how many workload recommendations are
                      written to status.recommendations. Resizes still use the full in-memory
                      set. When the cap is hit, entries with the largest absolute CPU+memory
                      request change are kept. Default: 100 (operator may override via flag).
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
                  maxTotalCpuIncrease:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxTotalCPUIncrease is the maximum aggregate CPU increase allowed
                      across all pods in a single reconcile cycle (e.g. "2000m", "4").
                      Once exhausted, remaining pods are deferred to the next cycle.
                      Decreases do not consume budget. Default: unlimited.

                      Prefer MaxCPUIncreasePerMinute. This per-cycle field is kept for
                      compatibility; its real-world rate depends on reconcileInterval.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxTotalMemoryIncrease:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxTotalMemoryIncrease is the maximum aggregate memory increase
                      allowed across all pods in a single reconcile cycle (e.g. "4Gi").
                      Once exhausted, remaining pods are deferred to the next cycle.
                      Decreases do not consume budget. Default: unlimited.

                      Prefer MaxMemoryIncreasePerMinute. This per-cycle field is kept for
                      compatibility; its real-world rate depends on reconcileInterval.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  resizeMethod:
                    description: |-
                      ResizeMethod controls what happens when an in-place resize fails.
                        InPlaceOnly (default): skip the pod and retry next cycle.
                        InPlaceOrRecreate: fall back to pod eviction if in-place resize
                        fails or is marked Infeasible by kubelet. The owning controller
                        recreates the pod with updated resources. Evictions respect
                        PodDisruptionBudgets and never evict the last replica.
                      Defaults to InPlaceOnly if not set (applied by the controller so that
                      AttuneDefaults cluster configuration can override it).
                    enum:
                    - InPlaceOnly
                    - InPlaceOrRecreate
                    type: string
                  safetyObservationPeriod:
                    description: |-
                      SafetyObservationPeriod is how long to observe a pod after resize before
                      concluding the resize is safe. Applies to all modes (Auto, OneShot, Canary).
                      Takes precedence over canary.observationPeriod when set. Must be >= 1m.
                      Defaults to 5m if neither this nor canary.observationPeriod is set.
                    type: string
                  schedule:
                    description: |-
                      Schedule restricts when resize operations can occur. Recommendations
                      are always computed; only resize execution is gated. If omitted,
                      resizes can occur at any time (current behavior).
                    properties:
                      daysOfWeek:
                        description: |-
                          DaysOfWeek restricts resizes to specific days. Values: Monday through Sunday.
                          If omitted, all days are allowed.
                          An overnight window (End before Start) uses the weekday when the window
                          opened for the post-midnight tail. Monday 22:00-06:00 includes Tuesday
                          03:00 and excludes Tuesday 23:00.
                        items:
                          enum:
                          - Monday
                          - Tuesday
                          - Wednesday
                          - Thursday
                          - Friday
                          - Saturday
                          - Sunday
                          type: string
                        type: array
                      timezone:
                        default: UTC
                        description: |-
                          Timezone for interpreting window start/end times. Must be a valid
                          IANA timezone name (e.g. "America/New_York"). Default: "UTC".
                        type: string
                      windows:
                        description: |-
                          Windows defines time-of-day ranges when resizes are allowed.
                          If multiple windows are specified, resizes are allowed during any of them.
                        items:
                          description: TimeWindow defines a daily time range.
                          properties:
                            end:
                              description: |-
                                End time in HH:MM format (24-hour). The end minute is exclusive.
                                If end < start, the window wraps past midnight (for example
                                start=22:00, end=06:00). If end equals start, the window never
                                opens and admission rejects it. Times are local wall-clock minutes
                                in Timezone, including DST spring-forward gaps and fall-back
                                repeated hours.
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                              type: string
                            start:
                              description: Start time in HH:MM format (24-hour).
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                              type: string
                          required:
                          - end
                          - start
                          type: object
                        type: array
                    type: object
                  sloGuardrails:
                    description: |-
                      SLOGuardrails defines application-level SLO metrics to check after
                      a resize. If any metric breaches its threshold during the safety
                      observation period, the resize is automatically reverted.
                      Requires a Prometheus-compatible metrics source.
                    items:
                      description: |-
                        SLOGuardrail defines an application-level metric that is checked after
                        a resize to detect degradation. If the metric breaches the threshold,
                        the safety monitor triggers an automatic revert.
                      properties:
                        comparison:
                          default: above
                          description: Comparison is "above" or "below". "above" reverts
                            when value > threshold.
                          enum:
                          - above
                          - below
                          type: string
                        evaluationWindow:
                          description: EvaluationWindow is how long after resize to
                            check. Defaults to 5m.
                          type: string
                        name:
                          description: Name identifies this guardrail for logging
                            and status reporting.
                          type: string
                        query:
                          description: |-
                            Query is a PromQL query that returns a scalar value.
                            Template variables: {{ .Namespace }}, {{ .WorkloadName }}, {{ .PodName }}
                          type: string
                        threshold:
                          description: Threshold is the value that triggers a revert.
                          type: string
                      required:
                      - name
                      - query
                      - threshold
                      type: object
                    maxItems: 10
                    type: array
                  templatePersistence:
                    description: |-
                      TemplatePersistence optionally writes recommended resources into the
                      workload pod template (Deployment/StatefulSet) so new pods start
                      correctly sized. Default off. Do not enable under unmanaged GitOps
                      sync without adopting recommendations in Git; prefer export or
                      initialSizing in that case.
                    properties:
                      enabled:
                        description: |-
                          Enabled turns on template persistence. When false or unset, templates
                          are never mutated.
                        type: boolean
                      when:
                        description: |-
                          When selects the trigger. Defaults to AfterSuccessfulResize when
                          Enabled is true and When is empty. AfterSuccessfulResize also
                          patches after Eviction+Evicted (InPlaceOrRecreate).
                        enum:
                        - AfterSuccessfulResize
                        - OnRecommendation
                        type: string
                    type: object
                  type:
                    description: |-
                      Mode determines the update behavior, graduated from safe to automated:
                        Recommend: collects metrics and writes recommendations to status, no pod changes.
                        OneShot: at most one needing pod per cycle. Skips already-at-target and blocked replicas (QoS, pressure, quota, Infeasible+InPlaceOnly).
                        Canary: resizes a percentage of pods first, then the rest after observation.
                        Auto: resizes all eligible pods each cycle.
                        Observe: collects metrics and tracks data points but does not surface recommendations or savings.
                      Start with Recommend in production and promote after reviewing status.
                      Defaults to Recommend if not set (applied by the controller, not the webhook,
                      so that AttuneDefaults cluster configuration can override it).
                    enum:
                    - Observe
                    - Recommend
                    - OneShot
                    - Canary
                    - Auto
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
