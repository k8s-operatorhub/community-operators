                    - 50
                    - 90
                    - 95
                    - 99
                    format: int32
                    type: integer
                  startupBoost:
                    description: |-
                      StartupBoost temporarily increases CPU requests for cold starts
                      (JVM/.NET class loading, JIT, cache warming). Applied by the CREATE
                      webhook and in-place while pod age (CreationTimestamp) is within
                      Duration. Expiry uses attune.io/startup-boost-at plus Duration.
                      Ready is not checked. CPU only.
                    properties:
                      duration:
                        description: |-
                          Duration is how long the boost stays active. Apply uses pod age
                          (CreationTimestamp). Expiry uses attune.io/startup-boost-at plus
                          this duration. Ready is not checked. Must be >= 10s and <= 1h.
                        type: string
                      excludeFromHistory:
                        description: |-
                          ExcludeFromHistory, when true, drops CPU samples from the
                          percentile while a pod is inside startupBoost.duration plus the
                          rate window. The window starts at attune.io/startup-boost-at when
                          that stamp is set and not before CreationTimestamp, otherwise at
                          CreationTimestamp. The cutoff is that start plus duration plus
                          rateWindow. A sample at the cutoff stays. Sample timestamps are
                          the end of rate(). Nil and false keep today's percentile. Memory
                          samples are unchanged. Deleted pods stay in history until
                          historyWindow because there is no creation time or stamp to cut
                          on. Samples older than CreationTimestamp stay. A series with no
                          pod label is left unfiltered.
                        type: boolean
                      multiplier:
                        description: |-
                          Multiplier scales the recommended CPU request during startup.
                          For example, "3.0" means 3x the steady-state recommendation.
                          Must be > 1.0 and <= 10.0.
                        type: string
                    required:
                    - duration
                    - multiplier
                    type: object
                    x-kubernetes-validations:
                    - message: startupBoost.duration must be between 10s and 1h
                      rule: duration(self.duration) >= duration('10s') && duration(self.duration)
                        <= duration('1h')
                  surge:
                    description: |-
                      Surge shortens the history window while recent usage is hot.
                      Absent means off. An empty object turns it on and fills
                      triggerRatio, percentile, and window. Valid on CPU and memory.
                    properties:
                      percentile:
                        description: |-
                          Percentile is the overall percentile of the short window.
                          50, 90, 95, or 99. Nil is filled with 99 when the block is set.
                          This does not change the long-window percentile.
                        enum:
                        - 50
                        - 90
                        - 95
                        - 99
                        format: int32
                        type: integer
                      triggerRatio:
                        description: |-
                          TriggerRatio is short/long. The short window is used when the
                          ratio is at least this value. Empty is filled with "1.5" when
                          the block is set. Must be finite and greater than 1, at most 100.
                        pattern: ^([0-9]+(\.[0-9]+)?)?$
                        type: string
                      window:
                        description: |-
                          Window is how far back the short percentile looks.
                          Nil is filled with 30m when the block is set. At least 5m, and
                          not longer than metricsSource.historyWindow (168h when that is unset).
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: surge.window must be at least 5m
                      rule: '!has(self.window) || duration(self.window) >= duration(''5m'')'
                type: object
                x-kubernetes-validations:
                - message: minAllowed must be less than or equal to maxAllowed
                  rule: '!has(self.minAllowed) || !has(self.maxAllowed) || quantity(string(self.minAllowed)).compareTo(quantity(string(self.maxAllowed)))
                    <= 0'
              excludeKnownSidecars:
                description: |-
                  ExcludeKnownSidecars, when true (the default when unset on both
                  defaults and policy), automatically skips well-known mesh and
