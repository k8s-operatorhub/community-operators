          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              properties:
                name:
                  description: One NFS and one Block driver can coexist per namespace, but not multiple of the same type.
                  type: string
              type: object
            spec:
              description: Spec defines the desired state of VastCSIDriver
              properties:
                allowROManyBlockFsMode:
                  default: false
                  description: |-
                    (Block driver only) Enable ReadOnlyMany (ROX) access mode for block filesystem volumes.
                    When enabled, multiple pods across different nodes can mount the same block volume
                    in read-only mode. The device and filesystem will be mounted with the 'ro' flag
                    to enforce read-only semantics at the OS level.
                  type: boolean
                applySecurityContextConstraints:
                  default: true
                  description: Flag specifies whether to enforce the defined security context constraints for pods  using specified service accounts in OpenShift, essential for ensuring proper permissions for mounting volumes.
                  type: boolean
                attachRequired:
                  default: true
                  description: |-
                    Indicates whether this CSI driver requires an attach operation, implementing ControllerPublishVolume.
                    If set to false, the driver will perform ControllerPublishVolume as part of NodePublishVolume operation,
                    potentially speeding up volume attachment where HTTP/HTTPS ports are not open.
                  type: boolean
                blockHostsAutoPrune:
                  default: false
                  description: |-
                    (Block driver only) If set to true, the CSI driver will automatically prune (delete) host
                    entries (NQNs) from the VMS when they are no longer in use by any PVCs on the corresponding
                    Kubernetes node. This prevents host sprawl due to unused NQNs automatically generated by the driver.
                    This option is particularly useful in Kubernetes environments where nodes are
                    not static (e.g., clusters with dynamic or ephemeral node pools and changing
                    hostnames), since unused hosts can otherwise accumulate quickly.
                    When disabled (false), host entries remain in the VMS even if unused and must be cleaned
                    up manually.
                  type: boolean
                cacheMaxAgeSeconds:
                  default: 0
                  description: Cache-Control max-age header value in seconds for VMS API requests. When set to a value greater than 0, the CSI driver will add a Cache-Control header to VMS API requests, allowing intermediate caches (like Nginx) to cache responses. Set to 0 to disable caching.
                  format: int32
                  type: integer
