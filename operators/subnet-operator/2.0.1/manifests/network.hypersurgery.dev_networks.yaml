apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  creationTimestamp: null
  name: networks.network.hypersurgery.dev
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: webhook-service
          namespace: system
          path: /convert
      conversionReviewVersions:
      - v1
  group: network.hypersurgery.dev
  names:
    categories:
    - hypersurgery
    kind: Network
    listKind: NetworkList
    plural: networks
    shortNames:
    - hsnet
    singular: network
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.account
      name: Account
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.name
      name: Name
      type: string
    - jsonPath: .status.cidrBlocks[0]
      name: CIDR
      type: string
    - jsonPath: .status.owner
      name: Owner
      type: string
    - jsonPath: .status.subnets
      name: Subnets
      type: integer
    - jsonPath: .status.availableIPs
      name: Free IPs
      type: integer
    - jsonPath: .status.env
      name: Env
      priority: 1
      type: string
    - jsonPath: .status.overlapsWith
      name: Overlaps
      priority: 1
