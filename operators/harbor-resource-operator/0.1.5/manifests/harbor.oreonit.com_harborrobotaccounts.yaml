                  with this object.
                enum:
                - Retain
                - Delete
                type: string
              description:
                description: description shown in Harbor.
                type: string
              disabled:
                description: disabled disables the robot in Harbor without deleting
                  it.
                type: boolean
              duration:
                default: -1
                description: duration in days before the robot expires. -1 means never.
                format: int64
                minimum: -1
                type: integer
              level:
                default: project
