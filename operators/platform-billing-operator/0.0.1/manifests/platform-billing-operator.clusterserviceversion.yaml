spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: |-
        BillingConnector is the Schema for the billingconnectors API.
        It configures integration with a payment service provider (Stripe, generic
        webhook, etc.) for the psp-connector binary.
      displayName: Billing Connector
      kind: BillingConnector
      name: billingconnectors.billing.opendatahub.io
      version: v1alpha1
    - description: |-
        BillingConsole is the Schema for the billingconsoles API.
        It configures operator-managed deployment of the billing console UI.
        Cluster-scoped; the controller enforces singleton semantics (name: default).
      displayName: Billing Console
      kind: BillingConsole
      name: billingconsoles.billing.opendatahub.io
      version: v1alpha1
    - description: |-
        BudgetPolicy is the Schema for the budgetpolicies API.
        It defines spending caps and threshold-based actions for a TenantAccount.
      displayName: Budget Policy
      kind: BudgetPolicy
      name: budgetpolicies.billing.opendatahub.io
      version: v1alpha1
    - description: |-
        Plan is the Schema for the plans API.
        It defines a billing plan with rate limits and model scopes that compiles
        down to Kuadrant TokenRateLimitPolicy, RateLimitPolicy, and AuthPolicy CRs.
      displayName: Plan
      kind: Plan
      name: plans.billing.opendatahub.io
      version: v1alpha1
    - description: |-
        PriceBook is the Schema for the pricebooks API.
        It defines the catalog of SKU rates, volume discounts, and committed-use tiers
        that govern how tenant usage is rated and invoiced.
      displayName: Price Book
      kind: PriceBook
      name: pricebooks.billing.opendatahub.io
      version: v1alpha1
    - description: |-
        Reservation is the Schema for the reservations API.
        It represents a calendar-committed GPU reservation with a time window,
        capacity class (Guaranteed or Preemptible), and fixed monthly pricing.
      displayName: Reservation
      kind: Reservation
      name: reservations.billing.opendatahub.io
      version: v1alpha1
    - description: |-
        TenantAccount is the Schema for the tenantaccounts API.
        It represents a billing tenant with a wallet, billing mode, and lifecycle state.
      displayName: Tenant Account
      kind: TenantAccount
      name: tenantaccounts.billing.opendatahub.io
      version: v1alpha1
  description: |
    # Platform Billing Operator

    A Kubernetes operator that adds billing, metering, and FinOps capabilities to
    AI inference services running on OpenShift. It compiles declarative billing
    Plans into [Kuadrant](https://kuadrant.io) enforcement policies
    (TokenRateLimitPolicy, RateLimitPolicy, AuthPolicy) on a Gateway API gateway.

    ## Features

    - **Prepaid wallets** with automatic reload, grace periods, and balance tracking
    - **Usage metering** via a WASM stream-sniffing capture filter on the Envoy data plane
    - **Multi-product billing** across Models-as-a-Service (token-based) and GPU-as-a-Service (time-based)
    - **PriceBook management** with SKU-level rates, volume discounts, and committed-use tiers
    - **Budget policies** with configurable thresholds (Notify, Throttle, Freeze)
    - **Payment processor integration** (Stripe) with extensible connector model
    - **GPU reservations** with Guaranteed and Preemptible capacity classes via Kueue
    - **Billing console** with RBAC-driven Provider and Consumer personas
    - **CLI** (`billctl`) for wallet adjustments, invoice generation, and DLQ management

    ## Prerequisites

    - OpenShift 4.14+ or Kubernetes 1.27+
    - [Kuadrant](https://kuadrant.io) (Connectivity Link) 1.4.2+ with Gateway API
    - A Gateway API `Gateway` resource for your inference endpoints

    ## Quick Start

    Install via OLM, then create a PriceBook, Plan, and TenantAccount to start
    metering and billing inference traffic. See the
    [Getting Started guide](https://github.com/rdwj/platform-billing-operator/blob/main/docs/getting-started.md)
    for a full walkthrough.
