  name: platformconfigs.core.navique.com
spec:
  group: core.navique.com
  names:
    kind: PlatformConfig
    listKind: PlatformConfigList
    plural: platformconfigs
    shortNames:
    - pfc
    singular: platformconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.active
      name: Active
      type: boolean
    - jsonPath: .status.registry
      name: Registry
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformConfig is the cluster-scoped, singleton operator configuration. It
          configures operator-wide behaviour such as the container registry every
          deployed image is pulled from.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformConfigSpec configures operator-wide behaviour — how the operator
              deploys and manages the platform. The PlatformConfig is a cluster-scoped
              singleton (conventionally named "cluster"). It currently configures the
              container registry; more operator-level defaults will hang off it over time.
            properties:
              defaults:
                description: |-
                  Defaults are operator-wide defaults applied to everything the operator
                  deploys (capability operators, datastore/workload instances, the
                  management-plane console). A component's own spec overrides the matching
                  default.
                properties:
                  clusterDomain:
                    description: |-
                      ClusterDomain is the cluster's DNS domain used to build service hostnames
                      (e.g. "<svc>.<ns>.svc.<clusterDomain>"). Defaults to "cluster.local"; set
                      this when the cluster was installed with a custom DNS domain, otherwise the
                      operator-computed in-cluster URLs (gateway↔langfuse↔chatui wiring, status
                      URLs) would be wrong.
                    type: string
                  commonAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
                      CommonAnnotations are stamped on every resource the operator creates. A
                      resource's own annotations win on key conflict.
                    type: object
                  commonLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      CommonLabels are stamped on every resource the operator creates (emitted
                      CRs, owned Secrets, the management-plane workload, and — via a Helm
                      post-renderer — every object the bundled charts render). A resource's own
                      labels win on key conflict.
                    type: object
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy is the default imagePullPolicy applied to containers in the
                      workloads the operator deploys via Helm.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  proxy:
                    description: |-
                      Proxy injects the standard outbound HTTP(S)_PROXY / NO_PROXY environment
                      variables into the pods the operator deploys via Helm, for restricted-egress
                      clusters where workloads reach EXTERNAL services (e.g. an external LLM API)
                      through a corporate forward proxy. This is unrelated to the container
                      registry: a private registry (Artifactory, Harbor, …) is configured via
                      spec.registry.host, not here. Leave unset on fully air-gapped clusters that
                      have no egress.
                    properties:
                      httpProxy:
                        description: HTTPProxy sets HTTP_PROXY / http_proxy.
                        type: string
                      httpsProxy:
                        description: HTTPSProxy sets HTTPS_PROXY / https_proxy.
                        type: string
                      noProxy:
                        description: NoProxy sets NO_PROXY / no_proxy (comma-separated
                          hosts/CIDRs).
                        type: string
                    type: object
                  scheduling:
                    description: |-
                      Scheduling sets default pod placement (nodeSelector / tolerations /
                      affinity / priorityClassName) on the workloads the operator deploys via
                      Helm, e.g. to pin the platform to a dedicated/tainted node pool.
                    properties:
                      affinity:
                        description: Affinity is a group of affinity scheduling rules.
                        properties:
                          nodeAffinity:
                            description: Describes node affinity scheduling rules
                              for the pod.
                            properties:
                              preferredDuringSchedulingIgnoredDuringExecution:
                                description: |-
                                  The scheduler will prefer to schedule pods to nodes that satisfy
                                  the affinity expressions specified by this field, but it may choose
                                  a node that violates one or more of the expressions. The node that is
                                  most preferred is the one with the greatest sum of weights, i.e.
                                  for each node that meets all of the scheduling requirements (resource
                                  request, requiredDuringScheduling affinity expressions, etc.),
                                  compute a sum by iterating through the elements of this field and adding
                                  "weight" to the sum if the node matches the corresponding matchExpressions; the
                                  node(s) with the highest sum are the most preferred.
