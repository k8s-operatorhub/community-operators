        version: v1beta1
      - description: |-
          NetworkScope selects the accounts and regions of one provider whose networks and subnets
          are discovered.
        displayName: Network Scope
        kind: NetworkScope
        name: networkscopes.network.hypersurgery.dev
        resources:
          - kind: Event
            name: ""
            version: v1
          - kind: Network
            name: ""
            version: v1
          - kind: ResourceImport
            name: ""
            version: v1
          - kind: Subnet
            name: ""
            version: v1
        specDescriptors:
          - description: accounts to discover.
            displayName: Accounts
            path: accounts
          - description: |-
              autoImport tags unmanaged resources on its own, deriving the tags from who created the
              resource, from its network, or from the account. Off unless configured.
            displayName: Auto Import
            path: autoImport
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: |-
              discoverUnmanaged also lists the networks the selector does not match, and their
              subnets, so resources nobody has claimed are counted and can be imported instead of
              staying invisible. They are reported and alerted on, never mirrored as objects.
            displayName: Discover Unmanaged
            path: discoverUnmanaged
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: |-
              namespaceSelector selects the namespaces whose SubnetClaims and ResourceImports may refer
              to this scope. Referring to a scope is what makes the operator use its identities,
              including the write identities, on the object's behalf, so this is what keeps one team's
              namespace from creating subnets in, or tagging, another team's accounts.

              Select namespaces by name with the kubernetes.io/metadata.name label, which the API
              server sets on every namespace and nobody can change, or by a label only cluster
              administrators can set. An empty selector ({}) allows every namespace on purpose.

              When unset, no namespace may use the scope. (In aws.hypersurgery/v1alpha1 unset allowed
              every namespace; migrated scopes get an explicit {} instead.)
            displayName: Namespace Selector
            path: namespaceSelector
          - description: |-
              networkSelector limits discovery to the networks (AWS VPCs, GCP VPC networks) it
              selects. When unset or empty, every network is discovered.
            displayName: Network Selector
            path: networkSelector
          - description: |-
              provider is the cloud the scope discovers. It cannot change: a scope does not move
              clouds, a new scope does. More values are added by the releases that implement them.
            displayName: Provider
            path: provider
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:select:AWS
              - urn:alm:descriptor:com.tectonic.ui:select:GCP
          - description: |-
              regions to discover in every account (unless the account overrides them): AWS regions
              such as eu-central-1, GCP regions such as europe-west1. Each region is listed once.
            displayName: Regions
            path: regions
          - description: |-
              requiredSubnetTags are tag keys every subnet must have. Missing keys are reported in the
              Subnet status and as metrics.
            displayName: Required Subnet Tags
            path: requiredSubnetTags
          - description: resyncInterval is how often the full inventory is refreshed.
            displayName: Resync Interval
            path: resyncInterval
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:advanced
        statusDescriptors:
          - description: 'conditions: Ready is True when every target synced successfully.'
            displayName: Conditions
            path: conditions
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
          - description: lastSyncTime is when the last full sync finished.
            displayName: Last Sync
            path: lastSyncTime
            x-descriptors:
              - urn:alm:descriptor:timestamp
          - description: networks is the number of networks discovered across all targets.
            displayName: Networks
            path: networks
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
          - description: subnets is the number of subnets discovered across all targets.
            displayName: Subnets
            path: subnets
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
          - description: targets reports each account/region pair.
            displayName: Targets
            path: targets
          - description: |-
              unmanaged is the number of discovered resources without the managed tag, across all
              targets. Anything above zero is something nobody has taken responsibility for.
            displayName: Unmanaged
            path: unmanaged
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
        version: v1
