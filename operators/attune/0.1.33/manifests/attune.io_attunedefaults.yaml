                description: |-
                  CostPricing configures the per-unit pricing used to compute
                  EstimatedMonthlySavings. If omitted, defaults to standard
                  on-demand Linux pricing ($0.031/vCPU-hour, $0.004/GiB-hour).
                properties:
                  cpuPerCoreHour:
                    description: |-
                      CPUPerCoreHour is the cost per vCPU-hour (e.g. "0.031").
                      Defaults to 0.031 if not specified.
                    type: string
                  memoryPerGiBHour:
                    description: |-
                      MemoryPerGiBHour is the cost per GiB-hour (e.g. "0.004").
                      Defaults to 0.004 if not specified.
                    type: string
                type: object
              cpu:
                description: CPU configures default CPU resource recommendation parameters.
                properties:
                  allowDecrease:
                    description: |-
                      AllowDecrease controls whether the resource value can be decreased.
                      For CPU: nil defaults to true (decreases allowed when the backend supports
                      throttle queries, because throttle is detected by the safety monitor).
                      CloudWatch does not support throttle queries.
                      For memory: nil defaults to false (decreases blocked to prevent OOMKill).
                    type: boolean
                  burstSensitivity:
                    description: |-
                      BurstSensitivity controls how much burst detection inflates the
                      recommendation. Expressed as a decimal string multiplied by
                      log2(burstMagnitude). Default "0.1" gives ~20% boost for magnitude 4,
                      ~30% for 8, ~40% for 16. Set "0" to disable burst boost entirely
                      (e.g. for batch jobs). Must be >= 0, max 1.0.
                    type: string
                  controlledValues:
                    description: |-
                      ControlledValues specifies which resource values to manage.
                      "RequestsOnly" (default) adjusts only requests. The live limit is
                      copied through on resize and is not scaled.
                      "RequestsAndLimits" scales the limit with the request. An omitted
                      limitMultiplier keeps the live request-to-limit ratio. An explicit
                      limitMultiplier replaces that ratio. For Guaranteed QoS, use
                      "RequestsAndLimits" so a request can stay equal to its limit.
                    enum:
                    - RequestsOnly
                    - RequestsAndLimits
                    type: string
                  decreaseUsageMarginPercent:
                    description: |-
                      DecreaseUsageMarginPercent is the minimum headroom above recent memory
                      usage required when decreasing memory limits (client-side pre-check).
                      The target limit must be at least usage * (1 + margin/100). Defaults to
                      10. Only applied on the memory ResourceConfig when a limit decrease is
                      attempted; ignored for CPU. Set 0 to require limit strictly above usage.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  limitMultiplier:
                    description: |-
                      LimitMultiplier sets the new limit to the new request times this
                      multiple when controlledValues is RequestsAndLimits. Omitted keeps
                      the live request-to-limit ratio. Explicit "1" forces the new limit
                      equal to the new request. A container with no current limit keeps
                      an omitted limit; this field does not invent one. RequestsOnly plus
                      a multiplier is rejected. Maximum 100. maxAllowed caps the request,
                      not the limit produced here.
