apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Flow",
          "metadata": {
            "name": "handle-order"
          },
          "spec": {
            "params": [
              {
                "description": "Order identifier",
                "name": "orderId",
                "required": true
              }
            ],
            "steps": [
              {
                "action": {
                  "http": {
                    "method": "GET",
                    "resultMappings": {
                      "customerName": "$.customerName",
                      "id": "$.id"
                    },
                    "timeoutSeconds": 30,
                    "url": "https://orders.internal/api/orders/$(params.orderId)"
                  },
                  "type": "http"
                },
                "name": "enrich-order"
              },
              {
                "action": {
                  "http": {
                    "body": "{\"text\": \"Order $(steps.enrich_order.results.customerName) processed\"}",
                    "headers": {
                      "Content-Type": "application/json"
                    },
                    "method": "POST",
                    "url": "https://hooks.slack.com/services/REPLACE_ME"
                  },
                  "type": "http"
                },
                "name": "notify-slack",
                "runAfter": [
                  "enrich-order"
                ],
                "when": [
                  {
                    "expression": "steps.enrich_order.status == \"Succeeded\""
                  }
                ]
              }
            ]
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "FlowRun",
          "metadata": {
            "name": "handle-order-manual-test"
          },
          "spec": {
            "flowRef": {
              "name": "handle-order"
            },
            "params": [
              {
                "name": "orderId",
                "value": "12345"
              }
            ],
            "triggerRef": {
              "name": "order-received",
              "type": "webhook"
            },
            "ttlAfterFinished": "24h"
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Integration",
          "metadata": {
            "name": "github-api",
            "namespace": "default"
          },
          "spec": {
            "http": {
              "auth": {
                "bearer": {
                  "tokenSecretRef": {
                    "key": "token",
                    "name": "github-api-token"
                  }
                },
                "type": "bearer"
              },
              "baseUrl": "https://api.github.com",
              "defaultHeaders": {
                "Content-Type": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            },
            "type": "http"
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Integration",
          "metadata": {
            "name": "kafka-cluster"
          },
          "spec": {
            "kafka": {
              "bootstrapServers": [
                "kafka.default.svc.cluster.local:9092"
              ],
              "sasl": {
                "mechanism": "PLAIN",
                "passwordSecretRef": {
                  "key": "password",
                  "name": "kafka-credentials"
                },
                "usernameSecretRef": {
                  "key": "username",
                  "name": "kafka-credentials"
                }
              }
            },
            "type": "kafka"
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Trigger",
          "metadata": {
            "name": "example-trigger"
          },
          "spec": {
            "flowRef": {
              "name": "handle-order"
            },
            "type": "webhook",
            "webhook": {
              "path": "/hooks/example"
            }
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "WebhookGatewayConfig",
          "metadata": {
            "name": "default",
            "namespace": "default"
          },
          "spec": {
            "hpa": {
              "maxReplicas": 20,
              "minReplicas": 2,
              "targetCPUUtilization": 60
            },
            "tls": {
              "clientCASecretRef": {
                "name": "webhook-gateway-mtls-ca"
              },
              "serverSecretRef": {
                "name": "webhook-gateway-tls"
              }
            }
          }
        }
      ]
