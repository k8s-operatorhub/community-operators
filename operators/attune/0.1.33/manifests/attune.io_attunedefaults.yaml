              metricsSource:
                description: MetricsSource configures default metrics source settings.
                properties:
                  cloudwatch:
                    description: CloudWatch configures an Amazon CloudWatch Container
                      Insights metrics source.
                    properties:
                      clusterName:
                        description: |-
                          ClusterName is the EKS cluster name for Container Insights metrics.
                          Required for metric filtering.
                        type: string
                      cpuUnit:
                        description: |-
                          CPUUnit selects the scale of Container Insights container_cpu_usage_total
                          before Attune converts it to cores. Millicores divides by 1000, Cores
                          leaves the sample unchanged, and Nanocores divides by 1e9 (the pre-field
                          behavior, and the Datadog scale). Empty means Millicores, including
                          objects stored before this field existed. Memory samples are not scaled.
                          Unknown values are rejected.
                        enum:
                        - Millicores
                        - Cores
                        - Nanocores
                        type: string
                      region:
                        description: Region is the AWS region (e.g. "us-east-1").
                          Required.
                        type: string
                      roleArn:
                        description: |-
                          RoleARN is an optional IAM role ARN to assume for cross-account access.
                          Empty uses the operator identity. On AttunePolicy and
                          AttuneNamespaceDefaults a set role must match --sigv4-allowed-role-arns.
                          Cluster AttuneDefaults is not filtered. A namespaced assume sends
                          ExternalId attune:<namespace>.
                        type: string
                    required:
                    - clusterName
                    - region
                    type: object
                  cpuRecordingMetric:
                    description: |-
                      CPURecordingMetric is an optional pre-aggregated Prometheus metric name
                      used instead of rate(container_cpu_usage_seconds_total). Labels must include
                      namespace, pod, and container. When set, the operator does not wrap the
                      metric in rate(). Pair with MemoryRecordingMetric for a recording-rules-only path.
