                - name: KAFKA_GATEWAY_IMAGE
                  value: ghcr.io/kubezap/kafka-gateway@sha256:77273a969c8b50c3d7f57a71d7b1c81328957dc29deb26d08e2cf4051767b63d
                - name: POD_NAMESPACE
