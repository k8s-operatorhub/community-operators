apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankoiamprofiles.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoIAMProfile
    listKind: HankoIAMProfileList
    plural: hankoiamprofiles
    shortNames:
    - hip
    singular: hankoiamprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.security.mfaPolicy
      name: MFA
      type: string
    - jsonPath: .status.policyHash
      name: Hash
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HankoIAMProfile is a reusable realm-scoped authentication and security policy.
          Applications inherit the profile through their HankoRealm and remain unaware
          of the concrete MFA, password, session, audit and broker controls.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoIAMProfileSpec defines the reusable desired IAM policy.
            properties:
              security:
                description: Security is the product-neutral policy reconciled to
                  every referencing realm.
                properties:
                  adminConsoleExposure:
                    description: |-
                      AdminConsoleExposure controls the browser-based realm administration console.
                      Restricted expects the platform ingress allow-list; disabled also disables
                      the realm's security-admin-console client in Keycloak.
                    enum:
                    - public
                    - restricted
                    - disabled
                    type: string
                  adminEventsEnabled:
                    description: AdminEventsEnabled records administrative realm changes.
                    type: boolean
                  auditExportEnabled:
                    description: AuditExportEnabled sends realm events to Keycloak's
                      external logging listener.
                    type: boolean
                  auditRetentionDays:
                    description: AuditRetentionDays controls Keycloak user-event retention
                      for this realm.
                    maximum: 3650
                    minimum: 1
                    type: integer
                  bruteForce:
                    description: BruteForce holds brute-force protection settings.
                    properties:
                      enabled:
                        description: Enabled activates brute-force protection.
                        type: boolean
                      maxFailures:
                        description: MaxFailures is the number of failures before
                          lockout.
                        minimum: 1
                        type: integer
                      waitIncrements:
                        description: WaitIncrements is the lockout duration (Go duration
                          string, e.g. "30s").
                        maxLength: 64
                        minLength: 1
                        pattern: ^[^\x00-\x1F\x7F]+$
                        type: string
                    required:
                    - enabled
                    type: object
                  clientSecretRotationDays:
                    description: |-
                      ClientSecretRotationDays is the default cadence for managed confidential
                      applications and service accounts that do not declare their own policy.
                      Zero disables the realm default.
                    maximum: 3650
                    minimum: 0
                    type: integer
                  emailVerificationRequired:
                    description: EmailVerificationRequired requires proof of email
                      ownership.
                    type: boolean
                  idpBrokerRequireSignature:
                    description: |-
                      IDPBrokerRequireSignature requires configured identity providers to validate
                      upstream token or assertion signatures.
                    type: boolean
                  idpBrokerTrustEmail:
                    description: |-
                      IDPBrokerTrustEmail controls whether brokered identities may assert that an
                      upstream email address is already verified.
                    type: boolean
                  mfaPolicy:
                    description: MFAPolicy controls multi-factor authentication enforcement.
                    enum:
                    - none
                    - optional
                    - required
                    type: string
                  otpAlgorithm:
                    default: HmacSHA1
                    description: |-
                      OTPAlgorithm is the TOTP hash algorithm applied when MFA is required or optional.
                      HmacSHA256 is recommended for new deployments; HmacSHA1 for legacy authenticator compat.
                    enum:
                    - HmacSHA1
                    - HmacSHA256
                    - HmacSHA512
                    type: string
                  otpDigits:
                    description: OTPDigits is the number of digits in generated TOTP
                      codes.
                    enum:
                    - 6
                    - 8
                    type: integer
                  otpPeriodSeconds:
                    description: OTPPeriodSeconds is the TOTP validity period.
                    maximum: 120
                    minimum: 15
                    type: integer
                  passwordDisallowEmail:
                    description: PasswordDisallowEmail prevents an email address from
                      being used as the password.
                    type: boolean
                  passwordDisallowUsername:
                    description: PasswordDisallowUsername prevents a user name from
                      being used as the password.
                    type: boolean
                  passwordExpiryDays:
                    description: PasswordExpiryDays forces password renewal after
                      this many days. 0 disables expiry.
                    minimum: 0
                    type: integer
                  passwordHistory:
                    description: PasswordHistory prevents reuse of this many previous
                      passwords.
                    minimum: 0
                    type: integer
                  passwordMinLength:
                    description: PasswordMinLength is the minimum password length
                      enforced by Keycloak.
                    minimum: 8
                    type: integer
                  passwordRequireDigit:
                    description: PasswordRequireDigit requires at least one numeric
                      character.
                    type: boolean
                  passwordRequireLowercase:
                    description: PasswordRequireLowercase requires at least one lowercase
                      character.
                    type: boolean
                  passwordRequireSpecial:
                    description: PasswordRequireSpecial requires at least one special
                      character.
                    type: boolean
                  passwordRequireUppercase:
                    description: PasswordRequireUppercase requires at least one uppercase
                      character.
                    type: boolean
                  refreshTokenMaxReuse:
                    description: |-
                      RefreshTokenMaxReuse is the number of times a refresh token may be reused.
                      0 means single use when RevokeRefreshToken is true.
                    minimum: 0
                    type: integer
                  rememberMeEnabled:
                    description: RememberMeEnabled allows persistent browser sessions.
                    type: boolean
                  revokeRefreshToken:
                    description: RevokeRefreshToken invalidates refresh tokens after
                      a single use to prevent replay attacks.
                    type: boolean
                  sessionIdleTimeout:
                    description: SessionIdleTimeout is the maximum inactive SSO session
                      duration.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  sessionLifetime:
                    description: SessionLifetime is the maximum SSO session duration
                      (Go duration string, e.g. "8h").
                    maxLength: 64
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  sslRequired:
                    default: external
                    description: |-
                      SSLRequired controls TLS enforcement on the Keycloak realm.
                      "external" (default) uses Keycloak's external-client TLS requirement,
                      including its local/private-address exceptions. This does not configure
                      the operator's administrative transport.
                    enum:
                    - none
                    - external
                    - all
                    type: string
                  userEventsEnabled:
                    description: UserEventsEnabled records authentication and account
                      events.
                    type: boolean
                  userRegistrationEnabled:
                    description: UserRegistrationEnabled allows public realm self-registration.
                    type: boolean
                type: object
            required:
            - security
            type: object
          status:
            description: HankoIAMProfileStatus describes validation of the reusable
              policy.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastValidated:
                description: LastValidated is the timestamp of the last successful
                  validation.
                format: date-time
                maxLength: 64
                type: string
              observedGeneration:
                description: ObservedGeneration is the profile generation represented
                  by this status.
                format: int64
                type: integer
              phase:
                description: Phase summarises whether the profile can be consumed
                  by realms.
                enum:
                - Pending
                - Ready
                - Error
                type: string
              policyHash:
                description: PolicyHash is the deterministic SHA-256 of the effective
                  security policy.
                maxLength: 71
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
