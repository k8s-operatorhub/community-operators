kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "network.hypersurgery.dev/v1",
          "kind": "NetworkScope",
          "metadata": {
            "name": "organization"
          },
          "spec": {
            "accounts": [
              {
                "id": "111111111111"
              },
              {
                "aws": {
                  "roleARN": "arn:aws:iam::222222222222:role/aws-subnet-operator-readonly"
                },
                "id": "222222222222"
              },
              {
                "aws": {
                  "roleARN": "arn:aws:iam::333333333333:role/aws-subnet-operator-readonly"
                },
                "id": "333333333333",
                "regions": [
                  "us-east-1"
                ]
              }
            ],
            "namespaceSelector": {
              "matchExpressions": [
                {
                  "key": "kubernetes.io/metadata.name",
                  "operator": "In",
                  "values": [
                    "default"
                  ]
                }
              ]
            },
            "networkSelector": {
              "matchTags": {
                "hs/managed": "true"
              }
            },
            "provider": "AWS",
            "regions": [
              "eu-central-1",
              "eu-west-1"
            ],
            "requiredSubnetTags": [
              "hs/owner",
              "hs/env",
              "hs/tier"
            ],
            "resyncInterval": "10m"
          }
        },
        {
          "apiVersion": "network.hypersurgery.dev/v1",
          "kind": "ResourceImport",
          "metadata": {
            "name": "subnet-04d1c2b3a4e5f607-import",
            "namespace": "default"
          },
          "spec": {
            "account": "333333333333",
            "dryRun": false,
            "region": "eu-central-1",
            "requestedBy": "anton",
            "resourceID": "subnet-04d1c2b3a4e5f607",
            "scopeRef": "organization",
            "tags": {
              "hs/env": "prod",
              "hs/managed": "true",
              "hs/owner": "team-data",
              "hs/tier": "private"
            }
          }
        },
        {
          "apiVersion": "network.hypersurgery.dev/v1",
          "kind": "SheetExport",
          "metadata": {
            "name": "organization"
          },
          "spec": {
            "credentialsSecretRef": {
              "key": "credentials.json",
              "name": "google-sheets",
              "namespace": "subnet-operator-system"
