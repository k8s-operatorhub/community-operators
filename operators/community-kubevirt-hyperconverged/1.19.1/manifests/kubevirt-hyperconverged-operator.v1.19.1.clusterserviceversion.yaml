      deployments:
      - label:
          app.kubernetes.io/component: deployment
          app.kubernetes.io/managed-by: olm
          app.kubernetes.io/part-of: hyperconverged-cluster
          app.kubernetes.io/version: 1.19.1
          name: hyperconverged-cluster-operator
        name: hco-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              name: hyperconverged-cluster-operator
          strategy:
            type: RollingUpdate
          template:
            metadata:
              labels:
                app.kubernetes.io/component: deployment
                app.kubernetes.io/managed-by: olm
                app.kubernetes.io/part-of: hyperconverged-cluster
                app.kubernetes.io/version: 1.19.1
                name: hyperconverged-cluster-operator
            spec:
              containers:
              - command:
                - hyperconverged-cluster-operator
                env:
                - name: WEBHOOK_MODE
                  value: "false"
                - name: APP
                  value: OPERATOR
                - name: KVM_EMULATION
                - name: OPERATOR_IMAGE
                  value: quay.io/kubevirt/hyperconverged-cluster-operator@sha256:fd605c8801d4645ee82d3441f3989575cd3c91fef50c0221a7f5d18090cd9cb7
                - name: OPERATOR_NAME
                  value: hyperconverged-cluster-operator
                - name: OPERATOR_NAMESPACE
                  value: kubevirt-hyperconverged
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: VIRTIOWIN_CONTAINER
                  value: quay.io/kubevirt/virtio-container-disk@sha256:6b823946eb7493347a93d6daa16b4101a68e16a0ee1766e01ac3adf82e4b5838
                - name: SMBIOS
                  value: |-
                    Family: KubeVirt
                    Manufacturer: KubeVirt
