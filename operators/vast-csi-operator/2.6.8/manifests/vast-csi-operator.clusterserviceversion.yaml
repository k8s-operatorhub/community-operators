          serviceAccountName: vast-csi-driver-operator-controller-manager
      deployments:
        - label:
            app.kubernetes.io/component: manager
            app.kubernetes.io/created-by: vast-csi-operator
            app.kubernetes.io/instance: controller-manager
            app.kubernetes.io/name: deployment
            app.kubernetes.io/part-of: vast-csi-operator
            control-plane: controller-manager
          name: vast-csi-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            template:
              metadata:
                labels:
                  control-plane: controller-manager
              spec:
                containers:
                  - name: kube-rbac-proxy
                    image: docker.io/kubebuilder/kube-rbac-proxy@sha256:a2523c532c0c3d51a5396a901d7ded23e402a9a1492c783aae27af6d0c1d2ec5
                    args:
                      - --secure-listen-address=0.0.0.0:8443
                      - --upstream=http://127.0.0.1:8080/
                      - --logtostderr=true
                      - --v=0
                    ports:
                      - containerPort: 8443
                        name: https
                    resources:
                      limits:
                        cpu: 500m
                        memory: 128Mi
                      requests:
                        cpu: 5m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                  - name: csi-vast-operator
                    image: docker.io/vastdataorg/csi@sha256:1e4723332b94d9e19fe32cda7d0ace9ce7b471fd5bcce82822d681e92af65a3c
                    imagePullPolicy: Always
                    args:
                      - --metrics-addr=127.0.0.1:8080
                      - --enable-leader-election
                      - --leader-election-id=vast-csi-operator
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 500m
                        memory: 600Mi
                      requests:
                        cpu: 10m
                        memory: 500Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    env:
                      - name: WATCH_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                      - name: POD_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.name
                      - name: RELATED_IMAGE_CSI_DRIVER
                        value: docker.io/vastdataorg/csi@sha256:ff45fe2bceb94ddbd399a4ece782e47844010c7fabf6bf4b839e7af4291854ef
                      - name: RELATED_IMAGE_CSI_ATTACHER
                        value: registry.k8s.io/sig-storage/csi-attacher@sha256:d69cc72025f7c40dae112ff989e920a3331583497c8dfb1600c5ae0e37184a29
                      - name: RELATED_IMAGE_CSI_NODE_DRIVER_REGISTRAR
                        value: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:c53535af8a7f7e3164609838c4b191b42b2d81238d75c1b2a2b582ada62a9780
                      - name: RELATED_IMAGE_CSI_PROVISIONER
                        value: registry.k8s.io/sig-storage/csi-provisioner@sha256:de79c8bbc271622eb94d2ee8689f189ea7c1cb6adac260a421980fe5eed66708
                      - name: RELATED_IMAGE_CSI_RESIZER
                        value: registry.k8s.io/sig-storage/csi-resizer@sha256:4c148bbdf883153bc72d321be4dc55c33774a6d98b2b3e0c2da6ae389149a9b7
                      - name: RELATED_IMAGE_CSI_SNAPSHOTTER
                        value: registry.k8s.io/sig-storage/csi-snapshotter@sha256:42af0929bcd60a43499825c078a60ff0534e08af8fbeb283aa391be40feb9f3e
                      - name: RELATED_IMAGE_CSI_ADDONS_SIDECAR
                        value: quay.io/csiaddons/k8s-sidecar@sha256:69092d026323307933fba2bed9c57d864f2a92cfd385d644b478442ded0d2886
                      - name: RELATED_IMAGE_CSI_ADDONS_CONTROLLER
                        value: quay.io/csiaddons/k8s-controller@sha256:412ed46f1f93a49aea6a6cb9c33e3bcb131f96bfe3d015314611c27282f472aa
                      - name: RELATED_IMAGE_VAST_EXTENSION_CONTROLLER
                        value: docker.io/vastdataorg/csi@sha256:f6561aa2270a1acbd8a1cb20a37923304f3eca171819d8d142f7f52585146cff
                securityContext:
                  runAsNonRoot: true
                serviceAccountName: vast-csi-driver-operator-controller-manager
                priorityClassName: system-cluster-critical
                terminationGracePeriodSeconds: 10
      permissions:
        - rules:
            - apiGroups:
                - ""
              resources:
