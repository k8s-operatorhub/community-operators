  names:
    kind: Identity
    listKind: IdentityList
    plural: identities
    singular: identity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.userRef.name
      name: User
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Identity is a managed per-backend account (LiteLLM/Observability/LibreChat) belonging
          to a User. It is not separately licensed — the seat is the User it links to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IdentitySpec is a single per-backend account for a person. Each Identity links
              to exactly one top-level User (the licensed seat) via UserRef; multiple
              Identities (gateway/observability/UI) for the same person share one User and so
              consume one seat. Identities exist in LiteLLM (CRD), the observability backend
              (Admin API — scaffolded), and LibreChat (provisioned by the bundled
              create-user script, run as a Job). Licensed feature: identity-management.
              A gateway-backed resource MUST carry gatewayRef. It was optional, so the
              resource was admitted and then failed at reconcile with "a gateway-backed
              identity resource requires gatewayRef" — a apply-time refusal is the same
              information, hours earlier.
              Both upstream operators resolve instanceRef namespace-locally, so a
              cross-namespace gatewayRef could never bind to anything.
            properties:
              budget:
                description: Budget passes through budget/rate-limit/model settings
                  (LiteLLM).
                properties:
                  budgetDuration:
                    description: BudgetDuration is the reset window, e.g. "30d", "1mo".
                    type: string
                  maxBudget:
                    description: MaxBudget is the spend cap in USD (0 = unset → backend
                      default/unlimited).
                    type: integer
                  models:
                    description: Models restricts the allowed model list (empty =
                      all the backend allows).
                    items:
                      type: string
                    type: array
                  rpmLimit:
                    description: RPMLimit caps requests per minute.
                    type: integer
                  tpmLimit:
                    description: TPMLimit caps tokens per minute.
                    type: integer
                type: object
              chatUIRef:
                description: ChatUIRef references the ChatUI/LibreChat instance (type=librechat).
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              displayName:
                description: DisplayName is a human-friendly name.
                type: string
              email:
                description: |-
                  Email is the account's identity in its backend (natural key). Defaults to
                  the owning User's email when unset.
                format: email
                type: string
              gatewayRef:
                description: |-
                  GatewayRef references the Gateway whose LiteLLM instance owns this account
                  (type=litellm).
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              observabilityRef:
                description: ObservabilityRef references the Observability instance
                  (type=observability).
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              passwordSecretRef:
                description: |-
                  PasswordSecretRef references a Secret with the initial password
                  (type=librechat; key "password" by default).
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              role:
                description: Role is the backend role (e.g. LiteLLM "internal_user"/"admin").
                type: string
              teamRefs:
                description: TeamRefs assigns the account to Team CRs in the same
                  namespace (LiteLLM).
                items:
                  description: LocalRef references an object in the same namespace
                    only.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              type:
                enum:
                - gateway
                - litellm
                - waeg
                - observability
                - librechat
                type: string
              userId:
                description: UserID overrides the backend user id (defaults to Email).
                type: string
              userRef:
                description: |-
                  UserRef links this account to its owning User (the licensed seat), in the
                  same namespace. The Identity waits until that User exists.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - type
            - userRef
            type: object
            x-kubernetes-validations:
            - fieldPath: .gatewayRef
              message: type gateway/litellm/waeg requires gatewayRef
              reason: FieldValueRequired
              rule: '!(self.type in [''gateway'',''litellm'',''waeg'']) || has(self.gatewayRef)'
            - fieldPath: .gatewayRef.namespace
              message: 'gatewayRef.namespace must be empty: the Gateway must live
                in the same namespace as this resource'
              reason: FieldValueForbidden
              rule: '!has(self.gatewayRef) || !has(self.gatewayRef.namespace) || size(self.gatewayRef.namespace)
                == 0'
          status:
            description: IdentityStatus is the shared status for the identity CRDs.
            properties:
              backendRef:
                description: BackendRef is the name of the emitted upstream resource
                  (or external id).
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is a coarse lifecycle state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
