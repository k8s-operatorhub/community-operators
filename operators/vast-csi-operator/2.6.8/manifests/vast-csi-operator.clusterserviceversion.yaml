          - description: Timeout for replication operations handled by the replication plugin (seconds).
            displayName: Replication Operation Timeout
            path: csiAddonsSidecar.operationTimeout
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
              - urn:alm:descriptor:com.tectonic.ui:advanced
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:replicationEnabled:true
      - kind: VastCluster
        name: vastclusters.storage.vastdata.com
        displayName: VastCluster
        description: "VastCluster encapsulates the connection details required for accessing a VAST cluster. This information is ultimately stored in a Kubernetes Secret."
        version: v1
        resources:
          - kind: Secret
            name: ''
            version: v1
        specDescriptors:
          - description: Password used for authentication.
            displayName: Password
            path: password
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:password
          - description: Optional SSL certificate for secure connections.
            displayName: SSL Certificate
            path: sslCert
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:password
      - kind: VastStorage
        name: vaststorages.storage.vastdata.com
        displayName: VastStorage
        description: "Represents VAST storage. Each VastStorage instance generates a corresponding storage class that can be used in PVCs to create workloads."
        version: v1
        resources:
          - kind: StorageClass
            name: ''
            version: v1
          - kind: VolumeSnapshotClass
            name: ''
            version: v1
        specDescriptors:
          - description: Choose the driver type for VastStorage.
            displayName: Driver Type
            path: driverType
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:select:nfs
              - urn:alm:descriptor:com.tectonic.ui:select:block
          - description: Choose Provisioner to create VastStorage for.
            displayName: Provisioner Name (NFS)
            path: nfsProvisioner
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:nfs
              - urn:alm:descriptor:io.kubernetes:storage.k8s.io:v1:CSIDriver?storage.vastdata.com/driverType=nfs
          - description: Choose Provisioner to create VastStorage for.
            displayName: Provisioner Name (Block)
            path: blockProvisioner
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
              - urn:alm:descriptor:io.kubernetes:storage.k8s.io:v1:CSIDriver?storage.vastdata.com/driverType=block
          - description: |
              Name of the VastCluster to use. Leave empty if you are manually specifying a Secret.
            displayName: VastCluster Name
            path: clusterName
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:storage.vastdata.com:v1:VastCluster
          - description: |
              Name of the Secret with credentials. Used only if VastCluster is not specified.
            displayName: Secret Name
            path: secretName
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
          - description: |
              Namespace of the Secret. Optional if using the operator’s namespace. Ignored if VastCluster is specified.
            displayName: Secret Namespace
            path: secretNamespace
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:Namespace
          - description: Base Storage Path for NFS views.
            displayName: Storage Path
            path: storagePath
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:nfs
          - description: VAST policy name to create views.
            displayName: View Policy
            path: viewPolicy
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:nfs
          - description: Name of QoS policy associates with the views or volumes.
            displayName: QoS Policy
            path: qosPolicy
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
          - description: |
              If true, the CSI driver will wait for the GSS (global snapshot stream) process to fully complete before returning from a volume clone operation. This ensures consistency at provisioning time but may increase latency. Unset by default (driver non-blocking). StorageClass parameters are immutable — set only when creating a new StorageClass.
            displayName: Blocking Clones
            path: blockingClones
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
          - description: |
              When true, NVMe host NQNs use HMAC-SHA256 instead of the plain node name suffix. Requires host_nqn_seed in the StorageClass controller-publish secret. Unset by default. StorageClass parameters are immutable — set only when creating a new StorageClass.
            displayName: Host NQN Obfuscation
            path: hostNqnObfuscation
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Enables LUKS-based host encryption for block volumes. Requires a passphrase to be defined in the vast-mgmt Secret and may optionally include parameters such as cipher, key size, hash algorithm, and PBKDF memory cost.
            displayName: Host Encryption
            path: hostEncryption
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:hostEncryption
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Encryption cipher used for LUKS. Must match supported kernel/cryptsetup values.
            displayName: Cipher
            path: hostEncryption.cipher
            x-descriptors:
              - 'urn:alm:descriptor:com.tectonic.ui:select:'
              - urn:alm:descriptor:com.tectonic.ui:select:aes-xts-plain64
              - urn:alm:descriptor:com.tectonic.ui:select:aes-cbc-essiv:sha256
              - urn:alm:descriptor:com.tectonic.ui:select:serpent-xts-plain64
              - urn:alm:descriptor:com.tectonic.ui:select:twofish-cbc-essiv:sha256
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Key size in bits. Must be compatible with selected cipher. Common values: 256 (AES-128 XTS) or 512 (AES-256 XTS).
            displayName: Key Size
            path: hostEncryption.key_size
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Hash algorithm used for passphrase derivation in PBKDF.
            displayName: Hash Algorithm
            path: hostEncryption.hash
            x-descriptors:
              - 'urn:alm:descriptor:com.tectonic.ui:select:'
              - urn:alm:descriptor:com.tectonic.ui:select:sha1
              - urn:alm:descriptor:com.tectonic.ui:select:sha256
              - urn:alm:descriptor:com.tectonic.ui:select:sha512
              - urn:alm:descriptor:com.tectonic.ui:select:ripemd160
              - urn:alm:descriptor:com.tectonic.ui:select:whirlpool
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Memory cost for PBKDF in kilobytes. Applies only for memory-hard algorithms like argon2id.
            displayName: PBKDF Memory
            path: hostEncryption.pbkdf_memory
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Use same CPU for encryption work. Improves performance by keeping encryption on the same CPU core. Enabled by default for optimal performance.
            displayName: Same CPU Crypt
            path: hostEncryption.perf-same_cpu_crypt
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Submit IO from crypt CPUs. Optimizes IO submission path for encrypted devices. Enabled by default for optimal performance.
            displayName: Submit From Crypt CPUs
            path: hostEncryption.perf-submit_from_crypt_cpus
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Bypass read workqueue. Reduces latency by avoiding workqueue overhead for read operations. Enabled by default for optimal performance.
            displayName: No Read Workqueue
            path: hostEncryption.perf-no_read_workqueue
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |
              Bypass write workqueue. Reduces latency by avoiding workqueue overhead for write operations. Enabled by default for optimal performance.
            displayName: No Write Workqueue
            path: hostEncryption.perf-no_write_workqueue
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: VAST subsystem for volume creation.
            displayName: Subsystem
            path: subsystem
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: Tenant name - required for additional filtering when multiple subsystems share the same name.
            displayName: Tenant Name
            path: tenantName
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: |-
              Optional template for constructing common volume prefix.
              It supports placeholders for the PVC name, namespace, and ID,
              which can be used in the format {namespace}, {name}, and {id}.
              If not provided, a default template will be used. The volume group
              can represent nested folder structures. For example:
                 - "folder1/folder2/block-{namespace}-{id}
            displayName: Volume Group
            path: volumeGroup
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: Filesystem type for volume creation.
            displayName: FsType
            path: fsType
            x-descriptors:
              - 'urn:alm:descriptor:com.tectonic.ui:select:'
              - urn:alm:descriptor:com.tectonic.ui:select:ext4
              - urn:alm:descriptor:com.tectonic.ui:select:ext3
              - urn:alm:descriptor:com.tectonic.ui:select:xfs
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: Host connectivity type used for block storage.
            displayName: Transport Type
            path: transportType
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:hidden
          - description: Allows resizing existing volumes.
            displayName: allowVolumeExpansion
            path: allowVolumeExpansion
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: "Helps distribute load across the entire VIP pool by randomizing the VIP resolved for each volume mount.\nIf set to true, a random prefix will be added to the VIP FQDN, ensuring that each NFS mount \nrequest resolves to a different VIP from the VIP pool."
            displayName: vipPoolFQDNRandomPrefix
            path: vipPoolFQDNRandomPrefix
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: Create SnapshotClass for VastStorage.
            displayName: Create SnapshotClass
            path: createSnapshotClass
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
          - description: SnapshotClass options.
            displayName: SnapshotClass configuration
            path: snapshotClass
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:createSnapshotClass:true
          - description: String template for CSI-provisioned ephemeral volumes, within VAST.
            displayName: ephemeralVolumeNameFormat
            path: ephemeralVolumeNameFormat
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: String template for CSI-provisioned volume names, within VAST.
            displayName: volumeNameFormat
            path: volumeNameFormat
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: Reclaim policy defines what happens to the volume when the corresponding PersistentVolumeClaim (PVC) is deleted. See https://kubernetes.io/docs/concepts/storage/storage-classes/#reclaim-policy  for more details.
            displayName: Reclaim Policy
            path: reclaimPolicy
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:select:Delete
              - urn:alm:descriptor:com.tectonic.ui:select:Retain
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: When enabled, Vast CSI will be set as the default storage class for the entire  Kubernetes cluster. This means Vast CSI will automatically be chosen as the  storage class for persistent volume claims (PVCs) that do not specify a  storage class. See https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass  for more details.
            displayName: Set Default Storage Class
            path: setDefaultStorageClass
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
              - urn:alm:descriptor:com.tectonic.ui:advanced
          - description: Host connectivity type used for block storage.
            displayName: Transport Type
            path: transportType
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:hidden
              - urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block
          - description: Choose Provisioner to create VastStorage for.
            displayName: Provisioner Name
            path: provisioner
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:hidden
      - kind: VastExtensionsManager
