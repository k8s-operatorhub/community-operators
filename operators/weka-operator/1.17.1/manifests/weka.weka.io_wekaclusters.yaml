---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: wekaclusters.weka.weka.io
spec:
  group: weka.weka.io
  names:
    kind: WekaCluster
    listKind: WekaClusterList
    plural: wekaclusters
    singular: wekacluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Status of the cluster
      jsonPath: .status.status
      name: Status
      type: string
    - description: Weka cluster GUID
      jsonPath: .status.clusterID
      name: Cluster ID
      type: string
    - description: 'Number of compute containers: Active/Created/Desired'
      jsonPath: .status.printer.computeContainers
      name: CCT(A/C/D)
      type: string
    - description: 'Number of drive containers: Active/Created/Desired'
      jsonPath: .status.printer.driveContainers
      name: DCT(A/C/D)
      type: string
    - description: 'Number of Drives: Active/Created/Desired'
      jsonPath: .status.printer.drives
      name: DRVS(A/C/D)
      type: string
    - description: IOPS Read/Write/Metadata
      jsonPath: .status.printer.iops
      name: IOPS(R/W/M)
      priority: 1
      type: string
    - description: Throughput Read/Write
      jsonPath: .status.printer.throughput
      name: THRPT(R/W)
      priority: 1
      type: string
    - description: Filesystem Capacity
      jsonPath: .status.printer.filesystemCapacity
      name: FS(Capacity)
      priority: 1
      type: string
    - description: Raw provisioned drive-sharing capacity (TLC/QLC)
      jsonPath: .status.printer.capacity
      name: Capacity
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WekaClusterSpec defines the desired state of WekaCluster
            properties:
              additionalMemory:
                description: additional memory to allocate for weka containers
                properties:
                  compute:
                    description: Additional memory in MiB for compute containers (positive
                      or negative offset from auto-calculated baseline).
                    type: integer
                  dataServices:
                    type: integer
                  drive:
                    description: Additional memory in MiB for drive containers.
                    type: integer
                  envoy:
                    description: Additional memory in MiB for Envoy proxy containers
                      (used by S3 gateway).
                    type: integer
                  nfs:
                    description: Additional memory in MiB for NFS protocol containers.
                    type: integer
                  s3:
                    description: Additional memory in MiB for S3 gateway containers.
                    type: integer
                  smbw:
                    type: integer
                type: object
              adminCredentialsSecretRef:
                description: 'reference to a user-provided secret (keys: username,
                  password) used as the weka admin user credentials instead of generating
                  them; immutable'
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: adminCredentialsSecretRef.name must be a valid Secret name
                    (lowercase DNS subdomain)
                  rule: size(self.name) <= 253 && self.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
              bucketRaftSize:
                description: size of raft for buckets, defaults to 5, 5/9 are supported
                type: integer
              catalog:
                description: Catalog configuration for data catalog service
                properties:
                  indexInterval:
                    default: 1d
                    description: IndexInterval specifies how often the catalog index
                      is updated (e.g., "1d", "1m")
                    type: string
                  retentionPeriod:
                    default: 30d
                    description: RetentionPeriod specifies how long catalog data is
                      retained (e.g., "30d", "10m")
                    type: string
                type: object
              cpuPolicy:
                default: auto
                description: |-
                  cpu policy to use for scheduling cores for weka, unless instructed by weka team, keep default of auto
                  manual and shared are same, with shared being deprecated
                  when manual is used - no exclusive cores will be allocaated on k8s/cgroup level, assuming good alignment of cores usage across different applications, like weka and slurm
                  there is no need to specify siblings in this list, but on the side of other applications like slurm, both weka core and its siblings should be excluded from used cpu set
                enum:
                - auto
                - shared
                - dedicated
                - dedicated_ht
                - manual
                type: string
              csiConfig:
                description: Configuration for the Weka CSI Driver integration. Controls
                  how the CSI driver discovers and connects to this cluster.
                properties:
                  advanced:
                    description: Advanced CSI driver settings. Should not be changed
                      unless explicitly instructed by Weka support.
                    properties:
                      controllerLabels:
                        additionalProperties:
                          type: string
                        type: object
                      controllerTolerations:
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                                Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
                      enforceTrustedHttps:
                        type: boolean
                      nodeLabels:
                        additionalProperties:
                          type: string
                        type: object
                      nodeTolerations:
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                                Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
                      skipGarbageCollection:
                        type: boolean
                    type: object
                  csiGroup:
                    description: CSI driver group name. Scopes CSI resources when
                      multiple Weka clusters coexist in the same namespace.
                    type: string
                  endpointsSubnets:
                    description: CIDR subnets to filter which management IPs are advertised
                      to the CSI driver. Leave empty to advertise all.
                    items:
                      type: string
                    type: array
                type: object
              driversDistService:
                description: endpoint for distribution service, global https://drivers.weka.io
                  or in-k8s-cluster "https://weka-drivers-dist.namespace.svc.cluster.local:60001"
                type: string
              dynamicTemplate:
                description: weka cluster topology configuration
                properties:
                  clusterCapacity:
                    description: |-
                      ClusterCapacity is a human-friendly target USABLE capacity for the whole cluster.
                      Alternative to ContainerCapacity: instead of sizing each container, the operator
                      translates this target into failure domains built from whole containers and grows
                      toward it (capacity only ever increases). Mutually exclusive with ContainerCapacity,
                      NumDrives and DriveCapacity.

                      Unit handling: the suffix determines whether decimal (base-1000) or binary (base-1024)
                      interpretation is used.
                        - Binary (IEC): "GiB"/"Gi", "TiB"/"Ti", "MiB"/"Mi", etc.  e.g. "8000GiB" = 8000 GiB
                        - Decimal (SI): "GB", "TB", "MB", etc.                      e.g. "8000GB"  ≈ 7450 GiB
                        - Bare unit (no "B"): "8000g", "300t" — treated as binary for backward compatibility
                    type: string
                  computeContainers:
                    description: Number of compute containers per cluster node.
                    minimum: 0
                    type: integer
                  computeCores:
                    description: Number of cores allocated to each compute container.
                    minimum: 0
                    type: integer
                  computeExtraCores:
                    minimum: 0
                    type: integer
                  computeHugepages:
                    description: Hugepage allocation in MiB for compute containers.
                      0 means auto-calculated.
                    minimum: 0
                    type: integer
                  computeHugepagesOffset:
                    description: Offset in MiB applied to the auto-calculated hugepage
                      allocation for compute containers.
                    minimum: 0
                    type: integer
                  containerCapacity:
                    description: |-
                      ContainerCapacity specifies the total capacity (in GiB) requested by each container when using shared drives via SSD proxy.
                      This value takes precedence over DriveCapacity when both are set. It allows more flexible capacity allocation.
                    minimum: 0
                    type: integer
                  dataServicesContainers:
                    minimum: 0
                    type: integer
                  dataServicesCores:
                    minimum: 0
                    type: integer
                  dataServicesExtraCores:
                    type: integer
                  dataServicesFeCores:
                    minimum: 0
                    type: integer
                  dataServicesHugepages:
                    minimum: 0
                    type: integer
                  dataServicesHugepagesOffset:
                    minimum: 0
                    type: integer
                  driveCapacity:
                    description: |-
                      DriveCapacity is the capacity in GiB to allocate per single virtual drive.
                      NumDrives multiplied by DriveCapacity gives the total capacity requested by each drive container.
                      This value determines how much capacity each container receives from shared drives.
                    minimum: 0
                    type: integer
                  driveContainers:
                    description: Number of drive containers per cluster node.
                    minimum: 0
                    type: integer
                  driveCores:
                    description: Number of cores allocated to each drive container.
                    minimum: 0
                    type: integer
                  driveExtraCores:
                    minimum: 0
                    type: integer
                  driveHugepages:
                    description: Hugepage allocation in MiB for drive containers.
                      0 means auto-calculated.
                    minimum: 0
                    type: integer
                  driveHugepagesOffset:
                    description: Offset in MiB applied to the auto-calculated hugepage
                      allocation for drive containers.
                    minimum: 0
                    type: integer
                  driveTypesRatio:
                    description: DriveTypesRatio specifies the desired ratio of drive
                      types (TLC vs QLC) when allocating drives for the cluster.
                    properties:
                      qlc:
                        default: 0
                        minimum: 0
                        type: integer
                      tlc:
                        default: 0
                        minimum: 0
                        type: integer
                    required:
                    - qlc
                    - tlc
                    type: object
                  envoyCores:
                    description: Number of cores allocated to the Envoy proxy process
                      used by the S3 gateway.
                    minimum: 0
                    type: integer
                  nfsContainers:
                    description: Number of NFS protocol containers per cluster node.
                    minimum: 0
                    type: integer
                  nfsCores:
                    description: Number of cores allocated to each NFS container.
                    minimum: 0
                    type: integer
                  nfsExtraCores:
                    description: Additional non-DPDK cores for NFS containers.
                    minimum: 0
                    type: integer
                  nfsFrontendHugepages:
                    description: Hugepage allocation in MiB for NFS frontend threads.
                    minimum: 0
                    type: integer
                  nfsFrontendHugepagesOffset:
                    description: Offset in MiB for NFS frontend hugepage allocation.
                    minimum: 0
                    type: integer
                  numDrives:
                    description: |-
                      Number of virtual or physical drives per drive container. Mutually exclusive with containerCapacity.
                      When the cluster acts as a daemonset (computeContainers and driveContainers both unset), NumDrives
                      is the per-node drive count: each drive container takes that many of the node's largest signed
                      drives instead of all of them.
                    minimum: 0
                    type: integer
                  s3Containers:
                    description: |-
                      Total number of S3 gateway containers in the cluster. -1 (act-as-daemonset mode only) puts one S3 and
                      one envoy container on every eligible node matching roleNodeSelector.s3, else the cluster nodeSelector.
                    minimum: -1
                    type: integer
                  s3Cores:
                    description: Number of cores allocated to each S3 gateway container.
                    minimum: 0
                    type: integer
                  s3ExtraCores:
                    description: Additional non-DPDK cores for S3 gateway containers,
                      used for background tasks.
                    minimum: 0
                    type: integer
                  s3FrontendHugepages:
                    description: Hugepage allocation in MiB for S3 gateway frontend
                      threads.
                    minimum: 0
                    type: integer
                  s3FrontendHugepagesOffset:
                    description: Offset in MiB applied to the auto-calculated hugepage
                      allocation for S3 frontend threads.
                    minimum: 0
                    type: integer
                  smbwContainers:
                    description: number of SMB-W containers (3-8)
                    minimum: 0
                    type: integer
                  smbwCores:
                    description: number of SMB-W cores per container
                    minimum: 0
                    type: integer
                  smbwExtraCores:
                    description: number of SMB-W extra cores per container
                    minimum: 0
                    type: integer
                  smbwFrontendHugepages:
                    description: hugepage allocation for SMB-W frontend
                    minimum: 0
                    type: integer
                  smbwFrontendHugepagesOffset:
                    description: hugepage offset for SMB-W frontend
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: driveCapacity and driveTypesRatio are mutually exclusive;
                    use driveCapacity for TLC-only mode, or containerCapacity with
                    driveTypesRatio for mixed drive types
                  rule: '!has(self.driveCapacity) || self.driveCapacity == 0 || !has(self.driveTypesRatio)'
                - message: numDrives must be >= driveCores when using driveCapacity
                    (TLC-only mode); each drive core requires at least one virtual
                    drive
                  rule: '!has(self.driveCapacity) || self.driveCapacity == 0 || !has(self.numDrives)
                    || self.numDrives == 0 || !has(self.driveCores) || self.driveCores
                    == 0 || self.numDrives >= self.driveCores'
                - message: numDrives must be >= driveCores in full-drives mode, including
                    the daemonset mode (computeContainers and driveContainers both
                    unset) where numDrives pins a per-node drive count; weka requires
                    at least one physical drive per drive core. To run more than one
                    core per physical drive, use a drive-sharing mode (containerCapacity
                    or clusterCapacity) instead
                  rule: '!has(self.numDrives) || self.numDrives == 0 || (has(self.driveCapacity)
                    && self.driveCapacity > 0) || !has(self.driveCores) || self.driveCores
                    == 0 || self.numDrives >= self.driveCores'
                - message: numDrives and containerCapacity are mutually exclusive;
                    use numDrives with driveCapacity for TLC-only mode, or containerCapacity
                    with driveTypesRatio for mixed drive types
                  rule: '!has(self.numDrives) || self.numDrives == 0 || !has(self.containerCapacity)
                    || self.containerCapacity == 0'
                - message: containerCapacity must be greater than 0 when specified
                  rule: '!has(self.containerCapacity) || self.containerCapacity >
                    0'
                - message: at least one of driveTypesRatio.tlc or driveTypesRatio.qlc
                    must be greater than 0
                  rule: '!has(self.driveTypesRatio) || self.driveTypesRatio.tlc >
                    0 || self.driveTypesRatio.qlc > 0'
                - message: driveTypesRatio.tlc must be greater than 0 when driveTypesRatio
                    is specified; TLC-only and mixed TLC/QLC configurations are supported,
                    but QLC-only is not allowed
                  rule: '!has(self.driveTypesRatio) || self.driveTypesRatio.tlc >
                    0'
                - message: driveCapacity must be greater than 0 when specified
                  rule: '!has(self.driveCapacity) || self.driveCapacity > 0'
                - message: clusterCapacity is mutually exclusive with containerCapacity,
                    numDrives and driveCapacity
                  rule: '!has(self.clusterCapacity) || self.clusterCapacity.size()
                    == 0 || ((!has(self.containerCapacity) || self.containerCapacity
                    == 0) && (!has(self.numDrives) || self.numDrives == 0) && (!has(self.driveCapacity)
                    || self.driveCapacity == 0))'
                - message: 'computeContainers and driveContainers must be set together:
                    setting both sizes the cluster by container counts, while leaving
                    both unset makes the operator act as a daemonset over its drive-role
                    nodeSelector (one drive container per eligible node, sized from
                    that node''s own full drives). numDrives, driveCores and computeCores
                    may be pinned either way. For capacity-based sizing, use clusterCapacity,
                    containerCapacity or driveCapacity instead'
                  rule: (has(self.clusterCapacity) && self.clusterCapacity.size()
                    > 0) || (has(self.containerCapacity) && self.containerCapacity
                    > 0) || (has(self.driveCapacity) && self.driveCapacity > 0) ||
                    ((has(self.computeContainers) && self.computeContainers > 0) ==
                    (has(self.driveContainers) && self.driveContainers > 0))
                - message: 's3Containers: -1 (one S3 container per eligible node)
                    is only allowed in act-as-daemonset mode: computeContainers, driveContainers,
                    containerCapacity, driveCapacity and clusterCapacity must all
                    be unset'
                  rule: '!has(self.s3Containers) || self.s3Containers != -1 || ((!has(self.computeContainers)
                    || self.computeContainers == 0) && (!has(self.driveContainers)
                    || self.driveContainers == 0) && (!has(self.containerCapacity)
                    || self.containerCapacity == 0) && (!has(self.driveCapacity) ||
                    self.driveCapacity == 0) && (!has(self.clusterCapacity) || self.clusterCapacity.size()
                    == 0))'
              encryption:
                description: Encryption configuration for data at rest. Configure
                  a HashiCorp Vault KMS for production use.
                properties:
                  internal:
                    description: InternalConfig defines internal encryption settings,
                      encryption key stored in weka configuration, for production
                      systems use real KMS, however this mode can be useful to evaluate
                      performance of encrypted filesystems
                    properties:
                      enabled:
                        type: boolean
                    required:
                    - enabled
                    type: object
                  vault:
                    description: Configures a HashiCorp Vault KMS for encryption key
                      management. Recommended for production.
                    properties:
                      address:
                        description: Vault address, e.g. "https://vault.example.com:8200".
                        type: string
                      authPath:
                        default: kubernetes
                        description: Path under auth/ that the weka uses for login.
                          defaults to "kubernetes"
                        type: string
                      keyName:
                        default: weka-key
                        description: Name of the transit key. defaults to "weka-key"
                        type: string
                      method:
                        default: kubernetes
                        description: Vault Auth method (only “kubernetes” is supported  on
                          operator side.)
                        enum:
                        - kubernetes
                        type: string
                      role:
                        description: Role to authenticate as in Vault.
                        type: string
                      transitPath:
                        default: transit
                        description: Transit engine mount path, defaults "transit".
                        type: string
                    required:
                    - address
                    - role
                    type: object
                type: object
              expandEndpoints:
                description: endpoint of existing weka cluster, containers created
                  for this k8s-driver cluster will join existing weka cluster, used
                  in flow of migration
                items:
                  type: string
                type: array
              failureDomain:
                description: failure domain configuration for weka containers
                properties:
                  compositeLabels:
                    description: |-
                      If multiple labels are specified, the failure domain will be the combination of the labels.
                      If `compositeLabels` is set, `label` and `skew` will be ignored.
                      When using compositeLabels, weka containers will be spread considering all labels
                      with best effort, but even distribution is not guaranteed
                    items:
                      type: string
                    type: array
                  label:
                    description: |-
                      label used for spreading the weka containers across different failure domains (if set)
                      nodes that have the same value for the label will be considered as a single failure domain
                    type: string
                  skew:
                    description: |-
                      skew for the failure domain, if set, the weka containers will be spread with the skew in mind
                      (only applicable if `label` is set)
                    type: integer
                type: object
              globalPVC:
                description: Reference to a PVC shared by all Weka containers. Use
                  to persist container state on nodes lacking local NVMe storage.
                properties:
                  name:
                    description: Name of the PersistentVolumeClaim to mount into all
                      Weka containers.
                    type: string
                  path:
                    description: Mount path inside the Weka container. Defaults to
                      /opt/k8s-weka when empty.
                    type: string
                required:
                - name
                type: object
              gracefulDestroyDuration:
                default: 24h
                description: |-
                  During this period the cluster will not be destroyed (protection from accidental deletion)
                  Note: due to discrepancies in validation vs parsing, we use a Pattern instead of `Format=duration`. See
                  https://bugzilla.redhat.com/show_bug.cgi?id=2050332
                  https://github.com/kubernetes/apimachinery/issues/131
                  https://github.com/kubernetes/apiextensions-apiserver/issues/56
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+)$
                type: string
              hotSpare:
                default: 0
                description: |-
                  A hot spare is reserved capacity designed to handle data rebuilds while maintaining the system's net capacity, even in the event of failure domains being lost
                  See: https://docs.weka.io/weka-system-overview/ssd-capacity-management#hot-spare
                type: integer
              image:
                description: full container image name in format of quay.io/weka.io/weka-in-container:VERSION
                pattern: ^.+:\d+\.\d+\.\d+.*$
                type: string
              imagePullSecret:
                description: image pull secret to use for pulling the image
                type: string
              ipv6:
                description: |-
                  prefer ipv6 on a data-path device that carries both address families.
                  It is not needed when network.deviceSubnets or a selector subnet is set, which already pin the
                  address family, nor when the device only has an ipv6 address.
                type: boolean
              leadershipRaftSize:
                description: size of raft for leadership, defaults to 5, 5/9 are supported
                type: integer
              licenseSecret:
                description: |-
                  Name of a Secret in the WekaCluster's namespace holding the WEKA license under key "license".
                  Applied after the cluster forms and re-applied when the Secret changes.
                type: string
              network:
                description: weka cluster network configuration
                properties:
                  allocateVfPerIoNode:
                    type: boolean
                  bindManagementAll:
                    description: |-
                      BindManagementAll controls whether Weka containers bind to all network interfaces or only to specific management interfaces.
                      When set to false (default), containers will only listen on the management ips interfaces (restrict_listen mode).
                      When set to true, containers will listen on all ips (0.0.0.0) instead of specific IP addresses.
                    type: boolean
                  deviceSubnets:
                    description: |-
                      A list of backend subnets in CIDR notation, either IPv4 (for example, 192.168.10.0/24)
                      or IPv6 (for example, 2001:db8::/64).
                      The operator assigns IP addresses from these subnets to the backend containers for their data path network.
                      The address family of the subnet selects the address family used on the data path; the ipv6 field is not consulted.
                    items:
                      pattern: ^(([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F:.]*)\/[0-9]{1,3}$
                      type: string
                    type: array
                  ethDevice:
                    description: |-
                      The name of a single network interface (for example, eth1) to be used by every backend container.
                      This is for clusters that use only one dedicated NIC for the data path.
                      You cannot use this field with ethDevices.
                      If you leave this empty, the system automatically uses the node’s interface associated with the first subnet defined in deviceSubnets.
                    type: string
                  ethDevices:
                    description: |-
                      A list of network interface names to be used by backend containers when you have multiple dedicated NICs.
                      The order of interfaces in this list is important, as it maps directly to the ethSlots index (the first interface maps to slot-0, the second to slot-1, and so on).
                      You cannot use this field with ethDevice. Ensure that every interface listed here exists on all nodes that are part of the cluster.
                    items:
                      type: string
                    type: array
                  gateway:
                    description: |-
                      The default gateway IPv4 address for the backend containers’ data-path network.
                      This is only necessary if backend subnets need to communicate with destinations outside of their local network (L2 segment).
                      If you have a flat, non-routed backend network, you can leave this field empty.
                    type: string
                  managementIpsSelectors:
