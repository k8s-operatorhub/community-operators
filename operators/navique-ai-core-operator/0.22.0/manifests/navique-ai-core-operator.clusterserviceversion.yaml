      displayName: User
      kind: User
      name: users.core.navique.com
      version: v1alpha1
  description: |-
    ## About the managed application

    The **Navique FORGE AI Core Operator** deploys and manages a complete, self-hosted
    AI platform on Kubernetes: the **LiteLLM** AI gateway, the **LibreChat** chat UI,
    **Langfuse** LLM observability, and the datastores and secrets plumbing behind
    them. You declare the platform as Kubernetes resources and the operator converges
    the cluster to match. It installs the upstream operators it needs (CloudNativePG,
    External Secrets, Sealed Secrets, cert-manager, and the Redis, ClickHouse,
    MongoDB, LiteLLM and Langfuse operators) from their official Helm charts, which
    are embedded in the operator.

    The core is open source (AGPL-3.0) and runs without a license as the
    **Community** edition. Enterprise features (multiple instances, multi-tenancy,
    automatic wiring between components, SSO/SCIM and the PII guardrail) unlock with
    a signed, offline license from Navique. There is no license server and no
    phone-home.

    More information:

    * Documentation: [docs.navique.dev/ai-core](https://docs.navique.dev/ai-core/)
    * Customer portal (licenses and trials): [portal.navique.dev](https://portal.navique.dev/)
    * Navique: [www.navique.com](https://www.navique.com/)

    ## Features

    * **One resource per capability:** `Gateway` (LiteLLM, with models, teams and
      organizations), `Observability` (Langfuse v3), `ChatUI` (LibreChat),
      `PostgresCluster`, `ClickHouseCluster`, `RedisInstance`, `MongoCluster`,
      `MeilisearchInstance`, `SecretsManagement`, `License`, `Guardrail`,
      `MCPServer` and more. An optional `Stack` resource brings up a whole bundle in
      one go.
    * **Managed, adopted or external datastores:** each datastore can be run by the
      operator, adopted from an existing in-cluster resource, or pointed at an
      external host.
    * **Provenance-aware installs:** an upstream operator you already installed is
      adopted, never reinstalled, and the operator only removes what it installed
      itself.
    * **Readiness-driven reconciliation:** apply everything at once; each resource
      becomes `Ready` as soon as the resources it references are, with detailed
      status conditions along the way.
    * **No credentials in manifests:** secrets come from Kubernetes Secrets, from
      External Secrets (Azure Key Vault, HashiCorp Vault, AWS or GCP secret managers,
      and others) or from Sealed Secrets.
    * **Management console** deployed by default.

    ## How to use it

    1. Install the operator from OperatorHub.
    2. Create the namespaces and the Secrets your workloads reference, for example
       your model provider API key and the object storage credentials for Langfuse.
    3. Create the platform resources, for example a `PostgresCluster`,
       `ClickHouseCluster` and `RedisInstance`, then a `Gateway`, an `Observability`
       and a `ChatUI`. Every resource kind has an example in the operator's
       "Create instance" forms.
    4. Watch them become ready: `kubectl get gateways,observabilities,chatuis -A`.

    The [Quick Start](https://docs.navique.dev/ai-core/guide/quickstart) walks through
    a complete platform step by step.

    ## Prerequisites

    * Kubernetes **1.28 or newer**. Tested on AKS, EKS, GKE, OpenShift, Kind and
      Minikube.
    * A **default StorageClass** with dynamic provisioning, if the operator is to run
      the datastores.
    * **Object storage** for Langfuse v3 (S3, Azure Blob or GCS; a small MinIO is
      enough for evaluation).
    * An **ingress controller** and DNS, to expose the gateway, the chat UI, Langfuse
      or the management console outside the cluster.
    * A **secrets backend** for production: an External Secrets provider or Sealed
      Secrets, configured through a `SecretsManagement` resource. Plain Kubernetes
      Secrets are enough for evaluation.
    * Outbound access to public image registries (ghcr.io, quay.io, Docker Hub). For
      air-gapped clusters, mirror the images into your own registry.
    * Optional: a license for the Enterprise features. Get a trial or your license
      from the [customer portal](https://portal.navique.dev/), store it in a Secret
      and reference it from a `License` resource named `cluster`.

    See [Prerequisites](https://docs.navique.dev/ai-core/guide/prerequisites) for
    details.
