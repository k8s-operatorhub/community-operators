
on: issue_comment
name: Issue Comments - retest
env:
  OPP_PRODUCTION_TYPE: "k8s"

jobs:
  handle_comments:
    name: Check comments for /retest
    if: |
      startsWith(github.event.comment.body, '/retest')
    runs-on: ubuntu-latest
    steps:
      - name: Restest command handler
        id: command
        uses: xt0rted/slash-command-action@865ee04a1dfc8aa2571513eee8e84b5377153511  # v1.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: retest
          reaction: "true"
          reaction-type: "eyes"
          allow-edits: "true"
          permission-level: read

      - name: Doing hold
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: |
          steps.command.outputs.command-name == 'retest'
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '/hold'
            })
            
      - name: Sleep for 10 seconds
        uses: jakejarvis/wait-action@919fc193e07906705e5b7a50f90ea9e74d20b2b0  # v0.1.1
        with:
          time: '10s'

      - name: Doing hold cancel
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: |
          steps.command.outputs.command-name == 'retest'
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '/hold cancel'
            })
