  description: |
    The Harbor Resource Operator manages objects **inside** a running
    [Harbor](https://goharbor.io) through its REST API, so Harbor configuration
    can be kept next to the workloads that use it:

    - projects, with quotas and scanning settings
    - robot accounts, with the token written to a Kubernetes Secret and rotated before it expires
    - replication endpoints and replication policies
    - project members, labels, immutable tag rules, webhooks and tag retention
    - the garbage collection schedule

    It does **not** install, upgrade or back up Harbor. Install Harbor with the
    [official Helm chart](https://github.com/goharbor/harbor-helm) first.

    ### Getting started

    1. Create a Secret with a Harbor user that may manage the kinds you use, in
       the namespace of the HarborConnection:

       ```
       kubectl create namespace harbor-system
       kubectl -n harbor-system create secret generic prod-harbor-admin \
         --from-literal=username=<harbor user> --from-literal=password=<password>
       ```

    2. Create a `HarborConnection` that points at Harbor and names that Secret
       in `credentialsSecretRef`. Its `allowedNamespaces` controls which
       namespaces may use it.
    3. Create projects, robot accounts and the other kinds in those namespaces,
       each with a `connectionRef` to the connection.

    The examples reference Secrets that you create yourself:
    `prod-harbor-admin` (Harbor credentials, keys `username` and `password`),
    `edge-eu-west-creds` (remote registry, keys `accessKey` and `accessSecret`)
    and `ci-webhook-auth` (webhook `Authorization` header, key `authorization`).
    Credentials are never logged or written to status or events.

    Supported: Harbor 2.12 to 2.15, Kubernetes 1.30 and later. The operator
    watches all namespaces.

    This is an independent community project. It is not affiliated with or
    endorsed by the Harbor project or the CNCF.
  displayName: Harbor Resource Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - secrets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - events.k8s.io
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - harbor.oreonit.com
          resources:
          - harborconnections
          - harborgarbagecollections
          - harborimmutablerules
          - harborlabels
          - harborprojectmembers
          - harborprojects
          - harborregistries
          - harborreplicationpolicies
          - harborretentionpolicies
          - harborrobotaccounts
          - harborwebhooks
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - harbor.oreonit.com
          resources:
          - harborconnections/finalizers
          - harborgarbagecollections/finalizers
          - harborimmutablerules/finalizers
          - harborlabels/finalizers
          - harborprojectmembers/finalizers
          - harborprojects/finalizers
          - harborregistries/finalizers
          - harborreplicationpolicies/finalizers
          - harborretentionpolicies/finalizers
          - harborrobotaccounts/finalizers
          - harborwebhooks/finalizers
          verbs:
          - update
        - apiGroups:
          - harbor.oreonit.com
          resources:
          - harborconnections/status
          - harborgarbagecollections/status
          - harborimmutablerules/status
          - harborlabels/status
          - harborprojectmembers/status
          - harborprojects/status
          - harborregistries/status
          - harborreplicationpolicies/status
          - harborretentionpolicies/status
          - harborrobotaccounts/status
          - harborwebhooks/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: harbor-resource-operator-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: harbor-resource-operator
          control-plane: controller-manager
        name: harbor-resource-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: harbor-resource-operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: harbor-resource-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                image: ghcr.io/oreondev/harbor-resource-operator:0.1.4
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8081
                  name: health
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: harbor-resource-operator-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: harbor-resource-operator-controller-manager
    strategy: deployment
