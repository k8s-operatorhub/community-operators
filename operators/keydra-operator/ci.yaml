# Who may release this operator. A pull request from anybody not named here waits for a
# maintainer instead of merging on green, which is the point: the package name is the
# identity, and this is what stops somebody else publishing under it.
reviewers:
  - MehmetNuri

# `replaces` in the ClusterServiceVersion names the version being upgraded from, rather than
# the graph being inferred from version numbers. Chosen because the next release will say so
# explicitly, and a graph that is written down is one that can be wrong in a visible way.
updateGraph: replaces-mode
