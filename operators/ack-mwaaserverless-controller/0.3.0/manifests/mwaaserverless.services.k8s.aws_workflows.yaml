                format: date-time
                type: string
              scheduleConfiguration:
                description: |-
                  The schedule configuration for the workflow, including cron expressions for
                  automated execution. Amazon Managed Workflows for Apache Airflow Serverless
                  uses EventBridge Scheduler for cost-effective, timezone-aware scheduling.
                  When a workflow includes schedule information in its YAML definition, the
                  service automatically configures the appropriate triggers for automated execution.
                  Only one version of a workflow can have an active schedule at any given time.
                properties:
                  cronExpression:
                    type: string
                type: object
              status:
                description: |-
                  The current status of the workflow. Possible values are READY (workflow is
                  ready to run) and DELETING (workflow is being deleted).
                type: string
              version:
                description: |-
                  The version identifier of the workflow. This is a service-generated alphanumeric
                  string that uniquely identifies this version of the workflow. Amazon Managed
                  Workflows for Apache Airflow Serverless uses a version-first approach where
                  each workflow can have multiple immutable versions, which allows you to maintain
                  different configurations and roll back to previous versions as needed. The
                  version identifier is used in ARNs and API operations to reference specific
                  workflow versions.

                  Regex Pattern: `^[a-z0-9]{32}$`
                type: string
            type: object
        type: object
