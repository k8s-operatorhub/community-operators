            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:storage.vastdata.com:v1:VastStorage
          - description: |
              Optional. Leave empty for autodiscovery of the single shared ReplicationPeer. Set only when more than one shared peer exists.
