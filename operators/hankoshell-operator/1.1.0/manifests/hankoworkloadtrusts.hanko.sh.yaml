apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankoworkloadtrusts.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoWorkloadTrust
    listKind: HankoWorkloadTrustList
    plural: hankoworkloadtrusts
    shortNames:
    - hwt
    singular: hankoworkloadtrust
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.realmRef
      name: Realm
      type: string
    - jsonPath: .spec.keycloakAlias
      name: Alias
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HankoWorkloadTrust owns one shared Kubernetes client-assertion trust. Ready
          qualifies configuration only; it never enables a workload client or handles JWTs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              dependentReaderRef:
                description: |-
                  DependentReaderRef selects a dedicated, distinct view-clients connection in this namespace.
                  The controller permits only target-realm client metadata GETs on that connection.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              keycloakAlias:
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              kubernetes:
                properties:
                  assertionMaxAgeSeconds:
                    default: 600
                    format: int64
                    maximum: 3600
                    minimum: 600
                    type: integer
                  clusterAnchor:
                    properties:
                      apiServerCAHash:
                        description: APIServerCAHash identifies the single configured
                          public API CA certificate DER.
                        maxLength: 71
                        minLength: 71
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      kubeSystemNamespaceUID:
                        maxLength: 128
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                        type: string
                    required:
                    - apiServerCAHash
                    - kubeSystemNamespaceUID
                    type: object
                  discoveryURL:
                    description: DiscoveryURL requires an explicit stable 26.8+ source
                      within the 26.x family.
                    maxLength: 2048
                    pattern: ^https://[a-z0-9\[\]:.-]+(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?$
                    type: string
                  issuer:
                    description: Issuer is the exact approved HTTPS issuer of the
                      controller's current cluster.
                    maxLength: 2048
                    minLength: 9
                    pattern: ^https://[a-z0-9\[\]:.-]+(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?$
                    type: string
                required:
                - clusterAnchor
                - issuer
                type: object
              mode:
                default: Manage
                description: Imported-by always forces Observe. Explicit adoption
                  is an ownership-only transaction.
                enum:
                - Manage
                - Observe
                type: string
              provider:
                enum:
                - Kubernetes
                type: string
              qualifiedKeycloakVersion:
                description: |-
                  QualifiedKeycloakVersion is explicit administrator source qualification,
                  never copied from diagnostic status. Common behavior needs no version disclosure.
                  Stable 26.x versions from 26.7.5 are eligible; exact tested patches are separate.
                  Discovery override additionally requires 26.8+ and native resolved-source read-back.
                maxLength: 23
                minLength: 6
                pattern: ^26\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$
                type: string
                x-kubernetes-validations:
                - message: workload identity requires stable Keycloak 26.7.5 or later
                    26.x
                  rule: int(self.split('.')[1]) > 7 || (int(self.split('.')[1]) ==
                    7 && int(self.split('.')[2]) >= 5)
              realmRef:
                description: RealmRef selects an existing HankoRealm in this namespace,
                  including Observe realms.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              sourceRef:
                description: SourceRef selects the canonical HankoKeycloakInstance
                  connection. Observe uses its reader identity.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              writerRef:
                description: |-
                  WriterRef optionally selects a distinct instance credential for Manage or explicitly approved acquisition.
                  Its endpoint/CA must equal SourceRef. Observe without approval never loads this credential.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
            required:
            - dependentReaderRef
            - keycloakAlias
            - kubernetes
            - provider
            - realmRef
            - sourceRef
            type: object
            x-kubernetes-validations:
            - message: realmRef is immutable; create a separately reviewed trust
              rule: self.realmRef == oldSelf.realmRef
            - message: sourceRef is immutable; create a separately reviewed trust
              rule: self.sourceRef == oldSelf.sourceRef
            - message: keycloakAlias is immutable; create a separately reviewed trust
              rule: self.keycloakAlias == oldSelf.keycloakAlias
            - message: discovery override requires an explicit stable Keycloak 26.8
                or later 26.x source
              rule: '!has(self.kubernetes.discoveryURL) || (has(self.qualifiedKeycloakVersion)
                && int(self.qualifiedKeycloakVersion.split(''.'')[1]) >= 8)'
          status:
            properties:
              adoptionCandidate:
                description: |-
                  AdoptionCandidateStatus is review evidence for a possible future adoption.
                  It is not approval, ownership, a receipt, or permission to enter Manage.
                properties:
                  approvable:
                    type: boolean
                  candidateHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  complete:
                    type: boolean
                  contractVersion:
                    enum:
                    - hanko.sh/adoption-contract/v1alpha1
                    type: string
                  diff:
                    items:
                      properties:
                        classification:
                          enum:
                          - supported-typed-native
                          - preserved-readonly-native
                          - unsupported
                          - conflicting
                          - security-sensitive-excluded
                          type: string
                        code:
                          enum:
                          - equal
                          - would-manage
                          - would-change
                          - would-preserve
                          - provider-native-readonly
                          - unsupported
                          - credential-excluded
                          - recreation-required
                          - ownership-transition
                          type: string
                        current:
                          description: AdoptionValue contains only reviewed non-secret
                            semantic fields.
                          properties:
                            flag:
                              type: boolean
                            set:
                              items:
                                maxLength: 512
                                type: string
                              maxItems: 1024
                              type: array
                              x-kubernetes-list-type: set
                            text:
                              maxLength: 512
                              type: string
                          type: object
                        desired:
                          description: AdoptionValue contains only reviewed non-secret
                            semantic fields.
                          properties:
                            flag:
                              type: boolean
                            set:
                              items:
                                maxLength: 512
                                type: string
                              maxItems: 1024
                              type: array
                              x-kubernetes-list-type: set
                            text:
                              maxLength: 512
                              type: string
                          type: object
                        domain:
                          maxLength: 64
                          type: string
                        field:
                          maxLength: 64
                          type: string
                        identity:
                          maxLength: 128
                          type: string
                        object:
                          maxLength: 255
                          type: string
                        roundTrip:
                          enum:
                          - lossless-represented
                          - preserved-native
                          - lossy
                          - unsupported
                          type: string
                      required:
                      - classification
                      - code
                      - domain
                      - field
                      - identity
                      - object
                      - roundTrip
                      type: object
                    maxItems: 256
                    type: array
                  diffHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  findings:
                    items:
                      properties:
                        blocking:
                          type: boolean
                        code:
                          maxLength: 512
                          type: string
                        domain:
                          maxLength: 64
                          type: string
                        message:
                          maxLength: 512
                          type: string
                      required:
                      - blocking
                      - code
                      - domain
                      - message
                      type: object
                    maxItems: 32
                    type: array
                  observationHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  providerIdentity:
                    description: AdoptionProviderIdentity excludes AdminRef, credentials
                      and credential hashes.
                    properties:
                      caIdentity:
                        description: CAIdentity binds the public trust bundle and
                          Secret UID.
                        maxLength: 255
                        type: string
                      caReference:
                        maxLength: 255
                        type: string
                      instance:
                        description: AdoptionTargetIdentity identifies a current object,
                          never write authority.
                        properties:
                          generation:
                            format: int64
                            minimum: 0
                            type: integer
                          importRef:
                            description: ImportRef binds the discovery latch without
                              consuming it.
                            maxLength: 255
                            type: string
                          kind:
                            maxLength: 64
                            type: string
                          name:
                            maxLength: 255
                            type: string
                          namespace:
                            maxLength: 255
                            type: string
                          tenantRef:
                            description: TenantRef binds connection-selecting target
                              metadata without acquiring it.
                            maxLength: 255
                            type: string
                          uid:
                            maxLength: 128
                            type: string
                        required:
                        - kind
                        - name
                        - namespace
                        - uid
                        type: object
                      objectIDs:
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 512
                        type: array
                        x-kubernetes-list-type: set
                      origin:
                        maxLength: 2048
                        type: string
                      realmID:
                        maxLength: 128
                        type: string
                      trust:
                        description: Unknown is reserved for incomplete diagnostic
                          evidence.
                        enum:
                        - public-ca
                        - private-ca
                        - explicit-http
                        - unknown
                        type: string
                    required:
                    - instance
                    - origin
                    - realmID
                    - trust
                    type: object
                  target:
                    description: AdoptionTargetIdentity identifies a current object,
                      never write authority.
                    properties:
                      generation:
                        format: int64
                        minimum: 0
                        type: integer
                      importRef:
                        description: ImportRef binds the discovery latch without consuming
                          it.
                        maxLength: 255
                        type: string
                      kind:
                        maxLength: 64
                        type: string
                      name:
                        maxLength: 255
                        type: string
                      namespace:
                        maxLength: 255
                        type: string
                      tenantRef:
                        description: TenantRef binds connection-selecting target metadata
                          without acquiring it.
                        maxLength: 255
                        type: string
                      uid:
                        maxLength: 128
                        type: string
                    required:
                    - kind
                    - name
                    - namespace
                    - uid
                    type: object
                  truncated:
                    type: boolean
                required:
                - approvable
                - candidateHash
                - complete
                - contractVersion
                - diffHash
                - observationHash
                - providerIdentity
                - target
                - truncated
                type: object
              adoptionReceipt:
                description: |-
                  AdoptionReceiptStatus reports a live provider checkpoint, never write or
                  deletion authority. A failed status update can be recovered from the provider.
                properties:
                  candidateHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  contractVersion:
                    enum:
                    - hanko.sh/adoption-contract/v1alpha1
                    type: string
                  state:
                    enum:
                    - Pending
                    - Verified
                    - Partial
                    - Conflict
                    type: string
                required:
                - candidateHash
                - contractVersion
                - state
                type: object
              appliedPlanHash:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              capabilities:
                properties:
                  federatedClientAuthentication:
                    description: FederatedClientAuthentication reports only the observed
                      flow prerequisite.
                    type: boolean
                  issuerDiscoveryOverride:
                    type: boolean
                  kubernetesWorkloadIdentity:
                    type: boolean
                  secretFallback:
                    description: 'SecretFallback remains false: no workload credential
                      transition is implemented here.'
                    type: boolean
                  shortLivedClientAssertion:
                    type: boolean
                required:
                - federatedClientAuthentication
                - issuerDiscoveryOverride
                - kubernetesWorkloadIdentity
                - secretFallback
                - shortLivedClientAssertion
                type: object
              capabilityEvidence:
                description: |-
                  IAMCapabilityEvidence describes the adapter mapping's qualification. It does
                  not claim to discover or qualify the installed provider version at runtime.
                properties:
                  qualificationWindow:
                    maxLength: 64
                    type: string
                  source:
                    maxLength: 64
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contractVersion:
                maxLength: 64
                type: string
              dependentInventoryHash:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              dependents:
                description: Dependents are diagnostic counts from a fresh complete
                  inventory, never client execution authority.
                properties:
                  ambiguous:
                    format: int32
                    maximum: 1024
                    minimum: 0
                    type: integer
                  foreign:
                    format: int32
                    maximum: 1024
                    minimum: 0
                    type: integer
                  owned:
                    format: int32
                    maximum: 1024
                    minimum: 0
                    type: integer
                required:
                - ambiguous
                - foreign
                - owned
                type: object
              evaluatedPlanHash:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              intentHash:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              observationComplete:
                type: boolean
              observedGeneration:
                format: int64
                minimum: 0
                type: integer
              observedStateHash:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              phase:
                enum:
                - Pending
                - Reconciling
                - Ready
                - Error
                type: string
              providerID:
                maxLength: 128
                type: string
              realmID:
                maxLength: 128
                type: string
              sharedAgeReviewHash:
                description: SharedAgeReviewHash is bounded review evidence; approval
                  is explicit metadata, never status.
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
