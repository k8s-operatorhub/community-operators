apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  creationTimestamp: null
  name: decisionmodels.decisionmodel.io
spec:
  group: decisionmodel.io
  names:
    kind: DecisionModel
    listKind: DecisionModelList
    plural: decisionmodels
    shortNames:
    - dm
    singular: decisionmodel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.stableRevision.model
      name: Active
      type: string
    - jsonPath: .status.candidateRevision.model
      name: Candidate
      type: string
    - jsonPath: .status.evaluation.accuracy
      name: Accuracy
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.stableRevision.digest
      name: Digest
      priority: 1
      type: string
    - jsonPath: .status.stableRevision.device
      name: Device
      priority: 1
      type: string
    - jsonPath: .status.replicas.modelReady
      name: Ready
      priority: 1
      type: integer
    - jsonPath: .status.lastPromotionTime
      name: Promoted
      priority: 1
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DecisionModel is the Schema for the decisionmodels API.

          metadata.name must be a DNS-1035 label of at most 43 characters (see
          MaxNameLength): the operator derives a Service named after it (no dots) and
          Job/PVC names that must stay within 63 characters (a new revision's 16-hex hash
          uses the short <dm>-pf-<hash> Job name so the worst case still fits 63).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DecisionModelSpec defines the desired state of DecisionModel.
            properties:
              auth:
                description: Auth configures the engine API key.
                properties:
                  apiKeySecretRef:
                    description: |-
                      APIKeySecretRef references a Secret key holding the engine API key. The
                      Secret must carry the label decisionmodel.io/api-key: "true" (opt-in), or
                      the operator reports Degraded (SecretNotAllowed) and creates no workloads.
                      The same key is used by the operator's prober and evaluator. The referenced
                      key must exist (optional is not supported: the prober and the serving Pod
                      would otherwise disagree); a missing key is reported as Degraded
                      (APIKeyInvalid).
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: 'apiKeySecretRef.optional is not supported: the key
                        must exist'
                      rule: '!has(self.optional) || !self.optional'
                type: object
              cache:
                description: Cache configures the model store PVC.
                properties:
                  accessModes:
                    description: |-
                      AccessModes for the model store PVC. Defaults to ReadWriteOnce. Set
                      ReadWriteMany when running replicas>1 spread across nodes. ReadOnlyMany is
                      rejected: the prefetch Job must write the store. PVC access modes are
                      immutable once created.
                    items:
                      type: string
                    type: array
                    x-kubernetes-validations:
                    - message: 'ReadOnlyMany is not allowed: the prefetch Job writes
                        the model store'
                      rule: self.all(m, m != 'ReadOnlyMany')
                  downloadTokenSecretRef:
                    description: |-
                      DownloadTokenSecretRef references a Secret key holding a credential for
                      weight downloads (e.g. a Hugging Face token for private or gated repositories,
                      or a mirror). It is injected into the prefetch Job only, never into serving
                      Pods. The Secret must carry the label decisionmodel.io/download-token: "true"
                      (opt-in guard), or the operator reports Degraded (SecretNotAllowed) and does
                      not create a prefetch Job. The optional field is not supported: when a ref is
                      set the Secret must exist and contain the referenced key, or the operator
                      reports Degraded (DownloadTokenInvalid).
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10Gi
                    description: Size is the requested PVC size for the model store.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClassName selects the PVC storage class. RWX is required for
                      replicas>1 spread across nodes.
                    type: string
                type: object
              device:
                default: cpu
                description: |-
                  Device selects the target compute device for serving. "cuda" also requests
                  an nvidia.com/gpu and uses the engine's CUDA image.
                enum:
                - cpu
                - cuda
                type: string
              digest:
                description: |-
                  Digest optionally pins the model to an immutable digest (bare hex sha256).
                  When empty, the operator resolves the tag and records the digest in status.
                pattern: ^[a-f0-9]{64}$
                type: string
              engine:
                default: ollaya
                description: Engine is the serving runtime for the model.
                enum:
                - ollaya
                type: string
              image:
                description: |-
                  Image overrides the engine's default container image. Rejected unless the
                  operator is started with --allow-image-override (a DecisionModel editor
                  could otherwise run an arbitrary image under the operator's Pod template).
                  Mutually exclusive with runtimeVersion.
                type: string
              model:
                description: |-
                  Model is the model name in engine terms, e.g. "laya:en". The last path
                  segment must include an explicit ":tag" (a bare name resolves to :latest,
                  a different and heavier artifact — see spike 001 §9).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: model must include an explicit tag, e.g. laya:en
                  rule: self.split('/')[size(self.split('/')) - 1].contains(':')
              replicas:
                default: 1
                description: |-
                  Replicas is the number of serving Pods for the stable revision (default 1).
                  With replicas > 1 spread across nodes the model store must be shareable —
                  see cache.accessModes; otherwise the operator reports Degraded
                  (CacheNotShareable).
                format: int32
                minimum: 1
                type: integer
              resources:
                description: Resources are the compute resource requirements for the
                  serving container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              rollout:
                description: Rollout configures rollout behaviour, including eval-gated
                  promotion.
                properties:
                  evaluation:
                    description: |-
                      Evaluation gates promotion on a golden-dataset accuracy check. When unset,
                      a candidate is promoted as soon as all its Pods are model-ready.
                    properties:
                      datasetRef:
                        description: DatasetRef points at the golden dataset (JSONL).
                        properties:
                          configMapRef:
                            description: ConfigMapRef selects a key in a ConfigMap
                              holding the JSONL dataset.
                            properties:
                              key:
                                description: Key holding the JSONL content.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the ConfigMap or Secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          secretRef:
                            description: |-
                              SecretRef selects a key in a Secret holding the JSONL dataset. The Secret
                              must carry the label decisionmodel.io/eval-dataset: "true" (opt-in guard).
                              For one release a Secret labelled only decisionmodel.io/api-key: "true" is
                              still accepted (deprecated; a Warning Event names the label to add).
                            properties:
                              key:
                                description: Key holding the JSONL content.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the ConfigMap or Secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of configMapRef or secretRef must be
                            set
                          rule: '(has(self.configMapRef) ? 1 : 0) + (has(self.secretRef)
                            ? 1 : 0) == 1'
                      maxAccuracyDrop:
                        description: |-
                          MaxAccuracyDrop is the maximum tolerated accuracy drop vs the stable
                          baseline (decimal string, e.g. "0.02"). Only enforced when a stable
                          revision exists to provide a baseline; empty means no drop constraint.
                        pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                        type: string
                      maxCases:
                        default: 500
                        description: MaxCases caps how many dataset cases are used
                          (first N).
                        format: int32
                        maximum: 5000
                        minimum: 1
                        type: integer
                      maxECE:
                        description: |-
                          MaxECE is the maximum tolerated Expected Calibration Error (decimal string
                          in [0,1], e.g. "0.10"). Empty disables the absolute ECE gate.
                        pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                        type: string
                      maxECEIncrease:
                        description: |-
                          MaxECEIncrease is the maximum tolerated ECE increase vs the stable baseline
                          (decimal string). Only enforced when a stable revision exists to provide a
                          baseline; empty disables the relative ECE gate.
                        pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                        type: string
                      minAccuracy:
                        description: |-
                          MinAccuracy is the minimum accuracy (decimal string in [0,1], e.g. "0.90")
                          the candidate must reach to be promoted.
                        pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                        type: string
                      scoreTolerance:
                        description: |-
                          ScoreTolerance is the correctness band for "score" questions (decimal
                          string): a predicted expected-value level counts as correct when it is
                          within this many levels of the golden integer level. A case may override it
                          per question via a "tolerance" map. Empty means the default (0.5, "rounds to
                          the expected level").
                        pattern: ^[0-9]+(\.[0-9]+)?$
                        type: string
                    required:
                    - datasetRef
                    - minAccuracy
                    type: object
                  manualPromotion:
                    default: false
                    description: |-
                      ManualPromotion holds a candidate that passed its gate (model-ready, plus
                      evaluation when configured) in phase AwaitingPromotion until a human
                      approves it by setting the annotation decisionmodel.io/promote to
                      status.evaluation.approvalId (or, without evaluation, the candidate's
                      revision hash for one release). The stable revision keeps serving meanwhile.
                      There is no progress timeout while waiting. The very first revision of a
                      DecisionModel (no stable revision yet) is promoted without approval, since
                      there is no traffic to protect. The approval annotation is removed once the
                      promotion has been persisted.

                      Deprecated: use promotion: Manual. manualPromotion:true keeps working as an
                      alias for promotion: Manual.
                    type: boolean
                  promotion:
                    description: |-
                      Promotion selects how a candidate that passed ModelReady is promoted:
                        - Automatic: promote as soon as the candidate is model-ready (and, when
                          evaluation is configured, has passed the gate).
                        - EvaluationGated: like Automatic but requires rollout.evaluation to be
                          set (rejected by CEL otherwise); the gate decides promotion.
                        - Manual: hold the candidate in AwaitingPromotion until a human sets the
                          annotation decisionmodel.io/promote to status.evaluation.approvalId (or,
                          without evaluation, the candidate's revision hash for one release)
                          (evaluation still runs when configured).
                      When unset the effective policy is EvaluationGated if rollout.evaluation is
                      set, else Automatic. The deprecated manualPromotion:true is an alias for
                      Manual; setting both promotion and manualPromotion:true to disagreeing
                      values is rejected by CEL.
                    enum:
                    - Automatic
                    - EvaluationGated
                    - Manual
                    type: string
                  stabilization:
                    description: |-
                      Stabilization keeps the previous revision's Deployment running (scaled to
                      its replicas, out of the Service) for this long after a promotion, so the
                      operator can switch traffic back instantly if the new stable turns out
                      unhealthy during the window. Default 5m when unset; "0" disables it (the
                      previous revision is removed after a short endpoint-gap grace, as before).
                      Must be between 1m and 24h when set to a non-zero value.
                    maxLength: 32
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be 0 or between 1m and 24h
                      rule: duration(self) == duration('0s') || (duration(self) >=
                        duration('1m') && duration(self) <= duration('24h'))
                  timeouts:
                    description: |-
                      Timeouts overrides the progress timeouts of a rollout. Unset fields keep
                      the built-in defaults. Large models (tens of GB) need more than the
                      defaults on a cold node. Not part of the revision hash; a change applies to
                      the phase timeouts immediately, but a prefetch Job that already exists keeps
                      the deadline it was created with.
                    properties:
                      caching:
                        description: |-
                          Caching bounds the Caching phase and is also used as the prefetch Job's
                          activeDeadlineSeconds. Default 30m.
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: must be between 1m and 24h
                          rule: duration(self) >= duration('1m') && duration(self)
                            <= duration('24h')
                      evaluating:
                        description: |-
                          Evaluating bounds the Evaluating phase and each golden-dataset run.
                          Default 10m.
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: must be between 1m and 24h
                          rule: duration(self) >= duration('1m') && duration(self)
                            <= duration('24h')
                      starting:
                        description: |-
                          Starting bounds the Starting phase (candidate Pods becoming model-ready)
                          and, when set, also the background model warmup on each Pod. When unset the
                          phase timeout is 10m and the warmup bound stays 2m. Default 10m.
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: must be between 1m and 24h
                          rule: duration(self) >= duration('1m') && duration(self)
                            <= duration('24h')
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'promotion: EvaluationGated requires rollout.evaluation
                    to be set'
                  rule: '!(has(self.promotion) && self.promotion == ''EvaluationGated'')
                    || has(self.evaluation)'
                - message: 'manualPromotion: true conflicts with promotion; use promotion:
                    Manual'
                  rule: '!(has(self.promotion) && has(self.manualPromotion) && self.manualPromotion)
                    || self.promotion == ''Manual'''
              runtimeVersion:
                description: |-
                  RuntimeVersion pins the engine runtime release (e.g. "0.10.0", plain
                  MAJOR.MINOR.PATCH) independently of the operator's default. Pinning it means
                  an operator upgrade that changes the default runtime image does not start a
                  rollout for this DecisionModel. Mutually exclusive with image. When unset
                  the effective version follows --runtime-version-policy.
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                type: string
              scheduling:
                description: Scheduling is a passthrough of nodeSelector/tolerations/affinity
                  for serving Pods.
                properties:
                  affinity:
                    description: Affinity constrains Pod scheduling.
                    properties:
                      nodeAffinity:
                        description: Describes node affinity scheduling rules for
                          the pod.
                        properties:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            description: |-
                              The scheduler will prefer to schedule pods to nodes that satisfy
                              the affinity expressions specified by this field, but it may choose
                              a node that violates one or more of the expressions. The node that is
                              most preferred is the one with the greatest sum of weights, i.e.
                              for each node that meets all of the scheduling requirements (resource
                              request, requiredDuringScheduling affinity expressions, etc.),
                              compute a sum by iterating through the elements of this field and adding
                              "weight" to the sum if the node matches the corresponding matchExpressions; the
                              node(s) with the highest sum are the most preferred.
                            items:
                              description: |-
                                An empty preferred scheduling term matches all objects with implicit weight 0
                                (i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).
                              properties:
                                preference:
                                  description: A node selector term, associated with
                                    the corresponding weight.
                                  properties:
                                    matchExpressions:
                                      description: A list of node selector requirements
                                        by node's labels.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
                                              array must have a single element, which will be interpreted as an integer.
                                              This array is replaced during a strategic merge patch.
                                            items:
                                              type: string
