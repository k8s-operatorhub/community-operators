      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HankoEmailProvider is a deprecated platform email configuration resource.
          Provider configuration and explicit tests now belong to the hankoShell API.
          Secret material is referenced by name and is never stored in this resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoEmailProviderSpec defines the desired email provider
              configuration.
            properties:
              enabled:
                description: Enabled is a legacy field ignored by the deprecated operator
                  controller.
                type: boolean
              fromAddress:
                description: FromAddress is the default sender address.
                format: email
                maxLength: 254
                type: string
              fromName:
                description: FromName is the default sender display name.
                maxLength: 128
                pattern: ^[^\r\n]*$
                type: string
              office365:
                description: Office365 contains Microsoft Graph application settings.
                properties:
                  clientID:
                    description: |-
                      ClientID is the Entra application UUID granted the Exchange Online
                      Application Mail.Send role scoped to Mailbox.
                    maxLength: 36
                    minLength: 36
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    type: string
                  keyVaultSecretName:
                    description: |-
                      KeyVaultSecretName is the Azure Key Vault secret containing the Entra
                      client secret. Retained only for migration; the operator no longer reads it.
                    maxLength: 127
                    minLength: 1
                    pattern: ^[0-9A-Za-z-]{1,127}$
                    type: string
                  mailbox:
                    description: Mailbox is the Microsoft 365 mailbox targeted by
                      Graph sendMail.
                    format: email
                    maxLength: 254
                    type: string
                  preflightRecipient:
                    description: PreflightRecipient is retained for migration; no
                      message is sent by the operator.
                    format: email
                    maxLength: 254
                    type: string
                  tenantID:
                    description: TenantID is the Microsoft Entra tenant UUID.
                    maxLength: 36
                    minLength: 36
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    type: string
                required:
                - clientID
                - keyVaultSecretName
                - mailbox
                - preflightRecipient
                - tenantID
                type: object
              testNonce:
                description: TestNonce is retained for migration; the operator performs
                  no delivery test.
                maxLength: 128
                type: string
              type:
                description: Type retains the legacy adapter selection; the operator
                  performs no delivery.
                enum:
                - office365
                type: string
            required:
            - enabled
            - fromAddress
            - type
            type: object
          status:
            description: HankoEmailProviderStatus describes provider validation and
              delivery state.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
