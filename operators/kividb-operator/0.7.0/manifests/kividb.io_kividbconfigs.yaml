apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/managed-by: kividb-operator
    app.kubernetes.io/name: kividb-operator
  name: kividbconfigs.kividb.io
spec:
  group: kividb.io
  names:
    kind: KividbConfig
    listKind: KividbConfigList
    plural: kividbconfigs
    shortNames:
    - kdbc
    singular: kividbconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KividbConfig is a reusable, standalone set of kividb.conf directives
          (and TLS settings). Create one and reference it by name from any number
          of KividbClusters' spec.configRef.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              directives:
                additionalProperties:
                  type: string
                description: Free-form kividb.conf directives (lower-kebab-case keys,
                  e.g. maxmemory, threads, aof, loglevel, cluster-enabled, notify-keyspace-events,
                  slowlog-log-slower-than). Do not set "replicaof", "port", or "aclfile"
                  here -- those remain operator-managed regardless of which KividbConfig
                  is referenced.
                type: object
              tls:
                description: TLS listener settings. Requires a KividbCluster with
                  spec.variant "tls" or "full".
                properties:
                  certSecretRef:
                    properties:
                      caKey:
                        description: Defaults to "ca.crt". Optional -- set only if
                          client-cert verification is desired and this key actually
                          exists in the Secret.
                        type: string
                      certKey:
                        description: Defaults to "tls.crt".
                        type: string
                      keyKey:
                        description: Defaults to "tls.key".
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    type: boolean
                  port:
                    default: 6443
                    description: TLS listener port. Defaults to 6443.
                    maximum: 65535
                    minimum: 0
                    type: integer
                required:
                - certSecretRef
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
