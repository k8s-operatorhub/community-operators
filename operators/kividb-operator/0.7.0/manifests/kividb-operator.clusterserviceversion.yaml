        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - displayName: Object key
        path: objectKey
        x-descriptors:
        - urn:alm:descriptor:text
      version: v1alpha1
  description: |
    KiviDB is a Redis-compatible in-memory database written in Rust. It
    speaks the Redis protocol (RESP), so Redis clients and `redis-cli`
    connect to it as they would to Redis. Learn more at
    [kividb.io](https://kividb.io); the engine source is at
    [github.com/kividbio/kividb](https://github.com/kividbio/kividb).

    The KiviDB Operator runs KiviDB on Kubernetes. You describe a cluster
    in a `KividbCluster` resource and the operator creates and keeps the
    StatefulSet, Services, configuration and backups that make it up.

    ## Features

    * **Replicated or sharded clusters.** One master with N replicas, or
      `spec.shards` masters each with its replicas, in KiviDB's cluster
      mode. Changing `spec.shards` moves slots between shards.
    * **Automatic failover.** An unhealthy master is replaced by the
      most caught-up replica. The `<cluster>-master` and
      `<cluster>-replicas` Services follow the new roles.
    * **Rolling engine upgrades.** A new `spec.image` rolls the
      pods replicas first and each master last, after an in-sync replica
      has taken over.
    * **Configuration and ACLs as resources.** `KividbConfig` holds
      `kividb.conf` directives and TLS settings, and `KividbAclConfig`
      holds ACL users whose passwords come from Secrets. Both can be
      shared by many clusters.
    * **Scheduled backups to S3-compatible storage** (AWS S3, MinIO, R2,
      B2, Ceph RGW and others) with retention, from the master or a
      replica, defined in a `KividbSnapshotConfig`. Every run is
      recorded as a `KividbSnapshot`, and a new cluster can start from a
      snapshot (`spec.bootstrapFromSnapshot`).
    * **Rolling restarts on request** with a `KividbDbOps` resource.
    * **Services** of type ClusterIP, NodePort or LoadBalancer for the
      master and the replicas, and Prometheus metrics through an optional
      `redis_exporter` sidecar (`spec.monitoring.enabled`).

    ## Getting started

    Create a cluster with one master and its data on a 5Gi volume:

    ```yaml
    apiVersion: kividb.io/v1alpha1
    kind: KividbCluster
    metadata:
      name: kividb-minimal
    spec:
      storage:
        size: 5Gi
    ```

    Then connect through the master Service:

    ```sh
    kubectl port-forward svc/kividb-minimal-master 6380:6380
    redis-cli -p 6380 ping
    ```

    The full field reference is in
    [CONFIGURATION.md](https://github.com/kividbio/kividb-operator/blob/v0.7.0/docs/CONFIGURATION.md),
    and backups and restores are described in
    [BACKUP_RESTORE.md](https://github.com/kividbio/kividb-operator/blob/v0.7.0/docs/BACKUP_RESTORE.md).

    ## Before you install

    * Kubernetes 1.27 or later, with a StorageClass that provisions
      ReadWriteOnce volumes for the data.
    * The operator watches all namespaces, so it is installed with an
      OperatorGroup for all namespaces.
    * Backups need an S3-compatible bucket and a Secret with its
      credentials. Prometheus scraping of the exporter needs a Prometheus
      that discovers the cluster's Services.
    * The API is `kividb.io/v1alpha1` and may change between releases.
      Read the [changelog](https://github.com/kividbio/kividb-operator/blob/v0.7.0/CHANGELOG.md)
      before an upgrade.
    * The operator's web dashboard is not part of this package. To run
      it, see [GUI.md](https://github.com/kividbio/kividb-operator/blob/v0.7.0/docs/GUI.md).

    The operator is licensed under Apache-2.0. The KiviDB engine images it
    runs are licensed under AGPL-3.0-only.
