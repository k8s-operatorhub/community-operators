  install:
    spec:
      clusterPermissions:
        - rules:
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - create
                - deletecollection
                - get
                - patch
                - update
            - apiGroups:
                - ""
              resources:
                - persistentvolumeclaims
                - serviceaccounts
                - services
              verbs:
                - create
                - patch
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - create
                - deletecollection
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - apps
              resources:
                - deployments
              verbs:
                - create
                - get
                - list
                - patch
                - watch
            - apiGroups:
                - argoproj.io
              resources:
                - applications
                - applicationsets
                - appprojects
              verbs:
                - create
                - deletecollection
                - patch
            - apiGroups:
                - dotvirt.io
              resources:
                - dotvirts
              verbs:
                - get
                - list
                - update
                - watch
            - apiGroups:
                - dotvirt.io
              resources:
                - dotvirts/finalizers
              verbs:
                - update
            - apiGroups:
                - dotvirt.io
              resources:
                - dotvirts/status
              verbs:
                - get
                - patch
                - update
            - apiGroups:
                - networking.k8s.io
              resources:
                - ingresses
              verbs:
                - create
                - patch
            - apiGroups:
                - rbac.authorization.k8s.io
              resources:
                - clusterrolebindings
              verbs:
                - create
                - deletecollection
                - patch
            - apiGroups:
                - rbac.authorization.k8s.io
              resourceNames:
                - dotvirt
                - dotvirt-argocd-apply
                - dotvirt-platform-network-admin
              resources:
                - clusterroles
              verbs:
                - bind
            - apiGroups:
                - route.openshift.io
              resources:
                - routes
              verbs:
                - create
                - get
                - list
                - patch
                - watch
            - apiGroups:
                - route.openshift.io
              resources:
                - routes/custom-host
              verbs:
                - create
                - update
          serviceAccountName: dotvirt-operator-controller
      deployments:
        - label:
            app: dotvirt-operator
          name: dotvirt-operator-controller
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: dotvirt-operator
            strategy: {}
            template:
              metadata:
                labels:
                  app: dotvirt-operator
              spec:
                containers:
                  - args:
                      - --leader-elect
                      - --health-probe-bind-address=:8081
                    env:
                      - name: RELATED_IMAGE_DOTVIRT
                        value: quay.io/epheo/dotvirt@sha256:519914426278e0809a545663af051475eb54c8b876ec40eadf9d5024527d4e9e
                      - name: RELATED_IMAGE_FORGEJO
                        value: codeberg.org/forgejo/forgejo:11-rootless@sha256:5135f11de848bea6d59c0a96688e90c361380ba102bdc08dbd5aa52cca2b179b
                    image: quay.io/epheo/dotvirt-operator@sha256:0a78ce0c8c4892fc2649455d1852bfa36f0ef07072d05d77a667b6249625e296
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        memory: 256Mi
                      requests:
                        cpu: 10m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      readOnlyRootFilesystem: true
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: dotvirt-operator-controller
                terminationGracePeriodSeconds: 10
      permissions:
        - rules:
            - apiGroups:
                - coordination.k8s.io
              resources:
                - leases
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
          serviceAccountName: dotvirt-operator-controller
    strategy: deployment
