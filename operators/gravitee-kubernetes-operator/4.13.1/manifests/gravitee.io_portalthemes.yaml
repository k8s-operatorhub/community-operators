                        most of the time because the value is ignored or...
                      items:
                        type: string
                      type: array
                  type: object
                id:
                  description: The ID of the PortalTheme in the Gravitee API Management instance
                  type: string
                organizationId:
                  description: The organization ID defined in the management context
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
