                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastExportTime:
                description: lastExportTime is when the sheet was last written.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation of the spec that
                  was last exported.
                format: int64
                type: integer
              rows:
                description: rows is the number of subnets in the sheet, excluding
                  the header.
                format: int32
                type: integer
              url:
                description: url links to the exported sheet.
                type: string
            type: object
        required:
        - spec
        type: object
