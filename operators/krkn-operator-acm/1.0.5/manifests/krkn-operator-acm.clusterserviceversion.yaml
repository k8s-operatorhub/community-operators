  apiservicedefinitions: {}
  customresourcedefinitions:
    required:
      - description: Target request shared with the Krkn Operator.
        displayName: Krkn Target Request
        kind: KrknTargetRequest
        name: krkntargetrequests.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: Provider registration shared with the Krkn Operator.
        displayName: Krkn Operator Target Provider
        kind: KrknOperatorTargetProvider
        name: krknoperatortargetproviders.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: Provider configuration shared with the Krkn Operator.
        displayName: Krkn Operator Target Provider Config
        kind: KrknOperatorTargetProviderConfig
        name: krknoperatortargetproviderconfigs.krkn.krkn-chaos.dev
        version: v1alpha1
  description: |
    Krkn Operator ACM provides optional integration with both upstream Open
    Cluster Management (OCM) and Red Hat Advanced Cluster Management (ACM).
    It discovers managed clusters and publishes target data for the Krkn
    Operator.

    Tested upstream OCM versions are 1.1.0, 1.2.0, and 1.3.1. Tested Red Hat
    ACM versions are 2.14, 2.15, and 2.16. For upstream OCM, the Managed
    ServiceAccount add-on must be installed and available on the OCM hub before
    enabling this integration. Follow the OCM Managed ServiceAccount
    installation guide linked below.

    Install the Krkn Operator package first, or install this package through
    the same catalog and let OLM satisfy its dependency automatically.
  displayName: Krkn Operator ACM
  install:
    spec:
      clusterPermissions:
        - rules:
