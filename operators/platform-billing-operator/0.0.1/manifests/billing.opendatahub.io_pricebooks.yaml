apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: pricebooks.billing.opendatahub.io
spec:
  group: billing.opendatahub.io
  names:
    kind: PriceBook
    listKind: PriceBookList
    plural: pricebooks
    singular: pricebook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.effectiveFrom
      name: Effective
      type: date
    - jsonPath: .spec.currency
      name: Currency
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PriceBook is the Schema for the pricebooks API.
          It defines the catalog of SKU rates, volume discounts, and committed-use tiers
          that govern how tenant usage is rated and invoiced.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PriceBookSpec defines the desired state of a PriceBook.
            properties:
              clientDisconnectPolicy:
                default: bill_partial
                description: |-
                  ClientDisconnectPolicy controls charging when the client disconnects mid-stream.
                  "bill_partial" (default): charge for tokens delivered before disconnect.
                  "zero_charge": no charge on client disconnect.
                enum:
                - bill_partial
                - zero_charge
                type: string
              committedUse:
                description: CommittedUse defines committed-use pricing tiers for
                  sustained throughput.
                items:
                  description: |-
                    CommittedUseTier defines a committed-use pricing tier where tenants
                    pre-commit to a sustained throughput level in exchange for a fixed monthly rate.
                  properties:
                    monthlyPrice:
                      description: MonthlyPrice is the fixed monthly price for this
                        tier as a decimal string.
                      pattern: ^\d+(\.\d{1,6})?$
                      type: string
                    name:
                      description: Name is the human-readable tier name (e.g. "starter",
                        "growth", "enterprise").
                      type: string
                    tokensPerSecond:
                      description: TokensPerSecond is the committed throughput in
                        tokens per second.
                      format: int64
                      minimum: 1
                      type: integer
                  required:
                  - monthlyPrice
                  - name
                  - tokensPerSecond
                  type: object
                type: array
              currency:
                description: Currency is the ISO 4217 currency code for all rates
                  in this PriceBook.
                enum:
                - USD
                - EUR
                - GBP
                - JPY
                - CAD
                - AUD
                - CHF
                type: string
              effectiveFrom:
                description: EffectiveFrom is the timestamp when this PriceBook becomes
                  Active.
                format: date-time
                type: string
              noticeDays:
                description: |-
                  NoticeDays is the minimum notice period (in days) tenants receive
                  before price changes take effect.
                format: int32
                minimum: 0
                type: integer
              providerFaultPolicy:
                default: zero_charge
                description: |-
                  ProviderFaultPolicy controls charging when the upstream model returns an error.
                  "zero_charge" (default): no charge for upstream failures.
                  "bill_partial": charge for any partial usage before the failure.
                enum:
                - zero_charge
                - bill_partial
                type: string
              skus:
                description: SKUs is the list of SKU pricing entries. At least one
                  SKU is required.
                items:
                  description: SKU defines pricing for a single model or product SKU.
                  properties:
                    geo:
                      description: |-
                        Geo is the geographic region this pricing applies to.
                        Empty string means this is the default rate for all regions.
                      type: string
                    passThrough:
                      description: PassThrough configures pass-through pricing derived
                        from upstream costs.
                      properties:
                        costSecretRef:
                          description: CostSecretRef references a Secret containing
                            the provider's cost data.
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                        markupPct:
                          description: |-
                            MarkupPct is the markup percentage applied on top of provider cost,
                            expressed as a decimal string (e.g. "15.0" for 15%).
                          pattern: ^\d+(\.\d{1,6})?$
                          type: string
                        provider:
                          description: Provider is the upstream provider name (e.g.
                            "openai", "anthropic").
                          type: string
                      required:
                      - costSecretRef
                      - markupPct
                      - provider
                      type: object
                    rates:
                      additionalProperties:
                        type: string
                      description: |-
                        Rates maps quantity names to decimal-string rates.
                        Keys are usage dimensions (e.g. "prompt_tokens", "completion_tokens",
                        "cached_tokens", "reasoning_tokens", "requests").
                        Values are decimal strings validated by the admission webhook.
                      type: object
                    sku:
                      description: SKU is the model or product identifier (e.g. "gpt-4o",
                        "llama-3.1-70b").
                      type: string
                    unit:
                      description: Unit is the pricing unit (e.g. "per-1M-tokens",
                        "per-gpu-hour").
                      type: string
                  required:
                  - rates
                  - sku
                  - unit
                  type: object
                minItems: 1
                type: array
              supersedes:
                description: Supersedes is the name of the prior PriceBook this one
                  replaces.
                type: string
              volumeTiers:
                description: VolumeTiers defines volume-based discount tiers applied
                  to aggregate usage.
                items:
                  description: VolumeTier defines a volume-based discount tier.
                  properties:
                    discountPct:
                      description: |-
                        DiscountPct is the discount percentage for this tier as a decimal string
                        (e.g. "10.0" for 10%).
                      pattern: ^\d+(\.\d{1,6})?$
                      type: string
                    thresholdTokens:
                      description: ThresholdTokens is the monthly token count at which
                        this tier activates.
                      format: int64
                      minimum: 0
                      type: integer
                  required:
                  - discountPct
                  - thresholdTokens
                  type: object
                type: array
            required:
            - currency
            - effectiveFrom
            - noticeDays
            - skus
            type: object
          status:
            description: PriceBookStatus defines the observed state of a PriceBook.
            properties:
              activeTenants:
                description: ActiveTenants is the count of TenantAccounts currently
                  using this PriceBook.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the PriceBook's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              grandfatheredTenants:
                description: |-
                  GrandfatheredTenants lists tenant names that are pinned to this PriceBook
                  via TenantAccount.spec.priceBookPin and will not be migrated automatically.
                items:
                  type: string
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              state:
                description: State is the current lifecycle state of this PriceBook.
                enum:
                - Draft
                - Announced
                - Active
                - Superseded
                - Retired
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
