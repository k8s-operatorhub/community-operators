apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: secretsmanagements.core.navique.com
spec:
  group: core.navique.com
  names:
    kind: SecretsManagement
    listKind: SecretsManagementList
    plural: secretsmanagements
    shortNames:
    - secmgmt
    singular: secretsmanagement
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend
      name: Backend
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecretsManagement selects and reconciles a credential backend
          for a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SecretsManagementSpec selects exactly one credential backend. Workloads in the
              same namespace bind it via secretsRef.
            properties:
              backend:
                description: Backend selects the credential source.
                enum:
                - eso
                - sealedSecrets
                type: string
              eso:
                description: |-
                  ESO configures the External Secrets Operator backend (Azure Key Vault via
                  Workload Identity). Required when backend=eso.
                properties:
                  authSecretRef:
                    description: AuthSecretRef references the client id/secret for
                      ServicePrincipal auth.
                    properties:
                      clientID:
                        description: SecretKeyRef references a Secret (optionally
                          a specific key within it).
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      clientSecret:
                        description: SecretKeyRef references a Secret (optionally
                          a specific key within it).
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - clientID
                    - clientSecret
                    type: object
                  authType:
                    default: WorkloadIdentity
                    description: |-
                      AuthType selects how the Azure SecretStore authenticates.
                      WorkloadIdentity is the production default (AKS + federated identity);
                      ServicePrincipal works anywhere (incl. Kind) using a client id/secret.
                    enum:
                    - WorkloadIdentity
                    - ServicePrincipal
                    type: string
                  clientID:
                    description: |-
                      ClientID is the client (application) ID of the Azure user-assigned managed
                      identity the workload-identity ServiceAccount federates to. Stamped onto the
                      operator-created ServiceAccount as `azure.workload.identity/client-id`, which
                      ESO reads to know which identity to exchange the SA token for. Required for
                      WorkloadIdentity unless you pre-create the ServiceAccount with that annotation.
                    type: string
                  externalSecrets:
                    description: ExternalSecrets to materialize as in-namespace K8s
                      Secrets.
                    items:
                      description: |-
                        ExternalSecretSpec maps provider secrets to a target K8s Secret. Use one of:
                          - Keys: the simple shortcut (k8sKey -> remote key/path). For Azure the value
                            is the KV secret name; for HashiCorp Vault KV-v2 the value is the path and
                            the K8s key is used as the property.
                          - Data: explicit per-key remoteRef (key/property/version) — provider-agnostic,
                            needed for AWS/GCP/etc. where property or version matter.
                          - FindRegexp: bulk dataFrom.find by name.
                      properties:
                        data:
                          description: Data is the explicit remoteRef form for full
                            control on any provider.
                          items:
                            description: ExternalSecretRemote is one explicit remoteRef
                              mapping (ESO data[] entry).
                            properties:
                              property:
                                description: Property is the field within the remote
                                  secret (remoteRef.property).
                                type: string
                              remoteKey:
                                description: RemoteKey is the provider's secret key/path
                                  (remoteRef.key).
                                type: string
                              secretKey:
                                description: SecretKey is the target key in the K8s
                                  Secret.
                                type: string
                              version:
                                description: Version is the remote secret version
                                  (remoteRef.version).
                                type: string
                            required:
                            - remoteKey
                            - secretKey
                            type: object
                          type: array
                        findRegexp:
                          description: FindRegexp pulls every matching secret (dataFrom.find).
                          type: string
                        keys:
                          additionalProperties:
                            type: string
                          description: Keys maps target Secret keys to provider remote
                            keys/paths.
                          type: object
                        name:
                          description: Name is the target K8s Secret name.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  hashicorpVault:
                    description: HashiCorpVault configures the Vault provider (provider=hashicorpVault).
                    properties:
                      auth:
                        description: |-
                          VaultAuth selects a Vault auth method: exactly one of kubernetes
                          (recommended in-cluster), appRole (common on-prem) or tokenSecretRef.
                        properties:
                          appRole:
                            description: |-
                              AppRole configures Vault AppRole auth: a role ID plus a secret ID kept in
                              a Secret.
                            properties:
                              path:
                                default: approle
                                description: Path is where the AppRole auth method
                                  is mounted in Vault.
                                type: string
                              roleId:
                                description: RoleID is the AppRole role ID (not a
                                  secret).
                                minLength: 1
                                type: string
                              secretIdSecretRef:
                                description: |-
                                  SecretIDSecretRef names the Secret holding the AppRole secret ID. Key
                                  defaults to "secret-id".
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  namespace:
                                    type: string
                                required:
                                - name
                                type: object
                            required:
                            - roleId
                            - secretIdSecretRef
                            type: object
                          kubernetes:
                            description: Kubernetes configures Vault Kubernetes auth
                              (production-sane).
                            properties:
                              mountPath:
                                default: kubernetes
                                type: string
                              role:
                                type: string
                              serviceAccountName:
                                description: |-
                                  ServiceAccountName is the SA whose token authenticates to Vault — the one
                                  the Vault role is bound to. The operator creates it if it does not exist
                                  (an existing one is used untouched). Empty = ESO's own ServiceAccount.
                                type: string
                            required:
                            - role
                            type: object
                          tokenSecretRef:
                            description: TokenSecretRef references a Secret holding
                              a Vault token (dev/e2e).
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: 'set exactly one Vault auth method: kubernetes,
                            appRole or tokenSecretRef'
                          reason: FieldValueInvalid
                          rule: '[has(self.tokenSecretRef), has(self.kubernetes),
                            has(self.appRole)].filter(x, x).size() == 1'
                      caSecretRef:
                        description: |-
                          CASecretRef names a same-namespace Secret holding the PEM certificate of
                          the CA that signed the Vault server's TLS certificate — needed when Vault
                          uses a private CA (common on-prem). Key defaults to "ca.crt".
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      namespace:
                        description: |-
                          Namespace is the Vault Enterprise namespace to read from (e.g. "team-a").
                          Leave empty for open-source Vault.
                        type: string
                      path:
                        default: secret
                        description: Path is the KV mount path (e.g. "secret").
                        type: string
                      server:
                        description: Server is the Vault address, e.g. http://vault.vault.svc:8200.
                        type: string
                      version:
                        default: v2
                        description: Version is the KV engine version.
                        enum:
                        - v1
                        - v2
                        type: string
                    required:
                    - auth
                    - server
                    type: object
                  provider:
                    default: azureKeyVault
                    description: |-
                      Provider selects the ESO SecretStore provider. azureKeyVault and
                      hashicorpVault have typed convenience config; "raw" + providerConfig support
                      ANY ESO provider (AWS, GCP, IBM, Akeyless, 1Password, Kubernetes, Fake, …)
                      by passing the ESO spec.provider block through verbatim.
                    enum:
                    - azureKeyVault
                    - hashicorpVault
                    - raw
                    type: string
                  providerConfig:
                    description: |-
                      ProviderConfig is the raw ESO SecretStore `spec.provider` block, used when
                      provider=raw. It is injected verbatim, so every ESO provider is supported
                      without per-provider code. Example: {"aws":{"service":"SecretsManager", …}}.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  refreshInterval:
                    description: RefreshInterval defaults to 1h when unset.
                    type: string
                  serviceAccountName:
                    description: |-
                      ServiceAccountName is the workload-identity ServiceAccount ESO authenticates
                      as (provider=azureKeyVault, authType=WorkloadIdentity). The operator creates
                      this ServiceAccount if it does not already exist (annotated with the
                      azure.workload.identity client-id/tenant-id below so ESO can request a token);
                      a pre-existing ServiceAccount is adopted untouched. Required for
                      WorkloadIdentity.
                    type: string
                  tenantID:
                    description: |-
                      TenantID is the Azure AD tenant. Required when authType=ServicePrincipal; for
                      WorkloadIdentity it is stamped onto the operator-created ServiceAccount as
                      `azure.workload.identity/tenant-id` (optional — ESO defaults to the cluster's).
                    type: string
                  vaultURL:
                    description: |-
                      VaultURL is the Azure Key Vault URL (provider=azureKeyVault),
                      e.g. https://kv.vault.azure.net/.
                    type: string
                type: object
              sealedSecrets:
                description: |-
                  SealedSecrets configures the Sealed Secrets backend. Required when
                  backend=sealedSecrets.
                properties:
                  controllerNamespace:
                    description: |-
                      ControllerNamespace optionally overrides where the controller is expected;
                      the platformdeps default is used otherwise.
                    type: string
                type: object
            required:
            - backend
            type: object
          status:
            description: SecretsManagementStatus reports backend readiness.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              materializedSecrets:
                description: MaterializedSecrets lists the K8s Secret names produced
                  by this backend.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
