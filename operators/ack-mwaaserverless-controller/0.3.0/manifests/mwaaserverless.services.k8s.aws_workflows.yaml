                description: |-
                  The configuration for workflow logging. Specifies the CloudWatch log group
                  where workflow execution logs are stored. Amazon Managed Workflows for Apache
                  Airflow Serverless automatically exports worker logs and task-level information
                  to the specified log group in your account using remote logging functionality.
                  This provides comprehensive observability for debugging and monitoring workflow
                  execution across the distributed, serverless environment.
                properties:
                  logGroupName:
                    type: string
                type: object
              name:
                description: |-
                  The name of the workflow. You must use unique workflow names within your
                  Amazon Web Services account. The service generates a unique identifier that
                  is appended to ensure temporal uniqueness across the account lifecycle.

                  Regex Pattern: `^[a-zA-Z0-9]+[a-zA-Z0-9\.\-_]*$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              networkConfiguration:
                description: |-
                  Network configuration for the workflow execution environment, including VPC
                  security groups and subnets for secure network access. When specified, Amazon
                  Managed Workflows for Apache Airflow Serverless deploys ECS worker tasks
                  in your customer VPC to provide secure connectivity to your resources. If
                  not specified, tasks run in the service's default worker VPC with network
                  isolation from other customers. This configuration enables secure access
                  to VPC-only resources like RDS databases or private endpoints.
                properties:
                  securityGroupIDs:
