apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openshellworkspaces.openshell.denegra.ai
spec:
  group: openshell.denegra.ai
  names:
    kind: OpenShellWorkspace
    listKind: OpenShellWorkspaceList
    plural: openshellworkspaces
    singular: openshellworkspace
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Deployed
          type: string
          jsonPath: .status.conditions[?(@.type=='Deployed')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            Prepares this namespace for OpenShell sandboxes in operator workspace mode: the sandbox
            ServiceAccount, the gateway's Role and RoleBinding here, and the SSH ingress
            NetworkPolicy. spec holds the values of the upstream openshell-workspace Helm chart.
            The namespace also needs the label the gateway's operatorNamespaceLabel selects.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Values of the upstream openshell-workspace Helm chart.
              type: object
              default: {}
              x-kubernetes-preserve-unknown-fields: true
              properties:
                gateway:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    allowDriverConfig:
                      description: Keep equal to the gateway's server.drivers.kubernetes.allowDriverConfig.
                      type: boolean
                    serviceAccount:
                      description: The gateway's ServiceAccount, which gets sandbox rights in this namespace.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                    networkPolicy:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        podSelector:
                          description: Labels of the gateway pods allowed to reach sandbox SSH.
                          type: object
                          additionalProperties:
                            type: string
                sandboxServiceAccount:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    create:
                      type: boolean
                    name:
                      type: string
                networkPolicy:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    enabled:
                      description: Allow SSH into sandbox pods only from the gateway pods.
                      type: boolean
                      default: true
            status:
              description: Set by the operator (helm-operator) after each reconcile.
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                conditions:
                  description: Initialized, Deployed, ReleaseFailed, Irreconcilable.
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                deployedRelease:
                  description: The Helm release now deployed.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    name:
                      type: string
                    manifest:
                      type: string
