apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "kividb.io/v1alpha1",
          "kind": "KividbAclConfig",
          "metadata": {
            "name": "kividb-full-acl"
          },
          "spec": {
            "users": [
              {
                "channelPatterns": [
                  "\u0026*"
                ],
                "commandRules": [
                  "+@all"
                ],
                "enabled": true,
                "keyPatterns": [
                  "~*"
                ],
                "name": "default",
                "passwordSecretRef": {
                  "key": "default-password",
                  "name": "kividb-full-user-passwords"
                }
              },
              {
                "channelPatterns": [
                  "\u0026app:*"
                ],
                "commandRules": [
                  "+@all",
                  "-flushall",
                  "-flushdb",
                  "-config",
                  "-shutdown"
                ],
                "enabled": true,
                "keyPatterns": [
                  "~app:*",
                  "~session:*"
                ],
                "name": "app",
                "passwordSecretRef": {
                  "key": "app-password",
                  "name": "kividb-full-user-passwords"
                }
              }
            ]
          }
        },
        {
          "apiVersion": "kividb.io/v1alpha1",
          "kind": "KividbCluster",
          "metadata": {
            "name": "kividb-minimal"
          },
          "spec": {
            "storage": {
              "size": "5Gi"
            }
          }
        },
        {
          "apiVersion": "kividb.io/v1alpha1",
          "kind": "KividbConfig",
          "metadata": {
            "name": "kividb-full-config"
          },
          "spec": {
            "directives": {
              "aof": "yes",
              "loglevel": "notice",
              "maxmemory": "1gb",
              "maxmemory-policy": "allkeys-lru",
              "notify-keyspace-events": "KEA",
              "slowlog-log-slower-than": "10000",
              "threads": "4"
            }
          }
        },
        {
          "apiVersion": "kividb.io/v1alpha1",
          "kind": "KividbConfig",
          "metadata": {
            "name": "kividb-tls-config"
          },
          "spec": {
            "directives": {
              "threads": "4"
            },
            "tls": {
              "certSecretRef": {
                "certKey": "tls.crt",
                "keyKey": "tls.key",
                "name": "kividb-tls-certs"
              },
              "enabled": true,
              "port": 6443
            }
          }
        },
        {
          "apiVersion": "kividb.io/v1alpha1",
          "kind": "KividbDbOps",
          "metadata": {
            "name": "kividb-minimal-restart"
          },
          "spec": {
            "clusterRef": {
              "name": "kividb-minimal"
            },
            "op": "restart",
            "restart": {
              "method": "InPlace"
            }
          }
        },
        {
          "apiVersion": "kividb.io/v1alpha1",
          "kind": "KividbSnapshotConfig",
          "metadata": {
            "name": "kividb-full-hourly-backup"
          },
          "spec": {
            "jobResources": {
              "limits": {
                "cpu": "250m",
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              }
            },
            "retention": 24,
            "s3": {
              "bucket": "kividb-backups",
              "credentialsSecretRef": {
                "accessKeyIdKey": "accessKeyId",
                "name": "kividb-full-s3-credentials",
                "secretAccessKeyKey": "secretAccessKey"
              },
              "endpoint": "https://minio.storage.svc.cluster.local:9000",
              "forcePathStyle": true,
              "insecureSkipTLSVerify": false,
              "pathPrefix": "prod/kividb-full",
              "region": "us-east-1"
            },
            "schedule": "0 * * * *",
            "source": "master",
            "timeoutSeconds": 900
          }
        }
      ]
