                  jwtLitellmRoleMap:
                    description: |-
                      JWTLiteLLMRoleMap maps a JWT role to a LiteLLM user role (proxy_admin,
                      internal_user, ...), with wildcard support. Rendered as
                      jwt_litellm_role_map.
                    items:
                      description: JWTLiteLLMRoleMapEntry maps a JWT role to a LiteLLM
                        user role.
                      properties:
                        jwtRole:
                          description: JWT role value (e.g. "ADMIN").
                          type: string
                        litellmRole:
                          description: LiteLLM user role (e.g. "proxy_admin", "internal_user").
                          type: string
                      required:
                      - jwtRole
                      - litellmRole
                      type: object
                    type: array
                  objectIdJwtField:
                    description: |-
                      ObjectIDJWTField is the JWT claim holding an object id — either a user or
                      a team id, inferred from the role mapping.
                    type: string
                  oidcUserinfoCacheTtl:
                    type: integer
