      deployments:
        - label:
            app.kubernetes.io/component: console
            app.kubernetes.io/instance: krkn-operator
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: krkn-operator
            app.kubernetes.io/version: v1.0.0-beta
            helm.sh/chart: krkn-operator-0.1.0
          name: krkn-operator-console
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/component: console
                app.kubernetes.io/instance: krkn-operator
                app.kubernetes.io/name: krkn-operator
            strategy: {}
            template:
              metadata:
                labels:
                  app.kubernetes.io/component: console
                  app.kubernetes.io/instance: krkn-operator
                  app.kubernetes.io/name: krkn-operator
              spec:
                containers:
                  - image: krkn-chaos.docker.scarf.sh/krkn-chaos/krkn-operator-console:v1.0.0@sha256:acf2e3e7d07dc9324f057ee7db2b55f910739cb607e13a852bb45b23f149cad6
                    imagePullPolicy: Always
                    livenessProbe:
                      failureThreshold: 3
                      httpGet:
                        path: /
                        port: 8080
                        scheme: HTTP
                      initialDelaySeconds: 10
                      periodSeconds: 30
                      successThreshold: 1
                      timeoutSeconds: 3
                    name: console
                    ports:
                      - containerPort: 8080
                        name: http
                        protocol: TCP
                    readinessProbe:
                      failureThreshold: 3
                      httpGet:
                        path: /
                        port: 8080
                        scheme: HTTP
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      successThreshold: 1
                      timeoutSeconds: 3
                    resources:
                      limits:
                        cpu: 200m
                        memory: 256Mi
                      requests:
                        cpu: 50m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - mountPath: /etc/nginx/nginx.conf
                        name: nginx-config
                        readOnly: true
                        subPath: nginx.conf
                securityContext:
                  fsGroup: 101
                  runAsNonRoot: true
                  runAsUser: 101
                  seccompProfile:
                    type: RuntimeDefault
                volumes:
                  - configMap:
                      name: krkn-operator-console-nginx
                    name: nginx-config
        - label:
            app.kubernetes.io/component: operator
            app.kubernetes.io/instance: krkn-operator
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: krkn-operator
            app.kubernetes.io/version: v1.0.0-beta
            control-plane: controller-manager
            helm.sh/chart: krkn-operator-0.1.0
          name: krkn-operator-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/component: operator
                app.kubernetes.io/instance: krkn-operator
                app.kubernetes.io/name: krkn-operator
                control-plane: controller-manager
            strategy: {}
            template:
              metadata:
                labels:
                  app.kubernetes.io/component: operator
                  app.kubernetes.io/instance: krkn-operator
                  app.kubernetes.io/name: krkn-operator
                  control-plane: controller-manager
              spec:
                containers:
                  - args:
                      - --leader-elect
                      - --health-probe-bind-address=:8081
                      - --metrics-bind-address=:8443
                      - --metrics-secure=true
                      - --api-port=8080
                      - --grpc-server-address=localhost:50051
                    command:
                      - /manager
                    env:
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                      - name: JWT_SECRET
                        valueFrom:
                          secretKeyRef:
                            key: jwt-secret
                            name: krkn-operator-jwt
                      - name: JWT_EXPIRY_HOURS
                        value: "24"
                    image: quay.io/krkn-chaos/krkn-operator:v1.0.4@sha256:9212e63e2b1a415845102807b2c9b0c22fb82b9ea71e15cf67ad305c54934f4d
                    imagePullPolicy: Always
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    ports:
                      - containerPort: 8080
                        name: http
                        protocol: TCP
                      - containerPort: 8443
                        name: https
                        protocol: TCP
                      - containerPort: 8081
                        name: health
                        protocol: TCP
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 500m
                        memory: 512Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                  - image: quay.io/krkn-chaos/krkn-operator-data-provider:v1.0.4@sha256:c54cee73497731614e727483abafefd7f7c346d23215425c22c6d310dbd1aa63
                    imagePullPolicy: Always
                    livenessProbe:
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      tcpSocket:
                        port: grpc
                    name: data-provider
                    ports:
                      - containerPort: 50051
                        name: grpc
                        protocol: TCP
                    readinessProbe:
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      tcpSocket:
                        port: grpc
                    resources:
                      limits:
                        cpu: 200m
                        memory: 256Mi
                      requests:
                        cpu: 50m
                        memory: 128Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                initContainers:
                  - args:
                      - --bootstrap-resources
                    command:
                      - /manager
                    env:
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                      - name: KRKN_OLM_OPENSHIFT
                        value: "false"
                    image: quay.io/krkn-chaos/krkn-operator:v1.0.4@sha256:9212e63e2b1a415845102807b2c9b0c22fb82b9ea71e15cf67ad305c54934f4d
                    imagePullPolicy: Always
                    name: olm-bootstrap-resources
                    resources: {}
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: krkn-operator
