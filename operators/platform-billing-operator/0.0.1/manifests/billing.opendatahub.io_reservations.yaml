            properties:
              class:
                description: |-
                  Class determines the reservation tier.
                  Guaranteed: capacity is protected from preemption, billed regardless of utilization.
                  Preemptible: capacity may be reclaimed when Guaranteed demand exceeds supply.
                enum:
                - Guaranteed
                - Preemptible
                type: string
              count:
