spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: FlowRun is an execution instance of a Flow, created by a gateway
        when a trigger fires.
      displayName: Flow Run
      kind: FlowRun
      name: flowruns.automation.kubezap.io
      resources:
      - kind: FlowRun
        name: ""
        version: v1alpha1
      specDescriptors:
      - description: |-
          Reference to the Flow to execute. The Flow must be in the same namespace as the FlowRun.
          Cross-namespace FlowRefs are not supported in v1alpha1 and are deferred to v1beta1 with a FlowGrant CRD.
        displayName: Flow Reference
        path: flowRef
      - description: Optional runtime parameters.
        displayName: Parameters
        path: params
      - description: Originating trigger reference.
        displayName: Trigger Reference
        path: triggerRef
      - description: TTL for cleanup after completion.
        displayName: TTL After Finished
        path: ttlAfterFinished
      version: v1alpha1
    - description: Flow defines an ordered workflow of steps with conditional logic
        and data transforms.
      displayName: Flow
      kind: Flow
      name: flows.automation.kubezap.io
      resources:
      - kind: Flow
        name: ""
        version: v1alpha1
      specDescriptors:
      - description: Parameters that can be passed into the Flow.
        displayName: Parameters
        path: params
      - description: Ordered list of steps in the Flow.
        displayName: Steps
        path: steps
      version: v1alpha1
    - description: Integration connects KubeZap to an external system (Kafka, plugin,
        etc.).
      displayName: Integration
      kind: Integration
      name: integrations.automation.kubezap.io
      resources:
      - kind: Deployment
        name: ""
        version: v1
      - kind: Role
        name: ""
        version: v1
      - kind: RoleBinding
        name: ""
        version: v1
      - kind: Service
        name: ""
        version: v1
      - kind: ServiceAccount
        name: ""
        version: v1
      specDescriptors:
      - description: AMQP specific configuration. Required when type=amqp.
        displayName: AMQP
        path: amqp
      - description: HTTP specific configuration. Required when type=http.
        displayName: HTTP
        path: http
      - description: Kafka specific configuration. Required when type=kafka.
        displayName: Kafka
        path: kafka
      - description: NATS specific configuration. Required when type=nats.
        displayName: NATS
        path: nats
      - description: Plugin specific configuration. Required when type=plugin.
        displayName: Plugin
        path: plugin
      - description: |-
          Integration type.
          kafka: first-party Kafka gateway (IBM/sarama).
          amqp: first-party AMQP gateway; covers RabbitMQ, ActiveMQ, Solace, Azure Service Bus.
            Use spec.amqp.version to select 0-9-1 or 1.0 wire protocol.
          nats: first-party NATS gateway; supports Core and JetStream.
          plugin: community or custom image implementing the KubeZap plugin contract.
            See docs/api/plugin-contract.md.
          http: lightweight HTTP endpoint with base URL, auth, and default headers.
        displayName: Type
        path: type
      version: v1alpha1
    - description: |-
        Trigger connects an event source (webhook, cron, Kafka, AMQP, NATS, or a
        Kubernetes resource event) to a Flow, creating a FlowRun each time it fires.
      displayName: Trigger
      kind: Trigger
      name: triggers.automation.kubezap.io
      resources:
      - kind: Deployment
        name: ""
        version: v1
      - kind: HorizontalPodAutoscaler
        name: ""
        version: v2
      - kind: Role
        name: ""
        version: v1
      - kind: RoleBinding
        name: ""
        version: v1
      - kind: Service
        name: ""
        version: v1
      - kind: ServiceAccount
        name: ""
        version: v1
      specDescriptors:
      - description: Type of trigger (webhook, cron, kafka, amqp, nats, resource)
        displayName: Type
        path: type
      - description: Webhook configuration (only for type=webhook)
        displayName: Webhook
        path: webhook
      - description: Reference to the flow this trigger invokes.
        displayName: Flow Reference
        path: flowRef
      version: v1alpha1
    - description: |-
        WebhookGatewayConfig is the Schema for the webhookgatewayconfigs API.

        At most one WebhookGatewayConfig may exist per namespace. This is enforced
        by requiring the object be named "default" (see the XValidation rule
        above) rather than by an admission webhook — Kubernetes' own
        per-(namespace, name) uniqueness in etcd then makes "at most one" hold
        unconditionally, with no dependency on webhook/cert infrastructure being
        deployed or healthy. See docs/design/webhookgatewayconfig-singleton-name.md.
      displayName: Webhook Gateway Config
      kind: WebhookGatewayConfig
      name: webhookgatewayconfigs.automation.kubezap.io
      resources:
      - kind: HorizontalPodAutoscaler
        name: ""
        version: v2
      - kind: PodDisruptionBudget
        name: ""
        version: v1
      specDescriptors:
      - description: |-
          HPA overrides the webhook gateway's HorizontalPodAutoscaler behavior.
          Any field left unset keeps today's operator default for that field
          (minReplicas=1, maxReplicas=10, targetCPUUtilization=70).
        displayName: HPA
        path: hpa
      - description: |-
          PodDisruptionBudget configures a PodDisruptionBudget for the webhook
          gateway Deployment. When omitted (or MinAvailable is unset), no
          PodDisruptionBudget is created — matching today's behavior (none exists).
        displayName: Pod Disruption Budget
        path: podDisruptionBudget
      - description: |-
          TLS configures inbound TLS/mTLS termination for the webhook gateway.
          When omitted, the gateway serves plain HTTP.
        displayName: TLS
        path: tls
      version: v1alpha1
  description: |
    KubeZap is an enterprise-grade Kubernetes operator providing declarative
    workflow automation.

    ## Features

    - **Webhook triggers**: Expose HTTP endpoints that fire workflows on incoming
      requests with HMAC, bearer token, OIDC/JWT, API-key, mTLS, and IP-allowlist
      authentication.
    - **Cron triggers**: Schedule workflow executions using standard cron expressions.
    - **Kafka triggers**: Consume from Kafka topics and create a FlowRun per message
      with partition/offset dedup keys.
    - **CEL conditions**: Per-step `when` expressions with full access to trigger
      payload and upstream step results.
    - **Data transforms**: `type: transform` steps for payload shaping between steps.
    - **Retry policies**: Configurable per-step exponential backoff.
    - **Plugin integrations**: Operator-managed plugin Deployments with automatic
      RBAC and secret injection.
    - **Observability**: Prometheus metrics, OpenTelemetry traces, and structured JSON
      access logs out of the box.

    ## Multi-namespace support

    Set `WATCH_NAMESPACES` on the operator Deployment:
    - Empty (default) — AllNamespaces
    - Single value — OwnNamespace / SingleNamespace
    - Comma-separated — MultiNamespace

    ## Resource Trigger RBAC Note

    In AllNamespaces mode, `type: resource` triggers (alpha) watch arbitrary Kubernetes
    resource kinds. The controller ServiceAccount must have `get`, `list`, and `watch`
    permissions on each target resource type. These permissions are NOT included in the
    default RBAC — users must grant them explicitly via an additional ClusterRole or Role.
