
name: Operator Workflow Complete

on:
  workflow_run:
    workflows: ["Operator test"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  OPP_PRODUCTION_TYPE: "k8s"


jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate triggering pull request
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { resolveTrustedPullRequest } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/workflow-run-security.js`
            );
            const result = await resolveTrustedPullRequest({
              github,
              context,
              expectedWorkflowName: "Operator test",
            });
            core.setOutput("pr", result.number);
            core.setOutput("head_sha", result.headSha);
    outputs:
      pr: "${{ steps.validate.outputs.pr }}"
      head_sha: "${{ steps.validate.outputs.head_sha }}"

  post-comments:
    runs-on: ubuntu-latest
    if: needs.pr.result == 'success'
    needs: [pr]
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: 'Download and post PR comments from artifacts'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
          RUN_ID: "${{ github.event.workflow_run.id }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { postWorkflowComments } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/workflow-run-security.js`
            );
            await postWorkflowComments({
              github,
              context,
              prNumber: Number(process.env.PR),
              runId: Number(process.env.RUN_ID),
              workspace: process.env.GITHUB_WORKSPACE,
            });

  on-success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && needs.pr.result == 'success'
    needs: [pr]
    steps:

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: pr-labels
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: | 
            const labels = await github.rest.issues.listLabelsOnIssue({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            return labels.data

      - name: "Setting package-validated label"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.addLabels({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['package-validated']
            })
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: |
          (!contains(fromJson(steps.pr-labels.outputs.result).*.name, 'do-not-merge/work-in-progress')) &&
          (!contains(fromJson(steps.pr-labels.outputs.result).*.name, 'do-not-merge/hold'))
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{ secrets.FRAMEWORK_MERGE }}
          script: |
            github.rest.issues.createComment({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '/merge possible'
            })

      - name: "Set installation-validated"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.addLabels({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['installation-validated']
            })
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: |
          (!contains(fromJson(steps.pr-labels.outputs.result).*.name, 'do-not-merge/work-in-progress')) &&
          (!contains(fromJson(steps.pr-labels.outputs.result).*.name, 'do-not-merge/hold'))
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{ secrets.FRAMEWORK_MERGE }}
          script: |
            github.rest.issues.createComment({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '/merge possible'
            })

  on-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && needs.pr.result == 'success'
    needs: [pr]
    steps:
      - name: "Removing package-validated label"
        if: needs.pr.outputs.pr != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.removeLabel({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'package-validated'
            })
      - name: "Removing installation-validated label"
        if: needs.pr.outputs.pr != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          PR: "${{ needs.pr.outputs.pr }}"
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.removeLabel({
              issue_number: process.env.PR,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'installation-validated'
            })
