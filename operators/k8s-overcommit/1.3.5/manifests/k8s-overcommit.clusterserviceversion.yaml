      version: v1alphav1
    - kind: Overcommit
      name: overcommits.overcommit.inditex.dev
      version: v1alphav1
  description: |
    The K8s Overcommit Operator manages pod resource overcommit on Kubernetes clusters.
    It rewrites container requests at admission time as ratio x limit, driven by
    declarative OvercommitClass resources, so the scheduler can pack more workloads per
    node without touching the limits that protect the node.

    ### Features
    - Overcommit classes with per-class CPU and memory ratios, namespace exclusions, node selectors and tolerations.
    - One mutating webhook per class, generated and reconciled by the operator itself.
    - Default class for namespace-level opt-in through a single label.
    - Idempotent mutation: pods already processed by a class are skipped on re-admission.

    ### Prerequisites
    - cert-manager is mandatory: the operator issues a Certificate and an Issuer for every overcommit class, and without them the generated mutating webhooks never get a serving certificate. The bundle declares it as an OLM dependency on cert-manager.io/v1 (Certificate, Issuer), so OLM installs cert-manager when no operator provides that API.
    - The operator installs cluster-wide (AllNamespaces) and creates MutatingWebhookConfigurations.
