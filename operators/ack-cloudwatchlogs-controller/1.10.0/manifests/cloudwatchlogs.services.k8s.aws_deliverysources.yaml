  name: deliverysources.cloudwatchlogs.services.k8s.aws
spec:
  group: cloudwatchlogs.services.k8s.aws
  names:
    kind: DeliverySource
    listKind: DeliverySourceList
    plural: deliverysources
    singular: deliverysource
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DeliverySource is the Schema for the DeliverySources API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DeliverySourceSpec defines the desired state of DeliverySource.

              This structure contains information about one delivery source in your account.
              A delivery source is an Amazon Web Services resource that sends logs to an
              Amazon Web Services destination. The destination can be CloudWatch Logs,
              Amazon S3, or Firehose.

              Only some Amazon Web Services services support being configured as a delivery
              source. These services are listed as Supported [V2 Permissions] in the table
              at Enabling logging from Amazon Web Services services. (https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AWS-logs-and-resource-policy.html)

              To configure logs delivery between a supported Amazon Web Services service
              and a destination, you must do the following:

                 * Create a delivery source, which is a logical object that represents
                 the resource that is actually sending the logs. For more information,
                 see PutDeliverySource (https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliverySource.html).

                 * Create a delivery destination, which is a logical object that represents
                 the actual delivery destination. For more information, see PutDeliveryDestination
                 (https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliveryDestination.html).

                 * If you are delivering logs cross-account, you must use PutDeliveryDestinationPolicy
                 (https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliveryDestinationPolicy.html)
                 in the destination account to assign an IAM policy to the destination.
                 This policy allows delivery to that destination.

                 * Create a delivery by pairing exactly one delivery source and one delivery
                 destination. For more information, see CreateDelivery (https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_CreateDelivery.html).

              You can configure a single delivery source to send logs to multiple destinations
              by creating multiple deliveries. You can also create multiple deliveries
              to configure multiple delivery sources to send logs to the same delivery
              destination.
            properties:
              logType:
                description: |-
                  Defines the type of log that the source is sending.

                     * For Amazon Bedrock Agents, the valid values are APPLICATION_LOGS and
                     EVENT_LOGS.

                     * For Amazon Bedrock Knowledge Bases, the valid value is APPLICATION_LOGS.

                     * For Amazon Bedrock AgentCore Runtime, the valid values are APPLICATION_LOGS,
                     USAGE_LOGS and TRACES.

                     * For Amazon Bedrock AgentCore Tools, the valid values are APPLICATION_LOGS,
                     USAGE_LOGS and TRACES.

                     * For Amazon Bedrock AgentCore Identity, the valid values are APPLICATION_LOGS
                     and TRACES.

                     * For Amazon Bedrock AgentCore Memory, the valid values are APPLICATION_LOGS
                     and TRACES.

                     * For Amazon Bedrock AgentCore Gateway, the valid values are APPLICATION_LOGS
                     and TRACES.

                     * For CloudFront, the valid value is ACCESS_LOGS.

                     * For Amazon CodeWhisperer, the valid value is EVENT_LOGS.

                     * For Elemental MediaPackage, the valid values are EGRESS_ACCESS_LOGS
                     and INGRESS_ACCESS_LOGS.

                     * For Elemental MediaTailor, the valid values are AD_DECISION_SERVER_LOGS,
                     MANIFEST_SERVICE_LOGS, and TRANSCODE_LOGS.

                     * For Amazon EKS Auto Mode, the valid values are AUTO_MODE_BLOCK_STORAGE_LOGS,
                     AUTO_MODE_COMPUTE_LOGS, AUTO_MODE_IPAM_LOGS, and AUTO_MODE_LOAD_BALANCING_LOGS.

                     * For Entity Resolution, the valid value is WORKFLOW_LOGS.

                     * For IAM Identity Center, the valid value is ERROR_LOGS.

                     * For Network Firewall Proxy, the valid values are ALERT_LOGS, ALLOW_LOGS,
                     and DENY_LOGS.

                     * For Network Load Balancer, the valid value is NLB_ACCESS_LOGS.

                     * For PCS, the valid values are PCS_SCHEDULER_LOGS and PCS_JOBCOMP_LOGS.

                     * For Quick, the valid values are CHAT_LOGS and FEEDBACK_LOGS.

                     * For Amazon Web Services RTB Fabric, the valid values is APPLICATION_LOGS.

                     * For Amazon Q, the valid values are EVENT_LOGS and SYNC_JOB_LOGS.

                     * For Amazon SES mail manager, the valid values are APPLICATION_LOGS and
                     TRAFFIC_POLICY_DEBUG_LOGS.

                     * For Amazon WorkMail, the valid values are ACCESS_CONTROL_LOGS, AUTHENTICATION_LOGS,
                     WORKMAIL_AVAILABILITY_PROVIDER_LOGS, WORKMAIL_MAILBOX_ACCESS_LOGS, and
                     WORKMAIL_PERSONAL_ACCESS_TOKEN_LOGS.

                     * For Amazon VPC Route Server, the valid value is EVENT_LOGS.

                  Regex Pattern: `^[\w]*$`
                type: string
              name:
                description: |-
                  A name for this delivery source. This name must be unique for all delivery
                  sources in your account.

                  Regex Pattern: `^[\w-]*$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              resourceARN:
                description: |-
                  The ARN of the Amazon Web Services resource that is generating and sending
                  logs. For example, arn:aws:workmail:us-east-1:123456789012:organization/m-1234EXAMPLEabcd1234abcd1234abcd1234
                type: string
              tags:
                additionalProperties:
                  type: string
                description: |-
                  An optional list of key-value pairs to associate with the resource.

                  For more information about tagging, see Tagging Amazon Web Services resources
                  (https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html)
                type: object
            required:
            - logType
            - name
            - resourceARN
            type: object
          status:
            description: DeliverySourceStatus defines the observed state of DeliverySource
            properties:
              ackResourceMetadata:
                description: |-
                  All CRs managed by ACK have a common `Status.ACKResourceMetadata` member
                  that is used to contain resource sync state, account ownership,
                  constructed ARN for the resource
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              resourceARNs:
                description: |-
                  This array contains the ARN of the Amazon Web Services resource that sends
                  logs and is represented by this delivery source. Currently, only one ARN
                  can be in the array.
                items:
                  type: string
                type: array
              service:
                description: |-
                  The Amazon Web Services service that is sending logs.

                  Regex Pattern: `^[\w_-]*$`
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
