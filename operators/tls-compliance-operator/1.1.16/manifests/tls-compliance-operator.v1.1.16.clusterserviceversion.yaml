apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "security.telco.openshift.io/v1alpha1",
          "kind": "TLSComplianceReport",
          "metadata": {
            "name": "example-service-443-abc12345"
          },
          "spec": {
            "host": "example-service.default",
            "port": 443,
            "sourceKind": "Service",
            "sourceName": "example-service",
            "sourceNamespace": "default"
          }
        },
        {
          "apiVersion": "security.telco.openshift.io/v1alpha1",
          "kind": "TLSComplianceTarget",
          "metadata": {
            "name": "external-api-check"
          },
          "spec": {
            "host": "api.example.com"
          }
        }
      ]
    capabilities: Deep Insights
    categories: Security
    containerImage: quay.io/bapalm/tls-compliance-operator:v1.1.16
    createdAt: "2026-10-05T17:26:58Z"
    description: Continuously discovers TLS endpoints and reports their protocol,
      certificate, and compliance status.
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    repository: https://github.com/sebrandon1/tls-compliance-operator
    support: Brandon Palm
  name: tls-compliance-operator.v1.1.16
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Observed TLS protocol, cipher, certificate, and compliance data
        for a discovered endpoint.
      displayName: TLS Compliance Report
      kind: TLSComplianceReport
      name: tlscompliancereports.security.telco.openshift.io
      version: v1alpha1
    - description: A user-defined host and port for TLS compliance scanning.
      displayName: TLS Compliance Target
      kind: TLSComplianceTarget
      name: tlscompliancetargets.security.telco.openshift.io
      version: v1alpha1
  description: |
    The TLS Compliance Operator continuously monitors TLS endpoints across a Kubernetes or OpenShift cluster.
    It discovers Services, Ingresses, Pods, optional OpenShift Routes, and installed Gateway API resources,
    then creates TLSComplianceReport resources with protocol support, cipher strength, certificate health,
    and post-quantum readiness details. TLSComplianceTarget resources add arbitrary host and port scans.

    The operator needs cluster-wide read access to discover endpoints and write access to its report resources.
    Route and Gateway API monitoring is enabled only when those APIs are installed. The operator supports
    Kubernetes 1.28 and later and OpenShift 4.x.
  displayName: TLS Compliance Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - ""
          resources:
          - nodes
          - pods
          - services
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - config.openshift.io
          resources:
          - apiservers
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - discovery.k8s.io
          resources:
          - endpointslices
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - events.k8s.io
          resources:
          - events
          verbs:
          - create
          - patch
          - update
        - apiGroups:
          - gateway.networking.k8s.io
          resources:
          - gateways
          - grpcroutes
          - httproutes
          - tlsroutes
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - machineconfiguration.openshift.io
          resources:
          - kubeletconfigs
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - networking.k8s.io
          resources:
          - ingresses
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - operator.openshift.io
          resources:
          - ingresscontrollers
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - route.openshift.io
          resources:
          - routes
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - security.telco.openshift.io
          resources:
          - imagecertificationinfoes
          - tlscompliancetargets
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - security.telco.openshift.io
          resources:
          - tlscompliancereports
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - security.telco.openshift.io
          resources:
          - tlscompliancereports/status
          - tlscompliancetargets/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: tls-compliance-operator
          control-plane: controller-manager
        name: controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: tls-compliance-operator
              control-plane: controller-manager
          strategy:
            type: Recreate
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: tls-compliance-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: GOMAXPROCS
                  value: "1"
                - name: GOMEMLIMIT
                  value: 460MiB
                image: quay.io/bapalm/tls-compliance-operator:v1.1.16
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8081
                  name: health
                  protocol: TCP
                - containerPort: 8443
                  name: metrics
                  protocol: TCP
                readinessProbe:
                  failureThreshold: 18
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 512Mi
                  requests:
                    cpu: 10m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: controller-manager
    strategy: deployment
  installModes:
  - supported: true
    type: AllNamespaces
  keywords:
  - TLS
  - security
  - compliance
  - certificates
  - post-quantum
  links:
  - name: Source Code
    url: https://github.com/sebrandon1/tls-compliance-operator
  - name: Documentation
    url: https://github.com/sebrandon1/tls-compliance-operator/tree/main/docs
  - name: Issue Tracker
    url: https://github.com/sebrandon1/tls-compliance-operator/issues
  maintainers:
  - email: bpalm@redhat.com
    name: Brandon Palm
  minKubeVersion: 1.28.0
  provider:
    name: Brandon Palm
  version: 1.1.16
