                  current state.
                type: string
              sourceLvolID:
                description: SourceLvolID is the UUID of the source volume on the
                  source cluster.
                type: string
              state:
                description: State is the current replication state for this slot.
                enum:
                - attaching
                - replicating
                - cutover_pending
                - cutover_done
                - failed_over
                - detaching
                - error
                type: string
              targetLvolID:
                description: TargetLvolID is the UUID of the replicated volume on
                  the target cluster.
                type: string
              targetNQN:
