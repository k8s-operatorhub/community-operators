  description: |-
    Manage Keycloak realms, OIDC clients, machine identities, roles and organizations declaratively from Kubernetes.

    Administrator preparation is REQUIRED before installation: follow https://github.com/Alien6-Studio/hankoshell-operator/blob/main/docs/operatorhub.md. OLM does not install the chart's admission policies. The preparation command renders admission and network protections from the chart, an immutable installation contract and a Subscription with its independently approved hash. Missing, incompatible or changed protections prevent the operator from starting. A NetworkPolicy-enforcing CNI is required.

    This alpha channel supports one namespace, the standard Keycloak profile, Linux amd64/arm64 and qualified Kubernetes 1.35–1.37. All 17 hanko.sh/v1alpha1 APIs remain experimental. Lifecycle operations stay disabled. Use Helm for connected Hub, lifecycle, experimental provider and advanced integration profiles. Do not install over a Helm-owned operator or share its watched namespace. Provider objects and custom resources are retained when the operator is removed; review finalizers before deleting CRDs.
  displayName: HankoShell Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resourceNames:
          - kube-system
          resources:
          - namespaces
          verbs:
          - get
        - nonResourceURLs:
          - /.well-known/openid-configuration
          - /openid/v1/jwks
          verbs:
          - get
        - apiGroups:
          - rbac.authorization.k8s.io
          resourceNames:
          - hankoshell-operator-olm-cluster-identity-reader
          - hankoshell-operator-olm-node-reader
          resources:
          - clusterroles
          - clusterrolebindings
          verbs:
          - get
        - apiGroups:
          - ""
          resources:
          - nodes
          verbs:
          - get
        serviceAccountName: hankoshell-operator-olm
      deployments:
      - name: hankoshell-operator-olm
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/instance: hankoshell-operator
              app.kubernetes.io/name: hanko-operator
          strategy: {}
          template:
            metadata:
              labels:
                app: hanko-operator
                app.kubernetes.io/instance: hankoshell-operator
                app.kubernetes.io/name: hanko-operator
            spec:
              containers:
              - args:
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=0
                - --watch-namespace=$(POD_NAMESPACE)
                - --leader-elect=true
                - --lifecycle-enabled=false
                - --require-installation-contract=true
                - --installation-configmap=$(HANKO_INSTALLATION_CONTRACT_CONFIGMAP)
                - --installation-contract-sha256=$(HANKO_INSTALLATION_CONTRACT_SHA256)
                env:
                - name: HANKO_IAM_MAX_CONCURRENT_RECONCILES
                  value: "1"
                - name: HANKO_EXPERIMENTAL_AUTHENTIK_CONNECTIONS
                - name: HANKO_EXPERIMENTAL_AUTHENTIK_ENABLED
                  value: "false"
                - name: HANKO_SECURITY_PROFILE
                  value: standard
                - name: HANKO_CONTROL_PLANE_AUTHORIZED_CLIENTS
                  value: hanko-dashboard
                - name: HANKO_FLEET_AUTHORITY_REALM
                  value: hanko
                - name: HANKO_CILIUM_POLICY_ENABLED
                  value: "false"
                - name: HANKO_KEYCLOAK_ALLOW_INSECURE_HTTP
                  value: "false"
                - name: HANKO_KEYCLOAK_URL
                  value: https://keycloak.auth.svc:8443
                - name: HANKO_KC_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      key: client-id
                      name: keycloak-ops-credentials
                - name: HANKO_KC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: client-secret
                      name: keycloak-ops-credentials
                - name: HANKO_ORGANIZATION_PROJECTION_ENABLED
                  value: "false"
                - name: HANKO_KC_SA_MAX_AGE
                  value: 90d
                - name: HANKO_KEYCLOAK_DEPLOYMENT
                  value: keycloak
                - name: HANKO_LOG_DEV
                  value: "false"
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: HANKO_INSTALLATION_CONTRACT_SHA256
                - name: HANKO_INSTALLATION_CONTRACT_CONFIGMAP
                  value: hankoshell-operator-installation
                image: ghcr.io/alien6-studio/hankoshell-operator@sha256:c26e0d53d90c44b55489ab1a855ae6eda988cf26e81beba00bdb14955ce4efa0
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8081
                  name: healthz
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz?exclude=leader
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 200m
                    memory: 128Mi
                  requests:
                    cpu: 50m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                - mountPath: /tmp
                  name: verifier-tmp
              nodeSelector:
                kubernetes.io/os: linux
              os:
                name: linux
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: hankoshell-operator-olm
              terminationGracePeriodSeconds: 60
              volumes:
              - emptyDir:
                  medium: Memory
                  sizeLimit: 16Mi
                name: verifier-tmp
