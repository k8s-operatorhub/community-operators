                        maxLength: 255
                        type: string
                      kind:
                        maxLength: 64
                        type: string
                      name:
                        maxLength: 255
                        type: string
                      namespace:
                        maxLength: 255
                        type: string
                      tenantRef:
                        description: TenantRef binds connection-selecting target metadata
