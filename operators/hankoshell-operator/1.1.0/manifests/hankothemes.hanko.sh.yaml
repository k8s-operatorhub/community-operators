apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankothemes.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoTheme
    listKind: HankoThemeList
    plural: hankothemes
    shortNames:
    - ht
    singular: hankotheme
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.buildJob
      name: BuildJob
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HankoTheme represents a Keycloakify login theme managed by the operator.
          The operator submits a K8s Job to build the theme JAR and copy it to the Keycloak PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoThemeSpec defines the desired theme configuration.
            properties:
              artifactSHA256:
                description: |-
                  ArtifactSHA256 selects precompiled installation from /theme/theme.jar in
                  BuildImage. The operator verifies these bytes before an atomic PVC write.
                  Omit it only for explicit local legacy builds. Visual settings are runtime
                  profile data and cannot be combined with artifact installation.
                maxLength: 64
                pattern: ^[a-f0-9]{64}$
                type: string
              backgroundColor:
                description: BackgroundColor is the CSS color used for the dark-mode
                  page background.
                maxLength: 128
                type: string
              buildImage:
                description: |-
                  BuildImage contains either the approved builder or a precompiled theme
                  artifact. Artifact mode does not execute the image entrypoint or build tools.
                maxLength: 2048
                minLength: 1
                pattern: ^[^\x00-\x20\x7F]+$
                type: string
              fontFamily:
                description: FontFamily is the CSS font-family applied by the generated
                  theme.
                maxLength: 256
                type: string
              foregroundColor:
                description: ForegroundColor is the CSS color used for the dark-mode
                  foreground.
                maxLength: 128
                type: string
              headline:
                description: Headline is the text shown above the login form.
                maxLength: 256
                type: string
              imagePullSecrets:
                description: ImagePullSecrets are attached to theme build and cleanup
                  Jobs.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                maxItems: 32
                type: array
              jarName:
                description: |-
                  JarName is the filename installed in Keycloak's providers directory. When
                  omitted, the operator derives <metadata.name>-theme.jar.
                maxLength: 255
                pattern: ^[a-zA-Z0-9._-]+\.jar$
                type: string
              keycloakPVC:
                description: KeycloakPVC is the name of the PersistentVolumeClaim
                  where the JAR is placed.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              logoURL:
                description: LogoURL is the URL of the logo image shown on the login
                  page.
                maxLength: 2048
                type: string
              primaryColor:
                description: |-
                  PrimaryColor is the CSS color for the primary UI elements (for example a
                  hex value or oklch()).
                maxLength: 128
                type: string
              rebuildNonce:
                description: |-
                  RebuildNonce requests a fresh build when its value changes, even if the
                  visual configuration is otherwise identical.
                maxLength: 128
                type: string
              subline:
                description: Subline is the optional supporting text shown below the
                  headline.
                maxLength: 512
                type: string
            required:
            - buildImage
            - keycloakPVC
            type: object
          status:
            description: HankoThemeStatus describes the observed state of the theme
              build.
            properties:
              buildJob:
                description: BuildJob is the name of the most recent K8s Job that
                  built this theme.
                maxLength: 253
                type: string
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installedBuildImage:
                description: |-
                  InstalledBuildImage records the previously validated image that can remove
                  the installed artifact even if the desired build image later changes.
                maxLength: 2048
                type: string
              installedImagePullSecrets:
                description: |-
                  InstalledImagePullSecrets records the credentials used by the installed
                  build image so finalizer cleanup does not depend on a later spec revision.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      maxLength: 253
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                maxItems: 32
                type: array
              installedPVC:
                description: |-
                  InstalledPVC records the claim containing JarPath. It lets cleanup remain
                  correct when spec.keycloakPVC changes after an installation.
                maxLength: 253
                type: string
              jarPath:
                description: JarPath is the path inside the PVC where the built JAR
                  was placed.
                maxLength: 1024
                type: string
              lastBuilt:
                description: LastBuilt is the timestamp when the theme JAR was last
                  successfully built.
                format: date-time
                maxLength: 64
                type: string
              lastReconciled:
                description: LastReconciled is the timestamp of the last successful
                  reconciliation.
                format: date-time
                maxLength: 64
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the HankoTheme generation represented by the
                  installed JAR and Ready status.
                format: int64
                type: integer
              phase:
                description: Phase summarises the build state.
                enum:
                - Pending
                - Building
                - Installing
                - Ready
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
