---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: wekaclients.weka.weka.io
spec:
  group: weka.weka.io
  names:
    kind: WekaClient
    listKind: WekaClientList
    plural: wekaclients
    singular: wekaclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Resource status
      jsonPath: .status.status
      name: Status
      type: string
    - description: Name of the target cluster if exists
      jsonPath: .spec.targetCluster.name
      name: Target Cluster
      type: string
    - description: Number of cores
      jsonPath: .spec.coresNum
      name: Cores
      type: integer
    - description: 'Number of client containers: Active/Created/Desired'
      jsonPath: .status.printer.containers
      name: Containers(A/C/D)
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WekaClient is the Schema for the clients API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WekaClientSpec defines the desired state of WekaClient
            properties:
              additionalMemory:
                description: memory to add/decrease from "auto-calculated" memory
                type: integer
              agentPort:
                description: if not set (0), weka will find a free port from the portRange
                type: integer
              allowHotUpgrade:
                type: boolean
              autoRemoveTimeout:
                default: 24h
                description: sets weka cluster-side timeout, if client is not coming
                  back in specified duration it will be auto removed from cluster
                  config
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+)$
                type: string
              coreIds:
                items:
                  type: integer
                type: array
              coresNum:
                type: integer
              cpuPolicy:
                default: auto
                enum:
                - auto
                - shared
                - dedicated
                - dedicated_ht
                - manual
                type: string
              cpuRequest:
                type: string
              csiConfig:
                description: 'EXPERIMENTAL, ALPHA STATE, should not be used in production:
                  if set, allows to reuse the same csi resources for multiple clients'
                properties:
                  advanced:
                    properties:
                      controllerLabels:
                        additionalProperties:
                          type: string
                        type: object
                      controllerTolerations:
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                                Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
                      enforceTrustedHttps:
                        type: boolean
                      nodeLabels:
                        additionalProperties:
                          type: string
                        type: object
                      nodeTolerations:
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                                Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
                      skipGarbageCollection:
                        type: boolean
                    type: object
                  csiGroup:
                    type: string
                  disableControllerCreation:
                    type: boolean
                type: object
              driversDistService:
                type: string
              extraCores:
                description: extraCores reserves additional CPUs for the pod on top
                  of the weka FE cores.
                minimum: 0
                type: integer
              extraVolumeMounts:
                description: mounts for `extraVolumes`, applied to the weka container
                  only (not init containers)
                items:
                  description: VolumeMount describes a mounting of a Volume within
                    a container.
                  properties:
                    mountPath:
                      description: |-
                        Path within the container at which the volume should be mounted.  Must
                        not contain ':'.
                      type: string
                    mountPropagation:
                      description: |-
                        mountPropagation determines how mounts are propagated from the host
                        to container and the other way around.
                        When not set, MountPropagationNone is used.
                        This field is beta in 1.10.
                        When RecursiveReadOnly is set to IfPossible or to Enabled, MountPropagation must be None or unspecified
                        (which defaults to None).
                      type: string
                    name:
                      description: This must match the Name of a Volume.
                      type: string
                    readOnly:
                      description: |-
                        Mounted read-only if true, read-write otherwise (false or unspecified).
                        Defaults to false.
                      type: boolean
                    recursiveReadOnly:
                      description: |-
                        RecursiveReadOnly specifies whether read-only mounts should be handled
                        recursively.

                        If ReadOnly is false, this field has no meaning and must be unspecified.

                        If ReadOnly is true, and this field is set to Disabled, the mount is not made
                        recursively read-only.  If this field is set to IfPossible, the mount is made
                        recursively read-only, if it is supported by the container runtime.  If this
                        field is set to Enabled, the mount is made recursively read-only if it is
                        supported by the container runtime, otherwise the pod will not be started and
                        an error will be generated to indicate the reason.

                        If this field is set to IfPossible or Enabled, MountPropagation must be set to
                        None (or be unspecified, which defaults to None).

                        If this field is not specified, it is treated as an equivalent of Disabled.
                      type: string
                    subPath:
                      description: |-
                        Path within the volume from which the container's volume should be mounted.
                        Defaults to "" (volume's root).
                      type: string
                    subPathExpr:
                      description: |-
                        Expanded path within the volume from which the container's volume should be mounted.
                        Behaves similarly to SubPath but environment variable references $(VAR_NAME) are expanded using the container's environment.
                        Defaults to "" (volume's root).
                        SubPathExpr and SubPath are mutually exclusive.
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
              extraVolumes:
                description: |-
                  extra volumes added to every client pod, in the same shape as a PodSpec's `volumes`.
                  Names must not collide with operator-managed volumes; see
                  doc/operator/deployment/extra-volumes.md for the reserved names and paths.
                x-kubernetes-preserve-unknown-fields: true
              globalPVC:
                properties:
                  name:
                    description: Name of the PersistentVolumeClaim to mount into all
                      Weka containers.
                    type: string
                  path:
                    description: Mount path inside the Weka container. Defaults to
                      /opt/k8s-weka when empty.
                    type: string
                required:
                - name
                type: object
              hugepages:
                description: hugepages, value in megabytes
                type: integer
              hugepagesOffset:
                description: value in megabytes to offset
                type: integer
              image:
                description: full container image in format of quay.io/weka.io/weka-in-container:VERSION
                pattern: ^.+:\d+\.\d+\.\d+.*$
                type: string
              imagePullSecret:
                type: string
              ipv6:
                description: |-
                  prefer ipv6 on a data-path device that carries both address families.
                  It is not needed when network.deviceSubnets or a selector subnet is set, which already pin the
                  address family, nor when the device only has an ipv6 address.
                type: boolean
              joinIpPorts:
                items:
                  type: string
                type: array
              network:
                properties:
                  allocateVfPerIoNode:
                    type: boolean
                  bindManagementAll:
                    description: |-
                      BindManagementAll controls whether Weka containers bind to all network interfaces or only to specific management interfaces.
                      When set to false (default), containers will only listen on the management ips interfaces (restrict_listen mode).
                      When set to true, containers will listen on all ips (0.0.0.0) instead of specific IP addresses.
                    type: boolean
                  deviceSubnets:
                    description: |-
                      A list of backend subnets in CIDR notation, either IPv4 (for example, 192.168.10.0/24)
                      or IPv6 (for example, 2001:db8::/64).
                      The operator assigns IP addresses from these subnets to the backend containers for their data path network.
                      The address family of the subnet selects the address family used on the data path; the ipv6 field is not consulted.
                    items:
                      pattern: ^(([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F:.]*)\/[0-9]{1,3}$
                      type: string
                    type: array
                  ethDevice:
                    description: |-
                      The name of a single network interface (for example, eth1) to be used by every backend container.
                      This is for clusters that use only one dedicated NIC for the data path.
                      You cannot use this field with ethDevices.
                      If you leave this empty, the system automatically uses the node’s interface associated with the first subnet defined in deviceSubnets.
                    type: string
                  ethDevices:
                    description: |-
                      A list of network interface names to be used by backend containers when you have multiple dedicated NICs.
                      The order of interfaces in this list is important, as it maps directly to the ethSlots index (the first interface maps to slot-0, the second to slot-1, and so on).
                      You cannot use this field with ethDevice. Ensure that every interface listed here exists on all nodes that are part of the cluster.
                    items:
                      type: string
                    type: array
                  gateway:
                    description: |-
                      The default gateway IPv4 address for the backend containers’ data-path network.
                      This is only necessary if backend subnets need to communicate with destinations outside of their local network (L2 segment).
                      If you have a flat, non-routed backend network, you can leave this field empty.
                    type: string
                  managementIpsSelectors:
                    description: Selectors for management IPs used for cluster API
                      and agent communication.
                    items:
                      properties:
                        deviceNames:
                          description: |-
                            Interface names (e.g. eth1) to select. Combine with subnet to narrow these to the interface
                            holding an address in that subnet, which lets one selector cover nodes on different subnets.
                            The subnet narrowing is skipped for rdmaOnly selectors, whose interfaces may carry no address at all.
                          items:
                            type: string
                          type: array
                        disableRdma:
                          type: boolean
                        max:
                          description: Maximum number of interfaces to select per
                            node matching this selector.
                          type: integer
                        min:
                          description: Minimum number of interfaces required from
                            nodes matching this selector.
                          type: integer
                        rdmaOnly:
                          type: boolean
                        subnet:
                          description: |-
                            CIDR subnet (e.g. 192.168.10.0/24) to filter interfaces. Only interfaces with an IP in this subnet are eligible.
                            When set together with deviceNames, both conditions apply: only the named interfaces that also hold an
                            address in this subnet are selected. For management IPs, the address picked is the one within this subnet.
                          type: string
                      type: object
                    type: array
                  netmask:
                    description: |-
                      The data-path netmask for the backend containers’ network, expressed as prefix bits (for example, 24).
                      This is only necessary when the netmask cannot be inferred from deviceSubnets.
                    maximum: 32
                    minimum: 1
                    type: integer
                  nvidiaVfSingleIp:
                    description: |-
                      NvidiaVfSingleIp indicates whether NVIDIA virtual functions (VFs) should be configured to use a single-ip weka mode, where multiple weka processes can share same VF
                      When not set defaults to false, in future releases, when auto-discovery of capabilities will be implemented not set might translate to true on supported setups
                    type: boolean
                  selectors:
                    description: Selectors define how backend data-path network interfaces
                      are chosen on each node.
                    items:
                      properties:
                        deviceNames:
                          description: |-
                            Interface names (e.g. eth1) to select. Combine with subnet to narrow these to the interface
                            holding an address in that subnet, which lets one selector cover nodes on different subnets.
                            The subnet narrowing is skipped for rdmaOnly selectors, whose interfaces may carry no address at all.
                          items:
                            type: string
                          type: array
                        disableRdma:
                          type: boolean
                        max:
                          description: Maximum number of interfaces to select per
                            node matching this selector.
                          type: integer
                        min:
                          description: Minimum number of interfaces required from
                            nodes matching this selector.
                          type: integer
                        rdmaOnly:
                          type: boolean
                        subnet:
                          description: |-
                            CIDR subnet (e.g. 192.168.10.0/24) to filter interfaces. Only interfaces with an IP in this subnet are eligible.
                            When set together with deviceNames, both conditions apply: only the named interfaces that also hold an
                            address in this subnet are selected. For management IPs, the address picked is the one within this subnet.
                          type: string
                      type: object
                    type: array
                  udpMode:
                    description: |-
                      A setting that enables or disables UDP encapsulation for backend traffic.
                      - false (default): Uses standard raw Ethernet frames. true: Wraps data-path traffic in UDP packets.
                      This is required if your network infrastructure or CNI (Container Network Interface) blocks traffic that isn’t IP-based.
                    type: boolean
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              nonDatapathCoreIds:
                items:
                  type: integer
                type: array
              numa:
                description: Numa configures NUMA confinement for this client container
                properties:
                  method:
                    description: Method selects the enforcement mechanism
                    enum:
                    - device-plugin
                    - dra
                    type: string
                  region:
                    description: Region is the NUMA region index to pin this container
                      to
                    minimum: 0
                    type: integer
                  single:
                    description: Single, when true, confines the container to a single
                      NUMA region
                    type: boolean
                type: object
              overrides:
                properties:
                  dpdkBaseMemoryMb:
                    type: integer
                  driversBuildId:
                    description: can be used to specify a build_id for a driver in
                      the distributor service, keep empty for auto detection default
                    type: string
                  driversLoaderImage:
                    type: string
                  dropAffinityConstraints:
                    description: |-
                      unsafe parameter, disables anti-affinities on client pods, allowing to schedule more than one client pod per node.
                      Running multiple clients for multiple clusters on the same node is not fully supported yet, and this flag should not be used in production.
                    type: boolean
                  forceDrain:
                    description: unsafe operation, forces drain on the node where
                      the container is running, should not be used unless instructed
                      explicitly by weka personnel, the effect of drain is throwing
                      away all IOs and acknowledging all umounts in unsafe manner
                    type: boolean
                  machineIdentifierNodeRef:
                    description: used to override machine identifier node reference
                      for client containers
                    type: string
                  noReserveSpace:
                    description: |-
                      configures the weka agent of this client's containers with [mounts] allocate_reserved_space=false.
                      applied only when a container is created; toggling it later does not reconfigure existing containers
                    type: boolean
                  skipActiveMountsCheck:
                    description: option to skip active mounts check before deleting
                      client containers
                    type: boolean
                  umountOnHost:
                    description: unsafe operation, runs nsenter in root namespace
                      to umount all wekafs mounts visible on host
                    type: boolean
                  waitSinceIoProcessesUpTimeout:
                    description: |-
                      how long to wait, once IO processes are reported up, before considering the container's applied
                      image settled. nil/0 (default): don't wait.
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+)$
                    type: string
                  wekaContainerName:
                    description: |-
                      override name used in weka local setup for the container
                      this can be used for integration with external client on the host
                    type: string
                type: object
              port:
                description: if not set (0), weka will find a free port from the portRange
                type: integer
              portRange:
                description: used for dynamic port allocation
                properties:
                  basePort:
                    default: 45000
                    maximum: 65535
                    type: integer
                  portRange:
                    default: 0
                    description: |-
                      number of ports to check for availability
                      if 0 - will check all ports from basePort to 65535
                    type: integer
                required:
                - basePort
                type: object
              rawTolerations:
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              resources:
                description: 'experimental: pod resources to be proxied as-is to the
                  pod spec'
                properties:
                  limits:
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      hugepages-2Mi:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          Hugepages2Mi is requested verbatim as the pod's hugepages-2Mi resource. 1Gi pages are
                          not settable through this field.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  requests:
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      hugepages-2Mi:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          Hugepages2Mi is requested verbatim as the pod's hugepages-2Mi resource. 1Gi pages are
                          not settable through this field.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                type: object
              serviceAccountName:
                type: string
              targetCluster:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              tolerations:
                items:
                  type: string
                type: array
              tracesConfiguration:
                description: TraceConfiguration defines the configuration for the
                  traces, accepts parameters in gigabytes
                properties:
                  dumperConfigMode:
                    default: auto
                    enum:
                    - override
                    - partial-override
                    - auto
                    - cluster
                    type: string
                  ensureFreeSpace:
                    default: 20
                    type: integer
                  maxCapacityPerIoNode:
                    default: 10
                    type: integer
                type: object
              upgradePolicy:
                properties:
                  type:
                    default: all-at-once
                    enum:
                    - manual
                    - all-at-once
                    - rolling
                    - all-at-once-force
                    type: string
                type: object
              useNfs:
                description: |-
                  UseNfs deploys CSI over NFS and creates no weka client containers.
                  Immutable.
                type: boolean
              wekaHome:
                properties:
                  cacertSecret:
                    type: string
                type: object
              wekaSecretRef:
                type: string
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: 'useNfs is immutable: create a new WekaClient instead'
              rule: '(has(self.useNfs) ? self.useNfs : false) == (has(oldSelf.useNfs)
                ? oldSelf.useNfs : false)'
          status:
            description: WekaClientStatus defines the observed state of WekaClient
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
