apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    gravitee.io/operator.version: 4.13.0
  name: amcertificates.gravitee.io
spec:
  group: gravitee.io
  names:
    kind: AMCertificate
    listKind: AMCertificateList
    plural: amcertificates
    shortNames:
      - graviteeamcertificates
    singular: amcertificate
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.name
          name: Name
          type: string
        - jsonPath: .status.type
          name: Type
          type: string
        - jsonPath: .spec.domainRef.name
          name: Domain
          type: string
        - jsonPath: .status.expiresAt
          name: Expires
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of
                an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object
                represents.
              type: string
            metadata:
              type: object
            spec:
              description: AMCertificateSpec defines the desired state of an AM certificate.
              properties:
                configuration:
                  description: Configuration Plugin-specific configuration, a free-form object
                    sent to AM as a JSON string.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                domainRef:
                  description: DomainRef Domain CRD reference
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                  x-kubernetes-validations:
                    - message: domainRef is immutable
                      rule: self == oldSelf
                    - message: domainRef.name must not be empty
                      rule: size(self.name) > 0
                name:
                  description: Name Human-readable name of the certificate.
                  maxLength: 255
                  minLength: 1
                  type: string
                system:
                  default: false
                  description: System Whether this is the domain's system certificate. Immutable
                    after creation.
                  type: boolean
                  x-kubernetes-validations:
                    - message: system is immutable
                      rule: self == oldSelf
                type:
                  description: Type Certificate plugin type identifier. Immutable after creation.
                  minLength: 1
                  type: string
              required:
                - domainRef
              type: object
              x-kubernetes-validations:
                - message: name, type and configuration are required unless system is true
                  rule: (has(self.system) && self.system) || (has(self.name) && has(self.type) &&
                    has(self.configuration))
                - message: type is immutable
                  rule: has(self.type) == has(oldSelf.type) && (!has(self.type) || self.type ==
                    oldSelf.type)
            status:
              description: AMCertificateStatus defines the observed state of an AM
                certificate.
              properties:
                conditions:
                  default: []
                  description: Conditions describe the current conditions of the security domain.
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                domainKey:
                  type: string
                environmentId:
                  description: The environment Key defined in the AM context.
                  type: string
                expiresAt:
                  description: When the certificate expires, as reported by AM.
                  format: date-time
                  type: string
                key:
                  description: The Key of the security domain in the AM instance.
                  type: string
                name:
                  description: The name of the certificate in AM. For the system certificate, the
                    one AM builds.
                  type: string
                organizationId:
                  description: The organization Key defined in the AM context.
                  type: string
                type:
                  description: The plugin type of the certificate in AM. For the system
                    certificate, the one AM builds.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
