apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankosnapshots.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoSnapshot
    listKind: HankoSnapshotList
    plural: hankosnapshots
    shortNames:
    - hsnap
    singular: hankosnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.instanceRef
      name: Instance
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HankoSnapshot records supported operator configuration for a Keycloak instance.
          It stores the operator CRD config in a ConfigMap and optionally
          triggers a pg_dump Job for the database.
          Portable backup/restore and database consistency are not qualified by the current snapshot contract.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoSnapshotSpec defines the desired state of a snapshot
              operation.
            properties:
              backupImage:
                description: |-
                  BackupImage is an immutable pg_dump image approved for database-backup
                  in the administrator-owned image policy. Its publisher signature and signed
                  source revision are verified before Job submission. It must run as UID/GID 70
                  with a read-only root filesystem. This separate image is not scanned as part
                  of the operator release; administrators must review its own security evidence.
                maxLength: 2048
                pattern: ^[^@\s]+@sha256:[a-f0-9]{64}$
                type: string
              backupPVC:
                description: |-
                  BackupPVC is the name of the PersistentVolumeClaim where the pg_dump output
                  is written. Required when includeData is true.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              backupSecretRef:
                description: |-
                  BackupSecretRef is a dedicated same-namespace Secret with PGHOST,
                  PGDATABASE, PGUSER and PGPASSWORD; PGPORT and PGSSLMODE are optional.
                  Only these keys enter the Job. It must differ from the instance's
                  administrative, managed database and serving TLS Secrets.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              includeData:
                description: |-
                  IncludeData triggers a pg_dump Job in addition to the config snapshot.
                  Requires managed mode, BackupPVC, an approved signed BackupImage and
                  a dedicated BackupSecretRef. No mutable or default image is used.
                type: boolean
              instanceRef:
                description: InstanceRef is the name of the HankoKeycloakInstance
                  to snapshot.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: includeData requires backupPVC, backupImage and backupSecretRef
              rule: '!has(self.includeData) || !self.includeData || (has(self.backupPVC)
                && has(self.backupImage) && has(self.backupSecretRef))'
          status:
            description: HankoSnapshotStatus describes the observed state of the snapshot.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                maxLength: 71
                type: string
              configMapRef:
                description: ConfigMapRef is the name of the ConfigMap holding the
                  serialized CRD config.
                maxLength: 253
                type: string
              configMapUID:
                description: ConfigMapUID and ConfigHash bind the immutable configuration
                  captured on the first successful create.
                maxLength: 128
                type: string
              dbJobRef:
                description: DBJobRef is the name of the pg_dump Job (set only when
                  includeData=true).
                maxLength: 253
                type: string
              dbJobUID:
                description: DBJobUID prevents replay when a previously accepted backup
                  Job disappears or is replaced.
                maxLength: 128
                type: string
              instanceUID:
                description: InstanceUID identifies the source instance before any
                  child is created.
                maxLength: 128
                type: string
              intentHash:
                maxLength: 71
                type: string
              lastReconciled:
                description: LastReconciled is the timestamp of the last reconcile
                  loop.
                format: date-time
                maxLength: 64
                type: string
              phase:
                description: 'Phase: Pending | Running | Done | Failed'
                enum:
                - Pending
                - Running
                - Done
                - Failed
                type: string
              startedGeneration:
                description: StartedGeneration and IntentHash bind retries to the
                  original specification and tenant.
                format: int64
                type: integer
              takenAt:
                description: TakenAt is when the snapshot completed successfully.
                format: date-time
                maxLength: 64
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
