      version: v1beta1
  description: |
    Seamless Redkey management on Kubernetes, in cluster or standalone mode.

    A **Redkey** is a key/value store built from either the [Redis official image](https://hub.docker.com/_/redis) or the [Valkey official image](https://hub.docker.com/r/valkey/valkey/). A Redkey can run in **cluster** mode — a sharded Redis Cluster of one or more primaries, each with an optional set of replicas — or in **standalone** mode — a single, non-clustered instance.

    The **Redkey Operator** deploys and manages Redkeys on Kubernetes by implementing the [operator pattern](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/). It extends the Kubernetes API with a controller that reconciles the desired state declared in the `Redkey` resource, manages the Kubernetes objects the Redkey requires, coordinates Redis-side operations through Redkey Robin, and keeps it healthy during lifecycle changes.

    ### Key Features

    - Deploy Redkeys from a single `Redkey` custom resource using Redis or Valkey images
    - Choose the deployment mode: **cluster** (a sharded Redis Cluster) or **standalone** (a single, non-clustered instance)
    - Configure the cluster-mode topology with a selectable number of primaries and replicas per primary
    - Run ephemeral or persistent Redkeys with configurable storage size, storage class, access modes, and PVC cleanup behavior
    - Scale clusters up and down while reassigning slots and preserving cluster balance
    - Choose between fast operations and key-preserving rebalance flows through `purgeKeysOnRebalance`
    - Roll out changes to node image, Redis configuration, and pod resources
    - Continuously reconcile cluster state, surface status and substatus, and recover from unhealthy conditions
    - Configure authentication, labels, PodDisruptionBudgets, and Kubernetes resource requests and limits
    - Deploy and tune Redkey Robin for Redis-side orchestration, health supervision, and metrics collection
    - Override generated StatefulSet and Service manifests for platform-specific customization

    ### Documentation

    [Quick Start](https://github.com/InditexTech/redkey-operator/tree/main?tab=readme-ov-file#quick-start)

    Discover the architecture and design of Redkey Operator in the [architecture document](https://github.com/InditexTech/redkey-operator/blob/main/docs/architecture.md).

    Refer to the [operator guide](https://github.com/InditexTech/redkey-operator/blob/main/docs/operator-guide/toc.md) to have an overview of the main Redis configuration and management options, and a troubleshooting guide.

    If you are a developer, you'll find interesting information in the [developer guide](https://github.com/InditexTech/redkey-operator/blob/main/docs/developer-guide/toc.md).

    ### Contributing

    Contributions are welcome! Please read our [contributing guidelines](https://github.com/InditexTech/redkey-operator/blob/main/CONTRIBUTING.md) to get started.

    ### License

    This project is licensed under the Apache License 2.0 - see the [LICENSE](https://github.com/InditexTech/redkey-operator/blob/main/LICENSE) file for details.
