  description: |
    Protem is just-in-time privileged access management for Kubernetes. It replaces standing admin rights with time-bound, approval-gated access across a fleet of clusters: engineers request a role, approvers see exactly what it grants, and every grant is audited and revoked automatically when it expires.

    A hub cluster holds the rules (`AccessProfile`) and the requests (`AccessRequest`) as custom resources. An agent on each target cluster turns approved requests into ordinary RoleBindings and removes them when they expire, even while the hub is unreachable.

    ### What gets installed

    The operator on the hub, with its web UI and API on port 8080, the five custom resource definitions, and the RBAC the operator needs. It may bind only the `view` and `edit` roles on the hub itself. The admission policy that checks requests created with `kubectl` is not part of this bundle: see [How to install with OLM](https://github.com/iLLeniumStudios/protem/blob/main/docs/guides/how-to-install-with-olm.md).

    ### After installing

    1. Put an OIDC-aware proxy, such as oauth2-proxy, in front of the UI, and set the OIDC issuer and client ID. See [How to set up login](https://github.com/iLLeniumStudios/protem/blob/main/docs/guides/how-to-set-up-login.md).
    2. To grant access on the hub itself, create a `TargetCluster` named like `PROTEM_HUB_CLUSTER_NAME` (default `local`). The operator marks it Ready without an agent.
    3. Connect each target cluster by running the agent on it. See [How to connect a target cluster](https://github.com/iLLeniumStudios/protem/blob/main/docs/guides/how-to-connect-a-target-cluster.md).

    ### Options

    Every operator flag `--some-name` can be set as the environment variable `PROTEM_SOME_NAME` in the Subscription's `spec.config.env`, for example:

    ```yaml
    config:
      env:
      - {name: PROTEM_OIDC_ISSUER_URL, value: "https://idp.example.com/realms/example"}
      - {name: PROTEM_OIDC_CLIENT_ID, value: protem}
    ```

    What Protem trusts and what it does not protect against: [Security model](https://github.com/iLLeniumStudios/protem/blob/main/docs/architecture/security-model.md).
