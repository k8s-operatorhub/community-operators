                    type: boolean
                  enforceTeamBasedModelAccess:
                    description: |-
                      EnforceTeamBasedModelAccess denies model access unless the caller's team
                      has access to the model.
                    type: boolean
                  issuer:
                    description: Issuer is the expected `iss` claim; rendered as the
