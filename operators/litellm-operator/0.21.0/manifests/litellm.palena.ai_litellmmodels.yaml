apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: litellmmodels.litellm.palena.ai
spec:
  group: litellm.palena.ai
  names:
    kind: LiteLLMModel
    listKind: LiteLLMModelList
    plural: litellmmodels
    shortNames:
    - lm
    singular: litellmmodel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .status.synced
      name: Synced
      type: boolean
    - jsonPath: .status.health
      name: Health
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LiteLLMModel is the Schema for the litellmmodels API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LiteLLMModelSpec defines the desired state of LiteLLMModel.
            properties:
              instanceRef:
                description: Reference to the LiteLLMInstance.
                properties:
                  name:
                    description: Name of the LiteLLMInstance CR.
                    type: string
                required:
                - name
                type: object
              litellmParams:
                description: LiteLLM-specific parameters for this model.
                properties:
                  apiBase:
                    description: API base URL for the provider.
                    type: string
                  apiKeySecretRef:
                    description: Reference to Secret containing the provider API key.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  apiVersion:
                    description: |-
                      API version (e.g., "2024-10-21" for Azure OpenAI / Azure AI Foundry).
                      Required by most Azure deployments. When credentialRef is set, the
                      value from the LiteLLMCredential takes precedence over this field.
                    type: string
                  awsRegionName:
                    description: |-
                      AWSRegionName is the AWS region for AWS-backed providers such as Bedrock
                      and SageMaker (e.g. "us-east-1").
                    type: string
                  credentialRef:
                    description: |-
                      Reference to a LiteLLMCredential CR for provider authentication.
                      When set, the credential's resolved api_base / api_version / api_key are
                      written inline onto the model (and `litellm_credential_name` is also sent
                      for Admin UI association). apiBase / apiVersion / apiKeySecretRef on this
                      model are ignored in favor of the credential's values.
                    properties:
                      name:
                        description: Name of the LiteLLMCredential CR.
                        type: string
                    required:
                    - name
                    type: object
                  dropParams:
                    description: |-
                      DropParams silently drops request parameters the provider does not
                      support instead of returning an error (e.g. `temperature` on reasoning
                      models like the o-series / gpt-5). Applies to this deployment only.
                    type: boolean
                  extraHeaders:
                    additionalProperties:
                      type: string
                    description: |-
                      ExtraHeaders are additional HTTP headers sent on every upstream request
                      to this deployment (e.g. provider-specific routing or beta headers).
                    type: object
                  maxInputTokens:
                    description: |-
                      MaxInputTokens is the context-window size the router uses for
                      context-window-aware routing and fallbacks (context_window_fallbacks).
                    type: integer
                  maxRetries:
                    description: Max retries for failed requests.
                    type: integer
                  maxTokens:
                    description: |-
                      MaxTokens is a default max_tokens (max completion tokens) applied to
                      requests to this deployment. This is a request-time default sent to the
                      provider and is distinct from modelInfo.maxTokens, which describes the
                      model's total token capacity for routing decisions.
                    type: integer
                  model:
                    description: Provider/model string (e.g., "openai/gpt-4", "anthropic/claude-3-opus").
                    type: string
                  order:
                    description: |-
                      Order sets the deployment's routing priority within its model group.
                      Lower numbers are preferred; higher-order deployments are only used
                      when lower-order ones are unavailable (fallback-style ordering).
                    type: integer
                  organization:
                    description: |-
                      Organization is the provider organization identifier (e.g. an OpenAI
                      organization ID) sent with requests to this deployment.
                    type: string
                  rpm:
                    description: 'Rate limit: requests per minute.'
                    type: integer
                  seed:
                    description: |-
                      Seed is a default seed applied to requests for reproducible outputs
                      (providers that support it).
                    type: integer
                  streamTimeout:
                    description: Stream timeout in seconds.
                    type: integer
                  temperature:
                    description: |-
                      Temperature is a default temperature applied to every request routed to
                      this deployment unless the caller overrides it.
                    type: number
                  timeout:
                    description: Request timeout in seconds.
                    type: integer
                  topP:
                    description: |-
                      TopP is a default top_p applied to every request routed to this
                      deployment unless the caller overrides it.
                    type: number
                  tpm:
                    description: 'Rate limit: tokens per minute.'
                    type: integer
                  vertexCredentialsSecretRef:
                    description: |-
                      VertexCredentialsSecretRef references a Secret key holding the GCP
                      service-account JSON used to authenticate Vertex AI calls. The operator
                      reads the JSON and sends it as `vertex_credentials`; the value is never
                      logged. Ignored when credentialRef is set.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  vertexLocation:
                    description: VertexLocation is the GCP region for Vertex AI models
                      (e.g. "us-central1").
                    type: string
                  vertexProject:
                    description: VertexProject is the GCP project ID for Vertex AI
                      models.
                    type: string
                  weight:
                    description: |-
                      Weight for weighted load balancing across the deployments in this
                      model group. A deployment with weight 2 receives roughly twice the
                      traffic of a deployment with weight 1.
                    type: integer
                required:
                - model
                type: object
              modelInfo:
                description: Optional model metadata.
                properties:
                  accessGroups:
                    description: |-
                      AccessGroups restrict which virtual keys / teams may use this model.
                      A key must be granted one of the listed access groups to route here.
                    items:
                      type: string
                    type: array
                  baseModel:
                    description: |-
                      BaseModel maps this deployment to a known base model for accurate cost
                      tracking and token accounting. Required for Azure deployments where the
                      deployment name differs from the underlying model (e.g. "azure/gpt-4o").
                    type: string
                  cacheCreationInputTokenCost:
                    description: |-
                      CacheCreationInputTokenCost is the cost per token in USD for writing to
                      the provider's prompt cache.
                    type: number
                  cacheReadInputTokenCost:
                    description: |-
                      CacheReadInputTokenCost is the cost per token in USD for reads that hit
                      the provider's prompt cache (e.g. Anthropic / OpenAI prompt caching).
                    type: number
                  healthCheck:
                    description: HealthCheck tunes or disables LiteLLM's per-model
                      health checks.
                    properties:
                      disableBackgroundHealthCheck:
                        description: |-
                          DisableBackgroundHealthCheck skips background health checks for this
                          model when the proxy runs with background_health_checks enabled. Useful
                          for providers that bill or rate-limit health probes, or models that do
                          not support the probe request shape.
                        type: boolean
                      maxTokens:
                        description: MaxTokens overrides the max_tokens used for the
                          health-check request.
                        type: integer
                      maxTokensNonReasoning:
                        description: |-
                          MaxTokensNonReasoning overrides the health-check max_tokens for
                          non-reasoning models.
                        type: integer
                      maxTokensReasoning:
                        description: |-
                          MaxTokensReasoning overrides the health-check max_tokens for reasoning
                          models (which require a larger budget to return a valid response).
                        type: integer
                      model:
                        description: |-
                          Model overrides the model used for the health-check request. Primarily
                          used for wildcard routes where the deployment does not map to a single
                          concrete model (e.g. "openai/gpt-4o-mini").
                        type: string
                      reasoningEffort:
                        description: |-
                          ReasoningEffort sets the reasoning effort used for health-check requests
                          against reasoning models (e.g. "none", "low", "medium", "high").
                        type: string
                      timeoutSeconds:
                        description: |-
                          TimeoutSeconds overrides the health-check request timeout for this model
                          (LiteLLM default is 60 seconds).
                        type: integer
                      voice:
                        description: |-
                          Voice sets the voice used for health-check requests against
                          text-to-speech models (e.g. "alloy").
                        type: string
                    type: object
                  inputCostPerPixel:
                    description: InputCostPerPixel is the cost per pixel in USD for
                      image models.
                    type: number
                  inputCostPerSecond:
                    description: |-
                      InputCostPerSecond is the cost per second in USD for audio / realtime
                      models billed by duration.
                    type: number
                  inputCostPerToken:
                    description: Input cost per token in USD.
                    type: number
                  maxTokens:
                    description: Maximum tokens supported.
                    type: integer
                  mode:
                    description: |-
                      Mode declares the model type so LiteLLM runs the correct health check
                      and routing logic. Common values: "chat", "completion", "embedding",
                      "image_generation", "audio_transcription", "audio_speech", "moderation",
                      "rerank", "responses", "batch", "realtime". Leave empty to let LiteLLM
                      infer from the provider/model string.
                    type: string
                  outputCostPerToken:
                    description: Output cost per token in USD.
                    type: number
                  regionName:
                    description: |-
                      RegionName is the geographic region used for region-based routing
                      (e.g. "us-east-1", "eu").
                    type: string
                  supportedEnvironments:
                    description: |-
                      SupportedEnvironments limits which environments expose this deployment
                      (e.g. "production", "staging", "development").
                    items:
                      type: string
                    type: array
                  tier:
                    description: |-
                      Tier classifies the deployment for tier-based routing. Common values are
                      "free" and "paid".
                    type: string
                  useInPassThrough:
                    description: |-
                      UseInPassThrough allows this deployment to be selected by pass-through
                      endpoints in addition to regular routing.
                    type: boolean
                type: object
              modelName:
                description: Model name exposed to clients.
                type: string
              tags:
                description: |-
                  Tags for tag-based routing. Requests with matching tags
                  will be routed to this model deployment.
                items:
                  type: string
                type: array
            required:
            - instanceRef
            - litellmParams
            - modelName
            type: object
          status:
            description: LiteLLMModelStatus defines the observed state of LiteLLMModel.
            properties:
              conditions:
                description: Standard conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              health:
                description: Model health status reported by LiteLLM.
                type: string
              lastSyncTime:
                description: Last successful sync time.
                format: date-time
                type: string
              latencyP50Ms:
                description: P50 latency in milliseconds.
                type: integer
              latencyP95Ms:
                description: P95 latency in milliseconds.
                type: integer
              litellmModelId:
                description: LiteLLM-assigned model ID.
                type: string
              requestsLast24h:
                description: Request count in last 24 hours.
                format: int64
                type: integer
              synced:
                description: Whether the model is synced to LiteLLM.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
