apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankoroles.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoRole
    listKind: HankoRoleList
    plural: hankoroles
    shortNames:
    - hrole
    singular: hankorole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.realmRef
      name: Realm
      type: string
    - jsonPath: .spec.name
      name: Role
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HankoRole represents one realm-scoped role in Keycloak.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HankoRoleSpec defines the desired state of a realm role.
              Reserved authority role definitions are owned only by the canonical
              HankoRealm in the configured fleet authority realm.
            properties:
              attributes:
                additionalProperties:
                  items:
                    maxLength: 255
                    type: string
                  maxItems: 64
                  type: array
                description: |-
                  Attributes holds arbitrary key/value metadata attached to the role in
                  Keycloak. Values are lists of strings per Keycloak's representation.
                maxProperties: 64
                type: object
                x-kubernetes-validations:
                - message: native map keys require 1..255 characters
                  rule: self.all(k, size(k) > 0 && size(k) <= 255)
              composite:
                description: |-
                  Composite marks this role as a composite role, aggregating the
                  permissions of the roles listed in Composites.
                type: boolean
              composites:
                description: |-
                  Composites lists child realm role names aggregated by this role when
                  Composite is true.
                items:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[^\x00-\x1F\x7F]+$
                  type: string
                maxItems: 64
                type: array
              description:
                description: Description is a human-readable description of the role.
                maxLength: 255
                type: string
              mode:
                default: Manage
                description: |-
                  Mode separates provider reconciliation from read-only observation.
                  The imported-by label always forces effective Observe.
                enum:
                - Manage
                - Observe
                type: string
              name:
                description: Name is the Keycloak realm role name.
                maxLength: 255
                minLength: 1
                pattern: ^[^\x00-\x1F\x7F]+$
                type: string
              realmRef:
                description: RealmRef references the HankoRealm this role belongs
                  to.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
            required:
            - name
            - realmRef
            type: object
            x-kubernetes-validations:
            - message: reserved platform, fleet and cluster roles cannot be defined
                by HankoRole
              rule: self.name != 'HANKO_PLATFORM' && !self.name.startsWith('HANKO_PLATFORM_')
                && !self.name.startsWith('HANKO_FLEET_') && !self.name.startsWith('HANKO_CLUSTER_')
            - message: reserved platform, fleet and cluster roles cannot be inherited
                through HankoRole composites
              rule: '!has(self.composites) || self.composites.all(r, r != ''HANKO_PLATFORM''
                && !r.startsWith(''HANKO_PLATFORM_'') && !r.startsWith(''HANKO_FLEET_'')
                && !r.startsWith(''HANKO_CLUSTER_''))'
            - message: provider ownership and adoption receipt attributes are reserved
              rule: '!has(self.attributes) || self.attributes.all(k, !(k.startsWith(''hanko.sh/'')
                && (k.contains(''owner'') || k == ''hanko.sh/adoption-receipt'')))'
          status:
            description: HankoRoleStatus describes the observed state of the realm
              role.
            properties:
              adoptionCandidate:
                description: AdoptionCandidate is bounded review evidence, never execution
                  authority.
                properties:
                  approvable:
                    type: boolean
                  candidateHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  complete:
                    type: boolean
                  contractVersion:
                    enum:
                    - hanko.sh/adoption-contract/v1alpha1
                    type: string
                  diff:
                    items:
                      properties:
                        classification:
                          enum:
                          - supported-typed-native
                          - preserved-readonly-native
                          - unsupported
                          - conflicting
                          - security-sensitive-excluded
                          type: string
                        code:
                          enum:
                          - equal
                          - would-manage
                          - would-change
                          - would-preserve
                          - provider-native-readonly
                          - unsupported
                          - credential-excluded
                          - recreation-required
                          - ownership-transition
                          type: string
                        current:
                          description: AdoptionValue contains only reviewed non-secret
                            semantic fields.
                          properties:
                            flag:
                              type: boolean
                            set:
                              items:
                                maxLength: 512
                                type: string
                              maxItems: 1024
                              type: array
                              x-kubernetes-list-type: set
                            text:
                              maxLength: 512
                              type: string
                          type: object
                        desired:
                          description: AdoptionValue contains only reviewed non-secret
                            semantic fields.
                          properties:
                            flag:
                              type: boolean
                            set:
                              items:
                                maxLength: 512
                                type: string
                              maxItems: 1024
                              type: array
                              x-kubernetes-list-type: set
                            text:
                              maxLength: 512
                              type: string
                          type: object
                        domain:
                          maxLength: 64
                          type: string
                        field:
                          maxLength: 64
                          type: string
                        identity:
                          maxLength: 128
                          type: string
                        object:
                          maxLength: 255
                          type: string
                        roundTrip:
                          enum:
                          - lossless-represented
                          - preserved-native
                          - lossy
                          - unsupported
                          type: string
                      required:
                      - classification
                      - code
                      - domain
                      - field
                      - identity
                      - object
                      - roundTrip
                      type: object
                    maxItems: 256
                    type: array
                  diffHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  findings:
                    items:
                      properties:
                        blocking:
                          type: boolean
                        code:
                          maxLength: 512
                          type: string
                        domain:
                          maxLength: 64
                          type: string
                        message:
                          maxLength: 512
                          type: string
                      required:
                      - blocking
                      - code
                      - domain
                      - message
                      type: object
                    maxItems: 32
                    type: array
                  observationHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  providerIdentity:
                    description: AdoptionProviderIdentity excludes AdminRef, credentials
                      and credential hashes.
                    properties:
                      caIdentity:
                        description: CAIdentity binds the public trust bundle and
                          Secret UID.
                        maxLength: 255
                        type: string
                      caReference:
                        maxLength: 255
                        type: string
                      instance:
                        description: AdoptionTargetIdentity identifies a current object,
                          never write authority.
                        properties:
                          generation:
                            format: int64
                            minimum: 0
                            type: integer
                          importRef:
                            description: ImportRef binds the discovery latch without
                              consuming it.
                            maxLength: 255
                            type: string
                          kind:
                            maxLength: 64
                            type: string
                          name:
                            maxLength: 255
                            type: string
                          namespace:
                            maxLength: 255
                            type: string
                          tenantRef:
                            description: TenantRef binds connection-selecting target
                              metadata without acquiring it.
                            maxLength: 255
                            type: string
                          uid:
                            maxLength: 128
                            type: string
                        required:
                        - kind
                        - name
                        - namespace
                        - uid
                        type: object
                      objectIDs:
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 512
                        type: array
                        x-kubernetes-list-type: set
                      origin:
                        maxLength: 2048
                        type: string
                      realmID:
                        maxLength: 128
                        type: string
                      trust:
                        description: Unknown is reserved for incomplete diagnostic
                          evidence.
                        enum:
                        - public-ca
                        - private-ca
                        - explicit-http
                        - unknown
                        type: string
                    required:
                    - instance
                    - origin
                    - realmID
                    - trust
                    type: object
                  target:
                    description: AdoptionTargetIdentity identifies a current object,
                      never write authority.
                    properties:
                      generation:
                        format: int64
                        minimum: 0
                        type: integer
                      importRef:
                        description: ImportRef binds the discovery latch without consuming
                          it.
                        maxLength: 255
                        type: string
                      kind:
                        maxLength: 64
                        type: string
                      name:
                        maxLength: 255
                        type: string
                      namespace:
                        maxLength: 255
                        type: string
                      tenantRef:
                        description: TenantRef binds connection-selecting target metadata
                          without acquiring it.
                        maxLength: 255
                        type: string
                      uid:
                        maxLength: 128
                        type: string
                    required:
                    - kind
                    - name
                    - namespace
                    - uid
                    type: object
                  truncated:
                    type: boolean
                required:
                - approvable
                - candidateHash
                - complete
                - contractVersion
                - diffHash
                - observationHash
                - providerIdentity
                - target
                - truncated
                type: object
              adoptionReceipt:
                description: |-
                  AdoptionReceiptStatus reports a live provider checkpoint, never write or
                  deletion authority. A failed status update can be recovered from the provider.
                properties:
                  candidateHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  contractVersion:
                    enum:
                    - hanko.sh/adoption-contract/v1alpha1
                    type: string
                  state:
                    enum:
                    - Pending
                    - Verified
                    - Partial
                    - Conflict
                    type: string
                required:
                - candidateHash
                - contractVersion
                - state
                type: object
              appliedGeneration:
                description: |-
                  AppliedGeneration is the latest Manage generation proven by matching
                  provider read-back. Observe clears applied evidence and cannot advance it.
                format: int64
                minimum: 0
                type: integer
              appliedPlanHash:
                description: |-
                  AppliedPlanHash identifies the latest Manage plan proven by matching read-back.
                  Observe clears applied evidence and cannot claim provider application.
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              backendKind:
                maxLength: 32
                type: string
              capabilities:
                description: RoleCapabilitySnapshot is domain-specific; it is not
                  a global provider API.
                properties:
                  composites:
                    type: boolean
                  nativeAttributes:
                    type: boolean
                  realmRoles:
                    type: boolean
                required:
                - composites
                - nativeAttributes
                - realmRoles
                type: object
              capabilityEvidence:
                description: CapabilityEvidence names static adapter qualification,
                  not runtime discovery.
                properties:
                  qualificationWindow:
                    maxLength: 64
                    type: string
                  source:
                    maxLength: 64
                    type: string
                type: object
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contractVersion:
                description: ContractVersion identifies canonical evidence semantics,
                  not an executable API.
                maxLength: 64
                type: string
              driftState:
                description: |-
                  DriftState is the comparison for ObservationPlanHash. Failure conditions
                  describe the current attempt; an older observation is historical evidence.
                enum:
                - Unknown
                - InSync
                - Drifted
                type: string
              evaluatedGeneration:
                description: |-
                  EvaluatedGeneration is the latest generation whose execution semantics
                  were fully evaluated or definitively refused. It does not prove application.
                format: int64
                minimum: 0
                type: integer
              evaluatedPlanHash:
                description: |-
                  EvaluatedPlanHash identifies the locally compiled provider-bound plan.
                  It is absent for rejected evaluation and is never execution authority.
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              findings:
                items:
                  description: AuthorizationFinding is a machine-readable portability
                    or provider-native gap.
                  properties:
                    classification:
                      enum:
                      - lossless
                      - lossy
                      - unsupported
                      type: string
                    code:
                      maxLength: 64
                      type: string
                    message:
                      maxLength: 256
                      type: string
                    objectKind:
                      maxLength: 64
                      type: string
                    objectName:
                      maxLength: 255
                      type: string
                    readOnly:
                      type: boolean
                  required:
                  - classification
                  - code
                  - message
                  - objectKind
                  - objectName
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - classification
                - objectKind
                - objectName
                - code
                x-kubernetes-list-type: map
              intentHash:
                description: IntentHash identifies normalized portable semantics of
                  EvaluatedGeneration.
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              lastReconciled:
                description: LastReconciled is the timestamp of the last successful
                  reconciliation.
                format: date-time
                maxLength: 64
                type: string
              observationComplete:
                description: |-
                  ObservationComplete distinguishes full supported-contract read-back from
                  partial coverage. A partial observation can prove drift but never equality.
                type: boolean
              observationGeneration:
                description: |-
                  ObservationGeneration and ObservationPlanHash bind the latest successful
                  bounded read to its evaluated input. They remain unchanged on read failure.
                format: int64
                minimum: 0
                type: integer
              observationPlanHash:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest generation processed into this status,
                  including failures; it does not mean successfully applied.
                format: int64
                minimum: 0
                type: integer
              observedStateHash:
                description: |-
                  ObservedStateHash identifies safe normalized provider semantics, including
                  observation coverage. It is neither an intent/plan identity nor a provider ID.
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              phase:
                description: Phase summarises the reconciliation state.
                enum:
                - Pending
                - Reconciling
                - Ready
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
