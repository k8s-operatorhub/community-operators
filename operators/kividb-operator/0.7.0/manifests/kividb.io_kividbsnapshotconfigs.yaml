apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/managed-by: kividb-operator
    app.kubernetes.io/name: kividb-operator
  name: kividbsnapshotconfigs.kividb.io
spec:
  group: kividb.io
  names:
    kind: KividbSnapshotConfig
    listKind: KividbSnapshotConfigList
    plural: kividbsnapshotconfigs
    shortNames:
    - kdbsc
    singular: kividbsnapshotconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KividbSnapshotConfig is a reusable, standalone backup destination
          and schedule. Create one and reference it by name from any number of KividbClusters'
          spec.snapshotConfigRef. Each scheduled run creates a KividbSnapshot record.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              jobResources:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              retention:
                default: 7
                description: Number of most-recent snapshots to keep in S3. 0 = keep
                  all.
                type: integer
              s3:
                properties:
                  bucket:
                    type: string
                  credentialsSecretRef:
                    properties:
                      accessKeyIdKey:
                        type: string
                      name:
                        type: string
                      secretAccessKeyKey:
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    type: string
                  forcePathStyle:
                    type: boolean
                  insecureSkipTLSVerify:
                    type: boolean
                  pathPrefix:
                    type: string
                  region:
                    type: string
                required:
                - endpoint
                - bucket
                - credentialsSecretRef
                type: object
              schedule:
                description: Standard cron expression, e.g. "0 * * * *".
                type: string
              source:
                default: master
                description: 'Which role''s pod to snapshot from. Recommended: master
                  (always the most complete, up-to-date data; kividb''s replication
                  has no guaranteed consistency lag bound today, so a replica-sourced
                  snapshot can be measurably stale).'
                enum:
                - master
                - replica
                type: string
              timeoutSeconds:
                format: int32
                type: integer
            required:
            - schedule
            - s3
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
