metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
    alm-examples: '[{"apiVersion":"krkn.krkn-chaos.dev/v1alpha1","kind":"KrknFileType","metadata":{"name":"configuration"},"spec":{"name":"configuration","color":"#4A90E2"}}]'
  creationTimestamp: null
  name: krknfiletypes.krkn.krkn-chaos.dev
spec:
  group: krkn.krkn-chaos.dev
  names:
    kind: KrknFileType
    listKind: KrknFileTypeList
    plural: krknfiletypes
    shortNames:
      - kft
    singular: krknfiletype
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.color
          name: Color
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            KrknFileType is the Schema for the krknfiletypes API.
            It defines metadata for file categories used in the ConfigMap-based file management system.

            File types are automatically created when first used in a file, allowing for
            GitHub-style label management where types can be created on-the-fly or reused.

            Each file can have only one type, enforced at the API level.
            Types cannot be deleted if files are still using them (enforced by the API handler).
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: "KrknFileTypeSpec defines the desired state of KrknFileType.\nKrknFileType represents a file category (e.g., \"config\", \"script\", \"template\")\nfor organizing ConfigMap-based files in the krkn-operator file management system.\n\nFile types are auto-created when first referenced in a file and can be reused\nacross multiple files. Each file has exactly one type, associated via labels:\n\n\tfile-type.krkn.krkn-chaos.dev/<type-name>: \"true\"\n\nUI metadata (color) helps users visually distinguish file categories."
              properties:
                color:
                  description: |-
                    Color is an optional hex color for UI display (e.g., "#FF5733")
                    If empty, the UI will use a default color
                  pattern: ^#[0-9A-Fa-f]{6}$|^$
                  type: string
                name:
                  description: |-
                    Name is the file type identifier (e.g., "config", "script", "template")
                    This duplicates metadata.name for API convenience
                  type: string
              required:
                - name
              type: object
          type: object
      served: true
      storage: true
      subresources: {}
