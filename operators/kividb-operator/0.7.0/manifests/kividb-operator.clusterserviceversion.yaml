        serviceAccountName: kividb-operator-manager
      deployments:
      - label:
          app.kubernetes.io/component: manager
          app.kubernetes.io/managed-by: kividb-operator
          app.kubernetes.io/name: kividb-operator
        name: kividb-operator-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/component: manager
              app.kubernetes.io/managed-by: kividb-operator
              app.kubernetes.io/name: kividb-operator
          strategy: {}
          template:
            metadata:
              labels:
                app.kubernetes.io/component: manager
                app.kubernetes.io/managed-by: kividb-operator
                app.kubernetes.io/name: kividb-operator
            spec:
              containers:
              - args:
                - --leader-elect
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=:8080
                - --agent-token-secret=kividb-operator-agent-token
                env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: docker.io/kividb/kividb-operator:0.7.0
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8080
                  name: metrics
                  protocol: TCP
                - containerPort: 8081
                  name: probes
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
              securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
              serviceAccountName: kividb-operator-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
