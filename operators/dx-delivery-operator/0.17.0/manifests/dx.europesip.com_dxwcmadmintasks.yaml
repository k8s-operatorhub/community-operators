---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dxwcmadmintasks.dx.europesip.com
spec:
  group: dx.europesip.com
  names:
    kind: DXWCMAdminTask
    listKind: DXWCMAdminTaskList
    plural: dxwcmadmintasks
    shortNames:
    - dxwcmadmin
    singular: dxwcmadmintask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.task
      name: Task
      type: string
    - jsonPath: .spec.fix
      name: Fix
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DXWCMAdminTask runs a maintenance module of Web Content Manager on DX Compose (member fixer, workflow checker), the
          ConfigEngine run-wcm-admin-task-* of traditional DX, once per spec; report only unless spec.fix.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DXWCMAdminTaskSpec is the module to run, on which libraries
              and how.
            properties:
              allLibraries:
                description: 'AllLibraries: every library of the portal (read from
                  WCM REST when the run starts), one request per library.'
                type: boolean
              connectionRef:
                description: 'ConnectionRef: the DXConnection of the DX.'
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              dependsOn:
                description: 'DependsOn: resources that must be Ready first.'
                items:
                  description: Dependency is an object that must be ready before the
                    resource is reconciled.
                  properties:
                    apiVersion:
                      description: APIVersion of the object, for example apps/v1 (default)
                        or dx.europesip.com/v1alpha1.
                      type: string
                    kind:
                      description: 'Kind: Deployment, StatefulSet, Job, DXScriptApplication,
                        DXPage, DXDamCollection, DXDatabase, DXTheme, DXWCMLibraryImport
                        or DXXMLAccess.'
                      enum:
                      - Deployment
                      - StatefulSet
                      - Job
                      - DXScriptApplication
                      - DXPage
                      - DXDamCollection
                      - DXDatabase
                      - DXTheme
                      - DXWCMLibraryImport
                      - DXXMLAccess
                      type: string
                    name:
                      description: Name of the object, in the same namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              fix:
                description: |-
                  Fix: apply the changes. Default false: report only (DX changes nothing). Run a report first: HCL warns that the
                  fixes may not be easy to undo.
                type: boolean
              libraries:
                description: Libraries to process, by title. One request per library,
                  one after the other.
                items:
                  type: string
                maxItems: 500
                type: array
              memberFixer:
                description: MemberFixer options (task MemberFixer).
                properties:
                  altDn:
                    description: |-
                      AltDn: references to users or groups that no longer exist: update replaces them with the alternate DNs of
                      MemberFixerModule.properties, remove deletes them (altDn).
                    enum:
                    - update
                    - remove
                    type: string
                  invalidDn:
                    description: |-
                      InvalidDn: references with an invalid DN: update replaces them with the DN of the portal administrator,
                      remove deletes them (invalidDn).
                    enum:
                    - update
                    - remove
                    type: string
                  mismatchedId:
                    description: |-
                      MismatchedId: references to users whose unique ID changed in the user repository: update fixes the ID,
                      remove deletes them (mismatchedId). HCL warns to use it with care, mainly together with invalidDn.
                    enum:
                    - update
                    - remove
                    type: string
                  noRealmDn:
                    description: 'NoRealmDn: also check references outside the base
                      DNs of every realm (noRealmDn).'
                    type: boolean
                  realm:
                    description: 'Realm to process in a federated user registry (default:
                      the default realm).'
                    type: string
                type: object
              output:
                description: 'Output: where else the report goes.'
                properties:
                  oci:
                    description: 'OCI: push the report of every library as an OCI
                      artifact (one file per library and REPORT-INFO.txt).'
                    properties:
                      pushSecrets:
                        description: 'PushSecrets: Secrets of type kubernetes.io/dockerconfigjson
                          with credentials that may push to the repository.'
                        items:
                          description: LocalObjectReference names an object in the
                            same namespace.
                          properties:
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      repository:
                        description: Repository without tag, for example harbor.example.com/dx-exports/url-mappings.
                        pattern: ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$
                        type: string
                      tag:
                        description: 'Tag of each run. ${DATE} is replaced by the
                          time of the run (yyyymmdd-hhmmss, UTC). Default: ${DATE}.'
                        type: string
                    required:
                    - repository
                    type: object
                type: object
              preserveDates:
                description: 'PreserveDates: keep the last modified date of the items
                  that are saved (preserve_dates).'
                type: boolean
              restrictOn:
                description: 'RestrictOn: only these item types (default: all).'
                items:
                  description: WCMItemType is an item type of WCM, for restrictOn.
                  enum:
                  - Content
                  - Folder
                  - Project
                  - PresentationTemplate
                  - AuthoringTemplate
                  - ContentTemplate
                  - SiteAreaTemplate
                  - Taxonomy
                  - Category
                  - SiteArea
                  - Workflow
                  - WorkflowStage
                  - WorkflowAction
                  - Cmpnt
                  type: string
                type: array
              suspend:
                description: Suspend stops the reconciliation.
                type: boolean
              task:
                description: 'Task: the module to run.'
                enum:
                - MemberFixer
                - WorkflowControlChecker
                type: string
              timeout:
                description: Timeout of the request of each library. Default 1h.
                type: string
              virtualPortal:
                description: 'VirtualPortal: URL context of a virtual portal; empty
                  for the base portal.'
                pattern: ^[a-zA-Z0-9_-]{0,64}$
                type: string
              workflowChecker:
                description: WorkflowChecker options (task WorkflowControlChecker).
                properties:
                  preserveSecurityInheritancePropagation:
                    description: |-
                      PreserveSecurityInheritancePropagation, with updateDocSecurity: keep the inheritance and propagation of the
                      security of each item.
                    type: boolean
                  repairInvalidWorkflow:
                    description: |-
                      RepairInvalidWorkflow finds the items whose workflow and workflow stage are both empty; with fix it moves them
                      to the internal system workflow.
                    type: boolean
                  rescheduleActions:
                    description: RescheduleActions schedules again the pending workflow
                      actions (scheduled moves, expiry...).
                    type: boolean
                  updateDocSecurity:
                    description: UpdateDocSecurity saves every workflowed item again,
                      applying the security of its workflow stage.
                    type: boolean
                type: object
            required:
            - connectionRef
            - task
            type: object
            x-kubernetes-validations:
            - message: 'libraries (one or more) or allLibraries: true, not both'
              rule: (has(self.allLibraries) && self.allLibraries) != (has(self.libraries)
                && size(self.libraries) > 0)
          status:
            description: DXWCMAdminTaskStatus is the result of the last run.
            properties:
              appliedHash:
                description: |-
                  AppliedHash of the spec of the last finished run (it runs again only when the spec changes, or with the
                  annotation dx.europesip.com/reconcile).
                type: string
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentLibrary:
                description: CurrentLibrary being processed (1-based), while it runs.
                type: integer
              libraries:
                description: 'Libraries: the summary of each library, in order.'
                items:
                  description: WCMAdminLibraryResult is the summary DX gave for one
                    library.
                  properties:
                    errors:
                      description: Errors DX detected.
                      type: integer
                    itemsProcessed:
                      description: 'ItemsProcessed, ItemsUpdated: "Items Processed",
                        "Items Updated and Saved".'
                      type: integer
                    itemsUpdated:
                      type: integer
                    library:
                      type: string
                    referencesToRemove:
                      description: 'Member fixer: references that need removal / update,
                        virtual members that need update.'
                      type: integer
                    referencesToUpdate:
                      type: integer
                    result:
                      description: 'Result: ok, or the error of the request.'
                      type: string
                    virtualMembersToUpdate:
                      type: integer
                  required:
                  - library
                  - result
                  type: object
                type: array
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              outputDigest:
                type: string
              outputRef:
                description: 'OutputRef and OutputDigest: the artifact with the report,
                  when spec.output.oci is set.'
                type: string
              phase:
                description: WCMAdminTaskPhase is where a run is.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              reportConfigMap:
                description: |-
                  ReportConfigMap: the ConfigMap with DX's answer for every library (the per item detail is only in the log of
                  the Web Engine).
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
