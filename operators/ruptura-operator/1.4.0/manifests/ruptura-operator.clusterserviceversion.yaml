apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: ruptura-operator.v1.4.0
  namespace: placeholder
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "ruptura.io/v1alpha1",
          "kind": "RupturaInstance",
          "metadata": {"name": "ruptura", "namespace": "ruptura-system"},
          "spec": {
            "storageSize": "10Gi",
            "level": {"scope": "workload"},
            "input": {"profile": "minimal"},
            "analysis": {"sensitivity": "balanced", "horizon": "30m"},
            "logging": {"level": "info"}
          }
        }
      ]
    capabilities: Basic Install
    categories: Monitoring
    containerImage: ghcr.io/benfradjselim/ruptura-operator@sha256:96a252a9bbab52c328277b9af61c5ffa01c6a02c8ba4a549d3c1e97366b0cb2b
    createdAt: "2026-11-04T00:00:00Z"
    description: Names Kubernetes workload failures before and as they happen, with evidence and a recommended action.
    operatorframework.io/suggested-namespace: ruptura-system
    repository: https://github.com/benfradjselim/ruptura
    support: https://github.com/benfradjselim/ruptura/issues
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
spec:
  displayName: Ruptura Operator
  description: |
    Ruptura watches your workloads and names their failures: a memory limit about
    to be reached, a crash loop, a pod that cannot start, a stuck rollout, missing
    replicas, CPU throttling, an OOM kill, and failures that recur on a rhythm.
    Each result says whether the failure is predicted or detected, when it is
    expected, the measurement behind it, and what to do.

    ## How it works

    Create one `RupturaInstance`. The operator deploys the Ruptura engine with its
    storage, service, API key and, on OpenShift, a Route and read access to the
    cluster monitoring stack. The engine reads Prometheus metrics and Kubernetes
    events, and needs no agent on your workloads.

    Results are served at `/api/v2/failures` and in the web console, and can be sent
    to Alertmanager.

    ## Configuration

    - `level.scope` and `level.selector`: report per workload, pod or namespace,
      and limit results to workloads with given labels.
    - `input.profile`: which metrics the engine reads.
    - `analysis.sensitivity` and `analysis.horizon`: how early a predicted failure
      turns a workload degraded.
    - `alerting.channels`: Alertmanager endpoints that receive active failures.
    - `logging.level`: engine log level.

    An invalid spec is refused with phase `Failed` and the reasons in `status.message`;
    nothing is deployed until it is fixed.

    ## Prerequisites

    Kubernetes 1.25 or later, or OpenShift 4.12 or later. On plain Kubernetes the
    engine needs a reachable Prometheus.
  maturity: alpha
  version: 1.4.0
  minKubeVersion: "1.25.0"
  relatedImages:
    - name: ruptura-operator
      image: ghcr.io/benfradjselim/ruptura-operator@sha256:96a252a9bbab52c328277b9af61c5ffa01c6a02c8ba4a549d3c1e97366b0cb2b
    - name: ruptura
      image: docker.io/selimbf/ruptura@sha256:8dd37db29619ae7cf1e14492b6f748f90d074650e448b34e0eaaa0f58b9ee2fd
  icon:
    - base64data: 
      mediatype: image/png
  keywords: [monitoring, observability, sre, failure-prediction, kubernetes, openshift]
  maintainers:
    - name: Ruptura Maintainers
      email: benfradjselim@gmail.com
  provider:
    name: Ruptura
    url: https://github.com/benfradjselim/ruptura
  links:
    - name: GitHub
      url: https://github.com/benfradjselim/ruptura
    - name: Issues
      url: https://github.com/benfradjselim/ruptura/issues
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/arch.arm64: supported
    operatorframework.io/os.linux: supported
  customresourcedefinitions:
    owned:
      - name: rupturainstances.ruptura.io
        version: v1alpha1
        kind: RupturaInstance
        displayName: Ruptura Instance
        description: One Ruptura engine, its storage, service, API key and, on OpenShift, its Route.
        resources:
          - {name: ruptura, version: v1, kind: Deployment}
          - {name: ruptura, version: v1, kind: Service}
          - {name: ruptura, version: v1, kind: PersistentVolumeClaim}
          - {name: ruptura, version: v1, kind: Secret}
          - {name: ruptura, version: v1, kind: ServiceAccount}
          - {name: ruptura, version: v1, kind: Route}
        specDescriptors:
          - path: storageSize
            displayName: Storage Size
            description: Size of the engine storage volume, for example 10Gi.
            x-descriptors: ["urn:alm:descriptor:com.tectonic.ui:text"]
          - path: apiKeyRef
            displayName: API Key Secret
            description: Secret with an api-key key. Generated when empty.
            x-descriptors: ["urn:alm:descriptor:io.kubernetes:Secret"]
          - path: level.scope
            displayName: Report Level
            description: workload, pod or namespace.
            x-descriptors: ["urn:alm:descriptor:com.tectonic.ui:select:workload", "urn:alm:descriptor:com.tectonic.ui:select:pod", "urn:alm:descriptor:com.tectonic.ui:select:namespace"]
          - path: analysis.horizon
            displayName: Warning Horizon
            description: How long before a predicted failure a workload turns degraded, for example 30m.
            x-descriptors: ["urn:alm:descriptor:com.tectonic.ui:text"]
          - path: logging.level
            displayName: Log Level
            x-descriptors: ["urn:alm:descriptor:com.tectonic.ui:select:debug", "urn:alm:descriptor:com.tectonic.ui:select:info", "urn:alm:descriptor:com.tectonic.ui:select:warn", "urn:alm:descriptor:com.tectonic.ui:select:error"]
          - path: resources
            displayName: Resources
            x-descriptors: ["urn:alm:descriptor:com.tectonic.ui:resourceRequirements"]
        statusDescriptors:
          - path: phase
            displayName: Phase
            x-descriptors: ["urn:alm:descriptor:io.kubernetes.phase"]
          - path: message
            displayName: Message
            x-descriptors: ["urn:alm:descriptor:text"]
          - path: readyReplicas
            displayName: Ready Replicas
            x-descriptors: ["urn:alm:descriptor:com.tectonic.ui:podCount"]
  install:
    strategy: deployment
    spec:
      clusterPermissions:
        - serviceAccountName: ruptura-operator
          rules:
            # Manage RupturaInstance CRDs
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterrolebindings"]
              verbs: ["get", "create", "update", "patch", "delete"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterroles"]
              resourceNames: ["cluster-monitoring-view", "ruptura-instance-reader"]
              verbs: ["bind"]
            # Let instances post to the OpenShift cluster Alertmanager
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["rolebindings"]
              verbs: ["get", "create", "update", "patch", "delete"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles"]
              resourceNames: ["monitoring-alertmanager-edit"]
              verbs: ["bind"]
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "create", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "create", "update", "delete"]
            - apiGroups: ["ruptura.io"]
              resources: ["rupturainstances", "rupturainstances/status"]
              verbs: ["get", "list", "watch", "update", "patch"]
            # Manage Deployments
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            # Manage Services, PVCs, ServiceAccounts and the generated API key Secret
            - apiGroups: [""]
              resources: ["services", "persistentvolumeclaims", "serviceaccounts"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            # OpenShift Routes (no-op on vanilla K8s — API simply won't be present)
            - apiGroups: ["route.openshift.io"]
              resources: ["routes"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            # OpenShift SCC probe (read-only)
            - apiGroups: ["security.openshift.io"]
              resources: ["securitycontextconstraints"]
              verbs: ["get", "list"]
            - apiGroups: ["security.openshift.io"]
              resources: ["securitycontextconstraints"]
              resourceNames: ["restricted-v2"]
              verbs: ["use"]
      deployments:
        - name: ruptura-operator
          label:
            app.kubernetes.io/name: ruptura
            app.kubernetes.io/component: operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: ruptura
                app.kubernetes.io/component: operator
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: ruptura
                  app.kubernetes.io/component: operator
                  app.kubernetes.io/version: "1.4.0"
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9090"
                  prometheus.io/path: "/metrics"
              spec:
                serviceAccountName: ruptura-operator
                securityContext:
                  runAsNonRoot: true
                containers:
                  - name: ruptura-operator
                    image: ghcr.io/benfradjselim/ruptura-operator@sha256:96a252a9bbab52c328277b9af61c5ffa01c6a02c8ba4a549d3c1e97366b0cb2b
                    imagePullPolicy: IfNotPresent
                    args: ["--interval=30s", "--metrics-addr=:9090"]
                    env:
                      - name: RELATED_IMAGE_RUPTURA
                        value: docker.io/selimbf/ruptura@sha256:8dd37db29619ae7cf1e14492b6f748f90d074650e448b34e0eaaa0f58b9ee2fd
                    ports:
                      - name: metrics
                        containerPort: 9090
                        protocol: TCP
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 9090
                      initialDelaySeconds: 5
                      periodSeconds: 15
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 9090
                      initialDelaySeconds: 3
                      periodSeconds: 10
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                    resources:
                      requests:
                        cpu: "50m"
                        memory: "32Mi"
                      limits:
                        cpu: "200m"
                        memory: "128Mi"
  installModes:
    - {type: OwnNamespace, supported: false}
    - {type: SingleNamespace, supported: false}
    - {type: MultiNamespace, supported: false}
    - {type: AllNamespaces, supported: true}
