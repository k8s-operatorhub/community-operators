apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankoimports.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoImport
    listKind: HankoImportList
    plural: hankoimports
    shortNames:
    - hi
    singular: hankoimport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.sourceRef
      name: Source
      type: string
    - jsonPath: .status.applied.total
      name: Applied
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HankoImport is a one-shot operation that scans an existing Keycloak instance
          and generates HankoRealm, HankoApplication and HankoServiceAccount CRDs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoImportSpec defines the desired state of an import operation.
            properties:
              dryRun:
                description: DryRun generates the import report without applying any
                  CRDs.
                type: boolean
              includeClients:
                default: true
                description: IncludeClients controls whether qualified OIDC and SAML
                  clients are imported as HankoApplication objects.
                type: boolean
              includeIdentityProviders:
                default: true
                description: |-
                  IncludeIdentityProviders controls whether realm brokers and their mappers
                  are captured in generated HankoRealm objects. Sensitive config is omitted.
                type: boolean
              includeServiceAccounts:
                default: true
                description: IncludeServiceAccounts controls whether M2M clients are
                  imported as HankoServiceAccount objects.
                type: boolean
              realms:
                description: Realms is the list of realm names to import. Empty means
                  all realms.
                items:
                  maxLength: 255
                  type: string
                maxItems: 16
                type: array
              sourceRef:
                description: SourceRef is the name of the HankoKeycloakInstance to
                  import from.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
            required:
            - sourceRef
            type: object
          status:
            description: HankoImportStatus describes the observed state of the import
              operation.
            properties:
              applied:
                description: Applied holds counts of CRDs successfully created or
                  updated.
                properties:
                  applications:
                    description: Applications is the count of OIDC client applications.
                    type: integer
                  authorizationObjects:
                    type: integer
                  groups:
                    type: integer
                  identityProviderMappers:
                    description: IdentityProviderMappers is the count of mappers attached
                      to imported brokers.
                    type: integer
                  identityProviders:
                    description: IdentityProviders is the count of realm-scoped upstream
                      brokers.
                    type: integer
                  organizations:
                    type: integer
                  realms:
                    description: Realms is the count of Keycloak realms.
                    type: integer
                  resourceServers:
                    type: integer
                  roles:
                    type: integer
                  serviceAccounts:
                    description: ServiceAccounts is the count of M2M service account
                      clients.
                    type: integer
                  total:
                    description: Total is the sum of every discovered or applied resource
                      and nested broker object.
                    type: integer
                type: object
              completedAt:
                description: CompletedAt is the timestamp when the import finished.
                format: date-time
                maxLength: 64
                type: string
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              coverage:
                description: Coverage measures discovery; terminal Done does not imply
                  complete inventory.
                properties:
                  candidateCount:
                    minimum: 0
                    type: integer
                  complete:
                    type: boolean
                  inventoryCount:
                    minimum: 0
                    type: integer
                  observationHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  truncated:
                    type: boolean
                  unsupportedCount:
                    minimum: 0
                    type: integer
                required:
                - candidateCount
                - complete
                - inventoryCount
                - truncated
                - unsupportedCount
                type: object
              discovered:
                description: Discovered holds counts of resources found in the source
                  Keycloak instance.
                properties:
                  applications:
                    description: Applications is the count of OIDC client applications.
                    type: integer
                  authorizationObjects:
                    type: integer
                  groups:
                    type: integer
                  identityProviderMappers:
                    description: IdentityProviderMappers is the count of mappers attached
                      to imported brokers.
                    type: integer
                  identityProviders:
                    description: IdentityProviders is the count of realm-scoped upstream
                      brokers.
                    type: integer
                  organizations:
                    type: integer
                  realms:
                    description: Realms is the count of Keycloak realms.
                    type: integer
                  resourceServers:
                    type: integer
                  roles:
                    type: integer
                  serviceAccounts:
                    description: ServiceAccounts is the count of M2M service account
                      clients.
                    type: integer
                  total:
                    description: Total is the sum of every discovered or applied resource
                      and nested broker object.
                    type: integer
                type: object
              findings:
                description: |-
                  Findings reports protocol inventory that cannot be imported safely.
                  No incompatible OIDC manifest is generated for a SAML/unknown client.
                items:
                  description: AuthorizationFinding is a machine-readable portability
                    or provider-native gap.
                  properties:
                    classification:
                      enum:
                      - lossless
                      - lossy
                      - unsupported
                      type: string
                    code:
                      maxLength: 64
                      type: string
                    message:
                      maxLength: 256
                      type: string
                    objectKind:
                      maxLength: 64
                      type: string
                    objectName:
                      maxLength: 255
                      type: string
                    readOnly:
                      type: boolean
                  required:
                  - classification
                  - code
                  - message
                  - objectKind
                  - objectName
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - classification
                - objectKind
                - objectName
                - code
                x-kubernetes-list-type: map
              inventory:
                description: Inventory holds bounded summaries; full diffs live on
                  Observe targets.
                items:
                  description: ImportInventoryReference is a compact identity/coverage
                    summary, not a diff.
                  properties:
                    approvable:
                      type: boolean
                    candidateHash:
                      maxLength: 71
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    complete:
                      type: boolean
                    findings:
                      items:
                        properties:
                          blocking:
                            type: boolean
                          code:
                            maxLength: 512
                            type: string
                          domain:
                            maxLength: 64
                            type: string
                          message:
                            maxLength: 512
                            type: string
                        required:
                        - blocking
                        - code
                        - domain
                        - message
                        type: object
                      maxItems: 32
                      type: array
                    kind:
                      maxLength: 64
                      type: string
                    providerID:
                      maxLength: 128
                      type: string
                    realm:
                      maxLength: 255
                      type: string
                    target:
                      description: AdoptionTargetIdentity identifies a current object,
                        never write authority.
                      properties:
                        generation:
                          format: int64
                          minimum: 0
                          type: integer
                        importRef:
                          description: ImportRef binds the discovery latch without
                            consuming it.
                          maxLength: 255
                          type: string
                        kind:
                          maxLength: 64
                          type: string
                        name:
                          maxLength: 255
                          type: string
                        namespace:
                          maxLength: 255
                          type: string
                        tenantRef:
                          description: TenantRef binds connection-selecting target
                            metadata without acquiring it.
                          maxLength: 255
                          type: string
                        uid:
                          maxLength: 128
                          type: string
                      required:
                      - kind
                      - name
                      - namespace
                      - uid
                      type: object
                  required:
                  - approvable
                  - complete
                  - kind
                  - providerID
                  - realm
                  type: object
                maxItems: 128
                type: array
              lastReconciled:
                description: LastReconciled is the timestamp of the last reconcile
                  loop.
                format: date-time
                maxLength: 64
                type: string
              phase:
                description: 'Phase: Pending | Scanning | Applying | Done | Failed'
                enum:
                - Pending
                - Scanning
                - Applying
                - Done
                - Failed
                type: string
              skipped:
                description: Skipped holds counts of resources that were not imported
                  (dry-run or already exist).
                properties:
                  applications:
                    description: Applications is the count of OIDC client applications.
                    type: integer
                  authorizationObjects:
                    type: integer
                  groups:
                    type: integer
                  identityProviderMappers:
                    description: IdentityProviderMappers is the count of mappers attached
                      to imported brokers.
                    type: integer
                  identityProviders:
                    description: IdentityProviders is the count of realm-scoped upstream
                      brokers.
                    type: integer
                  organizations:
                    type: integer
                  realms:
                    description: Realms is the count of Keycloak realms.
                    type: integer
                  resourceServers:
                    type: integer
                  roles:
                    type: integer
                  serviceAccounts:
                    description: ServiceAccounts is the count of M2M service account
                      clients.
                    type: integer
                  total:
                    description: Total is the sum of every discovered or applied resource
                      and nested broker object.
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
