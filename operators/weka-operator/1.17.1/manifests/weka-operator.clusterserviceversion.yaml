  description: |
    The WEKA Operator runs WEKA distributed storage clusters on Kubernetes. It manages the lifecycle of WEKA backend and client containers through Kubernetes custom resources.

    ### Capabilities

    - Provisioning of WEKA clusters (`WekaCluster`) from a template, including compute, drive and optional protocol (S3, NFS, SMB) containers
    - WEKA clients (`WekaClient`) that mount a WEKA filesystem on selected Kubernetes nodes
    - Node discovery, driver loading and distribution, drive signing and drive sharing
    - Cluster scale-up, rolling upgrades and container replacement
    - An embedded CSI driver (csi-wekafs) for provisioning persistent volumes on WEKA
    - Operator-level operations and policies (`WekaManualOperation`, `WekaPolicy`)
    - Validating admission webhook for the WEKA custom resources, with certificates managed by the operator itself

    ### Custom resources

    | Kind | Purpose |
    |------|---------|
    | `WekaCluster` | A WEKA storage cluster (backend containers) |
    | `WekaClient` | WEKA client containers on selected nodes |
    | `WekaContainer` | A single WEKA container; normally created by the operator |
    | `WekaManualOperation` | A one-off operation, for example blocking drives |
    | `WekaPolicy` | A recurring operation, for example signing drives |

    ### Prerequisites

    - Kubernetes 1.26 or newer
    - A WEKA license and access to the WEKA container images and the WEKA drivers distribution service
    - Worker nodes that meet the WEKA host requirements (hugepages, kernel, NICs and NVMe drives); see the documentation
    - Cluster resources are namespaced; each namespace that hosts a WekaCluster or WekaClient needs its image pull secret if one is required

    ### Notes

    - The operator is installed cluster-wide (AllNamespaces install mode).
    - The OpenShift specific integrations of the Helm chart (SecurityContextConstraints, MachineConfig resources) are not part of this bundle.
    - By default the operator sends connectivity and event data to WEKA Home, and traces to a WEKA OTLP endpoint. See the documentation for how to configure or disable these.
  customresourcedefinitions:
    owned:
      - name: wekaclusters.weka.weka.io
        kind: WekaCluster
        version: v1alpha1
        displayName: WEKA Cluster
        description: A WEKA storage cluster running on Kubernetes nodes, with its compute, drive and optional protocol containers.
      - name: wekaclients.weka.weka.io
        kind: WekaClient
        version: v1alpha1
        displayName: WEKA Client
        description: WEKA client containers deployed on selected nodes that connect to a target WEKA cluster and serve filesystem mounts.
      - name: wekacontainers.weka.weka.io
        kind: WekaContainer
        version: v1alpha1
        displayName: WEKA Container
        description: A single WEKA container. Normally created and managed by the operator for WekaCluster and WekaClient resources.
      - name: wekamanualoperations.weka.weka.io
        kind: WekaManualOperation
        version: v1alpha1
        displayName: WEKA Manual Operation
        description: A one-off operation executed by the operator, such as signing or blocking drives.
      - name: wekapolicies.weka.weka.io
        kind: WekaPolicy
        version: v1alpha1
        displayName: WEKA Policy
        description: A recurring operation executed by the operator on a schedule, such as signing drives.
