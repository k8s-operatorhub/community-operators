                enum:
                - project
                - system
                type: string
              name:
                description: |-
                  name of the robot without Harbor's prefix. Defaults to metadata.name.
                  Harbor stores it as robot$<name> (system) or robot$<project>+<name> (project).
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              permissions:
                description: |-
                  permissions granted to the robot. For project level robots a single
                  entry without namespace is usual.
                items:
                  description: |-
                    RobotPermission grants access within one namespace (a project name, or "*"
                    for system-wide permissions).
                  properties:
                    access:
                      description: access entries granted in the namespace.
                      items:
                        description: RobotAccess is one permission entry.
                        properties:
                          action:
                            description: action such as pull, push, read, list, create,
                              update, delete, stop.
                            minLength: 1
                            type: string
                          effect:
                            description: effect is allow or deny. Defaults to allow.
                            enum:
                            - allow
                            - deny
                            type: string
                          resource:
                            description: resource such as repository, artifact, tag,
                              scan, label, helm-chart.
                            minLength: 1
                            type: string
                        required:
                        - action
                        - resource
                        type: object
                      minItems: 1
                      type: array
                    namespace:
                      description: |-
                        namespace is the Harbor project name, or "*" for all projects (system level only).
                        For project level robots this defaults to the referenced project.
                      type: string
                  required:
                  - access
                  type: object
                minItems: 1
                type: array
              projectName:
                description: |-
                  projectName is the Harbor project name for project level robots when the
                  project is not managed by this operator.
                type: string
              projectRef:
                description: |-
                  projectRef names a HarborProject in this namespace. Required for project
                  level robots unless projectName is set.
                properties:
                  name:
                    description: name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              rotation:
                description: rotation controls automatic secret refresh.
                properties:
                  beforeExpiry:
                    description: |-
                      beforeExpiry refreshes the secret when the robot is this close to expiring.
                      Only useful when duration is set.
                    type: string
                  period:
                    description: period after which the secret is refreshed regardless
                      of expiry, for example 720h.
                    type: string
                type: object
              secret:
                description: secret describes the Kubernetes Secret that receives
                  the credentials.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: annotations added to the Secret.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: labels added to the Secret.
                    type: object
                  name:
                    description: name of the Secret. Defaults to "<metadata.name>-robot".
                    type: string
                  type:
                    default: Opaque
                    description: |-
                      type of the Secret: Opaque (keys username, password, host) or
                      kubernetes.io/dockerconfigjson (ready to use as an imagePullSecret).
                    enum:
                    - Opaque
                    - kubernetes.io/dockerconfigjson
                    type: string
                type: object
              syncPeriod:
                description: syncPeriod overrides the connection's drift-correction
                  interval.
                type: string
            required:
