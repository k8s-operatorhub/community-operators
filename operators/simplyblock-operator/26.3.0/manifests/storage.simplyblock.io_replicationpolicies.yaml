            type: string
          metadata:
            type: object
          spec:
            description: ReplicationPolicySpec defines the desired replication schedule
              and retention.
            properties:
              interval:
                default: 5m
                description: Interval is how often a replication snapshot is taken
                  (e.g. "5m", "1h").
                type: string
              mode:
                default: failover
                description: |-
                  Mode controls replication semantics.
                  failover: target is a DR standby; volumes are read-only on the target.
                  migration: planned online cutover to the target cluster.
                enum:
                - failover
                - migration
                type: string
              pairRef:
                description: |-
                  PairRef is the name of the ReplicationPair that defines the source and target clusters.
                  Multiple ReplicationPolicies may reference the same pair with different schedules.
                type: string
              snapshotRetention:
                default: 3
                description: SnapshotRetention is the minimum number of snapshots
                  to retain on the target.
                format: int32
                minimum: 2
                type: integer
            required:
            - pairRef
            type: object
