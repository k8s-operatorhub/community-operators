apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  creationTimestamp: null
  name: harborprojects.harbor.oreonit.com
spec:
  group: harbor.oreonit.com
  names:
    kind: HarborProject
    listKind: HarborProjectList
    plural: harborprojects
    shortNames:
    - hproj
    singular: harborproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.projectName
      name: Project
      type: string
    - jsonPath: .status.projectID
      name: ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'HarborProject manages a Harbor project: visibility, storage
          quota, scanning, CVE allowlist and proxy cache.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HarborProject
            properties:
              adoptExisting:
                description: |-
                  adoptExisting allows taking over a project of the same name that already
                  exists in Harbor. Without it, an existing project is reported as a conflict.
                type: boolean
              connectionRef:
                description: connectionRef selects the Harbor instance.
                properties:
                  name:
                    description: name of the HarborConnection.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      namespace of the HarborConnection. Defaults to the namespace of the
                      referencing resource. A cross-namespace reference is only honoured when
                      the connection's spec.allowedNamespaces permits it.
                    type: string
                required:
                - name
                type: object
              cveAllowlist:
                description: cveAllowlist is the project level CVE allowlist. When
                  set, it is managed in full.
                properties:
                  expiresAt:
                    description: expiresAt is when the allowlist stops applying. Empty
                      means never.
                    format: date-time
                    type: string
                  items:
                    description: items are CVE identifiers such as CVE-2025-1234.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  deletionPolicy controls whether the Harbor project is deleted with this object.
                  Harbor refuses to delete projects that still hold repositories; the
                  operator never deletes repositories.
                enum:
                - Retain
                - Delete
                type: string
              metadata:
                description: metadata holds scanning, content trust and allowlist
                  settings.
                properties:
                  autoSbomGeneration:
                    description: autoSbomGeneration generates an SBOM for every pushed
                      artifact.
                    type: boolean
                  autoScan:
                    description: autoScan scans every pushed artifact automatically.
                    type: boolean
                  enableContentTrustCosign:
                    description: enableContentTrustCosign requires cosign signatures
                      for pulls.
                    type: boolean
                  preventVulnerable:
                    description: preventVulnerable blocks pulls of artifacts with
                      vulnerabilities at or above severity.
                    type: boolean
                  reuseSystemCVEAllowlist:
                    description: reuseSystemCVEAllowlist uses the system CVE allowlist
                      instead of the project one.
                    type: boolean
                  severity:
                    description: severity threshold used by preventVulnerable.
                    enum:
                    - none
                    - low
                    - medium
                    - high
                    - critical
                    type: string
                type: object
              name:
                description: name of the project in Harbor. Defaults to metadata.name.
                maxLength: 255
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              proxyCache:
                description: proxyCache makes the project a proxy cache for an upstream
                  registry.
                properties:
                  registryRef:
                    description: |-
                      registryRef names a HarborRegistry in this namespace used as the upstream.
                      Immutable after creation, as in Harbor.
                    properties:
                      name:
                        description: name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - registryRef
                type: object
              public:
                description: public makes the project readable without authentication.
                type: boolean
              storageQuotaBytes:
                description: storageQuotaBytes caps the project storage. -1 means
                  unlimited.
                format: int64
                minimum: -1
                type: integer
              syncPeriod:
                description: syncPeriod overrides the connection's drift-correction
                  interval.
                type: string
            required:
            - connectionRef
            type: object
          status:
            description: status defines the observed state of HarborProject
            properties:
              conditions:
                description: 'conditions: Ready=True when the Harbor project matches
                  the spec.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              projectID:
                description: projectID in Harbor once created or adopted.
                format: int64
                type: integer
              projectName:
                description: projectName as created in Harbor.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
