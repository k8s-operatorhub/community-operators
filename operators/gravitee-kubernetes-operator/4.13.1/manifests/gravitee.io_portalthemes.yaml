apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    gravitee.io/operator.version: 4.13.1
  name: portalthemes.gravitee.io
spec:
  group: gravitee.io
  names:
    kind: PortalTheme
    listKind: PortalThemeList
    plural: portalthemes
    shortNames:
      - graviteeportalthemes
    singular: portaltheme
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.name
          name: Display Name
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: >-
            PortalTheme is the look and feel of a Gravitee next-gen developer
            portal managed as a

            Kubernetes...
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of
                an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object
                represents.
              type: string
            metadata:
              type: object
            spec:
              description: PortalThemeSpec defines the desired state of a PortalTheme.
              properties:
                backgroundImage:
                  description: Image displayed behind the portal header.
                  type: string
                contextRef:
                  description: Reference to a ManagementContext that determines which APIM
                    instance this theme is synced to.
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                definition:
                  description: The look and feel applied to the portal.
