                    format: date-time
                    type: string
                  pauseUpgrades:
                    description: |-
                      PauseUpgrades, when true, stops the operator from re-applying a bundled
                      capability operator's Helm release when its pinned chart version changes
                      (e.g. after an operator image bump). New installs and health re-applies of a
                      failed release still happen; only version-driven upgrades are paused. Useful
                      to schedule capability-operator upgrades during a maintenance window.
                    type: boolean
                  retainOnUninstall:
                    description: |-
                      RetainOnUninstall, when true, disables the ref-counted uninstall of bundled
                      capability operators: when the last consumer of a shared operator is deleted
                      the operator's Helm release (and CRDs) are LEFT in place instead of removed.
                      The operator still cleans up the emitted CRs and managed PVCs it owns. Useful
                      when other tooling also relies on those operators.
                    type: boolean
                type: object
              mcp:
                description: |-
                  MCP configures the cluster-shared bundled MCP catalog servers. Because a
                  catalog server (e.g. web search) is deployed as ONE shared, ref-counted
                  release for the whole cluster, its footprint is set here rather than per-ChatUI.
                properties:
                  footprint:
                    description: |-
                      Footprint tunes the shared web-search catalog stack: "full" (SearXNG + Presidio
                      Changing it after install does not migrate an already-deployed release.
                    enum:
                    - full
                    - minimal
                    type: string
                  values:
                    description: |-
                      Values is a free-form Helm values overlay merged into the shared catalog
                      release (escape hatch for chart options the operator does not model).
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              operators:
                description: |-
                  Operators controls which namespace(s) the bundled capability operators are
                  installed into. By default each operator gets its own dedicated namespace;
                  set this to consolidate them (e.g. all into one "navique-operators"
                  namespace).
                properties:
                  namespace:
                    description: |-
                      Namespace installs every bundled capability operator into this single
                      namespace instead of each operator's dedicated default namespace (the
                      namespace is created if missing). A per-operator entry in Namespaces wins
                      over this. Empty ⇒ each operator keeps its built-in default namespace.

                      Applied at install time only: changing it after operators are already
                      installed does NOT migrate existing releases — tear the platform down and
                      redeploy to move them.
                    type: string
                  namespaces:
                    additionalProperties:
                      type: string
                    description: |-
                      Namespaces overrides the install namespace for individual operators, keyed
                      by operator name: external-secrets, sealed-secrets, cloudnative-pg,
                      cert-manager, litellm-operator, langfuse-operator, redis-operator,
                      mongodb-kubernetes, clickhouse-operator, sail-operator. An entry wins over
                      Namespace; an operator with no entry falls back to Namespace, then to its
                      built-in default. Same install-time-only caveat as Namespace.
                    type: object
                type: object
              registry:
                description: |-
                  Registry redirects every image the operator deploys to a custom (e.g.
                  air-gapped mirror) registry and attaches pull credentials. It covers the
                  bundled capability operators, the instance CRs they manage, the workload
                  charts, and the management-plane console. It does NOT affect the operator's
                  OWN image — the operator is already running, so set that via the operator
                  Helm chart (image.repository / imagePullSecrets) at install time.
                properties:
                  auth:
                    description: |-
                      Auth references the credentials used to pull from Host. When set, the
                      operator propagates the pull Secret into every namespace it deploys a
                      workload into and wires it as imagePullSecrets on the upstream charts,
                      the emitted instance CRs, and operator-managed pods.
                    properties:
                      secretRef:
                        description: |-
                          SecretRef references a kubernetes.io/dockerconfigjson Secret holding
                          credentials for the mirror registry (the standard ".dockerconfigjson"
                          key; Key is ignored). Namespace defaults to the operator system namespace
                          when empty. The operator copies this Secret (as a dockerconfigjson Secret)
                          into each namespace where it deploys a workload.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  host:
                    description: |-
                      Host is the mirror registry host, optionally with a path prefix
                      (e.g. "registry.example.com" or "registry.example.com/mirror"). When set,
                      every operator-deployed image has its registry host swapped to this,
                      preserving the original image path and tag (host-mirror semantics):
                      "ghcr.io/cloudnative-pg/cloudnative-pg:1.2" with host
                      "registry.example.com" becomes "registry.example.com/cloudnative-pg/cloudnative-pg:1.2".
                      Empty disables rewriting (images keep their upstream registries).
                    type: string
                  operandImages:
                    additionalProperties:
                      type: string
                    description: |-
                      OperandImages pins the datastore operand images the upstream operators
                      would otherwise select on their own (and which the operator cannot re-pin
                      from a stable tag) to explicit references, by well-known key. The value is
                      still host-mirrored when Host is set. Recognised keys: "postgres" (CNPG
                      Cluster.spec.imageName), "clickhouse" and "clickhouseKeeper"
                      (ClickHouseCluster/KeeperCluster container image). This closes the
                      air-gap gap where those operands would otherwise reference a public image.
                    type: object
                type: object
              routing:
                description: |-
                  Routing selects how workload ingress is exposed: classic Ingress (default)
                  or the Gateway API (HTTPRoutes). When a ServiceMesh is active, Gateway is
                  used automatically (a workload can opt back to Ingress via its own
                  spec.ingress.api).
                properties:
                  gateway:
                    description: Gateway configures the shared Gateway resource HTTPRoutes
                      attach to.
                    properties:
                      clusterIssuer:
                        description: |-
                          ClusterIssuer is the cert-manager ClusterIssuer used (via the gateway-shim)
                          to provision certificates for HTTPS listeners when a workload requests TLS.
                        type: string
                      mode:
                        description: |-
                          Mode: "managed" (the operator creates+owns the Gateway, default), "adopt"
                          (reference an operator-labelled existing Gateway), or "external" (reference
                          a user-managed Gateway; never modified).
                        enum:
                        - managed
                        - adopt
                        - external
                        type: string
                      name:
                        description: Name of the Gateway (default "navique").
                        type: string
                      namespace:
                        description: 'Namespace of the Gateway (default: the operator
                          system namespace).'
                        type: string
                    type: object
                  gatewayClassName:
                    description: |-
                      GatewayClassName is the GatewayClass for the managed Gateway (e.g. "istio",
                      "envoy-gateway", "nginx"). Required for standalone Gateway mode; defaults to
                      "istio" when a ServiceMesh is active.
                    type: string
                  mode:
                    description: |-
                      Mode is the default routing API for workload ingress. "Ingress" (default)
                      keeps classic Ingress; "Gateway" emits Gateway API HTTPRoutes. An active
                      ServiceMesh forces Gateway regardless of this field.
                    enum:
                    - Ingress
                    - Gateway
                    type: string
                type: object
              runtime:
                description: Runtime configures the operator process itself (e.g.
                  log level).
                properties:
                  logLevel:
                    description: |-
                      LogLevel sets the operator's log verbosity LIVE (no restart): a change to
                      this field takes effect on the next reconcile. Overrides the startup
                      `--zap-log-level` flag while set; clearing it leaves the level at its last
                      value.
                    enum:
                    - debug
                    - info
                    - warn
                    - error
                    type: string
                type: object
              security:
                description: |-
                  Security configures the platform-wide security posture (e.g. encryption in
                  transit). See design-docs/ENCRYPTION-IN-TRANSIT.md.
                properties:
                  internalTLS:
                    description: |-
                      InternalTLS encrypts in-cluster service-to-service traffic with a
                      cert-manager-managed PKI (portable; no service mesh required). When unset or
                      mode=off, east-west traffic stays plaintext (today's behaviour).
                    properties:
                      caDuration:
                        description: |-
                          CADuration is the platform root CA lifetime (cert-manager duration string,
                          e.g. "87600h" = 10y). Keep it long — CA rotation is a planned maintenance
                          event, not a background renewal. Defaults to a long-lived value.
                        type: string
                      issuerRef:
                        description: |-
                          IssuerRef optionally chains the platform CA to an EXISTING cert-manager
                          (Cluster)Issuer (e.g. an enterprise PKI) instead of the operator's
                          self-signed root. When set, the operator issues leaf certs from it directly.
                        properties:
                          kind:
                            default: ClusterIssuer
                            description: Kind is "ClusterIssuer" (default) or "Issuer".
                            enum:
                            - ClusterIssuer
                            - Issuer
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      leafDuration:
                        description: |-
                          LeafDuration is the per-component leaf certificate lifetime (e.g. "2160h" =
                          90d). Leaves auto-rotate well before expiry. Defaults to a short value.
                        type: string
                      mode:
                        default: "off"
                        description: |-
                          Mode selects the posture:
                            - "off" (default): east-west traffic is plaintext.
                            - "tls": server-authenticated TLS on every supported hop.
                            - "mtls": mutual TLS where the backend supports client certs
                              (Postgres/Redis/Mongo/Meilisearch); server-TLS elsewhere.
                          Changing this is an install-/maintenance-time operation — flipping it on a
                          live platform triggers cert wiring + workload rollouts.
                        enum:
                        - "off"
                        - tls
                        - mtls
                        type: string
                    type: object
                type: object
            type: object
          status:
            description: PlatformConfigStatus reports the observed state of PlatformConfig.
            properties:
              active:
                description: |-
                  Active reports whether registry rewriting is currently in effect (a valid
                  singleton with a non-empty registry host).
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              propagatedNamespaces:
                description: PropagatedNamespaces lists namespaces the pull Secret
                  has been copied into.
                items:
                  type: string
                type: array
              pullSecret:
                description: PullSecret echoes the resolved source pull Secret as
                  "namespace/name".
                type: string
              reason:
                description: |-
                  Reason explains the current state when not Active (e.g. a missing Secret or
                  a non-singleton name).
                type: string
              registry:
                description: Registry echoes the active mirror host (empty when inactive).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
