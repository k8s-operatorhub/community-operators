                - objectstores
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - barmancloud.cnpg.io
              resources:
                - objectstores/finalizers
              verbs:
                - update
            - apiGroups:
