                    ephemeral-storage: 64Mi
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: decision-model-operator-controller-manager
              terminationGracePeriodSeconds: 10
