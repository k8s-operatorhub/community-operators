            - apiGroups:
                - rbac.authorization.k8s.io
              resources:
                - rolebindings
                - roles
              verbs:
                - create
                - get
                - list
                - patch
                - update
                - watch
          serviceAccountName: plugin-barman-cloud
      deployments:
        - label:
            app: barman-cloud
          name: barman-cloud
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: barman-cloud
            strategy:
              type: Recreate
            template:
              metadata:
                labels:
                  app: barman-cloud
              spec:
                containers:
                  - args:
                      - operator
                      - --server-cert=/server/tls.crt
                      - --server-key=/server/tls.key
                      - --client-cert=/client/tls.crt
                      - --server-address=:9090
                      - --leader-elect
                      - --log-level=debug
                    env:
                      - name: RELATED_IMAGE_SIDECAR
                        value: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
                      - name: SIDECAR_IMAGE
                        value: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
                    image: ghcr.io/cloudnative-pg/plugin-barman-cloud:v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
                    name: barman-cloud
                    ports:
                      - containerPort: 9090
                        protocol: TCP
                    readinessProbe:
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      tcpSocket:
                        port: 9090
                    resources: {}
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      readOnlyRootFilesystem: true
                      runAsGroup: 10001
                      runAsUser: 10001
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - mountPath: /server
                        name: server
                      - mountPath: /client
                        name: client
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: plugin-barman-cloud
                volumes:
                  - name: server
                    secret:
                      optional: true
                      secretName: barman-cloud-server-tls
                  - name: client
                    secret:
                      optional: true
                      secretName: barman-cloud-client-tls
      permissions:
        - rules:
            - apiGroups:
                - ""
              resources:
