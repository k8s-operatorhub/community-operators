apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    gravitee.io/operator.version: 4.13.0
  name: portallinks.gravitee.io
spec:
  group: gravitee.io
  names:
    kind: PortalLink
    listKind: PortalLinkList
    plural: portallinks
    shortNames:
      - graviteeportallinks
    singular: portallink
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.portalRef.name
          name: Portal
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: >-
            PortalLink attaches an external navigation link to exactly one of a
            Portal

            (portalRef) or an API...
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of
                an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object
                represents.
              type: string
            metadata:
              type: object
            spec:
              description: PortalLinkSpec defines the desired state of a PortalLink.
              properties:
                apiRef:
                  description: Reference to the API this link is attached to.
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                href:
                  description: The URL this link points to.
                  type: string
                location:
                  description: >-
                    The path in the owning resource's navigation hierarchy where
                    this link

                    should appear.
                  pattern: ^/
                  type: string
                name:
                  description: Display name of the link.
                  type: string
                order:
                  description: >-
                    Optional display order of this link relative to its siblings
                    at the

                    same location.
                  format: int32
                  type: integer
                portalRef:
                  description: Reference to the Portal this link is attached to.
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                visibility:
                  description: Whether this entry is shown to anonymous visitors of the portal.
                  enum:
                    - PUBLIC
                    - PRIVATE
                  type: string
              required:
                - href
                - name
              type: object
              x-kubernetes-validations:
                - message: exactly one of portalRef or apiRef must be set
                  rule: has(self.portalRef) != has(self.apiRef)
            status:
              description: PortalLinkStatus defines the observed state of a PortalLink.
              properties:
                conditions:
                  default: []
                  description: Conditions describe the current conditions of the PortalLink.
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                environmentId:
                  description: The environment ID defined in the management context
                  type: string
                errors:
                  description: >-
                    When the portal link has been created regardless of errors,
                    this field

                    is used to persist the error...
                  properties:
                    severe:
                      description: >-
                        severe errors do not pass admission and will block
                        reconcile

                        hence, this field should always be...
                      items:
                        type: string
                      type: array
                    warning:
                      description: |-
                        warning errors do not block object reconciliation,
                        most of the time because the value is ignored or...
                      items:
                        type: string
                      type: array
                  type: object
                id:
                  description: The ID of the PortalLink in the Gravitee API Management instance
                  type: string
                organizationId:
                  description: The organization ID defined in the management context
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
