apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankoserviceaccounts.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoServiceAccount
    listKind: HankoServiceAccountList
    plural: hankoserviceaccounts
    shortNames:
    - hsa
    singular: hankoserviceaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.realmRef
      name: Realm
      type: string
    - jsonPath: .status.nextRotation
      name: NextRotation
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HankoServiceAccount represents a machine-to-machine (M2M) Keycloak
          client.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HankoServiceAccountSpec defines the desired state of an M2M client.
              Built-in Keycloak clients are never valid service-account ownership targets.
              Fleet-authority and cross-resource ownership are checked by the reconciler:
              CEL cannot query other CRDs or runtime realm/client configuration.
            properties:
              attributes:
                additionalProperties:
                  maxLength: 4096
                  type: string
                description: |-
                  Attributes sets arbitrary Keycloak client attributes (single string value per
                  key) on the underlying M2M client. The full map is the desired state and
                  replaces unmanaged keys set directly in Keycloak on every reconcile.
                maxProperties: 64
                type: object
                x-kubernetes-validations:
                - message: native map keys require 1..255 characters
                  rule: self.all(k, size(k) > 0 && size(k) <= 255)
              authentication:
                description: |-
                  ServiceAccountAuthentication selects one client authentication contract.
                  Omission preserves Secret. Kubernetes binding is validated independently of
                  native activation and does not authorize a method transition.
                properties:
                  fallbackBinding:
                    description: FallbackBinding retains explicit trust/workload authority
                      for Secret fallback.
                    properties:
                      expirationSeconds:
                        default: 600
                        description: |-
                          ExpirationSeconds recommends kubelet projection duration, not native JWT
                          lifespan enforcement. It must also fit the current shared assertion age.
                        format: int64
                        maximum: 3600
                        minimum: 600
                        type: integer
                      sourceRef:
                        description: |-
                          SourceRef selects the client connection, freshly bound to the trust's
                          endpoint, public CA and native realm. There is no pooled writer fallback.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      trustRef:
                        description: TrustRef selects the shared trust in the HankoServiceAccount
                          namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      workload:
                        description: |-
                          KubernetesWorkloadBinding reuses the application workload's structural names
                          without changing that existing authorization-anchor contract into federation.
                        properties:
                          expectedUID:
                            description: |-
                              ExpectedUID is explicit administrator authority; names/status never approve
                              the UID of a replacement ServiceAccount.
                            maxLength: 128
                            minLength: 1
                            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:-]*$
                            type: string
                          namespace:
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          serviceAccountRef:
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - expectedUID
                        - namespace
                        - serviceAccountRef
                        type: object
                        x-kubernetes-validations:
                        - message: a dedicated ServiceAccount is required
                          rule: self.serviceAccountRef != 'default'
                    required:
                    - sourceRef
                    - trustRef
                    - workload
                    type: object
                  kubernetes:
                    properties:
                      expirationSeconds:
                        default: 600
                        description: |-
                          ExpirationSeconds recommends kubelet projection duration, not native JWT
                          lifespan enforcement. It must also fit the current shared assertion age.
                        format: int64
                        maximum: 3600
                        minimum: 600
                        type: integer
                      sourceRef:
                        description: |-
                          SourceRef selects the client connection, freshly bound to the trust's
                          endpoint, public CA and native realm. There is no pooled writer fallback.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      trustRef:
                        description: TrustRef selects the shared trust in the HankoServiceAccount
                          namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      workload:
                        description: |-
                          KubernetesWorkloadBinding reuses the application workload's structural names
                          without changing that existing authorization-anchor contract into federation.
                        properties:
                          expectedUID:
                            description: |-
                              ExpectedUID is explicit administrator authority; names/status never approve
                              the UID of a replacement ServiceAccount.
                            maxLength: 128
                            minLength: 1
                            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:-]*$
                            type: string
                          namespace:
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          serviceAccountRef:
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - expectedUID
                        - namespace
                        - serviceAccountRef
                        type: object
                        x-kubernetes-validations:
                        - message: a dedicated ServiceAccount is required
                          rule: self.serviceAccountRef != 'default'
                    required:
                    - sourceRef
                    - trustRef
                    - workload
                    type: object
                  mode:
                    default: Secret
                    enum:
                    - Secret
                    - Kubernetes
                    type: string
                  transition:
                    description: |-
                      ServiceAccountAuthenticationTransition requests a reviewed method change.
                      Exact approval and external authentication review use closed annotations;
                      adding them cannot stale the binding generation being approved.
                    properties:
                      preparedWorkloadRevision:
                        description: Public workload-owner revision, never a token
                          or credential.
                        maxLength: 128
                        minLength: 1
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$
                        type: string
                      requestID:
                        maxLength: 128
                        minLength: 1
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$
                        type: string
                      strategy:
                        enum:
                        - CoordinatedCutover
                        type: string
                    required:
                    - preparedWorkloadRevision
                    - requestID
                    - strategy
                    type: object
                type: object
                x-kubernetes-validations:
                - message: fallback binding requires an explicit Secret transition
                  rule: '!has(self.fallbackBinding) || (self.mode == ''Secret'' &&
                    has(self.transition))'
                - message: Kubernetes parameters are required only for Kubernetes
                    mode
                  rule: 'self.mode == ''Kubernetes'' ? has(self.kubernetes) : !has(self.kubernetes)'
              clientID:
                description: ClientID is the Keycloak client identifier for the M2M
                  client.
                maxLength: 255
                minLength: 1
                pattern: ^[^\x00-\x1F\x7F]+$
                type: string
              mode:
                default: Manage
                description: |-
                  Mode separates credential and provider management from observation.
                  The imported-by label always forces effective Observe.
                enum:
                - Manage
                - Observe
                type: string
              realmRef:
                description: RealmRef references the HankoRealm this service account
                  belongs to.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              runtimeMetadata:
                description: |-
                  WorkloadRuntimeMetadataTarget names a pre-existing, workload-owned ConfigMap
                  in the approved workload namespace. Its owner grants separate UID consent.
                properties:
                  configMapRef:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  expectedUID:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:-]*$
                    type: string
                required:
                - configMapRef
                - expectedUID
                type: object
              scopes:
                description: Scopes lists the OAuth2 scopes granted to this service
                  account.
                items:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[^\x00-\x1F\x7F]+$
                  type: string
                maxItems: 64
                type: array
              secretRotationPolicy:
                description: SecretRotationPolicy controls automatic secret rotation.
                properties:
                  enabled:
                    description: Enabled activates automatic rotation.
                    type: boolean
                  forceRotateAt:
                    description: ForceRotateAt, when set, triggers an immediate rotation
                      on the next reconcile.
                    format: date-time
                    maxLength: 64
                    type: string
                  intervalDays:
                    description: IntervalDays is the rotation period in days.
                    minimum: 1
                    type: integer
                required:
                - enabled
                type: object
              tokenClaims:
                description: |-
                  TokenClaims exposes a Keycloak user attribute or fixed value as a claim in
                  tokens issued to this service account. The same fail-closed mapper model as
                  HankoApplication is used.
                items:
                  description: |-
                    ApplicationTokenClaim describes a client-scoped OIDC protocol mapper. Only
                    the typed mapper forms below are supported; arbitrary Keycloak mapper
                    implementations and reserved identity/authorization claims fail closed.
                  properties:
                    addToAccessToken:
                      type: boolean
                    addToIDToken:
                      description: |-
                        Token destinations default to true when omitted. Introspection defaults to
                        the access-token setting.
                      type: boolean
                    addToIntrospection:
                      type: boolean
                    addToUserInfo:
                      type: boolean
                    claim:
                      description: |-
                        Claim is the claim name emitted in tokens. Dot notation creates nested claims.
                        The reserved value "aud" with a fixed Value uses Keycloak's native Audience
                        mapper so existing access-token audiences are preserved.
                      maxLength: 255
                      minLength: 1
                      type: string
                    jsonType:
                      default: String
                      description: JSONType controls conversion of the emitted value.
                      enum:
                      - String
                      - long
                      - int
                      - boolean
                      - JSON
                      type: string
                    keycloakName:
                      description: |-
                        KeycloakName explicitly adopts an existing client protocol mapper by name.
                        When omitted, the operator derives a stable application-scoped name.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[^\x00-\x1F\x7F]+$
                      type: string
                    multivalued:
                      description: Multivalued emits all values of a user attribute
                        as an array.
                      type: boolean
                    name:
                      description: Name is unique within this application.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    realmRolePrefix:
                      description: |-
                        RealmRolePrefix, when set, restricts and strips a prefix from the projected
                        realm-role names. Only meaningful together with realmRoles.
                      maxLength: 255
                      pattern: ^[^\x00-\x1F\x7F]*$
                      type: string
                    realmRoles:
                      description: |-
                        RealmRoles projects the caller's realm roles into this claim as a
                        multivalued array (Keycloak's realm-role user-model mapper). It is the
                        substrate for hierarchical-org role projection (HKX-09): a member inherits
                        realm roles from their organization group, and this claim carries them to
                        the consuming application (e.g. Trunx reads "trunx_roles"). Exactly one of
                        userAttribute, value or realmRoles must be set.
                      type: boolean
                    userAttribute:
                      description: |-
                        UserAttribute reads the value from a Keycloak user attribute.
                        Exactly one of userAttribute and value must be set.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[^\x00-\x1F\x7F]+$
                      type: string
                    value:
                      description: |-
                        Value emits a fixed application-specific claim value. A pointer allows an
                        explicitly configured empty string to remain distinguishable from omission.
                      maxLength: 16384
                      type: string
                  required:
                  - claim
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of userAttribute, value or realmRoles must
                      be set
                    rule: '[has(self.userAttribute), has(self.value), has(self.realmRoles)].exists_one(x,
                      x)'
                  - message: reserved identity and authorization claims cannot be
                      overridden
                    rule: self.claim != 'sub' && self.claim != 'iss' && self.claim
                      != 'exp' && self.claim != 'iat' && self.claim != 'nbf' && self.claim
                      != 'jti' && self.claim != 'azp' && self.claim != 'typ' && self.claim
                      != 'sid' && self.claim != 'scope' && self.claim != 'session_state'
                      && self.claim != 'nonce' && self.claim != 'auth_time' && self.claim
                      != 'acr' && self.claim != 'amr' && self.claim != 'at_hash' &&
                      self.claim != 'c_hash' && self.claim != 's_hash' && self.claim
                      != 'client_id' && self.claim != 'hanko_token_use' && self.claim
                      != 'realm_access' && !self.claim.startsWith('realm_access.')
                      && self.claim != 'resource_access' && !self.claim.startsWith('resource_access.')
                      && self.claim != 'authorization' && !self.claim.startsWith('authorization.')
                      && self.claim != 'permissions' && !self.claim.startsWith('permissions.')
                      && self.claim != 'https://hanko.sh/authorization' && !self.claim.startsWith('https://hanko.sh/authorization.')
                      && self.claim != 'cnf' && !self.claim.startsWith('cnf.') &&
                      self.claim != 'act' && !self.claim.startsWith('act.') && self.claim
                      != 'may_act' && !self.claim.startsWith('may_act.') && self.claim
                      != 'authorization_details' && !self.claim.startsWith('authorization_details.')
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - clientID
            - realmRef
            type: object
            x-kubernetes-validations:
            - message: built-in Keycloak clients cannot be managed as HankoServiceAccount
              rule: self.clientID.trim() != 'account' && self.clientID.trim() != 'account-console'
                && self.clientID.trim() != 'admin-cli' && self.clientID.trim() !=
                'broker' && self.clientID.trim() != 'realm-management' && self.clientID.trim()
                != 'security-admin-console'
            - message: provider ownership and adoption receipt attributes are reserved
              rule: '!has(self.attributes) || self.attributes.all(k, !(k.startsWith(''hanko.sh/'')
                && (k.contains(''owner'') || k == ''hanko.sh/adoption-receipt'')))'
            - message: workload authenticator and binding attributes are reserved
              rule: '!has(self.attributes) || self.attributes.all(k, !k.startsWith(''jwt.credential.'')
                && !k.startsWith(''hanko.sh/workload-''))'
            - message: workload runtime metadata requires Kubernetes authentication
                intent
              rule: '!has(self.runtimeMetadata) || (has(self.authentication) && self.authentication.mode
                == ''Kubernetes'')'
            - message: active secret rotation is incompatible with Kubernetes authentication
              rule: '!has(self.authentication) || self.authentication.mode != ''Kubernetes''
                || !has(self.secretRotationPolicy) || !self.secretRotationPolicy.enabled'
            - message: Secret fallback from Kubernetes must retain its explicit binding
                for reviewed preparation
              rule: '!has(oldSelf.authentication) || oldSelf.authentication.mode !=
                ''Kubernetes'' || (has(self.authentication) && (self.authentication.mode
                == ''Kubernetes'' || has(self.authentication.fallbackBinding)))'
          status:
            description: HankoServiceAccountStatus describes the observed state of
              the M2M client.
            properties:
              adoptionCandidate:
                description: AdoptionCandidate is bounded review evidence, never execution
                  authority.
                properties:
                  approvable:
                    type: boolean
                  candidateHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  complete:
                    type: boolean
                  contractVersion:
                    enum:
                    - hanko.sh/adoption-contract/v1alpha1
                    type: string
                  diff:
                    items:
                      properties:
                        classification:
                          enum:
                          - supported-typed-native
                          - preserved-readonly-native
                          - unsupported
                          - conflicting
                          - security-sensitive-excluded
                          type: string
                        code:
                          enum:
                          - equal
                          - would-manage
                          - would-change
                          - would-preserve
                          - provider-native-readonly
                          - unsupported
                          - credential-excluded
                          - recreation-required
                          - ownership-transition
                          type: string
                        current:
                          description: AdoptionValue contains only reviewed non-secret
                            semantic fields.
                          properties:
                            flag:
                              type: boolean
                            set:
                              items:
                                maxLength: 512
                                type: string
                              maxItems: 1024
                              type: array
                              x-kubernetes-list-type: set
                            text:
                              maxLength: 512
                              type: string
                          type: object
                        desired:
                          description: AdoptionValue contains only reviewed non-secret
                            semantic fields.
                          properties:
                            flag:
                              type: boolean
                            set:
                              items:
                                maxLength: 512
                                type: string
                              maxItems: 1024
                              type: array
                              x-kubernetes-list-type: set
                            text:
                              maxLength: 512
                              type: string
                          type: object
                        domain:
                          maxLength: 64
                          type: string
                        field:
                          maxLength: 64
                          type: string
                        identity:
                          maxLength: 128
                          type: string
                        object:
                          maxLength: 255
                          type: string
                        roundTrip:
                          enum:
                          - lossless-represented
                          - preserved-native
                          - lossy
                          - unsupported
                          type: string
                      required:
                      - classification
                      - code
                      - domain
                      - field
                      - identity
                      - object
                      - roundTrip
                      type: object
                    maxItems: 256
                    type: array
                  diffHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  findings:
                    items:
                      properties:
                        blocking:
                          type: boolean
                        code:
                          maxLength: 512
                          type: string
                        domain:
                          maxLength: 64
                          type: string
                        message:
                          maxLength: 512
                          type: string
                      required:
                      - blocking
                      - code
                      - domain
                      - message
                      type: object
                    maxItems: 32
                    type: array
                  observationHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  providerIdentity:
                    description: AdoptionProviderIdentity excludes AdminRef, credentials
                      and credential hashes.
                    properties:
                      caIdentity:
                        description: CAIdentity binds the public trust bundle and
                          Secret UID.
                        maxLength: 255
                        type: string
                      caReference:
                        maxLength: 255
                        type: string
                      instance:
                        description: AdoptionTargetIdentity identifies a current object,
                          never write authority.
                        properties:
                          generation:
                            format: int64
                            minimum: 0
                            type: integer
                          importRef:
                            description: ImportRef binds the discovery latch without
                              consuming it.
                            maxLength: 255
                            type: string
                          kind:
                            maxLength: 64
                            type: string
                          name:
                            maxLength: 255
                            type: string
                          namespace:
                            maxLength: 255
                            type: string
                          tenantRef:
                            description: TenantRef binds connection-selecting target
                              metadata without acquiring it.
                            maxLength: 255
                            type: string
                          uid:
                            maxLength: 128
                            type: string
                        required:
                        - kind
                        - name
                        - namespace
                        - uid
                        type: object
                      objectIDs:
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 512
                        type: array
                        x-kubernetes-list-type: set
                      origin:
                        maxLength: 2048
                        type: string
                      realmID:
                        maxLength: 128
                        type: string
                      trust:
                        description: Unknown is reserved for incomplete diagnostic
                          evidence.
                        enum:
                        - public-ca
                        - private-ca
                        - explicit-http
                        - unknown
                        type: string
                    required:
                    - instance
                    - origin
                    - realmID
                    - trust
                    type: object
                  target:
                    description: AdoptionTargetIdentity identifies a current object,
                      never write authority.
                    properties:
                      generation:
                        format: int64
                        minimum: 0
                        type: integer
                      importRef:
                        description: ImportRef binds the discovery latch without consuming
                          it.
                        maxLength: 255
                        type: string
                      kind:
                        maxLength: 64
                        type: string
                      name:
                        maxLength: 255
                        type: string
                      namespace:
                        maxLength: 255
                        type: string
                      tenantRef:
                        description: TenantRef binds connection-selecting target metadata
                          without acquiring it.
                        maxLength: 255
                        type: string
                      uid:
                        maxLength: 128
                        type: string
                    required:
                    - kind
                    - name
                    - namespace
                    - uid
                    type: object
                  truncated:
                    type: boolean
                required:
                - approvable
                - candidateHash
                - complete
                - contractVersion
                - diffHash
                - observationHash
                - providerIdentity
                - target
                - truncated
                type: object
              adoptionReceipt:
                description: |-
                  AdoptionReceiptStatus reports a live provider checkpoint, never write or
                  deletion authority. A failed status update can be recovered from the provider.
                properties:
                  candidateHash:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  contractVersion:
                    enum:
                    - hanko.sh/adoption-contract/v1alpha1
                    type: string
                  state:
                    enum:
                    - Pending
                    - Verified
                    - Partial
                    - Conflict
                    type: string
                required:
                - candidateHash
                - contractVersion
                - state
                type: object
              authenticationTransition:
                description: |-
                  AuthenticationTransitionStatus is bounded preparation evidence. Copying it
                  into status never authorizes a provider write or cleanup.
                properties:
                  bindingRevision:
                    maxLength: 71
                    type: string
                  clientUUID:
                    maxLength: 128
                    type: string
                  desiredMode:
                    maxLength: 32
                    type: string
                  nativeStateHash:
                    maxLength: 71
                    type: string
                  planHash:
                    maxLength: 71
                    type: string
                  previousMode:
                    maxLength: 32
                    type: string
                  requestID:
                    maxLength: 128
                    type: string
                  step:
                    maxLength: 32
                    type: string
                required:
                - bindingRevision
                - clientUUID
                - desiredMode
                - nativeStateHash
                - planHash
                - previousMode
                - requestID
                - step
                type: object
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
