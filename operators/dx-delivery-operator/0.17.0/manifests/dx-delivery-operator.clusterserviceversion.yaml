    - name: dxxmlaccesses.dx.europesip.com
      version: v1alpha1
      kind: DXXMLAccess
      displayName: DXXMLAccess
      description: DXXMLAccess runs XMLAccess requests against HCL DX (base or virtual portal), once per change of the spec
        or of
