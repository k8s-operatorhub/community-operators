    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HankoResourceServer is the provider-neutral aggregate for one
          protected API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HankoResourceServerSpec defines the portable desired authorization model.
              Internal scope and resource references are checked at admission time. Realm,
              role, application, and service-account existence is checked fail-closed by
              the reconciler because structural CRD validation cannot dereference objects.
            properties:
              applicationRef:
                description: ApplicationRef names the HankoApplication backing this
                  resource server.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              audience:
                description: Audience is the immutable identifier of the protected
                  API.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: audience is immutable
                  optionalOldSelf: true
                  rule: '!oldSelf.hasValue() || self == oldSelf.value()'
              displayName:
                description: DisplayName is the human-readable protected API name.
                maxLength: 255
                type: string
              mode:
                default: Manage
                description: Mode controls provider write authority.
                enum:
                - Manage
                - Observe
                type: string
              permissions:
                description: Permissions is a name-keyed set of allow-only grants.
                items:
                  description: AuthorizationPermission grants scopes over optional
                    resources to principals.
                  properties:
                    delegation:
                      description: |-
                        Delegation constrains this grant to an explicit actor and subject identity.
                        Current Keycloak profiles refuse this capability before provider writes.
                        Omitting it preserves ordinary authorization semantics.
                      properties:
                        actor:
                          description: Actor is the software identity acting on behalf
                            of Subject.
                          properties:
                            kind:
                              enum:
                              - application
                              - service_account
                              type: string
                            ref:
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              type: string
                          required:
                          - kind
                          - ref
                          type: object
                        maxDepth:
                          default: 1
                          description: MaxDepth bounds the complete delegation chain,
                            including this actor.
                          format: int32
                          maximum: 4
                          minimum: 1
                          type: integer
                        maxTTLSeconds:
                          default: 120
                          description: MaxTTLSeconds also remains bounded by both
                            input token expirations.
                          format: int32
                          maximum: 600
                          minimum: 1
                          type: integer
                        subject:
                          description: Subject is the software identity whose authority
                            is delegated.
                          properties:
                            kind:
                              enum:
                              - application
                              - service_account
                              type: string
                            ref:
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              type: string
                          required:
                          - kind
                          - ref
                          type: object
                        taskAuthorization:
                          description: |-
                            TaskAuthorization requires issuer-created approval and online recipient checks.
                            Omission preserves existing software delegation. No task reference is stored here.
                          enum:
                          - required
                          type: string
                      required:
                      - actor
                      - subject
                      type: object
                      x-kubernetes-validations:
                      - message: delegation actor and subject must be different identities
                        rule: self.actor.kind != self.subject.kind || self.actor.ref
                          != self.subject.ref
                      - message: task authorization supports one hop
                        rule: '!has(self.taskAuthorization) || !has(self.maxDepth)
                          || self.maxDepth == 1'
                    name:
                      maxLength: 255
                      pattern: ^[A-Za-z0-9][A-Za-z0-9:._/-]*$
                      type: string
                    principals:
                      items:
                        description: |-
                          AuthorizationPrincipal is a portable role, workload or organization principal. Ref is a
                          namespaced Hanko object name; provider IDs are never accepted in desired state.
                        properties:
                          includeDescendants:
                            description: |-
                              IncludeDescendants explicitly includes current declared and independently
                              owned HankoOrganization descendants. Omitted/false is direct-only; foreign
                              provider subgroups are excluded. Only valid for kind organization.
                            type: boolean
                          kind:
                            enum:
                            - realm_role
                            - application
                            - service_account
                            - organization
                            type: string
                          ref:
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                        required:
                        - kind
                        - ref
                        type: object
                        x-kubernetes-validations:
                        - message: includeDescendants is only valid for organization
                            principals
                          rule: '!has(self.includeDescendants) || !self.includeDescendants
                            || self.kind == ''organization'''
                      maxItems: 128
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - kind
                      - ref
                      x-kubernetes-list-type: map
                    resources:
                      items:
                        maxLength: 255
                        type: string
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: set
                    scopes:
                      items:
                        maxLength: 255
                        type: string
                      maxItems: 8
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - name
                  - principals
                  - scopes
                  type: object
                  x-kubernetes-validations:
                  - message: delegation requires explicit declared resources
                    rule: '!has(self.delegation) || (has(self.resources) && size(self.resources)
                      > 0)'
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              realmRef:
                description: RealmRef references the HankoRealm containing every referenced
                  principal.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              resources:
                description: Resources is a name-keyed set of protected resource objects.
                items:
                  description: AuthorizationResource is a protected resource and its
                    scope bindings.
                  properties:
                    displayName:
                      maxLength: 255
                      type: string
                    name:
                      maxLength: 255
                      pattern: ^[A-Za-z0-9][A-Za-z0-9:._/-]*$
                      type: string
                    scopes:
                      items:
                        maxLength: 255
                        type: string
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: set
                    type:
                      maxLength: 255
                      type: string
                    uris:
                      items:
                        maxLength: 255
                        minLength: 1
                        pattern: ^[^\x00-\x1F\x7F]+$
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              scopes:
                description: Scopes is a name-keyed set of portable authorization
                  scopes.
                items:
                  description: AuthorizationScope is a scope owned by one resource
                    server.
                  properties:
                    description:
                      maxLength: 255
                      type: string
                    name:
                      maxLength: 255
                      pattern: ^[A-Za-z0-9][A-Za-z0-9:._/-]*$
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - applicationRef
            - audience
            - realmRef
            type: object
            x-kubernetes-validations:
            - message: every resource scope must reference a declared scope
              rule: '!has(self.resources) || self.resources.all(r, !has(r.scopes)
                || (has(self.scopes) && r.scopes.all(scopeName, self.scopes.exists(s,
                s.name == scopeName))))'
            - message: every permission scope must reference a declared scope
              rule: '!has(self.permissions) || self.permissions.all(p, has(self.scopes)
                && p.scopes.all(scopeName, self.scopes.exists(s, s.name == scopeName)))'
            - message: every permission resource must reference a declared resource
              rule: '!has(self.permissions) || self.permissions.all(p, !has(p.resources)
                || (has(self.resources) && p.resources.all(resourceName, self.resources.exists(r,
                r.name == resourceName))))'
