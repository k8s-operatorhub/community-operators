apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftwises.shiftwise.ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
spec:
  group: shiftwise.ai
  names:
    kind: ShiftWise
    listKind: ShiftWiseList
    plural: shiftwises
    singular: shiftwise
    shortNames:
      - sw
    categories:
      - shiftwise
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.readyComponents
        - name: Storage
          type: string
          jsonPath: .spec.storage.size
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: ShiftWise is the Schema for the shiftwises API.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ShiftWiseSpec defines the desired state of a ShiftWise platform instance.
              type: object
              properties:
                storage:
                  description: Shared PVC used by Harvester, Analyzer, Core AI and Reporter. PostgreSQL credentials are generated automatically.
                  type: object
                  properties:
                    existingClaim:
                      type: string
                    name:
                      type: string
                    size:
                      description: Size is a positive Kubernetes quantity (for example, 20Gi). Omit or leave empty to use the default.
                      pattern: '^(\+?([0-9]*[1-9][0-9]*(\.[0-9]*)?|[0-9]*\.[0-9]*[1-9][0-9]*)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?)?$'
                      type: string
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items:
                        type: string
            status:
              description: ShiftWiseStatus defines the observed state of ShiftWise.
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Initializing
                    - Progressing
                    - Ready
                    - Error
                readyComponents:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
