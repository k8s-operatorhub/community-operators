apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: mongoclusters.core.navique.com
spec:
  group: core.navique.com
  names:
    kind: MongoCluster
    listKind: MongoClusterList
    plural: mongoclusters
    shortNames:
    - mongo
    singular: mongocluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.host
      name: Host
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MongoCluster is a shared MongoDB replica set.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MongoClusterSpec defines a shared MongoDB (MongoDB Controllers for Kubernetes).
              It mirrors the PostgresCluster shape: a single replica set with one SCRAM admin
              user, exposing per-consumer logical databases (each materialized as a MONGO_URI
              Secret) so multiple workloads can share one MongoDB.
            properties:
              adopt:
                description: MongoAdopt references an existing MongoDBCommunity (lifecycle
                  not managed).
                properties:
                  connectionSecretRef:
                    description: |-
                      ConnectionSecretRef is the connection-string Secret for the adopted instance
                      (key "connectionString.standard"). Defaults to MCK's
                      "<instance>-admin-<user>" convention when omitted. Namespace defaults to the
                      adopted instance's namespace; when that is not this CR's namespace the operator
                      mirrors the Secret into an owned Secret here.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  instanceRef:
                    description: |-
                      InstanceRef references the existing MongoDBCommunity. Namespace is optional
                      and defaults to this CR's namespace; a cross-namespace reference is resolved
                      against the referenced namespace (the service host is built from it).
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - instanceRef
                type: object
              databases:
                description: |-
                  Databases declares the logical databases provisioned for consumers. Each
                  yields a per-database credentials Secret holding a MONGO_URI (the shared
                  SCRAM user authenticated against admin, pointed at that database). MongoDB
                  creates databases lazily on first write, so no DDL is issued.
                items:
                  description: MongoDatabase declares a logical database exposed to
                    a consumer.
                  properties:
                    credentialsSecretName:
                      description: |-
                        CredentialsSecretName is the Secret the operator materializes for the
                        consumer (holds MONGO_URI). Defaults to "<cluster>-<name>-credentials".
                      type: string
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              external:
                description: MongoExternal points at an external MongoDB via a connection
                  secret.
                properties:
                  connectionSecretRef:
                    description: |-
                      ConnectionSecretRef references a Secret holding a base connection string
                      under the key "MONGO_URI" (or the ref's Key). Per-database URIs are derived
                      from it.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - connectionSecretRef
                type: object
              managed:
                description: MongoManaged configures an operator-owned MongoDBCommunity
                  replica set.
                properties:
                  backup:
                    description: |-
                      Backup configures scheduled backups to object storage (S3/Azure/GCS) via a
                      mongodump + rclone CronJob. Managed mode only.
                    properties:
                      azure:
                        description: Azure configures Azure Blob Storage.
                        properties:
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret holding a "connection-string" key.
                              Omit when using inheritFromAzureAD.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          destinationPath:
                            description: DestinationPath, e.g. "https://<account>.blob.core.windows.net/<container>/".
                            type: string
                          inheritFromAzureAD:
                            description: InheritFromAzureAD uses Azure Workload Identity
                              instead of static credentials.
                            type: boolean
                        required:
                        - destinationPath
                        type: object
                      enabled:
                        description: Enabled turns on scheduled backups + continuous
                          WAL archiving (PITR).
                        type: boolean
                      gcs:
                        description: GCS configures Google Cloud Storage.
                        properties:
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret holding a "credentials" key with the
                              service-account JSON. Omit when using gkeEnvironment.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          destinationPath:
                            description: DestinationPath, e.g. "gs://my-bucket/path".
                            type: string
                          gkeEnvironment:
                            description: GKEEnvironment uses GKE Workload Identity
                              instead of a service-account key.
                            type: boolean
                        required:
                        - destinationPath
                        type: object
                      provider:
                        default: s3
                        description: Provider selects the object-storage backend.
                        enum:
                        - s3
                        - azure
                        - gcs
                        type: string
                      retentionPolicy:
                        default: 30d
                        description: |-
                          RetentionPolicy is the recovery-window retention, e.g. "30d", "4w", "6m".
                          Defaults to "30d".
                        type: string
                      s3:
                        description: S3 configures AWS S3 or any S3-compatible store
                          (MinIO, Cloudflare R2, …).
                        properties:
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret holding keys "access-key-id" and
                              "secret-access-key". Omit when using inheritFromIAMRole.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          destinationPath:
                            description: DestinationPath is the bucket URL, e.g. "s3://my-bucket/path".
                            type: string
                          endpointURL:
                            description: EndpointURL overrides the S3 endpoint for
                              S3-compatible stores (MinIO, R2).
                            type: string
                          inheritFromIAMRole:
                            description: InheritFromIAMRole uses the pod's IAM role
                              (IRSA) instead of static keys.
                            type: boolean
                        required:
                        - destinationPath
                        type: object
                      schedule:
                        default: 0 0 2 * * *
                        description: |-
                          Schedule is the backup cadence as a 6-field cron WITH SECONDS
                          (sec min hour dom mon dow) — the format CNPG's ScheduledBackup requires
                          (NOT the 5-field crontab format). Defaults to "0 0 2 * * *" (daily 02:00).
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - fieldPath: .s3
                      message: backup.provider 's3' requires backup.s3
                      reason: FieldValueRequired
                      rule: '!self.enabled || self.provider != ''s3'' || has(self.s3)'
                    - fieldPath: .azure
                      message: backup.provider 'azure' requires backup.azure
                      reason: FieldValueRequired
                      rule: '!self.enabled || self.provider != ''azure'' || has(self.azure)'
                    - fieldPath: .gcs
                      message: backup.provider 'gcs' requires backup.gcs
                      reason: FieldValueRequired
                      rule: '!self.enabled || self.provider != ''gcs'' || has(self.gcs)'
                  credentialsSecretName:
                    description: CredentialsSecretName overrides the operator-generated
                      SCRAM password Secret.
                    type: string
                  members:
                    default: 1
                    description: Members is the replica-set size.
                    format: int32
                    type: integer
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  rotation:
                    description: |-
                      Rotation rotates the operator-generated SCRAM password (licensed); MCK
                      reconciles the change into the replica set.
                    properties:
                      enabled:
                        type: boolean
                      interval:
                        description: Interval between rotations (default 2160h = 90d
                          when enabled).
                        type: string
                    type: object
                  storageClass:
                    type: string
                  storageSize:
                    type: string
                  version:
                    default: 8.0.4
                    description: Version is the MongoDB server version.
                    type: string
                type: object
              mode:
                enum:
                - managed
                - adopt
                - external
                type: string
              type:
                default: mck
                description: |-
                  Type selects the MongoDB engine. Only "mck" (MongoDB Controllers for
                  Kubernetes, emitting a MongoDBCommunity replica set) is implemented.
                enum:
                - mck
                type: string
            required:
            - mode
            - type
            type: object
          status:
            description: MongoClusterStatus reports connection coordinates + per-database
              state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecret:
                description: |-
                  CredentialsSecret is the cluster connection-string Secret (MCK-generated or
                  external/adopted).
                type: string
              databases:
                items:
                  description: DatabaseStatus reports the per-database provisioning
                    state.
                  properties:
                    claimedBy:
                      description: |-
                        ClaimedBy lists the workloads that reference this datastore and use this
                        database ("Kind namespace/name"). With the auto-wiring licence a claimed
                        database is created even when spec.databases does not declare it.
                      items:
                        type: string
                      type: array
                    credentialsSecret:
                      type: string
                    name:
                      type: string
                    ready:
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
              host:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              port:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
