---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dxxmlaccesses.dx.europesip.com
spec:
  group: dx.europesip.com
  names:
    kind: DXXMLAccess
    listKind: DXXMLAccessList
    plural: dxxmlaccesses
    shortNames:
    - dxxml
    singular: dxxmlaccess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.virtualPortal.context
      name: Virtual portal
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.outputRef
      name: Output
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DXXMLAccess runs XMLAccess requests against HCL DX (base or virtual portal), once per change of the spec or of
          its source, like a Job: it does not watch for drift.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DXXMLAccessSpec says which XMLAccess requests to run and
              where.
            properties:
              cleanup:
                description: |-
                  Cleanup: a request run when the resource is deleted. Without it, deleting the resource changes nothing in
                  DX. A failed cleanup is reported as an event; the resource is removed anyway.
                properties:
                  file:
                    description: File of spec.source with the request.
                    type: string
                  xml:
                    description: XML of the request (inline).
                    type: string
                type: object
              connectionRef:
                description: 'ConnectionRef: the DXConnection of the DX (its user
                  must be a DX administrator).'
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              continueOnError:
                description: 'ContinueOnError: run the next requests after a failed
                  one. Default false: stop at the first failure.'
                type: boolean
              dependsOn:
                description: 'DependsOn: resources that must be Ready first.'
                items:
                  description: Dependency is an object that must be ready before the
                    resource is reconciled.
                  properties:
                    apiVersion:
                      description: APIVersion of the object, for example apps/v1 (default)
                        or dx.europesip.com/v1alpha1.
                      type: string
                    kind:
                      description: 'Kind: Deployment, StatefulSet, Job, DXScriptApplication,
                        DXPage, DXDamCollection, DXDatabase, DXTheme, DXWCMLibraryImport
                        or DXXMLAccess.'
                      enum:
                      - Deployment
                      - StatefulSet
                      - Job
                      - DXScriptApplication
                      - DXPage
                      - DXDamCollection
                      - DXDatabase
                      - DXTheme
                      - DXWCMLibraryImport
                      - DXXMLAccess
                      type: string
                    name:
                      description: Name of the object, in the same namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              dryRun:
                description: 'DryRun: only fetch the files, check that each one is
                  an XMLAccess request and report them, without calling DX.'
                type: boolean
              files:
                description: 'Files of the source to run, in this order. Empty: every
                  *.xml file of the source, sorted by path.'
                items:
                  type: string
                type: array
              objectIDs:
                default: Keep
                description: |-
                  ObjectIDs: what DX does with the object IDs (objectid) of the resources the requests create, chosen when importing
                  (as DXWCMLibraryImport mode Import / ImportCopy). Keep (default): the requests are sent as they are, so the IDs of
                  the XML are kept (staging → production, portals that are syndicated later; pair it with mode Import for Portal
                  Site). New: create-oids="true" is set on every <request>, so DX gives new IDs (a copy into a portal where they
                  would collide; pair it with mode ImportCopy). Also for XML exported with xmlaccess.sh of a traditional DX.
                enum:
                - Keep
                - New
                type: string
              output:
                description: 'Output: keep DX''s answer to every request in a ConfigMap
                  (handy for export requests).'
                properties:
                  configMap:
                    description: |-
                      ConfigMap that receives one key per request: <file name> ("/" becomes "__"; "request.xml" for spec.xml) with
                      DX's answer. The operator creates it and owns it (deleted with the resource). A ConfigMap holds at most 1 MiB,
                      so answers bigger than 900 KiB are never cut: the ConfigMap only gets a README key, and without oci the run
                      fails with OutputTooLarge. Use oci for exports.
                    properties:
                      name:
                        description: Name of the object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  oci:
                    description: |-
                      OCI: push the answers to a registry (for example Harbor) as an OCI artifact, one file per request plus
                      results.json, the way "oras push" does: versioned, with no size limit, readable with "oras pull" or as the
                      source of another resource (for example a DXXMLAccess of another environment). Every run pushes a new tag.
                    properties:
                      pushSecrets:
                        description: 'PushSecrets: Secrets of type kubernetes.io/dockerconfigjson
                          with credentials that may push to the repository.'
                        items:
                          description: LocalObjectReference names an object in the
                            same namespace.
                          properties:
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      repository:
                        description: Repository without tag, for example harbor.example.com/dx-exports/url-mappings.
                        pattern: ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$
                        type: string
                      tag:
                        description: 'Tag of each run. ${DATE} is replaced by the
                          time of the run (yyyymmdd-hhmmss, UTC). Default: ${DATE}.'
                        type: string
                    required:
                    - repository
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set configMap, oci or both
                  rule: has(self.configMap) || has(self.oci)
              source:
                description: |-
                  Source of the files with the requests: an OCI image or ORAS artifact (Harbor), an archive URL (for example
                  the archive of a folder of a Git repository: https://gitlab.example.com/g/p/-/archive/main/p-main.tar.gz with
                  path p-main/xmlaccess, or an S3 presigned URL) or a ConfigMap.
                properties:
                  configMap:
                    description: |-
                      ConfigMap: every key of the ConfigMap is a file (data and binaryData). Handy for small applications:
                      a ConfigMap and its Secret are limited to 1 MiB. Keys cannot contain "/", so a key "assets__app.js"
                      becomes the file "assets/app.js".
                    properties:
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  image:
                    description: |-
                      Image: an OCI image (a "bundle image") that carries the files. The operator reads its layers directly
                      from the registry: nothing runs in the cluster. Use a digest (repo@sha256:...) for immutable deployments.
                    properties:
                      path:
                        default: /app
                        description: |-
                          Path inside the image where the files are (default /app). With the default and nothing under /app, the only
                          top-level folder with files that is not part of an operating system is used (for example /export).
                        type: string
                      pullSecrets:
                        description: 'PullSecrets: Secrets of type kubernetes.io/dockerconfigjson
                          for a private registry.'
                        items:
                          description: LocalObjectReference names an object in the
                            same namespace.
                          properties:
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      ref:
                        description: Reference of the image, for example ghcr.io/acme/my-app:1.2.0
                          or ghcr.io/acme/my-app@sha256:...
                        minLength: 1
                        type: string
                    required:
                    - ref
                    type: object
                  url:
                    description: |-
                      URL: a .tar.gz, .tgz or .zip archive downloaded over HTTP(S), for example a CI artifact or a GitHub
                      release asset.
                    properties:
                      path:
                        description: 'Path inside the archive where the files are
                          (default: the root).'
                        type: string
                      sha256:
                        description: |-
                          SHA256 of the archive (hex). Recommended: the download is rejected if it does not match, and the
                          operator only downloads it again when this value changes.
                        type: string
                      url:
                        description: URL of a .tar.gz, .tgz or .zip archive.
                        pattern: ^https?://
                        type: string
                    required:
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of image, configMap or url
                  rule: '(has(self.image) ? 1 : 0) + (has(self.configMap) ? 1 : 0)
                    + (has(self.url) ? 1 : 0) == 1'
              suspend:
                description: Suspend stops the reconciliation.
                type: boolean
              timeout:
                description: Timeout of each request. Default 10m.
                type: string
              variables:
                additionalProperties:
                  type: string
                description: 'Variables: ${NAME} in the XML is replaced by the value
                  (not for secrets: the spec is plain text).'
                type: object
              virtualPortal:
                description: 'VirtualPortal: send the requests to this virtual portal.
                  Empty: the base portal.'
                properties:
                  context:
                    description: 'Context: URL context of the virtual portal (the
                      part after /wps/portal/), for example "europesip".'
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                    type: string
                required:
                - context
                type: object
              xml:
                description: 'XML: one request, inline.'
                type: string
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of xml or source
              rule: has(self.xml) != has(self.source)
          status:
            description: DXXMLAccessStatus is the result of the last run.
            properties:
              appliedHash:
                description: |-
                  AppliedHash of the spec, the source revision and the reconcile annotation of the last finished run: it runs
                  again only when it changes.
                type: string
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dryRun:
                description: 'DryRun: true when the status describes a dry run.'
                type: boolean
              message:
                description: 'Message: last result in words.'
                type: string
              observedGeneration:
                format: int64
                type: integer
              outputDigest:
                description: 'OutputDigest: repository@sha256:... of that artifact
                  (immutable).'
                type: string
              outputRef:
                description: 'OutputRef: the artifact pushed by the last run (repository:tag),
                  with output.oci.'
                type: string
              phase:
                description: XMLAccessPhase is the step a run is in.
                type: string
              results:
                description: 'Results: one entry per request, in the order they ran.'
                items:
                  description: XMLAccessFileResult is one request of a run and what
                    DX answered.
                  properties:
                    file:
                      description: File of the source, or "request.xml" for spec.xml.
                      type: string
                    message:
                      description: 'Message: the first message of DX when it failed.'
                      type: string
                    result:
                      description: 'Result: ok, error, skipped (after an earlier failure)
                        or checked (dry run).'
                      type: string
                    type:
                      description: Type of the request (update, export...).
                      type: string
                  required:
                  - file
                  - result
                  type: object
                type: array
              sourceRevision:
                description: SourceRevision of the files.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
