                    type: boolean
                  profileType:
                    description: ProfileType is the configured profile type (Old,
                      Intermediate, Modern, Custom)
                    type: string
                required:
                - compliant
                - groupsCompliant
                - minTLSVersionMet
                - profileType
                type: object
              keyExchangeTypes:
                additionalProperties:
                  type: string
                description: |-
                  KeyExchangeTypes maps TLS version to the key exchange algorithm used
                  (ECDHE, DHE, RSA, or TLS13)
                type: object
              kubeletProfileCompliance:
                description: |-
                  KubeletProfileCompliance contains the compliance result against the
                  OpenShift KubeletConfig TLS security profile (OpenShift only)
                properties:
                  compliant:
                    description: Compliant indicates whether the endpoint meets the
                      profile requirements
                    type: boolean
                  disallowedCiphers:
                    description: |-
                      DisallowedCiphers lists cipher suites negotiated by the endpoint that are
                      not in the profile's allowed list
                    items:
                      type: string
                    type: array
                  disallowedGroups:
                    description: |-
                      DisallowedGroups lists key exchange groups negotiated by the endpoint
                      that are not in the profile's allowed list
                    items:
                      type: string
                    type: array
                  groupsCompliant:
                    description: |-
                      GroupsCompliant indicates whether the endpoint's negotiated curves are
                      in the profile's allowed groups list
                    type: boolean
                  minTLSVersionMet:
                    description: |-
                      MinTLSVersionMet indicates whether the endpoint does not support TLS versions
                      below the profile's minimum
                    type: boolean
                  profileType:
                    description: ProfileType is the configured profile type (Old,
                      Intermediate, Modern, Custom)
                    type: string
                required:
                - compliant
                - groupsCompliant
                - minTLSVersionMet
                - profileType
                type: object
              lastCheckAt:
                description: LastCheckAt is when the last TLS check was performed
                format: date-time
                type: string
              lastError:
                description: LastError is the last error message from a TLS check
                type: string
              lastSeenAt:
                description: LastSeenAt is when this endpoint was last observed
                format: date-time
                type: string
              mlkemSupported:
                description: |-
                  MLKEMSupported indicates whether the endpoint accepted a hybrid ML-KEM
                  key exchange when explicitly offered via active probing
                type: boolean
              negotiatedCurves:
                additionalProperties:
                  type: string
                description: |-
                  NegotiatedCurves maps TLS version to the negotiated key exchange curve
                  (e.g. X25519, P-256, X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024)
                type: object
              nextRetryAt:
                description: NextRetryAt is when the next retry attempt will happen
                format: date-time
                type: string
              nextScanAt:
                description: NextScanAt is the estimated time of the next TLS check
                format: date-time
                type: string
              overallCipherGrade:
                description: OverallCipherGrade is the worst grade across all negotiated
                  cipher suites
                type: string
              pqcReadiness:
                description: |-
                  PQCReadiness classifies the endpoint's post-quantum cryptography readiness:
                  PQCReady (TLS 1.3 + hybrid ML-KEM), TLS13Capable (TLS 1.3 without ML-KEM),
                  LegacyTLS (TLS 1.2 or older only), or NoPQC (no TLS detected)
                enum:
                - PQCReady
                - TLS13Capable
                - LegacyTLS
                - NoPQC
                type: string
              quantumReady:
                description: |-
                  QuantumReady indicates whether any TLS connection negotiated a
                  hybrid ML-KEM key exchange (e.g. X25519MLKEM768, SecP256r1MLKEM768)
                type: boolean
              retryCount:
                description: RetryCount is the current retry attempt number for transient
                  failures
                type: integer
              scanDuration:
                description: ScanDuration is the wall-clock time taken by the last
                  TLS check (e.g. "1.23s")
                type: string
              serverPrefersOwnCiphers:
                description: |-
                  ServerPrefersOwnCiphers indicates whether the TLS 1.2 endpoint selects its
                  own cipher order instead of following the client's offered order. A nil
                  value means detection was disabled or inconclusive.
                type: boolean
              tlsAdherence:
                description: |-
                  TLSAdherence is the OpenShift APIServer TLS adherence mode
                  (e.g. LegacyAdheringComponentsOnly, StrictAllComponents).
                  Empty on non-OpenShift clusters or when the field is not set.
                type: string
              tlsVersions:
                description: TLSVersions indicates which TLS versions are supported
                properties:
                  ssl30:
                    description: SSL30 indicates if the deprecated SSLv3 protocol
                      is supported
                    type: boolean
                  tls10:
                    description: TLS10 indicates if TLS 1.0 is supported
                    type: boolean
                  tls11:
                    description: TLS11 indicates if TLS 1.1 is supported
                    type: boolean
                  tls12:
                    description: TLS12 indicates if TLS 1.2 is supported
                    type: boolean
                  tls13:
                    description: TLS13 indicates if TLS 1.3 is supported
                    type: boolean
                required:
                - tls10
                - tls11
                - tls12
                - tls13
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
