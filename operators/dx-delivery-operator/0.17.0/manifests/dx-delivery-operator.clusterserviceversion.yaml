        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: dx-delivery-operator
          template:
            metadata:
              labels:
                app.kubernetes.io/name: dx-delivery-operator
            spec:
              serviceAccountName: dx-delivery-operator
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: manager
                image: ghcr.io/europesip/dx-delivery-operator:0.17.0
