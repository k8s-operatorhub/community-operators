                                          HTTP/native URLs; port defaults to 8123/9000).
                            - Redis:      "host", "password" (port defaults to 6379).
                            - Mongo:      "MONGO_URI" (the full connection string; override via .key).
                            - Meilisearch:"MEILI_MASTER_KEY" (the master key; pair with .host).
