  description: |
    The Barman Cloud Plugin for [CloudNativePG](https://cloudnative-pg.io/)
    enables online continuous physical backups of PostgreSQL clusters to object
    storage, using the `barman-cloud` suite from the
    [Barman](https://docs.pgbarman.org/release/latest/) project.

    It replaces the in-tree object storage support previously provided by the
    `.spec.backup.barmanObjectStore` section of the `Cluster` resource. Backups
    taken with the in-tree approach remain fully compatible.

    ## Features

    - Physical online backup and restore of the data directory
    - Write-Ahead Log (WAL) archiving and restore
    - Full cluster recovery and Point-in-Time Recovery (PITR)
    - Replica cluster bootstrap and WAL restore from the archive

    Supported object stores: Amazon S3 (and S3-compatible storage), Google Cloud
    Storage and Microsoft Azure Blob Storage.

    ## Requirements

    - The CloudNativePG operator, version 1.30 or later.
    - The plugin **must** be installed in the same namespace as the
      CloudNativePG operator.
    - TLS certificates used for the mutual TLS (mTLS) communication
      with the CloudNativePG operator.

    ### Post-installation: TLS certificates

    The plugin and the CloudNativePG operator communicate over mutual TLS.
    After installing the plugin, create the following secrets in the
    plugin's namespace:

    - `barman-cloud-server-tls`: server certificate, valid for the
      `barman-cloud` DNS name
    - `barman-cloud-client-tls`: client certificate used by the
      CloudNativePG operator

    The plugin starts serving requests as soon as both secrets exist; no
    restart is needed. The recommended way to create and renew them is
    [cert-manager](https://cert-manager.io/):

    ```yaml
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: selfsigned-issuer
    spec:
      selfSigned: {}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: barman-cloud-server
    spec:
      secretName: barman-cloud-server-tls
      commonName: barman-cloud
      dnsNames:
        - barman-cloud
      usages:
        - server auth
      issuerRef:
        name: selfsigned-issuer
        kind: Issuer
        group: cert-manager.io
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: barman-cloud-client
    spec:
      secretName: barman-cloud-client-tls
      commonName: barman-cloud-client
      usages:
        - client auth
      issuerRef:
        name: selfsigned-issuer
        kind: Issuer
        group: cert-manager.io
    ```

    Apply it with `kubectl apply -n <plugin namespace> -f <file>`.

    ## Documentation

    See the [Barman Cloud Plugin documentation](https://cloudnative-pg.io/plugin-barman-cloud/)
    for configuration, usage, and migration from the in-tree backup support.
