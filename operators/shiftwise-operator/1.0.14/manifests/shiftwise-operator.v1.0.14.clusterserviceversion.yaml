          - serviceaccounts
          - secrets
          - configmaps
          - persistentvolumeclaims
          - events
          - pods
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - apps
          resources:
          - deployments
          - statefulsets
          - daemonsets
          - replicasets
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterroles
          - clusterrolebindings
          - roles
          - rolebindings
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterroles
          resourceNames:
          - cluster-reader
          verbs:
          - bind
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterroles
          resourceNames:
          - system:auth-delegator
          verbs:
          - bind
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        - apiGroups:
          - policy
          resources:
          - poddisruptionbudgets
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - admissionregistration.k8s.io
          resources:
          - validatingadmissionpolicies
          - validatingadmissionpolicybindings
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - route.openshift.io
          resources:
          - routes
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - image.openshift.io
          resources:
          - imagestreams
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - build.openshift.io
          resources:
          - buildconfigs
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - shiftwise.ai
          resources:
          - shiftwises
          - shiftwises/status
          - shiftwises/finalizers
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      permissions:
      - serviceAccountName: shiftwise-operator-controller-manager
        rules:
        - apiGroups:
          - ''
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
          - patch
      deployments:
      - name: shiftwise-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: shiftwise-operator
              control-plane: controller-manager
          template:
            metadata:
              labels:
                app.kubernetes.io/name: shiftwise-operator
                app.kubernetes.io/part-of: kubeoptix
                control-plane: controller-manager
              annotations:
                kubectl.kubernetes.io/default-container: manager
            spec:
              serviceAccountName: shiftwise-operator-controller-manager
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: manager
                image: quay.io/parraes/shiftwise-operator:1.0.14
                imagePullPolicy: Always
                args:
                - --metrics-bind-address=:8080
                - --health-probe-bind-address=:8081
                - --leader-elect
                env:
                - name: WATCH_NAMESPACE
                  value: ''
                - name: OPERATOR_NAME
                  value: shiftwise-operator
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                ports:
                - name: metrics
                  containerPort: 8080
                  protocol: TCP
                - name: health
                  containerPort: 8081
                  protocol: TCP
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: health
                  initialDelaySeconds: 15
                  periodSeconds: 20
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: health
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                volumeMounts:
                - name: tmp
                  mountPath: /tmp
              volumes:
              - name: tmp
                emptyDir: {}
              terminationGracePeriodSeconds: 10
