  description: |
    ## KubeVault by AppsCode — HashiCorp Vault Operator for Kubernetes

    **KubeVault by AppsCode** is a Kubernetes operator that deploys and manages
    [HashiCorp Vault](https://www.vaultproject.io/) and OpenBao clusters, and lets you manage
    secret engines, roles and secret access requests with Kubernetes custom resources. It runs on
    any Kubernetes distribution, including Red Hat OpenShift.

    Installing this operator through Operator Lifecycle Manager (OLM) deploys and manages the
    KubeVault operator, its CRD manager, the Vault server version catalog and the webhook server.
    Create a `Kubevault` resource to install KubeVault and edit it to configure or upgrade the
    installation.

    ---

    ## Features

    - **Declarative Vault lifecycle** — provision, configure and upgrade Vault and OpenBao servers
      with custom resources, using `kubectl`, Helm or GitOps.
    - **Secret engines and roles** — manage secret engines and database/cloud roles (for example
      AWS, Azure, GCP, MongoDB, MySQL and PostgreSQL) as Kubernetes resources.
    - **Secret access requests** — request and approve dynamic credentials through Kubernetes
      resources.
    - **Version catalog** — a bundled catalog of supported Vault and OpenBao server versions.

    ---

    ## Prerequisites

    KubeVault uses [cert-manager](https://cert-manager.io) to issue the serving certificate of its
    webhook server. Install cert-manager before creating a `Kubevault` resource.

    ---

    ## More Information

    - **Website:** https://kubevault.com
    - **Documentation:** https://kubevault.com/docs
    - **GitHub:** https://github.com/kubevault
    - **Support:** https://appscode.freshdesk.com
    - **Contact Sales:** https://appscode.com/contact
