apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: observabilities.core.navique.com
spec:
  group: core.navique.com
  names:
    kind: Observability
    listKind: ObservabilityList
    plural: observabilities
    shortNames:
    - obs
    singular: observability
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Observability is an LLM observability/tracing backend (type=langfuse
          implemented).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ObservabilitySpec defines an LLM observability/tracing backend. The backend is
              pluggable via Type (only "langfuse" is implemented; alternatives are scaffolded),
              with the type-specific configuration in the matching nested block — mirroring the
              datastore CRDs (PostgresCluster type switch) and BlobStorage's discriminated union.
            properties:
              image:
                description: ImageSpec is a container image reference.
                properties:
                  pullPolicy:
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  repository:
                    type: string
                  tag:
                    type: string
                type: object
              ingress:
                description: Ingress, when TLS-enabled, triggers Ensure(cert-manager).
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  api:
                    description: |-
                      API overrides the cluster-wide routing API (PlatformConfig.spec.routing) for
                      THIS workload. Empty follows the resolved cluster/mesh mode; "Ingress" forces
                      a classic Ingress even when a mesh is active (escape hatch); "Gateway" forces
                      a Gateway API HTTPRoute.
                    enum:
                    - Ingress
                    - Gateway
                    type: string
                  basicAuthSecret:
                    description: |-
                      BasicAuthSecret references a same-namespace Secret (htpasswd) for nginx
                      basic-auth annotations.
                    type: string
                  className:
                    type: string
                  clusterIssuer:
                    description: ClusterIssuer is the cert-manager ClusterIssuer to
                      use when TLS is true.
                    type: string
                  enabled:
                    type: boolean
                  host:
                    type: string
                  tls:
                    description: TLS enables a cert-manager-issued certificate for
                      Host.
                    type: boolean
                type: object
              langfuse:
                description: Langfuse holds the configuration when type=langfuse.
                properties:
                  auth:
                    description: |-
                      LangfuseAuth configures NextAuth. nextauth-secret/salt are auto-generated by
                      the langfuse-operator unless overridden here.
                    properties:
                      disableSignup:
                        type: boolean
                      nextAuthUrl:
                        type: string
                    type: object
                  blob:
                    description: |-
                      Blob configures object storage for event/media uploads. Langfuse v3
                      requires blob storage; pick a provider (S3-compatible, Azure Blob, or GCS).
                    properties:
                      azure:
                        description: Azure configures Azure Blob Storage.
                        properties:
                          containerName:
                            description: ContainerName is the blob container (Langfuse's
                              upload "bucket").
                            type: string
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret holding the storage account key
                              under the canonical key account-key. Omit to use ambient credentials
                              (AKS Workload Identity).
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            description: |-
                              Endpoint overrides the blob service endpoint. Defaults to
                              https://<storageAccountName>.blob.core.windows.net. Set for Azure
                              Government, sovereign clouds, or an Azurite emulator.
                            type: string
                          storageAccountName:
                            description: StorageAccountName is the Azure storage account.
                            type: string
                        required:
                        - containerName
                        - storageAccountName
                        type: object
                      gcs:
                        description: GCS configures Google Cloud Storage.
                        properties:
                          bucket:
                            description: Bucket is the GCS bucket name.
                            type: string
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret holding the service-account JSON
                              under the canonical key credentials. Omit to use Workload Identity /
                              Application Default Credentials on GKE.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          projectId:
                            description: ProjectID is the GCP project ID (optional;
                              inferred from credentials).
                            type: string
                        required:
                        - bucket
                        type: object
                      provider:
                        default: s3
                        description: Provider selects the object storage backend.
                        enum:
                        - s3
                        - azure
                        - gcs
                        type: string
                      s3:
                        description: S3 configures AWS S3 or any S3-compatible store
                          (MinIO, Cloudflare R2, …).
                        properties:
                          bucket:
                            description: Bucket is the S3 bucket Langfuse uploads
                              events/media to.
                            type: string
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret holding the access key id and
                              secret access key under the canonical keys access-key-id /
                              secret-access-key. Omit to use ambient credentials (EKS IRSA / Pod Identity).
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            description: |-
                              Endpoint overrides the S3 endpoint for S3-compatible stores (MinIO, R2,
                              on-prem). Leave empty for AWS S3.
                            type: string
                          forcePathStyle:
                            description: |-
                              ForcePathStyle enables path-style addressing, required by MinIO and most
                              S3-compatible stores.
                            type: boolean
                          region:
                            description: |-
                              Region is the S3 region. Optional: the operator defaults it to us-east-1
                              when unset, because the AWS SDK requires a region even for S3-compatible
                              stores (MinIO, R2) and a missing one silently breaks event ingestion. Set
                              it explicitly for real AWS S3 buckets.
                            type: string
                        required:
                        - bucket
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - fieldPath: .s3
                      message: blob.provider 's3' requires blob.s3
                      reason: FieldValueRequired
                      rule: self.provider != 's3' || has(self.s3)
                    - fieldPath: .azure
                      message: blob.provider 'azure' requires blob.azure
                      reason: FieldValueRequired
                      rule: self.provider != 'azure' || has(self.azure)
                    - fieldPath: .gcs
                      message: blob.provider 'gcs' requires blob.gcs
                      reason: FieldValueRequired
                      rule: self.provider != 'gcs' || has(self.gcs)
                  bootstrap:
                    description: |-
                      Bootstrap headless-seeds an organization/project/API-key + admin user at
                      startup (Langfuse `LANGFUSE_INIT_*`). This is the declarative way to obtain
                      tracing keys on **community** Langfuse, which has no Admin API — so a
                      LiteLLM `Gateway`/`ChatUI` can wire to it without Langfuse Enterprise. Maps
                      to the LangfuseInstance `web.extraEnv`.
                    properties:
                      adminSecretRef:
                        description: |-
                          AdminSecretRef references a Secret with the initial admin user under keys
                          "email" and "password".
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      enabled:
                        default: true
                        type: boolean
                      keysSecretRef:
                        description: |-
                          KeysSecretRef references a Secret with the project API keys under keys
                          "publicKey" and "secretKey".
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      orgId:
                        description: OrgID / ProjectID are stable identifiers (so
                          re-seeding is idempotent).
                        type: string
                      orgName:
                        type: string
                      projectId:
                        type: string
                      projectName:
                        type: string
                    required:
                    - adminSecretRef
                    - keysSecretRef
                    type: object
                  clickhouse:
                    description: DatastoreRef points at a datastore CRD (ref) or an
                      external connection secret.
                    properties:
                      connectionSecretRef:
                        description: ConnectionSecretRef supplies an external connection
                          string.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      databaseName:
                        description: |-
                          DatabaseName selects a logical database inside the shared datastore.

                          Postgres: required for a ref to a managed/adopted PostgresCluster (its
                          per-database credentials are looked up by this name).

                          ClickHouse: optional; Langfuse writes to ClickHouse's built-in `default`
                          database when unset. Langfuse creates only its tables, never the database:
                          on a managed or adopted ClickHouseCluster list the name in the cluster's
                          spec.databases (a Stack does this for you) and Langfuse waits until it
                          exists; with an external ClickHouse it must already exist. Changing it on a
                          running Langfuse starts it on an EMPTY database — earlier traces stay in the
                          old one.
                        type: string
                      mode:
                        enum:
                        - ref
                        - external
                        type: string
                      ref:
                        description: Ref points at a PostgresCluster / ClickHouseCluster
                          / RedisInstance.
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - mode
                    type: object
                  defaultAccess:
                    description: |-
                      DefaultAccess adds everyone who signs in for the first time — typically
                      with company sign-in (SSO) — to the bootstrap organization and project with
                      these roles (Langfuse LANGFUSE_DEFAULT_*; no Enterprise licence needed).
                      It is access for everyone who can sign in, not per person; per-person
                      access needs licenseSecretRef. Requires bootstrap, whose organization and
                      project it points at.
                    properties:
                      orgRole:
                        default: VIEWER
                        description: |-
                          OrgRole in the bootstrap organization. Without a Langfuse Enterprise
                          licence this is the role that counts: it applies to every project in the
                          organization.
                        enum:
                        - OWNER
                        - ADMIN
                        - MEMBER
                        - VIEWER
                        - NONE
                        type: string
                      projectRole:
                        default: VIEWER
                        description: |-
                          ProjectRole in the bootstrap project. Project-level roles are a Langfuse
                          Enterprise feature: without licenseSecretRef Langfuse ignores it and the
                          person gets OrgRole on every project.
                        enum:
                        - OWNER
                        - ADMIN
                        - MEMBER
                        - VIEWER
                        type: string
                    type: object
                  licenseSecretRef:
                    description: |-
                      LicenseSecretRef supplies the Langfuse Enterprise licence key (passed to
                      the LangfuseInstance as eeLicenseKey). Langfuse's organization and member
                      management API is Enterprise-only, so it is what makes per-person access
                      work: with it, Identities of type observability become members of this
                      Langfuse's organization. Without it they are refused with the reason.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  postgres:
                    description: DatastoreRef points at a datastore CRD (ref) or an
                      external connection secret.
                    properties:
                      connectionSecretRef:
                        description: ConnectionSecretRef supplies an external connection
                          string.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      databaseName:
                        description: |-
                          DatabaseName selects a logical database inside the shared datastore.

                          Postgres: required for a ref to a managed/adopted PostgresCluster (its
                          per-database credentials are looked up by this name).

                          ClickHouse: optional; Langfuse writes to ClickHouse's built-in `default`
                          database when unset. Langfuse creates only its tables, never the database:
                          on a managed or adopted ClickHouseCluster list the name in the cluster's
                          spec.databases (a Stack does this for you) and Langfuse waits until it
                          exists; with an external ClickHouse it must already exist. Changing it on a
                          running Langfuse starts it on an EMPTY database — earlier traces stay in the
                          old one.
                        type: string
                      mode:
                        enum:
                        - ref
                        - external
                        type: string
                      ref:
                        description: Ref points at a PostgresCluster / ClickHouseCluster
                          / RedisInstance.
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - mode
                    type: object
                  redis:
                    description: DatastoreRef points at a datastore CRD (ref) or an
                      external connection secret.
                    properties:
                      connectionSecretRef:
                        description: ConnectionSecretRef supplies an external connection
                          string.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      databaseName:
                        description: |-
                          DatabaseName selects a logical database inside the shared datastore.

                          Postgres: required for a ref to a managed/adopted PostgresCluster (its
                          per-database credentials are looked up by this name).

                          ClickHouse: optional; Langfuse writes to ClickHouse's built-in `default`
                          database when unset. Langfuse creates only its tables, never the database:
                          on a managed or adopted ClickHouseCluster list the name in the cluster's
                          spec.databases (a Stack does this for you) and Langfuse waits until it
                          exists; with an external ClickHouse it must already exist. Changing it on a
                          running Langfuse starts it on an EMPTY database — earlier traces stay in the
                          old one.
                        type: string
                      mode:
                        enum:
                        - ref
                        - external
                        type: string
                      ref:
                        description: Ref points at a PostgresCluster / ClickHouseCluster
                          / RedisInstance.
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - mode
                    type: object
                required:
                - clickhouse
                - postgres
                - redis
                type: object
                x-kubernetes-validations:
                - fieldPath: .clickhouse.databaseName
                  message: clickhouse.databaseName must start with a letter or underscore
                    and contain only letters, digits and underscores
                  reason: FieldValueInvalid
                  rule: '!has(self.clickhouse.databaseName) || self.clickhouse.databaseName.matches(''^[A-Za-z_][A-Za-z0-9_]*$'')'
                - fieldPath: .bootstrap
                  message: 'defaultAccess needs bootstrap: new users are added to
                    the bootstrap organization and project'
                  reason: FieldValueRequired
                  rule: '!has(self.defaultAccess) || (has(self.bootstrap) && self.bootstrap.enabled)'
              mesh:
                description: |-
                  Mesh opts this workload's namespace into the cluster ServiceMesh (mTLS +
                  isolation). Defaults to mode=auto.
                properties:
                  mode:
                    default: auto
                    enum:
                    - auto
                    - enabled
                    - disabled
                    type: string
                type: object
              secretsRef:
                description: |-
                  SecretsRef optionally binds a same-namespace SecretsManagement; the
                  workload then waits until it is Ready (its ExternalSecrets / SealedSecrets
                  have produced the Secrets this workload references). Leave it unset to use
                  plain Kubernetes Secrets you manage yourself — every credential is already
                  referenced directly, so no ESO or SealedSecrets is needed.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              sso:
                description: |-
                  SSO enables OIDC/SSO login on the observability UI. The backend translates it
                  (for Langfuse: AUTH_CUSTOM_* on the web component). The custom-OIDC callback
                  the IdP must allow is <publicURL>/api/auth/callback/custom, so an ingress host
                  (or langfuse.auth.nextAuthUrl) must resolve to the public URL.
                properties:
                  authorizationEndpoint:
                    description: |-
                      AuthorizationEndpoint overrides the OIDC authorization endpoint. The LiteLLM
                      Gateway's generic-oidc provider requires the three explicit endpoints below
                      (it does not perform discovery); ChatUI and Langfuse derive them from
                      IssuerURL and ignore these.
                    type: string
                  clientSecretRef:
                    description: |-
                      ClientSecretRef references a same-namespace Secret holding this workload's
                      OAuth client credentials. The Secret must carry the client ID and client
                      secret under ClientIDKey / ClientSecretKey (defaulting to client-id /
                      client-secret). Supply it via SecretsManagement (ESO/SealedSecrets).
                    properties:
                      clientIDKey:
                        default: client-id
                        description: ClientIDKey is the Secret key holding the OAuth
                          client ID.
                        type: string
                      clientSecretKey:
                        default: client-secret
                        description: ClientSecretKey is the Secret key holding the
                          OAuth client secret.
                        type: string
                      name:
                        description: Name is the Secret name (same namespace as the
                          workload).
                        type: string
                    required:
                    - name
                    type: object
                  issuerURL:
                    description: |-
                      IssuerURL is the OIDC issuer / discovery base URL, e.g.
                      "https://login.microsoftonline.com/<tenant>/v2.0" or
                      "https://accounts.google.com". Used directly by ChatUI (OPENID_ISSUER) and
                      Langfuse (AUTH_CUSTOM_ISSUER); for the Gateway it is informational unless the
                      explicit generic endpoints below are also set.
                    type: string
                  provider:
                    description: |-
                      Provider selects the LiteLLM Gateway provider flavor. Ignored by ChatUI and
                      Langfuse (both always use their generic OIDC path). Defaults to generic-oidc.
                    enum:
                    - generic-oidc
                    - azure-entra
                    - google
                    - okta
                    type: string
                  providerName:
                    description: |-
                      ProviderName is the display name / login-button label shown to users
                      (LibreChat OPENID_BUTTON_LABEL, Langfuse AUTH_CUSTOM_NAME). Defaults to "SSO".
                    type: string
                  scopes:
                    description: Scopes requested from the IdP. Defaults to ["openid","email","profile"].
                    items:
                      type: string
                    type: array
                  tenantID:
                    description: |-
                      TenantID is the directory/tenant ID, required by the Gateway for
                      provider=azure-entra.
                    type: string
                  tokenEndpoint:
                    description: TokenEndpoint overrides the OIDC token endpoint (Gateway
                      generic-oidc).
                    type: string
                  userinfoEndpoint:
                    description: UserinfoEndpoint overrides the OIDC userinfo endpoint
                      (Gateway generic-oidc).
                    type: string
                required:
                - clientSecretRef
                - issuerURL
                type: object
              type:
                description: Type selects the observability backend. Only "langfuse"
                  is implemented.
                enum:
                - langfuse
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - fieldPath: .langfuse
              message: type 'langfuse' requires the langfuse block
              reason: FieldValueRequired
              rule: self.type != 'langfuse' || has(self.langfuse)
          status:
            description: ObservabilityStatus reports readiness.
            properties:
              clickhouseReady:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              peopleAccess:
                description: |-
                  PeopleAccess says whether people can be given Langfuse access one by one
                  (Identities of type observability): Available, NeedsLicense (no Langfuse
                  Enterprise licence), or NeedsNewerLangfuseOperator. Consoles read it to
                  offer — or explain — the choice without restating the rules.
                type: string
              phase:
                type: string
              postgresReady:
                type: boolean
              redisReady:
                type: boolean
              signInAccessRole:
                description: |-
                  SignInAccessRole is the role everyone actually gets on first sign-in
                  (spec.langfuse.defaultAccess): the project role with a Langfuse Enterprise
                  licence, else the organization role (Langfuse ignores project roles
                  without one). Empty when automatic access is off.
                type: string
              url:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
