apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: cube-microk8s-operator.v0.1.0
  annotations:
    alm-examples: '[{"apiVersion": "platform.cube.dev/v1alpha1", "kind": "CubeCluster",
      "metadata": {"name": "analytics"}, "spec": {"image": "cubejs/cube:v1.7.20@sha256:7f14f4be9f3303afe48a16584480c8a9dc15f44c13daf66c2a5b31019025b71a",
      "modelConfigMap": "cube-model", "configurationSecret": "cube-configuration",
      "api": {"replicas": 2, "resources": {"requests": {"cpu": "2", "memory": "3Gi"},
      "limits": {"cpu": "4", "memory": "6Gi"}}}, "refreshWorker": {"replicas": 1,
      "resources": {"requests": {"cpu": "2", "memory": "6Gi"}, "limits": {"cpu": "4",
      "memory": "8Gi"}}}, "cubeStore": {"mode": "clustered", "image": "cubejs/cubestore:v1.7.20@sha256:cd5fe68049204640704a6412a39e7a09eb391fc70890577dd21b5480d85cb219",
      "workers": 2, "resources": {"requests": {"cpu": "4", "memory": "8Gi"}, "limits":
      {"cpu": "8", "memory": "12Gi"}}, "remoteStorage": {"type": "s3", "s3": {"bucket":
      "replace-me-cubestore", "region": "us-west-2"}}, "scratch": {"size": "100Gi"}},
      "service": {"type": "LoadBalancer"}}}]'
    capabilities: Basic Install
    categories: Database,Big Data
    description: Independent Kubernetes operator for self-hosted Cube Core and Cube
      Store.
    containerImage: ghcr.io/sqe/cube-operator@sha256:f75bc96562adf0464d3a9cc7acf5880fc1c1802a441333bc881ddfdba2b6567c
    repository: https://github.com/sqe/cube-microk8s-operator
    support: https://github.com/sqe/cube-microk8s-operator/issues
    operators.operatorframework.io/arch.amd64: supported
    operators.operatorframework.io/arch.arm64: supported
spec:
  displayName: Cube Core Operator
  description: '## Independent community operator for Cube Core


    Manages self-hosted [Cube Core](https://github.com/cube-js/cube) APIs, refresh

    workers, and Cube Store. This is not an official Cube product or an endorsement

    by Cube Dev, Inc.


    ### Features and usage


    Create a `platform.cube.dev/v1alpha1` CubeCluster to reconcile API and refresh

    Deployments, single or clustered Cube Store, Services, PodDisruptionBudgets,

    and NetworkPolicies. The operator reports readiness in CubeCluster status.

    Only the Go controller is packaged, with cluster-wide AllNamespaces mode.

    Do not run another Go or Kopf controller alongside this installation.


    ### Prerequisites


    Use Kubernetes 1.34 or later. Before creating a CubeCluster, create its model

    ConfigMap, configuration Secret, and durable storage (an existing PVC or S3

    bucket with any required credentials). Adapt the example bucket and resource

    requests to your environment. The operator does not create credentials,

    provision remote storage, or provide data backups.


    See the [installation and configuration guide](https://github.com/sqe/cube-microk8s-operator#configure-cube-core).

    On arm64, choose an arm64-compatible Cube Store image as described in the guide.


    ### License and attribution


    Original operator code: Apache-2.0, copyright 2026 Aziz Kurbanov.

    Uses upstream Cube software: Cube Client is MIT licensed; Cube Backend is

    Apache-2.0 licensed. Their licenses and copyrights remain separate.

    '
  version: 0.1.0
  maturity: alpha
  minKubeVersion: 1.34.0
  provider:
    name: Aziz Kurbanov
    url: https://github.com/sqe
  maintainers:
  - name: Aziz Kurbanov
    email: azizbek@gmail.com
  icon:
  - base64data: 
    mediatype: image/svg+xml
  keywords:
  - cube
  - analytics
  - semantic-layer
  - cubestore
  links:
  - name: Documentation
    url: https://github.com/sqe/cube-microk8s-operator
  installModes:
  - type: OwnNamespace
    supported: false
  - type: SingleNamespace
    supported: false
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: true
  customresourcedefinitions:
    owned:
    - name: cubeclusters.platform.cube.dev
      version: v1alpha1
      kind: CubeCluster
      displayName: Cube Cluster
      description: A self-hosted Cube Core and Cube Store deployment.
      resources:
      - name: deployments
        kind: Deployment
        version: v1
      - name: statefulsets
        kind: StatefulSet
        version: v1
      - name: services
        kind: Service
        version: v1
      - name: poddisruptionbudgets
        kind: PodDisruptionBudget
        version: v1
      - name: networkpolicies
        kind: NetworkPolicy
        version: v1
      specDescriptors:
      - path: image
        displayName: Cube image
        description: Cube API and refresh worker container image.
      - path: imagePullPolicy
        displayName: Image pull policy
        description: Pull policy for managed container images.
      - path: modelConfigMap
        displayName: Model ConfigMap
        description: Existing ConfigMap containing Cube models.
      - path: configurationSecret
        displayName: Configuration Secret
        description: Existing Secret containing Cube configuration.
      - path: api
        displayName: API
        description: API replicas and container resource requirements.
      - path: refreshWorker
        displayName: Refresh worker
        description: Refresh replicas and container resource requirements.
      - path: cubeStore
        displayName: Cube Store
        description: Store topology, image, scratch space, and durable remote storage.
      - path: service
        displayName: API service
        description: Service type, annotations, and optional node port.
      statusDescriptors:
      - path: conditions
        displayName: Conditions
        description: Readiness and configuration validation conditions.
      - path: observedGeneration
        displayName: Observed generation
        description: Last reconciled desired-state generation.
      - path: readyAPIs
        displayName: Ready APIs
        description: Number of ready Cube API replicas.
      - path: endpoint
        displayName: Endpoint
        description: In-cluster Cube API endpoint.
  install:
    strategy: deployment
    spec:
      deployments:
      - name: cube-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: cube-operator
          template:
            metadata:
              labels:
                app.kubernetes.io/name: cube-operator
            spec:
              serviceAccountName: cube-operator
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: manager
                image: ghcr.io/sqe/cube-operator@sha256:f75bc96562adf0464d3a9cc7acf5880fc1c1802a441333bc881ddfdba2b6567c
                imagePullPolicy: IfNotPresent
                args:
                - --leader-elect
                ports:
                - name: metrics
                  containerPort: 8080
                - name: health
                  containerPort: 8081
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: health
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: health
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
      clusterPermissions:
      - serviceAccountName: cube-operator
        rules:
        - apiGroups:
          - ''
          resources:
          - configmaps
          - persistentvolumeclaims
          - secrets
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - ''
          resources:
          - services
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - apps
          resources:
          - deployments
          - statefulsets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - networking.k8s.io
          resources:
          - networkpolicies
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - platform.cube.dev
          resources:
          - cubeclusters
          verbs:
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - platform.cube.dev
          resources:
          - cubeclusters/finalizers
          verbs:
          - update
        - apiGroups:
          - platform.cube.dev
          resources:
          - cubeclusters/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - policy
          resources:
          - poddisruptionbudgets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
