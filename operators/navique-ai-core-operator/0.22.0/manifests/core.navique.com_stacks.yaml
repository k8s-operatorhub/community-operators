apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: stacks.core.navique.com
spec:
  group: core.navique.com
  names:
    kind: Stack
    listKind: StackList
    plural: stacks
    shortNames:
    - stk
    singular: stack
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyComponents
      name: Ready
      type: integer
    - jsonPath: .status.totalComponents
      name: Total
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Available
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Stack is a curated, owned bundle of platform components (ARM-deployment
          style).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              StackSpec is a curated, opinionated bundle. Each component block is opt-in
              (`enabled: true`); the controller creates + owns the corresponding per-component
              CRs (in the Stack's namespace), fills sensible defaults, and AUTO-WIRES the
              cross-references between them (database/secretsRef/langfuseRef/gatewayRef/
              datastore refs) — so you don't set any refs by hand. Power users who need the
              full surface use the standalone CRDs directly; both models coexist.

              Licensed feature: managed-deployment (+ counted against the "stacks" limit).

              A managed Postgres datastore MUST configure an enabled backup — applying a Stack
              that enables a managed Postgres without datastores.postgres.backup.enabled is
              rejected at admission. This guards non-technical users from running a database
              with no backups.
            properties:
              chatUI:
                description: ChatUI provisions a LibreChat UI.
                properties:
                  enabled:
                    default: true
                    type: boolean
                  host:
                    type: string
                  imageVolume:
                    description: PVCSpec describes a persistent volume claim for a
                      workload.
                    properties:
                      accessMode:
                        enum:
                        - ReadWriteOnce
                        - ReadWriteMany
                        - ReadOnlyMany
                        type: string
                      enabled:
                        type: boolean
                      size:
                        type: string
                      storageClass:
                        type: string
                    type: object
                  ingress:
                    description: |-
                      IngressSpec configures an optional ingress for a workload. When TLS is enabled
                      the owning controller ensures cert-manager via platformdeps.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      api:
                        description: |-
                          API overrides the cluster-wide routing API (PlatformConfig.spec.routing) for
                          THIS workload. Empty follows the resolved cluster/mesh mode; "Ingress" forces
                          a classic Ingress even when a mesh is active (escape hatch); "Gateway" forces
                          a Gateway API HTTPRoute.
                        enum:
                        - Ingress
                        - Gateway
                        type: string
                      basicAuthSecret:
                        description: |-
                          BasicAuthSecret references a same-namespace Secret (htpasswd) for nginx
                          basic-auth annotations.
                        type: string
                      className:
                        type: string
                      clusterIssuer:
                        description: ClusterIssuer is the cert-manager ClusterIssuer
                          to use when TLS is true.
                        type: string
                      enabled:
                        type: boolean
                      host:
                        type: string
                      tls:
                        description: TLS enables a cert-manager-issued certificate
                          for Host.
                        type: boolean
                    type: object
                  mcp:
                    description: |-
                      MCP wires Model Context Protocol servers into the ChatUI. `catalog` keys are
                      bundled servers the Stack provisions as owned MCPServer children (licensed
                      `bundled-mcp-catalog`); `refs` point at MCPServer CRs you create yourself
                      (catalog or external). Both are wired into the ChatUI's mcpRefs.
                    properties:
                      catalog:
                        description: |-
                          Catalog selects bundled MCP servers (e.g. "websearch"). The Stack
                          creates an owned MCPServer child (mode=catalog) per key and wires it in.
                          Requires the bundled-mcp-catalog license; an unlicensed entry is Refused and
                          skipped (the ChatUI still comes up).
                        items:
                          type: string
                        type: array
                      refs:
                        description: |-
                          Refs wire pre-existing MCPServer CRs (catalog or external, in any namespace)
                          into the ChatUI without the Stack owning their lifecycle.
                        items:
                          description: |-
                            ObjectRef references another namespaced object. Namespace is optional and
                            defaults to the referring object's namespace. Cross-namespace references are
                            allowed for datastore/gateway/langfuse references; Secret references must stay
                            in-namespace (use SecretKeyRef without Namespace, or a same-namespace value).
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                    type: object
                  models:
                    description: Models is the client-facing model list shown in the
                      UI.
                    items:
                      type: string
                    type: array
                  namespace:
                    description: |-
                      Namespace optionally places this component (and its managed MongoDB +
                      Meilisearch) in its own namespace (created if missing). Defaults to the
                      Stack's namespace.
                    type: string
                type: object
              datastores:
                description: Datastores provisions Postgres/ClickHouse/Redis.
                properties:
                  clickhouse:
                    description: |-
                      StackDatastore is the curated knob set for one datastore. In `mode: managed`
                      (default) the operator provisions and owns the datastore CR. In `mode:
                      external` the operator provisions nothing and wires the workloads to a
                      user-managed instance via ConnectionSecretRef; the managed-only knobs
                      (Enabled/StorageSize/StorageClass/Resources) are ignored.
                    properties:
                      backup:
                        description: |-
                          Backup configures scheduled backups to object storage (S3/Azure/GCS).
                          Supported for **Postgres** (CNPG-native), **ClickHouse** (clickhouse-backup
                          CronJob), and **MongoDB** (mongodump+rclone CronJob); ignored for Redis
                          (cache) and Meilisearch (rebuildable index). It is **required** when Postgres
                          is managed — admission rejects a managed-Postgres Stack that omits an enabled
                          backup, so non-technical users can't stand up a database with no backup.
                          Managed mode only.
                        properties:
                          azure:
                            description: Azure configures Azure Blob Storage.
                            properties:
                              credentialsSecretRef:
                                description: |-
                                  CredentialsSecretRef references a Secret holding a "connection-string" key.
                                  Omit when using inheritFromAzureAD.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  namespace:
                                    type: string
                                required:
                                - name
                                type: object
                              destinationPath:
                                description: DestinationPath, e.g. "https://<account>.blob.core.windows.net/<container>/".
                                type: string
                              inheritFromAzureAD:
                                description: InheritFromAzureAD uses Azure Workload
                                  Identity instead of static credentials.
                                type: boolean
                            required:
                            - destinationPath
                            type: object
                          enabled:
                            description: Enabled turns on scheduled backups + continuous
                              WAL archiving (PITR).
                            type: boolean
                          gcs:
                            description: GCS configures Google Cloud Storage.
                            properties:
                              credentialsSecretRef:
                                description: |-
                                  CredentialsSecretRef references a Secret holding a "credentials" key with the
                                  service-account JSON. Omit when using gkeEnvironment.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  namespace:
                                    type: string
                                required:
                                - name
                                type: object
                              destinationPath:
                                description: DestinationPath, e.g. "gs://my-bucket/path".
                                type: string
                              gkeEnvironment:
                                description: GKEEnvironment uses GKE Workload Identity
                                  instead of a service-account key.
                                type: boolean
                            required:
                            - destinationPath
                            type: object
                          provider:
                            default: s3
                            description: Provider selects the object-storage backend.
                            enum:
                            - s3
                            - azure
                            - gcs
                            type: string
                          retentionPolicy:
                            default: 30d
                            description: |-
                              RetentionPolicy is the recovery-window retention, e.g. "30d", "4w", "6m".
                              Defaults to "30d".
                            type: string
                          s3:
                            description: S3 configures AWS S3 or any S3-compatible
                              store (MinIO, Cloudflare R2, …).
                            properties:
                              credentialsSecretRef:
                                description: |-
                                  CredentialsSecretRef references a Secret holding keys "access-key-id" and
                                  "secret-access-key". Omit when using inheritFromIAMRole.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                  namespace:
                                    type: string
                                required:
                                - name
                                type: object
                              destinationPath:
                                description: DestinationPath is the bucket URL, e.g.
                                  "s3://my-bucket/path".
                                type: string
                              endpointURL:
                                description: EndpointURL overrides the S3 endpoint
                                  for S3-compatible stores (MinIO, R2).
                                type: string
                              inheritFromIAMRole:
                                description: InheritFromIAMRole uses the pod's IAM
                                  role (IRSA) instead of static keys.
                                type: boolean
                            required:
                            - destinationPath
                            type: object
                          schedule:
                            default: 0 0 2 * * *
                            description: |-
                              Schedule is the backup cadence as a 6-field cron WITH SECONDS
                              (sec min hour dom mon dow) — the format CNPG's ScheduledBackup requires
                              (NOT the 5-field crontab format). Defaults to "0 0 2 * * *" (daily 02:00).
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - fieldPath: .s3
                          message: backup.provider 's3' requires backup.s3
                          reason: FieldValueRequired
                          rule: '!self.enabled || self.provider != ''s3'' || has(self.s3)'
                        - fieldPath: .azure
                          message: backup.provider 'azure' requires backup.azure
                          reason: FieldValueRequired
                          rule: '!self.enabled || self.provider != ''azure'' || has(self.azure)'
                        - fieldPath: .gcs
                          message: backup.provider 'gcs' requires backup.gcs
                          reason: FieldValueRequired
                          rule: '!self.enabled || self.provider != ''gcs'' || has(self.gcs)'
                      connectionSecretRef:
                        description: |-
                          ConnectionSecretRef points at the Secret carrying the external instance's
                          connection details. Required when mode=external; ignored when managed. The
                          Secret must carry these keys (already consumed by the component controllers):
                            - Postgres:   "DATABASE_URL" (the SQLAlchemy/libpq URL). Override the key
