  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Backend pool status
      jsonPath: .status.status
      name: Status
      type: string
    - description: Backend pool UUID
      jsonPath: .status.uuid
      name: UUID
      type: string
