  description: |
    ## KubeStash by AppsCode — Backup and Recovery for Kubernetes

    **KubeStash by AppsCode** is a Kubernetes-native backup and recovery operator. It lets
    platform teams back up and restore Kubernetes workloads, persistent volumes, cluster
    manifests and databases using declarative custom resources, on any Kubernetes distribution
    including Red Hat OpenShift.

    Installing this operator through Operator Lifecycle Manager (OLM) deploys and manages the
    KubeStash operator, its addon catalog and its metrics exporter. Create a `Kubestash`
    resource to install KubeStash and edit it to configure or upgrade the installation.

    ---

    ## Features

    - **Declarative backup and restore** — define backup schedules, storage, retention and
      encryption as Kubernetes custom resources, and drive them with `kubectl`, Helm or GitOps.
    - **Pluggable addons** — a bundled catalog provides addons for workloads, persistent volumes,
      volume snapshots, cluster manifests, Vault and KubeVirt virtual machines.
    - **Flexible storage** — back up to object storage and other supported backends, with
      retention policies to manage backup lifecycle.
    - **Metrics** — an optional metrics exporter reports backup and restore status.

    ---

    ## Prerequisites

    KubeStash uses [cert-manager](https://cert-manager.io) to issue the serving certificate of its
    webhook server. Install cert-manager before creating a `Kubestash` resource.

    ---

    ## More Information

    - **Website:** https://kubestash.com
    - **Documentation:** https://kubestash.com/docs
    - **GitHub:** https://github.com/kubestash
    - **Support:** https://appscode.freshdesk.com
    - **Contact Sales:** https://appscode.com/contact
