apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  creationTimestamp: null
  name: harnesses.bedrockagentcorecontrol.services.k8s.aws
spec:
  group: bedrockagentcorecontrol.services.k8s.aws
  names:
    kind: Harness
    listKind: HarnessList
    plural: harnesses
    singular: harness
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Harness is the Schema for the Harnesses API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HarnessSpec defines the desired state of Harness.

              Representation of a harness.
            properties:
              allowedTools:
                description: |-
                  The tools that the agent is allowed to use. Supports glob patterns such as
                  * for all tools, @builtin for all built-in tools, or @serverName/toolName
                  for specific MCP server tools.
                items:
                  type: string
                type: array
              authorizerConfiguration:
                description: |-
                  Represents inbound authorization configuration options used to authenticate
                  incoming requests.
                properties:
                  customJWTAuthorizer:
                    description: |-
                      Configuration for inbound JWT-based authorization, specifying how incoming
                      requests should be authenticated.
                    properties:
                      allowedAudience:
                        items:
                          type: string
                        type: array
                      allowedClients:
                        items:
                          type: string
                        type: array
                      allowedScopes:
                        items:
                          type: string
                        type: array
                      customClaims:
                        items:
                          description: |-
                            Defines the name of a custom claim field and rules for finding matches to
                            authenticate its value.
                          properties:
                            authorizingClaimMatchValue:
                              description: Defines the value or values to match for
                                and the relationship of the match.
                              properties:
                                claimMatchOperator:
                                  type: string
                                claimMatchValue:
                                  description: |-
                                    The value or values to match for.

                                       * Include a matchValueString with the EQUALS operator to specify a string
                                       that matches the claim field value.

                                       * Include a matchValueArray to specify an array of string values. You
                                       can use the following operators: Use CONTAINS to yield a match if the
                                       claim field value is in the array. Use CONTAINS_ANY to yield a match if
                                       the claim field value contains any of the strings in the array.
                                  properties:
                                    matchValueString:
                                      type: string
                                    matchValueStringList:
                                      items:
                                        type: string
                                      type: array
                                  type: object
                              type: object
                            inboundTokenClaimName:
                              type: string
                            inboundTokenClaimValueType:
                              type: string
                          type: object
                        type: array
                      discoveryURL:
                        type: string
                    type: object
                type: object
              environment:
                description: |-
                  The compute environment configuration for the harness, including network
                  and lifecycle settings.
                properties:
                  agentCoreRuntimeEnvironment:
                    description: The AgentCore Runtime environment request configuration.
                    properties:
                      filesystemConfigurations:
                        items:
                          description: Configuration for a filesystem that can be
                            mounted into the AgentCore Runtime.
                          properties:
                            sessionStorage:
                              description: |-
                                Configuration for a session storage filesystem mounted into the AgentCore
                                Runtime. Session storage provides persistent storage that is preserved across
                                AgentCore Runtime session invocations.
                              properties:
                                mountPath:
                                  type: string
                              type: object
                          type: object
                        type: array
                      lifecycleConfiguration:
                        description: |-
                          LifecycleConfiguration lets you manage the lifecycle of runtime sessions
                          and resources in AgentCore Runtime. This configuration helps optimize resource
                          utilization by automatically cleaning up idle sessions and preventing long-running
                          instances from consuming resources indefinitely.
                        properties:
                          idleRuntimeSessionTimeout:
                            format: int64
                            type: integer
                          maxLifetime:
                            format: int64
                            type: integer
                        type: object
                      networkConfiguration:
                        description: SecurityConfig for the Agent.
                        properties:
                          networkMode:
                            type: string
                          networkModeConfig:
                            description: VpcConfig for the Agent.
                            properties:
                              securityGroupRefs:
                                description: Reference field for SecurityGroups
                                items:
                                  description: "AWSResourceReferenceWrapper provides
                                    a wrapper around *AWSResourceReference\ntype to
                                    provide more user friendly syntax for references
                                    using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                                    \ name: my-api"
                                  properties:
                                    from:
                                      description: |-
                                        AWSResourceReference provides all the values necessary to reference another
                                        k8s resource for finding the identifier(Id/ARN/Name)
                                      properties:
                                        name:
                                          type: string
                                        namespace:
                                          type: string
                                      type: object
                                  type: object
                                type: array
                              securityGroups:
                                items:
                                  type: string
                                type: array
                              subnetRefs:
                                description: Reference field for Subnets
                                items:
                                  description: "AWSResourceReferenceWrapper provides
                                    a wrapper around *AWSResourceReference\ntype to
                                    provide more user friendly syntax for references
                                    using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                                    \ name: my-api"
                                  properties:
                                    from:
                                      description: |-
                                        AWSResourceReference provides all the values necessary to reference another
                                        k8s resource for finding the identifier(Id/ARN/Name)
                                      properties:
                                        name:
                                          type: string
                                        namespace:
                                          type: string
                                      type: object
                                  type: object
                                type: array
                              subnets:
                                items:
                                  type: string
                                type: array
                            type: object
                        type: object
                    type: object
                type: object
              environmentArtifact:
                description: |-
                  The environment artifact for the harness, such as a custom container image
                  containing additional dependencies.
                properties:
                  containerConfiguration:
                    description: Representation of a container configuration.
                    properties:
                      containerURI:
                        type: string
                    type: object
                type: object
              environmentVariables:
                additionalProperties:
                  type: string
                description: Environment variables to set in the harness runtime environment.
                type: object
              executionRoleARN:
                description: |-
                  The ARN of the IAM role that the harness assumes when running. This role
                  must have permissions for the services the agent needs to access, such as
                  Amazon Bedrock for model invocation.

                  Regex Pattern: `^arn:aws(-[^:]+)?:iam::([0-9]{12})?:role/.+$`
                type: string
              executionRoleRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              harnessName:
                description: |-
                  The name of the harness. Must start with a letter and contain only alphanumeric
                  characters and underscores.

                  Regex Pattern: `^[a-zA-Z][a-zA-Z0-9_]{0,39}$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              maxIterations:
                description: The maximum number of iterations the agent loop can execute
                  per invocation.
                format: int64
                type: integer
              maxTokens:
                description: |-
                  The maximum total number of output tokens the agent can generate across all
                  model calls within a single invocation.
                format: int64
                type: integer
              memory:
                description: |-
                  The AgentCore Memory configuration for persisting conversation context across
                  sessions.
                properties:
                  agentCoreMemoryConfiguration:
                    description: Configuration for AgentCore Memory integration.
                    properties:
                      actorID:
                        type: string
                      arn:
                        type: string
                      messagesCount:
                        format: int64
                        type: integer
                      retrievalConfig:
                        additionalProperties:
                          description: Configuration for memory retrieval within a
                            namespace.
                          properties:
                            relevanceScore:
                              type: number
                            strategyID:
                              type: string
                            topK:
                              format: int64
                              type: integer
                          type: object
                        type: object
                    type: object
                  disabled:
                    additionalProperties:
                      type: string
                    description: Explicitly opt out of memory.
                    type: object
                  managedMemoryConfiguration:
                    description: Configuration for managed memory creation.
                    properties:
                      arn:
                        type: string
                      encryptionKeyARN:
                        type: string
                      encryptionKeyRef:
                        description: Reference field for EncryptionKeyARN
                        properties:
                          from:
                            description: |-
                              AWSResourceReference provides all the values necessary to reference another
                              k8s resource for finding the identifier(Id/ARN/Name)
                            properties:
                              name:
                                type: string
                              namespace:
                                type: string
                            type: object
                        type: object
                      eventExpiryDuration:
                        format: int64
                        type: integer
                      strategies:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              model:
                description: |-
                  The model configuration for the harness. Supports Amazon Bedrock, OpenAI,
                  and Google Gemini model providers.
                properties:
                  bedrockModelConfig:
                    description: Configuration for an Amazon Bedrock model provider.
                    properties:
                      apiFormat:
                        type: string
                      maxTokens:
                        format: int64
                        type: integer
                      modelID:
                        type: string
                      temperature:
                        type: number
                      topP:
                        type: number
                    type: object
                  geminiModelConfig:
                    description: |-
                      Configuration for a Google Gemini model provider. Requires an API key stored
                      in AgentCore Identity.
                    properties:
                      apiKeyARN:
                        type: string
                      maxTokens:
                        format: int64
                        type: integer
                      modelID:
                        type: string
                      temperature:
                        type: number
                      topK:
                        format: int64
                        type: integer
                      topP:
                        type: number
                    type: object
                  liteLlmModelConfig:
                    description: |-
                      Configuration for a LiteLLM model provider, enabling connection to third-party
                      model providers.
                    properties:
                      apiBase:
                        type: string
                      apiKeyARN:
                        type: string
                      maxTokens:
                        format: int64
                        type: integer
                      modelID:
                        type: string
                      temperature:
                        type: number
                      topP:
                        type: number
                    type: object
                  openAiModelConfig:
                    description: |-
                      Configuration for an OpenAI model provider. Requires an API key stored in
                      AgentCore Identity.
                    properties:
                      apiFormat:
                        type: string
                      apiKeyARN:
                        type: string
                      maxTokens:
                        format: int64
                        type: integer
                      modelID:
                        type: string
                      temperature:
                        type: number
                      topP:
                        type: number
                    type: object
                type: object
              skills:
                description: |-
                  The skills available to the agent. Skills are bundles of files that the agent
                  can pull into its context on demand.
                items:
                  description: A skill available to the agent.
                  properties:
                    awsSkills:
                      description: Passed to show that AWS Skills should be included.
                      properties:
                        paths:
                          items:
                            type: string
                          type: array
                      type: object
                    git:
                      description: A git repository source for a skill.
                      properties:
                        auth:
                          description: Authentication configuration for accessing
                            a private git repository.
                          properties:
                            credentialARN:
                              type: string
                            username:
                              type: string
                          type: object
                        path:
                          type: string
                        url:
                          type: string
                      type: object
                    path:
                      type: string
                    s3:
                      description: An S3 source for a skill.
                      properties:
                        uri:
                          type: string
                      type: object
                  type: object
                type: array
              systemPrompt:
                description: The system prompt that defines the agent's behavior and
                  instructions.
                items:
                  description: A content block in the system prompt.
                  properties:
                    text:
                      type: string
                  type: object
                type: array
              tags:
                additionalProperties:
                  type: string
                description: Tags to apply to the harness resource.
                type: object
              timeoutSeconds:
                description: The maximum duration in seconds for the agent loop execution
                  per invocation.
                format: int64
                type: integer
              tools:
                description: |-
                  The tools available to the agent, such as remote MCP servers, AgentCore Gateway,
                  AgentCore Browser, Code Interpreter, or inline functions.
                items:
                  description: A tool available to the agent loop.
                  properties:
                    config:
                      description: Configuration union for different tool types.
                      properties:
                        agentCoreBrowser:
                          description: Configuration for AgentCore Browser.
                          properties:
                            browserARN:
                              description: |-
                                Browser ARN for Harness tool configuration. Accepts both managed (aws.browser.v1)
                                and custom browser ARNs.
                              type: string
                            browserRef:
                              description: Reference field for BrowserARN
                              properties:
                                from:
                                  description: |-
                                    AWSResourceReference provides all the values necessary to reference another
                                    k8s resource for finding the identifier(Id/ARN/Name)
                                  properties:
                                    name:
                                      type: string
                                    namespace:
                                      type: string
                                  type: object
                              type: object
                          type: object
                        agentCoreCodeInterpreter:
                          description: Configuration for AgentCore Code Interpreter.
                          properties:
                            codeInterpreterARN:
                              description: |-
                                Code Interpreter ARN for Harness tool configuration. Accepts both managed
                                (aws.codeinterpreter.v1) and custom code interpreter ARNs.
                              type: string
                            codeInterpreterRef:
                              description: Reference field for CodeInterpreterARN
                              properties:
                                from:
                                  description: |-
                                    AWSResourceReference provides all the values necessary to reference another
                                    k8s resource for finding the identifier(Id/ARN/Name)
                                  properties:
                                    name:
                                      type: string
                                    namespace:
                                      type: string
                                  type: object
                              type: object
                          type: object
                        agentCoreGateway:
                          description: Configuration for AgentCore Gateway.
                          properties:
                            gatewayARN:
                              type: string
                            gatewayRef:
                              description: Reference field for GatewayARN
                              properties:
                                from:
                                  description: |-
                                    AWSResourceReference provides all the values necessary to reference another
                                    k8s resource for finding the identifier(Id/ARN/Name)
                                  properties:
                                    name:
                                      type: string
                                    namespace:
                                      type: string
                                  type: object
                              type: object
                            outboundAuth:
                              description: Authentication method for calling a Gateway.
                              properties:
                                awsIAM:
                                  additionalProperties:
                                    type: string
                                  type: object
                                none:
                                  additionalProperties:
                                    type: string
                                  type: object
                                oauth:
                                  description: |-
                                    An OAuth credential provider for gateway authentication. This structure contains
                                    the configuration for authenticating with the target endpoint using OAuth.
                                  properties:
                                    customParameters:
                                      additionalProperties:
                                        type: string
                                      type: object
                                    defaultReturnURL:
                                      type: string
                                    grantType:
                                      type: string
                                    providerARN:
                                      type: string
                                    scopes:
                                      items:
                                        type: string
                                      type: array
                                  type: object
                              type: object
                          type: object
                        inlineFunction:
                          description: |-
                            Configuration for an inline function tool. When the agent calls this tool,
                            the tool call is returned to the caller for external execution.
                          properties:
                            description:
                              type: string
                          type: object
                        remoteMcp:
                          description: Configuration for connecting to a remote MCP
                            server.
                          properties:
                            url:
                              type: string
                          type: object
                      type: object
                    name:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              truncation:
                description: |-
                  The truncation configuration for managing conversation context when it exceeds
                  model limits.
                properties:
                  config:
                    description: Strategy-specific truncation configuration.
                    properties:
                      slidingWindow:
                        description: Configuration for sliding window truncation strategy.
                        properties:
                          messagesCount:
                            format: int64
                            type: integer
                        type: object
                      summarization:
                        description: Configuration for summarization-based truncation
                          strategy.
                        properties:
                          preserveRecentMessages:
                            format: int64
                            type: integer
                          summarizationSystemPrompt:
                            type: string
                          summaryRatio:
                            type: number
                        type: object
                    type: object
                  strategy:
                    type: string
                type: object
            required:
            - harnessName
            type: object
          status:
            description: HarnessStatus defines the observed state of Harness
            properties:
              ackResourceMetadata:
                description: |-
                  All CRs managed by ACK have a common `Status.ACKResourceMetadata` member
                  that is used to contain resource sync state, account ownership,
                  constructed ARN for the resource
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              agentRuntimeARN:
                description: The ARN of the underlying AgentCore Runtime.
                type: string
              agentRuntimeID:
                description: The ID of the underlying AgentCore Runtime.
                type: string
              agentRuntimeName:
                description: The name of the underlying AgentCore Runtime.
                type: string
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                description: The createdAt time of the harness.
                format: date-time
                type: string
              failureReason:
                description: Reason why create or update operations fail.
                type: string
              harnessID:
                description: |-
                  The ID of the harness.

                  Regex Pattern: `^[a-zA-Z][a-zA-Z0-9_]{0,39}-[a-zA-Z0-9]{10}$`
                type: string
              harnessVersion:
                description: |-
                  The version of the harness. Incremented on every successful UpdateHarness.

                  Regex Pattern: `^([1-9][0-9]{0,4})$`
                type: string
              status:
                description: The status of the harness.
                type: string
              updatedAt:
                description: The updatedAt time of the harness.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
