              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReplicationSlotSpec defines the identity of a per-volume
              replication slot.
            properties:
              policyRef:
                description: PolicyRef is the name of the ReplicationPolicy governing
                  this slot. Immutable.
                type: string
              pvcRef:
                description: PVCRef is the name of the PVC being replicated. Immutable.
                type: string
              volumeID:
                description: |-
                  VolumeID is the backend lvol UUID of the source volume. Immutable.
                  Format: "<clusterUUID>:<poolUUID>:<volumeUUID>"
                type: string
            required:
            - policyRef
            - pvcRef
            - volumeID
            type: object
          status:
            description: ReplicationSlotStatus holds the observed state of a ReplicationSlot.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition types.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
