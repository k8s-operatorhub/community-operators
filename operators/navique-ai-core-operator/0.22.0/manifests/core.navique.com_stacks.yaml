                default: Enforce
                description: |-
                  DriftPolicy controls whether the Stack keeps overwriting its children's
                  specs after they are created.

                    - "Enforce" (default): the curated spec is reasserted on every reconcile,
                      so any manual edit to a child CR is reverted — full drift correction.
                    - "Adopt": the curated spec is applied only when the Stack's own spec
                      changes (a generation bump — an ARM-style "redeploy"). Between Stack
                      edits, manual per-child changes are preserved. Editing the Stack still
                      reasserts every child, overwriting drift.

