  description: |
    Denegra Shellwarden installs [NVIDIA OpenShell](https://github.com/NVIDIA/OpenShell) and keeps it upgraded.
    OpenShell is an open-source (Apache-2.0) runtime that runs autonomous AI agents, such as
    coding agents, in sandboxes: Landlock and seccomp confine each agent, every network
    connection goes through a supervisor that checks it against a policy, and credentials are
    injected only into approved requests, so the agent never holds them.

    OpenShell ships a Helm chart. This operator installs that chart, pinned and tested, from one
    `OpenShell` resource, and lets OLM manage upgrades.

    **This is a community project by Denegra. It is not made, endorsed or supported by NVIDIA.**

    ### What it installs

    | Version | |
    |---|---|
    | NVIDIA OpenShell | 0.1.6 |
    | Agent Sandbox (kubernetes-sigs) | v1.0.9 |

    OpenShell needs the Agent Sandbox API (kubernetes-sigs). OLM installs the Agent Sandbox Operator from the same catalog as a dependency. **Before installing, create the namespace `agent-sandbox-system`**: Agent Sandbox Operator 0.5.6 stores its webhook certificate there and does not start without it.

    ### Before you install

    * **Linux kernel with Landlock ABI 3 or later** (6.2-class) and seccomp user notification on
      the nodes that run sandboxes.
    * **OpenShift 4.19 or later.** The RHCOS kernels of 4.16 to 4.18 have no Landlock.
      Everything runs under the `restricted-v2` SCC; the operator detects OpenShift and leaves
      pod user IDs to the SCC.
    * **A network plugin that enforces NetworkPolicy** (OVN-Kubernetes, Calico, Cilium). The
      sandbox's network fence is a NetworkPolicy.
    * A default StorageClass with block storage, or set `server.dataStorageClass`.

    ### Quick start

    Create the namespace `openshell` and, in it:

    ```yaml
    apiVersion: openshell.denegra.ai/v1alpha1
    kind: OpenShell
    metadata:
      name: openshell
    spec:
      server:
        telemetryEnabled: false
    ```

    `spec` takes the values of the upstream chart, so OpenShell's own Kubernetes documentation
    applies as written. Then use the `openshell` CLI against the gateway (client certificate in
    the Secret `openshell-client-tls`) to create sandboxes.

    For a platform with many teams, set `server.drivers.kubernetes.workspaceMode: operator` and an
    `operatorNamespaceLabel`, then create an `OpenShellWorkspace` in each labelled namespace.

    ### Defaults that differ from the upstream chart

    * **Telemetry to NVIDIA is off** unless `server.telemetryEnabled: true`.
    * **Images are pinned by digest.** For a mirror, set `global.image.registry` (for example
      `mirror.example.com/nvidia`); on OpenShift an ImageDigestMirrorSet needs no change here.

    ### Upgrade notes

    OpenShell is before 1.0: it releases weekly, supports the latest two minor versions, and its
    Kubernetes support is marked Experimental upstream. This operator follows upstream minor
    releases on the `alpha` channel and is tested by installing the previous version and
    upgrading. Read OpenShell's release notes before upgrading production gateways.

    NVIDIA is a trademark of NVIDIA Corporation. Other names may be trademarks of their owners.
