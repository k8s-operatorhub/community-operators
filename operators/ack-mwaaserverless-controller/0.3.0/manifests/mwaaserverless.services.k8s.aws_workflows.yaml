                        syntax for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                        \ name: my-api"
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                    type: array
                  subnetIDs:
                    items:
                      type: string
                    type: array
                  subnetRefs:
                    description: Reference field for SubnetIDs
                    items:
                      description: "AWSResourceReferenceWrapper provides a wrapper
                        around *AWSResourceReference\ntype to provide more user friendly
                        syntax for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                        \ name: my-api"
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                    type: array
                type: object
              roleARN:
                description: |-
                  The Amazon Resource Name (ARN) of the IAM role that Amazon Managed Workflows
                  for Apache Airflow Serverless assumes when executing the workflow. This role
                  must have the necessary permissions to access the required Amazon Web Services
                  services and resources that your workflow tasks will interact with. The role
                  is used for task execution in the isolated, multi-tenant environment and
                  should follow the principle of least privilege. Amazon Managed Workflows
                  for Apache Airflow Serverless validates role access during workflow creation
                  but runtime permission checks are performed by the target services.

                  Regex Pattern: `^arn:aws(?:-(?:cn|us-gov|iso|iso-b|iso-e|iso-f))?:iam::[0-9]{12}:role(/[a-zA-Z0-9+=,.@_\-]{1,512})*?/[a-zA-Z0-9+=,.@_\-]{1,64}$`
