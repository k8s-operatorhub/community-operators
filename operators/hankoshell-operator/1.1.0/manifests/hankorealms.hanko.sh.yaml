apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankorealms.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoRealm
    listKind: HankoRealmList
    plural: hankorealms
    shortNames:
    - hr
    singular: hankorealm
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.keycloakRealmID
      name: Realm
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HankoRealm represents a Keycloak realm managed by hanko-operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoRealmSpec defines the desired state of a Keycloak realm.
            properties:
              displayName:
                description: DisplayName is the human-readable realm name shown on
                  the login page.
                maxLength: 255
                pattern: ^[^\x00-\x1F\x7F]*$
                type: string
              email:
                description: |-
                  Email retains platform messaging preferences for API compatibility.
                  Provider credentials, tests and sending belong to the platform API.
                  The operator does not route messages or change Keycloak SMTP with this field.
                properties:
                  fromName:
                    description: FromName is the sender display name for Hanko-owned
                      messages.
                    maxLength: 128
                    pattern: ^[^\r\n]*$
                    type: string
                  providerRef:
                    description: |-
                      ProviderRef selects the singleton Graph provider. Empty or omitted
                      delegates Hanko UI delivery to the realm's SMTP path.
                    enum:
                    - platform-email
                    type: string
                  replyTo:
                    description: ReplyTo optionally routes replies to a different
                      mailbox.
                    format: email
                    maxLength: 254
                    type: string
                  replyToName:
                    description: ReplyToName is the display name associated with ReplyTo.
                    maxLength: 128
                    pattern: ^[^\r\n]*$
                    type: string
                type: object
              frontendURL:
                description: |-
                  FrontendURL is the canonical public URL Keycloak uses for browser-facing
                  endpoints in this realm. When omitted, the operator leaves the existing
                  Keycloak realm frontend URL unmanaged.
                maxLength: 2048
                pattern: ^https?://.+$
                type: string
              iamProfileRef:
                description: |-
                  IAMProfileRef references a reusable HankoIAMProfile in the same namespace.
                  Every application in this realm inherits the resolved authentication policy.
                  It is mutually exclusive with the legacy inline SecurityProfile.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              identityProviders:
                description: |-
                  IdentityProviders declares upstream identity brokers and their realm-scoped
                  mappers. Providers omitted from this list are left untouched unless they
                  were previously recorded as managed by this HankoRealm.
                items:
                  description: |-
                    RealmIdentityProvider describes an upstream Keycloak identity broker.
                    Non-sensitive provider options live in Config; client credentials must be
                    supplied through ClientSecretRef so they never appear in the CRD or imports.
                  properties:
                    addReadTokenRoleOnCreate:
                      type: boolean
                    alias:
                      description: Alias is the stable URL-addressable Keycloak provider
                        name.
                      maxLength: 255
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    clientSecretRef:
                      description: |-
                        ClientSecretRef points to the Kubernetes Secret key injected into
                        config.clientSecret at reconcile time. Imports never populate this field.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[-._a-zA-Z0-9]+$
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    config:
                      additionalProperties:
                        maxLength: 16384
                        type: string
                      description: |-
                        Config contains non-sensitive provider-specific Keycloak options. Only
                        declared keys are reconciled; provider defaults and opaque keys survive.
                      maxProperties: 64
                      type: object
                      x-kubernetes-validations:
                      - message: native map keys require 1..255 characters
                        rule: self.all(k, size(k) > 0 && size(k) <= 255)
                    displayName:
                      maxLength: 255
                      type: string
                    enabled:
                      description: |-
                        Boolean settings use pointers so imported providers preserve explicit
                        false values. Enabled defaults to true; the other flags default to false.
                      type: boolean
                    firstBrokerLoginFlowAlias:
                      maxLength: 255
                      minLength: 1
                      pattern: ^[^\x00-\x1F\x7F]+$
                      type: string
                    linkOnly:
                      type: boolean
                    mappers:
                      description: |-
                        Mappers are realm-scoped Keycloak identity-provider mappers owned by this
                        HankoRealm. Mapper names must be unique within the provider.
                      items:
                        description: |-
                          RealmIdentityProviderMapper is a provider-native mapper attached to a realm broker.
                          Reserved authority markers in mapper config keys and values are checked
                          exhaustively by the reconciler before any provider mutation. Admission CEL
                          deliberately does not iterate this provider-native map because OpenAPI cannot
                          bound JSON object-key length and Kubernetes therefore rejects the CRD's
                          worst-case CEL cost estimate.
                        properties:
                          config:
                            additionalProperties:
                              maxLength: 16384
                              type: string
                            maxProperties: 32
                            type: object
                            x-kubernetes-validations:
                            - message: native map keys require 1..255 characters
                              rule: self.all(k, size(k) > 0 && size(k) <= 255)
                          identityProviderMapper:
                            description: IdentityProviderMapper is the Keycloak mapper
                              implementation identifier.
                            maxLength: 255
                            type: string
                          name:
                            maxLength: 255
                            pattern: ^[A-Za-z0-9._ -]+$
                            type: string
                        required:
                        - identityProviderMapper
                        - name
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    postBrokerLoginFlowAlias:
                      maxLength: 255
                      minLength: 1
                      pattern: ^[^\x00-\x1F\x7F]+$
                      type: string
                    providerID:
                      description: ProviderID is the Keycloak provider implementation,
                        for example "oidc".
                      maxLength: 255
                      pattern: ^[A-Za-z0-9._-]+$
                      type: string
                    storeToken:
                      type: boolean
                    trustEmail:
                      type: boolean
                  required:
                  - alias
                  - providerID
                  type: object
                  x-kubernetes-validations:
                  - message: clientSecret must be supplied through clientSecretRef
                    rule: '!has(self.config) || !(''clientSecret'' in self.config)'
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - alias
                x-kubernetes-list-type: map
              loginTheme:
                description: LoginTheme is the Keycloak theme applied to the realm
                  login page.
                maxLength: 255
                type: string
              otpRequired:
                description: OTPRequired forces TOTP for all realm users when true.
                type: boolean
              roles:
                description: |-
                  Roles lists realm-scoped roles managed additively by the operator.
                  Existing roles not declared here are preserved.
                items:
                  description: |-
                    RealmRole describes a Keycloak realm role and the realm roles it includes.
                    Composite membership is reconciled additively so adopting an existing role
                    does not remove composites managed outside hankoShell.
                  properties:
                    composites:
                      description: |-
                        Composites lists realm roles included by this role.
                        Every referenced role must already exist or be declared in this spec.
                      items:
                        maxLength: 255
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: set
                    description:
                      description: Description is an optional human-readable explanation
                        of the role.
                      maxLength: 255
                      type: string
                    name:
                      description: Name is the Keycloak realm role name.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[^\x00-\x1F\x7F]+$
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: reserved platform, fleet and cluster roles cannot be
                      inherited through composites
                    rule: '!has(self.composites) || self.composites.all(r, r != ''HANKO_PLATFORM''
                      && !r.startsWith(''HANKO_PLATFORM_'') && !r.startsWith(''HANKO_FLEET_'')
                      && !r.startsWith(''HANKO_CLUSTER_''))'
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              securityProfile:
                description: |-
                  SecurityProfile is the legacy inline authentication and security policy.
                  New managed realms should reference a reusable HankoIAMProfile instead.
                properties:
                  adminConsoleExposure:
                    description: |-
                      AdminConsoleExposure controls the browser-based realm administration console.
                      Restricted expects the platform ingress allow-list; disabled also disables
                      the realm's security-admin-console client in Keycloak.
                    enum:
                    - public
                    - restricted
                    - disabled
                    type: string
                  adminEventsEnabled:
                    description: AdminEventsEnabled records administrative realm changes.
                    type: boolean
                  auditExportEnabled:
                    description: AuditExportEnabled sends realm events to Keycloak's
                      external logging listener.
                    type: boolean
                  auditRetentionDays:
                    description: AuditRetentionDays controls Keycloak user-event retention
                      for this realm.
                    maximum: 3650
                    minimum: 1
                    type: integer
                  bruteForce:
                    description: BruteForce holds brute-force protection settings.
                    properties:
                      enabled:
                        description: Enabled activates brute-force protection.
                        type: boolean
                      maxFailures:
                        description: MaxFailures is the number of failures before
                          lockout.
                        minimum: 1
                        type: integer
                      waitIncrements:
                        description: WaitIncrements is the lockout duration (Go duration
                          string, e.g. "30s").
                        maxLength: 64
                        minLength: 1
                        pattern: ^[^\x00-\x1F\x7F]+$
                        type: string
                    required:
                    - enabled
                    type: object
                  clientSecretRotationDays:
                    description: |-
                      ClientSecretRotationDays is the default cadence for managed confidential
                      applications and service accounts that do not declare their own policy.
                      Zero disables the realm default.
                    maximum: 3650
                    minimum: 0
                    type: integer
                  emailVerificationRequired:
                    description: EmailVerificationRequired requires proof of email
                      ownership.
                    type: boolean
                  idpBrokerRequireSignature:
                    description: |-
                      IDPBrokerRequireSignature requires configured identity providers to validate
                      upstream token or assertion signatures.
                    type: boolean
                  idpBrokerTrustEmail:
                    description: |-
                      IDPBrokerTrustEmail controls whether brokered identities may assert that an
                      upstream email address is already verified.
                    type: boolean
                  mfaPolicy:
                    description: MFAPolicy controls multi-factor authentication enforcement.
                    enum:
                    - none
                    - optional
                    - required
                    type: string
                  otpAlgorithm:
                    default: HmacSHA1
                    description: |-
                      OTPAlgorithm is the TOTP hash algorithm applied when MFA is required or optional.
                      HmacSHA256 is recommended for new deployments; HmacSHA1 for legacy authenticator compat.
                    enum:
                    - HmacSHA1
                    - HmacSHA256
                    - HmacSHA512
                    type: string
                  otpDigits:
                    description: OTPDigits is the number of digits in generated TOTP
                      codes.
                    enum:
                    - 6
                    - 8
                    type: integer
                  otpPeriodSeconds:
                    description: OTPPeriodSeconds is the TOTP validity period.
                    maximum: 120
                    minimum: 15
                    type: integer
                  passwordDisallowEmail:
                    description: PasswordDisallowEmail prevents an email address from
                      being used as the password.
                    type: boolean
                  passwordDisallowUsername:
                    description: PasswordDisallowUsername prevents a user name from
                      being used as the password.
                    type: boolean
                  passwordExpiryDays:
                    description: PasswordExpiryDays forces password renewal after
                      this many days. 0 disables expiry.
                    minimum: 0
                    type: integer
                  passwordHistory:
                    description: PasswordHistory prevents reuse of this many previous
                      passwords.
                    minimum: 0
                    type: integer
                  passwordMinLength:
                    description: PasswordMinLength is the minimum password length
                      enforced by Keycloak.
                    minimum: 8
                    type: integer
                  passwordRequireDigit:
                    description: PasswordRequireDigit requires at least one numeric
                      character.
                    type: boolean
                  passwordRequireLowercase:
                    description: PasswordRequireLowercase requires at least one lowercase
                      character.
                    type: boolean
                  passwordRequireSpecial:
                    description: PasswordRequireSpecial requires at least one special
                      character.
                    type: boolean
                  passwordRequireUppercase:
                    description: PasswordRequireUppercase requires at least one uppercase
                      character.
                    type: boolean
                  refreshTokenMaxReuse:
                    description: |-
                      RefreshTokenMaxReuse is the number of times a refresh token may be reused.
                      0 means single use when RevokeRefreshToken is true.
                    minimum: 0
                    type: integer
                  rememberMeEnabled:
                    description: RememberMeEnabled allows persistent browser sessions.
                    type: boolean
                  revokeRefreshToken:
                    description: RevokeRefreshToken invalidates refresh tokens after
                      a single use to prevent replay attacks.
                    type: boolean
                  sessionIdleTimeout:
                    description: SessionIdleTimeout is the maximum inactive SSO session
                      duration.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  sessionLifetime:
                    description: SessionLifetime is the maximum SSO session duration
                      (Go duration string, e.g. "8h").
                    maxLength: 64
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  sslRequired:
                    default: external
                    description: |-
                      SSLRequired controls TLS enforcement on the Keycloak realm.
                      "external" (default) uses Keycloak's external-client TLS requirement,
                      including its local/private-address exceptions. This does not configure
                      the operator's administrative transport.
                    enum:
                    - none
                    - external
                    - all
                    type: string
                  userEventsEnabled:
                    description: UserEventsEnabled records authentication and account
                      events.
                    type: boolean
                  userRegistrationEnabled:
                    description: UserRegistrationEnabled allows public realm self-registration.
                    type: boolean
                type: object
            type: object
            x-kubernetes-validations:
            - message: iamProfileRef and securityProfile are mutually exclusive
              rule: '!(has(self.iamProfileRef) && has(self.securityProfile))'
          status:
            description: HankoRealmStatus describes the observed state of the realm.
            properties:
              appliedMFAPolicy:
                description: |-
                  AppliedMFAPolicy records the MFA level represented by EffectivePolicyHash.
                  It lets the operator detect a later strengthening and revoke older sessions.
                maxLength: 32
                type: string
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      maxLength: 64
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveIAMProfile:
                description: |-
                  EffectiveIAMProfile is the resolved profile name, or "inline" for a legacy
                  inline security profile. Empty means that no explicit IAM profile is active.
                maxLength: 253
                type: string
              effectivePolicyHash:
                description: EffectivePolicyHash identifies the exact security policy
                  applied to Keycloak.
                maxLength: 71
                type: string
              keycloakRealmID:
                description: KeycloakRealmID is the realm ID as registered in Keycloak.
                maxLength: 128
                type: string
              lastReconciled:
                description: LastReconciled is the timestamp of the last successful
                  reconciliation.
                format: date-time
                maxLength: 64
                type: string
              managedIdentityProviders:
                description: |-
                  ManagedIdentityProviders records only provider objects whose lifecycle was
                  explicitly adopted by this HankoRealm. Cleanup never touches other brokers.
                items:
                  description: |-
                    ManagedRealmIdentityProviderReference checkpoints provider ownership and its
                    child mapper IDs so interrupted reconciliations remain safely recoverable.
                  properties:
                    alias:
                      maxLength: 255
                      type: string
                    mappers:
                      items:
                        description: ManagedRealmIdentityProviderMapperReference identifies
                          an owned Keycloak mapper.
                        properties:
                          keycloakID:
                            maxLength: 128
                            type: string
                          name:
                            maxLength: 253
                            type: string
                        required:
                        - keycloakID
                        - name
                        type: object
                      maxItems: 128
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      - keycloakID
                      x-kubernetes-list-type: map
                  required:
                  - alias
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - alias
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the HankoRealm generation represented
                  by this status.
                format: int64
                type: integer
              phase:
                description: Phase summarises the reconciliation state.
                enum:
                - Pending
                - Reconciling
                - Ready
                - Error
                type: string
              policyRevision:
                description: |-
                  PolicyRevision increases whenever a different effective IAM policy is
                  successfully applied. Applications do not interpret this value.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
