    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Network is a network discovered by a NetworkScope: an AWS VPC or a GCP VPC network. It is
          read-only for users. On AWS the object is named after the VPC ID; on GCP, whose network names
          repeat across projects, after the network's name and a hash of its resource name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the network
            properties:
              account:
                description: account is the account that owns the network.
                type: string
              id:
                description: |-
                  id is the provider's ID of the network: the VPC ID on AWS, the network's resource name
                  (projects/<project>/global/networks/<name>) on GCP.
                type: string
              provider:
                description: provider is the provider of the scope that discovered
                  the network.
                enum:
                - AWS
                - GCP
                type: string
              region:
                description: region of the network. Empty for providers whose networks
                  are global.
                type: string
            required:
            - account
            - id
            - provider
            type: object
          status:
            description: status is the observed state of the network
            properties:
              availableIPs:
                description: |-
                  availableIPs is the sum of free IPv4 addresses in all subnets. Unset when the free
                  addresses of any subnet are unknown.
                format: int64
                type: integer
              aws:
                description: aws holds what only an AWS VPC has.
                properties:
                  isDefault:
                    description: isDefault is true for the default VPC of the region.
                    type: boolean
                type: object
              cidrBlocks:
                description: |-
                  cidrBlocks are the associated IPv4 CIDR blocks, primary first. Empty on GCP, where the
                  address ranges belong to the subnets.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              env:
                description: env is read from the env tag configured in the NetworkScope.
                type: string
              gcp:
                description: gcp holds what only a GCP VPC network has.
                properties:
                  autoCreateSubnetworks:
                    description: |-
                      autoCreateSubnetworks is true for an auto mode network, which has a subnet in every
                      region from 10.128.0.0/9.
                    type: boolean
                  overlaps:
                    description: |-
                      overlaps details overlapsWith: for other networks of the scope whose ranges overlap
                      this network's, whether the two are peered and which ranges overlap. A VPC network has
                      no range of its own, so the ranges compared are those of its subnetworks: primary,
                      secondary and IPv6. Every peered network is listed, and the first 50 others by name;
                      overlapsWith lists them all.
                    items:
                      description: GCPNetworkOverlap is another network of the scope
                        whose ranges overlap this network's.
                      properties:
                        network:
                          description: network is the other network as overlapsWith
                            names it, "<account>/<region>/<id>".
                          type: string
                        peered:
                          description: |-
                            peered is true when either network has a peering with the other, active or not. A
                            peering between overlapping networks cannot become active, or stops exchanging the
                            overlapping routes.
                          type: boolean
                        peeringState:
                          description: |-
                            peeringState is the state of this network's peering with the other one, or of the other
                            network's peering with this one when only that exists: ACTIVE or INACTIVE. Empty when the
                            networks are not peered.
                          type: string
                        rangeCount:
                          description: rangeCount is the number of pairs of overlapping
                            ranges.
                          format: int32
                          type: integer
                        ranges:
                          description: ranges are the first pairs of overlapping ranges,
                            in address order, at most five.
                          items:
                            description: GCPOverlappingRange is a range of this network
                              that overlaps a range of another network.
                            properties:
                              cidrBlock:
                                description: cidrBlock is this network's range.
                                type: string
                              otherCIDRBlock:
                                description: otherCIDRBlock is the other network's
                                  range.
                                type: string
                              otherSubnet:
                                description: otherSubnet is the resource name of the
                                  other network's subnetwork the range belongs to.
                                type: string
                              subnet:
                                description: |-
                                  subnet is the resource name of this network's subnetwork the range belongs to. Empty for
                                  the range of a legacy network, which has one of its own.
                                type: string
                            required:
                            - cidrBlock
                            - otherCIDRBlock
                            type: object
                          maxItems: 5
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - network
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  peerings:
                    description: peerings are the network's VPC Network Peering connections,
                      as Compute lists them.
                    items:
                      description: GCPNetworkPeering is a VPC Network Peering connection
                        of a GCP network.
                      properties:
                        name:
                          description: name is the peering's name.
                          type: string
                        network:
                          description: |-
                            network is the resource name of the peer network,
                            projects/<project>/global/networks/<name>.
                          type: string
                        state:
                          description: |-
                            state is ACTIVE once both networks have a peering with each other, INACTIVE while only
                            this one has.
                          type: string
                        stateDetails:
                          description: stateDetails is Compute's explanation of the
                            state.
                          type: string
                      required:
                      - name
                      - network
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  routingMode:
                    description: routingMode is the network's dynamic routing mode,
                      REGIONAL or GLOBAL.
                    type: string
                type: object
              ipv6CIDRBlocks:
                description: ipv6CIDRBlocks are the associated IPv6 CIDR blocks.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              name:
                description: |-
                  name is the network's name: the value of the Name tag on AWS, the resource's name on
                  GCP.
                type: string
              overlapsWith:
                description: |-
                  overlapsWith lists networks in the same NetworkScope whose CIDRs overlap this one, as
                  "<account>/<region>/<id>". Overlaps break peering and transit routing. On GCP the ranges
                  compared are the subnetworks' (see gcp.overlaps).
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              owner:
                description: owner is read from the owner tag configured in the NetworkScope.
                type: string
              state:
                description: state is the provider's state of the network.
                type: string
              subnets:
                description: subnets is the number of discovered subnets.
                format: int32
                type: integer
              tags:
                additionalProperties:
                  type: string
                description: tags are the network's tags at the provider.
                type: object
              totalIPs:
                description: totalIPs is the sum of usable IPv4 addresses in all subnets.
                  Unset when unknown.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
