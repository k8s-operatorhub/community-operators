apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "ChatUI",
          "metadata": {
            "name": "forge-ui",
            "namespace": "forge-ui"
          },
          "spec": {
            "gatewayRef": {
              "name": "gateway",
              "namespace": "forge-gateway"
            },
            "host": "chat.forge.example.com",
            "imageVolume": {
              "accessMode": "ReadWriteOnce",
              "enabled": true,
              "size": "10Gi"
            },
            "ingress": {
              "basicAuthSecret": "forge-ui-basic-auth",
              "className": "nginx",
              "enabled": true,
              "host": "chat.forge.example.com"
            },
            "meilisearch": {
              "mode": "ref",
              "ref": {
                "name": "forge-meili"
              }
            },
            "models": [
              "azure_ai/gpt-5.4"
            ],
            "mongo": {
              "databaseName": "LibreChat",
              "mode": "ref",
              "ref": {
                "name": "forge-mongo"
              }
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "ClickHouseCluster",
          "metadata": {
            "name": "forge-ch",
            "namespace": "forge-data"
          },
          "spec": {
            "managed": {
              "replicas": 1,
              "shards": 1,
              "storageSize": "20Gi"
            },
            "mode": "managed",
            "type": "clickhouse"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Gateway",
          "metadata": {
            "name": "gateway",
            "namespace": "forge-gateway"
          },
          "spec": {
            "database": {
              "databaseName": "litellm",
              "mode": "postgresCluster",
              "postgresClusterRef": {
                "name": "forge-pg",
                "namespace": "forge-data"
              }
            },
            "instance": {
              "masterKey": {
                "autoGenerate": true
              },
              "replicas": 1,
              "saltKey": {
                "autoGenerate": true
              }
            },
            "models": [
              {
                "credentials": {
                  "apiBase": "https://my-resource.openai.azure.com/openai/v1?api-version=2025-01-01-preview"
                },
                "model": "azure_ai/gpt-5.4",
                "modelName": "azure_ai/gpt-5.4",
                "name": "gpt-5.4",
                "refSecretKey": "OPENAI_API_KEY",
                "rpm": 300,
                "timeout": 120,
                "tpm": 80000
              }
            ],
            "observabilityRef": {
              "name": "observability",
              "namespace": "forge-langfuse"
            },
            "organization": {
              "budgetDuration": "30d",
              "maxBudget": 2000,
              "name": "navique-ag",
              "rpmLimit": 1000,
              "tpmLimit": 200000
            },
            "secretsRef": {
              "name": "forge-secrets"
            },
            "teams": [
              {
                "budgetDuration": "30d",
                "maxBudgetMonthly": 1000,
                "name": "data-engineering"
              }
            ]
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Gateway",
          "metadata": {
            "name": "waeg-gateway",
            "namespace": "forge-gateway"
          },
          "spec": {
            "database": {
              "databaseName": "waeg",
              "mode": "postgresCluster",
              "postgresClusterRef": {
                "name": "forge-pg",
                "namespace": "forge-data"
              }
            },
            "instance": {
              "masterKey": {
                "autoGenerate": true
              },
              "replicas": 2
            },
            "models": [
              {
                "credentials": {
                  "apiBase": "https://my-resource.openai.azure.com/openai/v1?api-version=2025-01-01-preview"
                },
                "fallbacks": [
                  "economy"
                ],
                "model": "azure/gpt-5.4",
                "modelName": "premium",
                "name": "gpt-5-4",
                "refSecretKey": "OPENAI_API_KEY"
              },
              {
                "credentials": {
                  "apiBase": "https://my-resource.openai.azure.com/openai/v1?api-version=2025-01-01-preview"
                },
                "model": "azure/gpt-5.4-mini",
                "modelName": "economy",
                "name": "gpt-5-4-mini",
                "refSecretKey": "OPENAI_API_KEY"
              }
            ],
            "organization": {
              "maxBudget": 2000,
              "name": "navique-ag",
              "rpmLimit": 1000,
              "tpmLimit": 200000
            },
            "secretsRef": {
              "name": "forge-secrets"
            },
            "teams": [
              {
                "name": "data-engineering"
              }
            ],
            "type": "waeg",
            "waeg": {
              "artifacts": {
                "emptyDirSizeLimit": "5Gi",
                "type": "emptyDir"
              },
              "clickhouse": {
                "mode": "ref",
                "ref": {
                  "name": "forge-ch",
                  "namespace": "forge-data"
                }
              },
              "modelAccess": {
                "fallbackMode": "deny",
                "grants": [
                  {
                    "models": [
                      "premium",
                      "economy"
                    ]
                  }
                ],
                "openByDefault": false
              },
              "redis": {
                "mode": "ref",
                "ref": {
                  "name": "forge-redis",
                  "namespace": "forge-data"
                }
              },
              "topology": "Split",
              "worker": {
                "enabled": true,
                "jobWorkers": 4,
                "replicas": 2
              }
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Guardrail",
          "metadata": {
            "name": "byo-guardrail",
            "namespace": "forge-gateway"
          },
          "spec": {
            "external": {
              "apiBase": "https://guardrail.example.com",
              "unreachableFallback": "fail_closed"
            },
            "mode": "external",
            "modes": [
              "pre_call"
            ]
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Guardrail",
          "metadata": {
            "name": "pii-pseudonymizer",
            "namespace": "forge-gateway"
          },
          "spec": {
            "catalog": "pseudonymizer",
            "mode": "catalog"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Identity",
          "metadata": {
            "name": "demo-litellm",
            "namespace": "forge-gateway"
          },
          "spec": {
            "budget": {
              "budgetDuration": "30d",
              "maxBudget": 25
            },
            "gatewayRef": {
              "name": "gateway"
            },
            "role": "internal_user",
            "teamRefs": [
              {
                "name": "platform"
              }
            ],
            "type": "litellm",
            "userRef": {
              "name": "demo-user"
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "License",
          "metadata": {
            "name": "cluster"
          },
          "spec": {
            "secretRef": {
              "key": "license",
              "name": "navique-license",
              "namespace": "navique-system"
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Lock",
          "metadata": {
            "name": "protect-forge-stack",
            "namespace": "forge"
          },
          "spec": {
            "reason": "Production environment — remove this Lock deliberately before deleting.",
            "targetRef": {
              "apiVersion": "core.navique.com/v1alpha1",
              "kind": "Stack",
              "name": "forge"
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "ManagementPlane",
          "metadata": {
            "name": "management-plane",
            "namespace": "navique-system"
          },
          "spec": {
            "auth": {
              "localAdmin": {
                "credentialsSecretRef": {
                  "name": "mp-local-admin"
                },
                "enabled": true
              },
              "oidc": {
                "clientID": "\u003capp-id\u003e",
                "clientSecretRef": {
                  "key": "client-secret",
                  "name": "mp-oidc"
                },
                "enabled": true,
                "issuerURL": "https://login.microsoftonline.com/\u003ctenant\u003e/v2.0"
              }
            },
            "ingress": {
              "className": "nginx",
              "enabled": true,
              "host": "console.forge.example.com",
              "tls": true
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "MeilisearchInstance",
          "metadata": {
            "name": "forge-meili",
            "namespace": "forge-ui"
          },
          "spec": {
            "managed": {
              "storageSize": "5Gi"
            },
            "mode": "managed",
            "type": "meilisearch"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "MongoCluster",
          "metadata": {
            "name": "forge-mongo",
            "namespace": "forge-ui"
          },
          "spec": {
            "databases": [
              {
                "name": "LibreChat"
              }
            ],
            "managed": {
              "members": 1,
              "storageSize": "5Gi",
              "version": "8.0.4"
            },
            "mode": "managed",
            "type": "mck"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Observability",
          "metadata": {
            "name": "observability",
            "namespace": "forge-langfuse"
          },
          "spec": {
            "ingress": {
              "className": "nginx",
              "enabled": true,
              "host": "langfuse.forge.example.com",
              "tls": true
            },
            "langfuse": {
              "blob": {
                "provider": "s3",
                "s3": {
                  "bucket": "langfuse",
                  "credentialsSecretRef": {
                    "name": "langfuse-s3"
                  },
                  "region": "us-east-1"
                }
              },
              "clickhouse": {
                "mode": "ref",
                "ref": {
                  "name": "forge-ch",
                  "namespace": "forge-data"
                }
              },
              "postgres": {
                "databaseName": "langfuse",
                "mode": "ref",
                "ref": {
                  "name": "forge-pg",
                  "namespace": "forge-data"
                }
              },
              "redis": {
                "mode": "ref",
                "ref": {
                  "name": "forge-redis",
                  "namespace": "forge-data"
                }
              }
            },
            "type": "langfuse"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Organization",
          "metadata": {
            "name": "acme",
            "namespace": "forge-gateway"
          },
          "spec": {
            "budget": {
              "budgetDuration": "30d",
              "maxBudget": 1000
            },
            "displayName": "ACME Corp",
            "gatewayRef": {
              "name": "gateway"
            },
            "type": "litellm"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "PlatformConfig",
          "metadata": {
            "name": "cluster"
          },
          "spec": {
            "defaults": {
              "clusterDomain": "cluster.local",
              "commonAnnotations": {
                "owner": "ai-platform"
              },
              "commonLabels": {
                "team": "platform"
              },
              "imagePullPolicy": "IfNotPresent",
              "proxy": {
                "httpProxy": "http://proxy.example.com:3128",
                "httpsProxy": "http://proxy.example.com:3128",
                "noProxy": ".svc,.cluster.local,10.0.0.0/8"
              },
              "scheduling": {
                "nodeSelector": {
                  "workload": "platform"
                },
                "priorityClassName": "system-cluster-critical",
                "tolerations": [
                  {
                    "key": "platform",
                    "operator": "Exists"
                  }
                ]
              },
              "securityContext": {
                "runAsNonRoot": true,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              },
              "storageClass": "fast-ssd"
            },
            "lifecycle": {
              "pauseUpgrades": false,
              "retainOnUninstall": false
            },
            "operators": {
              "namespace": "navique-operators",
              "namespaces": {
                "cloudnative-pg": "data-system"
              }
            },
            "registry": {
              "auth": {
                "secretRef": {
                  "name": "registry-pull-secret",
                  "namespace": "navique-system"
                }
              },
              "host": "registry.example.com/mirror",
              "operandImages": {
                "clickhouse": "clickhouse/clickhouse-server:25.3",
                "postgres": "ghcr.io/cloudnative-pg/postgresql:17.2"
              }
            },
            "routing": {
              "gateway": {
                "clusterIssuer": "letsencrypt-prod",
                "mode": "managed",
                "name": "navique",
                "namespace": "navique-system"
              },
              "gatewayClassName": "istio",
              "mode": "Ingress"
            },
            "runtime": {
              "logLevel": "info"
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "PostgresCluster",
          "metadata": {
            "name": "forge-pg",
            "namespace": "forge-data"
          },
          "spec": {
            "databases": [
              {
                "credentialsSecretName": "litellm-db-credentials",
                "name": "litellm"
              },
              {
                "credentialsSecretName": "langfuse-db-credentials",
                "name": "langfuse"
              }
            ],
            "managed": {
              "instances": 3,
              "storageSize": "20Gi"
            },
            "mode": "managed",
            "type": "cnpg"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "RedisInstance",
          "metadata": {
            "name": "forge-redis",
            "namespace": "forge-data"
          },
          "spec": {
            "managed": {
              "storageSize": "5Gi",
              "topology": "standalone"
            },
            "mode": "managed",
            "type": "ot-container-kit"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "SecretsManagement",
          "metadata": {
            "name": "forge-secrets",
            "namespace": "forge-gateway"
          },
          "spec": {
            "backend": "eso",
            "eso": {
              "externalSecrets": [
                {
                  "keys": {
                    "OPENAI_API_KEY": "navique/models"
                  },
                  "name": "model-credentials"
                }
              ],
              "hashicorpVault": {
                "auth": {
                  "kubernetes": {
                    "role": "navique",
                    "serviceAccountName": "navique-vault"
                  }
                },
                "caSecretRef": {
                  "name": "vault-ca"
                },
                "path": "secret",
                "server": "https://vault.example.internal:8200",
                "version": "v2"
              },
              "provider": "hashicorpVault",
              "refreshInterval": "1h"
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "SecretsManagement",
          "metadata": {
            "name": "forge-secrets-azure",
            "namespace": "forge-gateway"
          },
          "spec": {
            "backend": "eso",
            "eso": {
              "clientID": "00000000-0000-0000-0000-000000000000",
              "externalSecrets": [
                {
                  "keys": {
                    "OPENAI_API_KEY": "gateway-openai-api-key"
                  },
                  "name": "model-credentials-azure"
                }
              ],
              "provider": "azureKeyVault",
              "refreshInterval": "1h",
              "serviceAccountName": "forge-sa",
              "vaultURL": "https://kv-example.vault.azure.net/"
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "ServiceMesh",
          "metadata": {
            "name": "cluster"
          },
          "spec": {
            "dataPlane": "ambient",
            "enrollNamespaces": [],
            "isolation": "namespace",
            "mode": "managed",
            "mtls": {
              "mode": "strict"
            },
            "provider": "auto",
            "version": "1.30"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Stack",
          "metadata": {
            "name": "forge",
            "namespace": "forge"
          },
          "spec": {
            "chatUI": {
              "host": "chat.forge.example.com",
              "ingress": {
                "className": "nginx",
                "enabled": true,
                "host": "chat.forge.example.com",
                "tls": true
              },
              "models": [
                "gpt-4o"
              ]
            },
            "datastores": {
              "clickhouse": {
                "backup": {
                  "enabled": true,
                  "provider": "s3",
                  "s3": {
                    "credentialsSecretRef": {
                      "name": "forge-backup-s3"
                    },
                    "destinationPath": "s3://forge-backups/clickhouse"
                  }
                },
                "resources": {
                  "memory": "1Gi",
                  "memoryLimit": "3Gi"
                },
                "storageSize": "20Gi"
              },
              "mongo": {
                "backup": {
                  "enabled": true,
                  "provider": "s3",
                  "s3": {
                    "credentialsSecretRef": {
                      "name": "forge-backup-s3"
                    },
                    "destinationPath": "s3://forge-backups/mongo"
                  }
                }
              },
              "postgres": {
                "backup": {
                  "enabled": true,
                  "provider": "s3",
                  "s3": {
                    "credentialsSecretRef": {
                      "name": "forge-backup-s3"
                    },
                    "destinationPath": "s3://forge-backups/postgres"
                  }
                },
                "storageSize": "5Gi"
              },
              "redis": {
                "storageSize": "5Gi"
              }
            },
            "gateway": {
              "ingress": {
                "className": "nginx",
                "enabled": true,
                "host": "gw.forge.example.com",
                "tls": true
              },
              "models": [
                {
                  "model": "openai/gpt-4o",
                  "modelName": "gpt-4o",
                  "name": "gpt-4o",
                  "refSecretKey": "OPENAI_API_KEY"
                }
              ],
              "storePromptsInLogs": true
            },
            "observability": {
              "blob": {
                "provider": "s3",
                "s3": {
                  "bucket": "langfuse",
                  "credentialsSecretRef": {
                    "name": "langfuse-s3"
                  },
                  "endpoint": "http://minio.forge.svc:9000",
                  "forcePathStyle": true
                }
              },
              "ingress": {
                "className": "nginx",
                "enabled": true,
                "host": "lf.forge.example.com",
                "tls": true
              }
            },
            "secrets": {
              "backend": "eso",
              "eso": {
                "externalSecrets": [
                  {
                    "keys": {
                      "OPENAI_API_KEY": "model-credentials"
                    },
                    "name": "model-credentials"
                  }
                ],
                "hashicorpVault": {
                  "auth": {
                    "kubernetes": {
                      "role": "navique",
                      "serviceAccountName": "navique-vault"
                    }
                  },
                  "caSecretRef": {
                    "name": "vault-ca"
                  },
                  "server": "https://vault.example.internal:8200"
                },
                "provider": "hashicorpVault"
              }
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Stack",
          "metadata": {
            "name": "forge-byo-db",
            "namespace": "forge"
          },
          "spec": {
            "datastores": {
              "clickhouse": {
                "resources": {
                  "memory": "1Gi",
                  "memoryLimit": "3Gi"
                },
                "storageSize": "20Gi"
              },
              "postgres": {
                "connectionSecretRef": {
                  "key": "DATABASE_URL",
                  "name": "forge-postgres-conn"
                },
                "mode": "external"
              },
              "redis": {
                "storageSize": "5Gi"
              }
            },
            "gateway": {
              "models": [
                {
                  "model": "openai/gpt-4o",
                  "modelName": "gpt-4o",
                  "name": "gpt-4o",
                  "refSecretKey": "OPENAI_API_KEY"
                }
              ]
            },
            "observability": {
              "blob": {
                "provider": "s3",
                "s3": {
                  "bucket": "langfuse",
                  "credentialsSecretRef": {
                    "name": "langfuse-s3"
                  },
                  "endpoint": "http://minio.forge.svc:9000",
                  "forcePathStyle": true
                }
              }
            },
            "secrets": {
              "backend": "eso",
              "eso": {
                "externalSecrets": [
                  {
                    "keys": {
                      "OPENAI_API_KEY": "model-credentials"
                    },
                    "name": "model-credentials"
                  }
                ],
                "hashicorpVault": {
                  "auth": {
                    "kubernetes": {
                      "role": "navique",
                      "serviceAccountName": "navique-vault"
                    }
                  },
                  "caSecretRef": {
                    "name": "vault-ca"
                  },
                  "server": "https://vault.example.internal:8200"
                },
                "provider": "hashicorpVault"
              }
            }
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "Team",
          "metadata": {
            "name": "platform",
            "namespace": "forge-gateway"
          },
          "spec": {
            "budget": {
              "budgetDuration": "30d",
              "maxBudget": 300,
              "rpmLimit": 200
            },
            "displayName": "Platform Team",
            "gatewayRef": {
              "name": "gateway"
            },
            "organizationRef": {
              "name": "acme"
            },
            "type": "litellm"
          }
        },
        {
          "apiVersion": "core.navique.com/v1alpha1",
          "kind": "User",
          "metadata": {
            "name": "demo-user",
            "namespace": "forge-gateway"
          },
          "spec": {
            "displayName": "Demo User",
            "email": "demo@forge.local"
          }
        }
      ]
    capabilities: Basic Install
    categories: AI/Machine Learning
    containerImage: ghcr.io/scigility/navique-ai-core-operator:v0.22.0
    createdAt: "2026-09-26T08:47:36Z"
    description: Deploys and manages the Navique FORGE AI platform (LiteLLM gateway,
      Langfuse observability, LibreChat UI and their datastores) on Kubernetes
    operators.operatorframework.io/builder: operator-sdk-v1.42.1
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    support: Navique
  name: navique-ai-core-operator.v0.22.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ChatUI is a LibreChat web UI wired to a Gateway.
      displayName: Chat UI
      kind: ChatUI
      name: chatuis.core.navique.com
      version: v1alpha1
    - description: ClickHouseCluster is a shared ClickHouse cluster.
      displayName: Click House Cluster
      kind: ClickHouseCluster
      name: clickhouseclusters.core.navique.com
      version: v1alpha1
    - description: |-
        Gateway is an AI gateway (LiteLLM or Wäg) with models, teams, and an
        organization.
      displayName: Gateway
      kind: Gateway
      name: gateways.core.navique.com
      version: v1alpha1
    - kind: Guardrail
      name: guardrails.core.navique.com
      version: v1alpha1
