---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: attunedefaults.attune.io
spec:
  group: attune.io
  names:
    categories:
    - attune
    kind: AttuneDefaults
    listKind: AttuneDefaultsList
    plural: attunedefaults
    shortNames:
    - ad
    singular: attunedefaults
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.metricsSource.prometheus.address
      name: Prometheus
      type: string
    - jsonPath: .spec.updateStrategy.type
      name: Type
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AttuneDefaults is the Schema for the attunedefaults API.
          It defines cluster-scoped default values for AttunePolicy resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AttuneDefaultsSpec defines cluster-scoped default values for AttunePolicy resources.
              containerPolicies is intentionally absent. AttuneNamespaceDefaults uses this
              same spec, so per-container settings stay on AttunePolicy only.
